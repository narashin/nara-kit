<!doctype html>
<!-- State player starter: a fixed state map (boxes + arrows) on which one token walks a chosen scenario.
     One SCENARIOS array is the single source for the map highlight, the token, the caption, the actor and
     the status pill. Rules: ../references/diagram-patterns.md ("상태 지도 시나리오 재생기").
     Copy this file, replace ONLY the SAMPLE block in the script with verified facts (and the SAMPLE text in
     the markup), then delete data-sample. Do not touch the drawing code below the SAMPLE block.
     No external fonts, CDN, fetch, storage or URL writes.
     Inside SAMPLE strings write "</" as "<\/": a literal "</script" ends this script early. -->
<html lang="ko" data-sample="true">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAMPLE 문서가 공개되기까지</title>
<style>
  :root {
    color-scheme: light dark;
    --bg:#f4f5f7; --surface:#ffffff; --fg:#1f2430; --muted:#5b6470; --dim:#8a919e; --line:#e2e5ea; --zone:#f8f9fb;
    --accent:#274b9b; --accent-bg:#e8efff; --accent-line:#8fb3ea;
    --back:#c46f12; --back-bg:#fff3d6; --bad:#b3261e; --bad-bg:#fdeaea; --mute:#6b7280; --mute-bg:#f0f1f4;
    --ok:#1b7f4d; --ok-bg:#e5f3ea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0d1117; --surface:#161b22; --fg:#e6edf3; --muted:#9aa4af; --dim:#7d8590; --line:#30363d; --zone:#11161d;
      --accent:#8ab4ff; --accent-bg:#1b2a44; --accent-line:#4b6fb0;
      --back:#e3a03b; --back-bg:#3a2d12; --bad:#ff7b72; --bad-bg:#3a1a1a; --mute:#9aa4af; --mute-bg:#21262d;
      --ok:#56d364; --ok-bg:#12261a;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:16px/1.65 "Pretendard","Apple SD Gothic Neo",-apple-system,"Segoe UI",sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:24px 16px 60px; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:22px; margin-bottom:18px; min-width:0; }
  h1 { font-size:23px; line-height:1.35; margin:0 0 8px; }
  .conclusion { background:var(--accent-bg); border-radius:10px; padding:12px 16px; margin:0; }
  .muted { color:var(--muted); font-size:14px; }
  .tag { display:inline-block; font-size:12px; font-weight:700; border:1px solid currentColor; border-radius:6px; padding:0 6px; color:var(--back); }
  button { font:inherit; font-size:14px; border:1px solid var(--line); background:var(--surface); color:var(--fg);
           border-radius:8px; padding:5px 14px; cursor:pointer; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  [hidden] { display:none !important; }
  /* Scenario tabs */
  .tabs { display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 8px; }
  .tabs button { border-radius:999px; font-weight:600; color:var(--muted); }
  .tabs button .k { color:var(--dim); font-weight:500; margin-right:6px; font-size:12px; }
  .tabs button[aria-selected="true"] { background:var(--fg); border-color:var(--fg); color:var(--surface); }
  .tabs button[aria-selected="true"] .k { color:var(--surface); opacity:.7; }
  /* Map */
  .map { display:block; width:100%; height:auto; }
  .map text { fill:var(--fg); font-family:inherit; }
  .map .mh { font-size:15px; font-weight:700; }
  .map .mb { font-size:13px; fill:var(--muted); }
  .map .ms { font-size:12px; fill:var(--muted); }
  .map .md { font-size:12px; fill:var(--dim); }
  .map .mk { font-size:12px; fill:var(--back); font-weight:600; }
  .map .zone { fill:var(--zone); stroke:var(--line); stroke-width:1.5; }
  .map .node rect { fill:var(--surface); stroke:var(--line); stroke-width:1.5; transition:fill .3s, stroke .3s, stroke-width .3s; }
  .map .node.done rect { fill:var(--ok-bg); stroke:var(--ok); stroke-width:2; }
  .map .node.planned rect { stroke-dasharray:6 5; }
  .map .node.past rect { stroke:var(--accent-line); }
  .map .node.cur rect { stroke:var(--accent); stroke-width:3; fill:var(--accent-bg); }
  .map .node.cur.bad rect { stroke:var(--bad); fill:var(--bad-bg); }
  .map .node.cur.muted rect { stroke:var(--mute); fill:var(--mute-bg); }
  .map .edge { fill:none; stroke:var(--dim); stroke-opacity:.7; stroke-width:1.5; transition:stroke .3s, stroke-width .3s; }
  .map .edge.dashed { stroke-dasharray:6 5; }
  .map .edge.back { stroke:var(--back); stroke-opacity:1; stroke-dasharray:5 4; }
  .map .edge.on { stroke:var(--accent); stroke-opacity:1; stroke-width:2.5; }
  .map .edge.back.on { stroke:var(--back); stroke-width:3; }
  .map .edge.live { stroke-dasharray:7 6; animation:march .7s linear infinite; }
  @keyframes march { to { stroke-dashoffset:-13; } }
  .map .marker-idle { fill:var(--dim); } .map .marker-lit { fill:var(--accent); } .map .marker-back { fill:var(--back); }
  .map .chip rect { fill:var(--accent); filter:drop-shadow(0 2px 3px rgba(0,0,0,.25)); }
  .map .chip text { fill:#fff; font-size:12px; font-weight:800; }
  .map .chip.bad rect { fill:var(--bad); } .map .chip.muted rect { fill:var(--mute); } .map .chip.back rect { fill:var(--back); }
  /* Bottom bar: who acts where, what the user sees, controls */
  .bar { display:grid; grid-template-columns:auto minmax(0,1fr) auto auto; gap:10px 16px; align-items:center;
         border-top:1px solid var(--line); padding-top:12px; margin-top:8px; }
  .who { font-size:13px; font-weight:800; padding:4px 10px; border-radius:6px; white-space:nowrap; }
  .who.blue { background:var(--accent-bg); color:var(--accent); }
  .who.amber { background:var(--back-bg); color:var(--back); }
  .who.grey { background:var(--mute-bg); color:var(--mute); }
  .say { font-size:17px; line-height:1.5; min-height:2.6em; }
  .status { font-size:13px; color:var(--muted); white-space:nowrap; }
  .pill { display:inline-block; margin-left:6px; font-size:14px; font-weight:700; color:var(--fg); padding:3px 10px; border-radius:999px;
          background:var(--mute-bg); transition:background .3s, color .3s; }
  .pill.ok { background:var(--ok-bg); color:var(--ok); } .pill.bad { background:var(--bad-bg); color:var(--bad); }
  .pill.muted { background:var(--mute-bg); color:var(--mute); } .pill.info { background:var(--accent-bg); color:var(--accent); }
  .ctrl { display:flex; align-items:center; gap:6px; }
  .ctrl .count { font-size:13px; color:var(--muted); min-width:44px; text-align:center; font-variant-numeric:tabular-nums; }
  @media (max-width: 720px) { .bar { grid-template-columns:minmax(0,1fr); } .status { white-space:normal; } }
  /* The js class is added only after the first successful draw, so a script error shows no dead controls. */
  html:not(.js) .tabs, html:not(.js) .bar, html:not(.js) .hint { display:none; }
  .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  @media (prefers-reduced-motion: reduce) {
    .map .edge.live { animation:none; }
    .map .node rect, .map .edge, .pill { transition:none; }
  }
  @media print {
    body { background:#fff; }
    .tabs, .bar, .hint { display:none !important; }
    .card { border:0; padding:0; break-inside:avoid; }
  }
</style>
</head>
<body>
<main>
  <section class="card">
    <h1>SAMPLE 문서가 공개되기까지</h1>
    <p class="conclusion"><strong>요약.</strong> SAMPLE 첫 화면에서 결론을 한 문장으로.</p>
  </section>

  <section class="card" id="player">
    <p class="muted"><span class="tag">설명용 가정</span> SAMPLE 무엇이 예시이고 무엇이 실제 근거인지.</p>
    <div class="tabs" id="tabs" role="tablist" aria-label="시나리오 선택"></div>
    <svg class="map" id="map" role="img" aria-label="상태 지도. 현재 단계의 칩이 상태 사이를 이동한다. 아래 설명이 같은 내용을 글로 담는다."></svg>
    <div class="bar">
      <div class="who" id="who"></div>
      <div class="say" id="say" aria-live="polite"></div>
      <div class="status" id="status"></div>
      <div class="ctrl">
        <button type="button" id="prev" aria-label="이전 단계">←</button>
        <span class="count" id="count"></span>
        <button type="button" id="next" aria-label="다음 단계">→</button>
        <button type="button" id="play">재생</button>
      </div>
    </div>
    <p class="muted hint">← → 한 칸 · Space 재생/멈춤 · 1~9 시나리오 선택</p>
    <noscript><p class="muted">이 그림은 JavaScript가 켜져 있어야 그려진다.</p></noscript>
  </section>
</main>
<script>
(() => {
  // ===== SAMPLE: replace everything in this block with verified facts. =====
  // Coordinates live in the viewBox below. Boxes: x,y = top-left. "rest" is where the token sits on a box:
  // on the BOTTOM edge for the top row and on the TOP edge for the outcome row, so it never covers a title.
  const VIEW = "10 52 940 430";
  const CHIP = "문서"; // token label, keep it to 3 characters

  // Who acts. tone picks the badge color: blue | amber | grey.
  const ACTORS = {
    author:   { label: "작성자 · 문서 앱",   tone: "blue" },
    reviewer: { label: "검토자 · 검토 화면", tone: "amber" },
    system:   { label: "자동",               tone: "grey" },
  };

  // What the user sees at that moment. cls picks the pill color: "" | info | ok | bad | muted.
  const STATUS_LABEL = "문서 상태";
  const ST = {
    review:    { text: "검토 중",   cls: "info" },
    published: { text: "공개됨",    cls: "ok" },
    rejected:  { text: "반려됨",    cls: "bad" },
    withdrawn: { text: "철회됨",    cls: "muted" },
    expired:   { text: "기한 만료", cls: "muted" },
  };

  // kind: "normal" | "done" | "exit", plus "planned" for something not shipped yet (dashed border).
  const NODES = [
    { id: "submit", x: 20,  y: 125, w: 150, h: 70, title: "제출",      sub: ["검토 요청 생성"],     kind: "normal",       rest: [95, 195] },
    { id: "r1",     x: 225, y: 128, w: 145, h: 64, title: "1차 검토",  sub: ["편집자 확인"],        kind: "normal",       rest: [297.5, 192] },
    { id: "r2",     x: 400, y: 128, w: 145, h: 64, title: "2차 검토",  sub: ["책임자 승인"],        kind: "normal",       rest: [472.5, 192] },
    { id: "pub",    x: 720, y: 120, w: 210, h: 80, title: "공개됨",    sub: ["모두에게 보인다"],    kind: "done",         rest: [825, 200] },
    { id: "rej",    x: 140, y: 380, w: 230, h: 90, title: "반려됨",    sub: ["초안으로 돌아간다", "고쳐서 새로 제출"], kind: "exit", rest: [255, 380] },
    { id: "wd",     x: 400, y: 380, w: 230, h: 90, title: "철회됨",    sub: ["검토 요청만 취소", "고쳐서 다시 제출"],  kind: "exit", rest: [515, 380] },
    { id: "exp",    x: 660, y: 380, w: 230, h: 90, title: "기한 만료 (예정)", sub: ["남은 검토가 만료", "요청이 자동 철회"], kind: "exit planned", rest: [775, 380] },
  ];

  const ZONES = [{ x: 200, y: 62, w: 370, h: 233, title: "검토 중", sub: "검토자가 검토 화면에서 판단한다" }];

  // Free text on the map. cls: mb (body) | ms (small) | md (dim) | mk (back-route color).
  const NOTES = [
    { x: 632, y: 148, cls: "ms", anchor: "middle", text: "마지막 검토가 승인" },
    { x: 385, y: 250, cls: "mk", anchor: "middle", text: "되돌림" },
    { x: 225, y: 280, cls: "md", anchor: "start",  text: "되돌림은 한 단계만. 1차는 반려만 가능" },
    { x: 265, y: 356, cls: "ms", anchor: "start",  text: "반려 (어느 단계든)" },
    { x: 525, y: 356, cls: "ms", anchor: "start",  text: "철회 (작성자)" },
    { x: 785, y: 356, cls: "ms", anchor: "start",  text: "기한 경과" },
  ];

  // Static edges. kind: "forward" | "back" | "dashed". arrow:false for a line with no arrowhead.
  const EDGES = [
    { id: "e-submit-r1", kind: "forward", d: "M170,160 L223,160" },
    { id: "e-r1-r2",     kind: "forward", d: "M370,160 L398,160" },
    { id: "e-r2-pub",    kind: "forward", d: "M545,160 L718,160" },
    { id: "e-r2-r1",     kind: "back",    d: "M440,192 C440,236 330,236 330,194" },
    { id: "e-trunk",     kind: "forward", d: "M385,295 L385,322", arrow: false },
    { id: "e-h-rej",     kind: "forward", d: "M255,322 L385,322", arrow: false },
    { id: "e-h-wd",      kind: "forward", d: "M385,322 L515,322", arrow: false },
    { id: "e-h-exp",     kind: "dashed",  d: "M515,322 L775,322", arrow: false },
    { id: "e-v-rej",     kind: "forward", d: "M255,322 L255,378" },
    { id: "e-v-wd",      kind: "forward", d: "M515,322 L515,378" },
    { id: "e-v-exp",     kind: "dashed",  d: "M775,322 L775,378" },
  ];

  // Token routes keyed "from-to". d starts at the rest point of "from" and ends at the rest point of "to".
  // edges = the static edges lit once this hop has been taken. back:true recolors the token while it moves.
  const ROUTES = {
    "submit-r1": { d: "M95,195 L297.5,192",                                           edges: ["e-submit-r1"], back: false },
    "r1-r2":     { d: "M297.5,192 L472.5,192",                                        edges: ["e-r1-r2"],     back: false },
    "r2-pub":    { d: "M472.5,192 L825,200",                                          edges: ["e-r2-pub"],    back: false },
    "r2-r1":     { d: "M472.5,192 L440,192 C440,236 330,236 330,194 L297.5,192",     edges: ["e-r2-r1"],     back: true },
    "r2-rej":    { d: "M472.5,192 L385,295 L385,322 L255,322 L255,380",               edges: ["e-trunk", "e-h-rej", "e-v-rej"], back: false },
    "r1-wd":     { d: "M297.5,192 L385,295 L385,322 L515,322 L515,380",               edges: ["e-trunk", "e-h-wd", "e-v-wd"],   back: false },
    "r2-exp":    { d: "M472.5,192 L385,295 L385,322 L775,322 L775,380",               edges: ["e-trunk", "e-h-wd", "e-h-exp", "e-v-exp"], back: false },
  };

  // Scenarios. Each step: at = node id the token rests on, who = ACTORS key, say = caption,
  // state = status pill, tone = "bad" | "muted" for a terminal outcome node.
  const SUBMIT = "작성자가 초안을 제출한다";
  const SCENARIOS = [
    { key: "공개", steps: [
      { at: "submit", who: "author",   say: SUBMIT, state: ST.review },
      { at: "r1",     who: "reviewer", say: "1차 검토자가 검토 화면에서 판단한다", state: ST.review },
      { at: "r2",     who: "reviewer", say: "1차가 승인하면 2차 검토 차례다. 문서 상태는 그대로다", state: ST.review },
      { at: "pub",    who: "system",   say: "2차가 승인하면 문서가 공개된다", state: ST.published },
    ] },
    { key: "되돌림", steps: [
      { at: "submit", who: "author",   say: SUBMIT, state: ST.review },
      { at: "r1",     who: "reviewer", say: "1차 검토자가 검토 화면에서 판단한다", state: ST.review },
      { at: "r2",     who: "reviewer", say: "1차가 승인하면 2차 검토 차례다", state: ST.review },
      { at: "r1",     who: "reviewer", say: "2차가 되돌리면 작성자가 아니라 1차 검토로 돌아간다. 상태는 그대로다", state: ST.review },
      { at: "r2",     who: "reviewer", say: "1차가 다시 승인하면 2차로 돌아온다", state: ST.review },
      { at: "pub",    who: "system",   say: "2차가 승인하면 문서가 공개된다", state: ST.published },
    ] },
    { key: "반려", steps: [
      { at: "submit", who: "author",   say: SUBMIT, state: ST.review },
      { at: "r1",     who: "reviewer", say: "1차 검토자가 검토 화면에서 판단한다", state: ST.review },
      { at: "r2",     who: "reviewer", say: "1차가 승인하면 2차 검토 차례다", state: ST.review },
      { at: "rej",    who: "reviewer", tone: "bad", say: "어느 단계에서든 반려하면 끝난다. 초안이 만들어지고, 고쳐서 새로 제출한다", state: ST.rejected },
    ] },
    { key: "철회", steps: [
      { at: "submit", who: "author",   say: SUBMIT, state: ST.review },
      { at: "r1",     who: "reviewer", say: "1차 검토자가 판단하기 전이다", state: ST.review },
      { at: "wd",     who: "author",   tone: "muted", say: "작성자가 철회하면 검토 요청만 취소된다. 고쳐서 다시 제출한다", state: ST.withdrawn },
    ] },
    { key: "기한 만료 (예정)", steps: [
      { at: "submit", who: "author",   say: SUBMIT, state: ST.review },
      { at: "r1",     who: "reviewer", say: "1차 검토자가 검토 화면에서 판단한다", state: ST.review },
      { at: "r2",     who: "reviewer", say: "기한 안에 2차 검토자가 판단하지 않는다", state: ST.review },
      { at: "exp",    who: "system",   tone: "muted", say: "남은 검토가 모두 만료되고 요청이 자동 철회된다 (출시 뒤 적용)", state: ST.expired },
    ] },
  ];
  // ===== end SAMPLE =====

  // ---- Drawing code: do not edit below this line when reusing the starter. ----
  const NS = "http://www.w3.org/2000/svg";
  const el = (name, attrs, text) => {
    const n = document.createElementNS(NS, name);
    Object.entries(attrs || {}).forEach(([k, v]) => n.setAttribute(k, String(v)));
    if (text !== undefined) n.textContent = text;
    return n;
  };
  const $ = (id) => document.getElementById(id);
  const svg = $("map");
  const ui = { tabs: $("tabs"), who: $("who"), say: $("say"), status: $("status"), count: $("count"),
               prev: $("prev"), next: $("next"), play: $("play") };
  const KIND_CLASS = { forward: "", back: "back", dashed: "dashed" };
  const MARKERS = { idle: "url(#sp-idle)", lit: "url(#sp-lit)", back: "url(#sp-back)" };

  // Build the map from SAMPLE only.
  svg.setAttribute("viewBox", VIEW);
  const defs = el("defs");
  ["idle", "lit", "back"].forEach((k) => {
    const m = el("marker", { id: `sp-${k}`, viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" });
    m.appendChild(el("path", { d: "M0,0 L10,5 L0,10 z", class: `marker-${k}` }));
    defs.appendChild(m);
  });
  svg.appendChild(defs);
  ZONES.forEach((z) => {
    svg.appendChild(el("rect", { class: "zone", x: z.x, y: z.y, width: z.w, height: z.h, rx: 14 }));
    svg.appendChild(el("text", { class: "mh", x: z.x + 22, y: z.y + 28 }, z.title));
    if (z.sub) svg.appendChild(el("text", { class: "ms", x: z.x + 22, y: z.y + 48 }, z.sub));
  });
  const nodeEl = {};
  NODES.forEach((n) => {
    const g = el("g", { class: `node ${n.kind}`, id: `n-${n.id}` });
    g.appendChild(el("rect", { x: n.x, y: n.y, width: n.w, height: n.h, rx: 10 }));
    const cx = n.x + n.w / 2;
    const ty = n.y + n.h / 2 - (n.sub.length * 21) / 2 + 6.5;
    g.appendChild(el("text", { class: "mh", x: cx, y: ty, "text-anchor": "middle" }, n.title));
    n.sub.forEach((line, i) => g.appendChild(el("text", { class: "mb", x: cx, y: ty + 21 + i * 20, "text-anchor": "middle" }, line)));
    svg.appendChild(g);
    nodeEl[n.id] = g;
  });
  const edgeEl = {}, edgeDef = {};
  EDGES.forEach((e) => {
    const p = el("path", { class: `edge ${KIND_CLASS[e.kind]}`.trim(), d: e.d });
    if (e.arrow !== false) p.setAttribute("marker-end", e.kind === "back" ? MARKERS.back : MARKERS.idle);
    svg.appendChild(p);
    edgeEl[e.id] = p; edgeDef[e.id] = e;
  });
  NOTES.forEach((t) => svg.appendChild(el("text", { class: t.cls, x: t.x, y: t.y, "text-anchor": t.anchor }, t.text)));
  const chip = el("g", { class: "chip" });
  chip.appendChild(el("rect", { x: -28, y: -11, width: 56, height: 22, rx: 11 }));
  chip.appendChild(el("text", { x: 0, y: 4.5, "text-anchor": "middle" }, CHIP));
  svg.appendChild(chip);
  const probe = el("path", { fill: "none" }); // measuring path for the token tween
  svg.appendChild(probe);

  // Fail loudly if SAMPLE is inconsistent, before anything is drawn as "working".
  const nodeById = Object.fromEntries(NODES.map((n) => [n.id, n]));
  const route = (a, b) => ROUTES[`${a}-${b}`];
  (function selfCheck() {
    const bad = [];
    if (new Set(NODES.map((n) => n.id)).size !== NODES.length) bad.push("duplicate node id");
    if (new Set(EDGES.map((e) => e.id)).size !== EDGES.length) bad.push("duplicate edge id");
    NODES.forEach((n) => {
      const [x, y] = n.rest;
      if (!(x >= n.x && x <= n.x + n.w && (y === n.y || y === n.y + n.h))) bad.push(`rest of ${n.id} is not on its top or bottom edge`);
    });
    Object.entries(ROUTES).forEach(([k, r]) => {
      const [a, b] = k.split("-");
      if (!nodeById[a] || !nodeById[b]) { bad.push(`route ${k} names an unknown node`); return; }
      r.edges.forEach((id) => { if (!edgeEl[id]) bad.push(`route ${k} lights unknown edge ${id}`); });
      probe.setAttribute("d", r.d);
      const len = probe.getTotalLength();
      const near = (p, q) => Math.hypot(p.x - q[0], p.y - q[1]) < 0.75;
      if (!near(probe.getPointAtLength(0), nodeById[a].rest) || !near(probe.getPointAtLength(len), nodeById[b].rest)) bad.push(`route ${k} does not run from rest point to rest point`);
    });
    SCENARIOS.forEach((s) => s.steps.forEach((st, i) => {
      if (!nodeById[st.at]) bad.push(`${s.key} step ${i + 1}: unknown node ${st.at}`);
      if (!ACTORS[st.who]) bad.push(`${s.key} step ${i + 1}: unknown actor ${st.who}`);
      if (!st.state || !st.state.text) bad.push(`${s.key} step ${i + 1}: no status`);
      if (i > 0 && s.steps[i - 1].at !== st.at && !route(s.steps[i - 1].at, st.at)) bad.push(`${s.key} step ${i + 1}: no route ${s.steps[i - 1].at}-${st.at}`);
    }));
    if (SCENARIOS.length > 9) bad.push("more than 9 scenarios: keys 1-9 cannot reach them");
    if (bad.length) throw new Error(`state player SAMPLE is inconsistent:\n- ${bad.join("\n- ")}`);
  })();

  let sc = 0, step = 0, anim = 0, timer = 0;
  const placeChip = ([x, y]) => chip.setAttribute("transform", `translate(${x},${y})`);

  function paint() {
    const steps = SCENARIOS[sc].steps;
    const cur = steps[step];
    EDGES.forEach((e) => {
      const p = edgeEl[e.id];
      p.classList.remove("on", "live");
      if (e.arrow !== false) p.setAttribute("marker-end", e.kind === "back" ? MARKERS.back : MARKERS.idle);
    });
    NODES.forEach((n) => nodeEl[n.id].classList.remove("cur", "past", "bad", "muted"));
    for (let i = 1; i <= step; i++) {
      const r = route(steps[i - 1].at, steps[i].at);
      if (!r) continue; // same node twice in a row: nothing to light
      r.edges.forEach((id) => {
        const p = edgeEl[id];
        p.classList.add("on");
        if (i === step) p.classList.add("live");
        if (edgeDef[id].arrow !== false && edgeDef[id].kind !== "back") p.setAttribute("marker-end", MARKERS.lit);
      });
    }
    for (let i = 0; i < step; i++) nodeEl[steps[i].at].classList.add("past");
    const node = nodeEl[cur.at];
    node.classList.add("cur");
    if (cur.tone) node.classList.add(cur.tone);
    chip.setAttribute("class", `chip ${cur.tone || ""}`.trim());

    const actor = ACTORS[cur.who];
    ui.who.className = `who ${actor.tone}`;
    ui.who.textContent = actor.label;
    ui.say.textContent = cur.say;
    ui.status.textContent = STATUS_LABEL;
    const pill = document.createElement("b");
    pill.className = `pill ${cur.state.cls || ""}`.trim();
    pill.textContent = cur.state.text;
    ui.status.appendChild(pill);
    ui.count.textContent = `${step + 1} / ${steps.length}`;
    ui.prev.disabled = step === 0;
    ui.next.disabled = step === steps.length - 1;
    [...ui.tabs.children].forEach((t, i) => t.setAttribute("aria-selected", String(i === sc)));
  }

  function moveChip(from, to, done) {
    cancelAnimationFrame(anim);
    const r = route(from, to);
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) { placeChip(nodeById[to].rest); done(); return; }
    probe.setAttribute("d", r.d);
    const len = probe.getTotalLength();
    const dur = Math.min(1400, 500 + len * 1.4); // longer routes take longer, capped
    const t0 = performance.now();
    chip.setAttribute("class", `chip ${r.back ? "back" : ""}`.trim());
    const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
    const tick = (now) => {
      const t = Math.min(1, (now - t0) / dur);
      const p = probe.getPointAtLength(len * ease(t));
      placeChip([p.x, p.y]);
      if (t < 1) anim = requestAnimationFrame(tick); else done();
    };
    anim = requestAnimationFrame(tick);
  }

  // Paint the target step first (map, caption, actor, status), then tween the token into place.
  function go(n, animate) {
    const steps = SCENARIOS[sc].steps;
    if (n < 0 || n >= steps.length) return false;
    step = n;
    paint();
    const prevAt = n > 0 ? steps[n - 1].at : null;
    if (animate && prevAt && prevAt !== steps[n].at) {
      placeChip(nodeById[prevAt].rest);
      moveChip(prevAt, steps[n].at, paint);
    } else {
      cancelAnimationFrame(anim);
      placeChip(nodeById[steps[n].at].rest);
    }
    return true;
  }

  function stopPlay() { clearInterval(timer); timer = 0; ui.play.textContent = "재생"; }
  function togglePlay() {
    if (timer) { stopPlay(); return; }
    if (step === SCENARIOS[sc].steps.length - 1) go(0, false);
    ui.play.textContent = "멈춤";
    timer = setInterval(() => {
      go(step + 1, true);
      if (step === SCENARIOS[sc].steps.length - 1) stopPlay(); // stop as soon as the last step is reached
    }, 2200);
  }
  function pick(i) { if (i < 0 || i >= SCENARIOS.length) return; stopPlay(); sc = i; step = 0; go(0, false); }

  SCENARIOS.forEach((s, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.setAttribute("role", "tab");
    const k = document.createElement("span");
    k.className = "k";
    k.textContent = String(i + 1);
    b.append(k, s.key);
    b.addEventListener("click", () => pick(i));
    ui.tabs.appendChild(b);
  });
  ui.prev.addEventListener("click", () => { stopPlay(); go(step - 1, false); });
  ui.next.addEventListener("click", () => { stopPlay(); go(step + 1, true); });
  ui.play.addEventListener("click", togglePlay);
  document.addEventListener("keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "ArrowRight") { e.preventDefault(); stopPlay(); go(step + 1, true); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); stopPlay(); go(step - 1, false); }
    else if (e.key === " ") { e.preventDefault(); togglePlay(); }
    else if (/^[1-9]$/.test(e.key)) pick(Number(e.key) - 1);
  });
  // Space on a focused button would also click it on keyup; the keydown above already handled it.
  document.addEventListener("keyup", (e) => { if (e.key === " ") e.preventDefault(); });

  go(0, false);
  document.documentElement.classList.add("js");
})();
</script>
</body>
</html>
