<head>

<title>흐름 지도</title>
<style>
:root {
  --bg: #f4f5f2; --panel: #ffffff; --panel2: #fafbf9; --ink: #1f2328; --sub: #57606a; --faint: #8c959f;
  --rule: #d0d7de; --path: #c3cad2; --accent: #d97706; --accent-soft: #fef3c7;
  --c-ext: #8250df; --c-core: #0969da; --c-store: #1a7f37; --c-edge: #bc4c00; --c-worker: #cf222e; --c-batch: #0a7a8a;
  --ok: #1a7f37; --ok-bg: #dafbe1; --bad: #cf222e; --bad-bg: #ffebe9; --eval: #9a6700; --eval-bg: #fff8c5;
  --card-bg: #fffbeb; --card-ink: #3d2c00; --card-line: #d97706;
  --chip-data-bg: #ddf4ff; --chip-data-ink: #0550ae; --chip-store-bg: #dafbe1; --chip-store-ink: #116329;
  --chip-warn-bg: #fff8c5; --chip-warn-ink: #7d4e00;
  --pair1: #8250df; --pair1-bg: #f6efff; --pair1-ink: #4b1d8f; --pair2: #bf3989; --pair2-bg: #ffeff7; --pair2-ink: #6e1146;
  --use: #0a7a8a; --use-bg: #dff6f8; --use-ink: #055560;
  --plan: #8250df; --plan-bg: #f3ecff; --plan-ink: #4b1d8f;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1117; --panel: #161b22; --panel2: #1b222c; --ink: #e6edf3; --sub: #9da7b3; --faint: #6e7681;
    --rule: #3a424d; --path: #3a424d; --accent: #f59e0b; --accent-soft: #3d2e00;
    --c-ext: #bc8cff; --c-core: #58a6ff; --c-store: #3fb950; --c-edge: #f0883e; --c-worker: #ff7b72; --c-batch: #39c5cf;
    --ok: #3fb950; --ok-bg: #0f3d1f; --bad: #ff7b72; --bad-bg: #4a1414; --eval: #d29922; --eval-bg: #3d2e00;
    --card-bg: #2d2205; --card-ink: #fde68a; --card-line: #f59e0b;
    --chip-data-bg: #0c2d6b; --chip-data-ink: #a5d6ff; --chip-store-bg: #0f3d1f; --chip-store-ink: #7ee787;
    --chip-warn-bg: #3d2e00; --chip-warn-ink: #f2cc60;
    --pair1: #bc8cff; --pair1-bg: #2c1a4d; --pair1-ink: #e2c9ff; --pair2: #ff80c8; --pair2-bg: #4a1430; --pair2-ink: #ffd0ea;
    --use: #39c5cf; --use-bg: #0b3a40; --use-ink: #a5eef3;
    --plan: #bc8cff; --plan-bg: #2c1a4d; --plan-ink: #e2c9ff;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1117; --panel: #161b22; --panel2: #1b222c; --ink: #e6edf3; --sub: #9da7b3; --faint: #6e7681;
  --rule: #3a424d; --path: #3a424d; --accent: #f59e0b; --accent-soft: #3d2e00;
  --c-ext: #bc8cff; --c-core: #58a6ff; --c-store: #3fb950; --c-edge: #f0883e; --c-worker: #ff7b72; --c-batch: #39c5cf;
  --ok: #3fb950; --ok-bg: #0f3d1f; --bad: #ff7b72; --bad-bg: #4a1414; --eval: #d29922; --eval-bg: #3d2e00;
  --card-bg: #2d2205; --card-ink: #fde68a; --card-line: #f59e0b;
  --chip-data-bg: #0c2d6b; --chip-data-ink: #a5d6ff; --chip-store-bg: #0f3d1f; --chip-store-ink: #7ee787;
  --chip-warn-bg: #3d2e00; --chip-warn-ink: #f2cc60;
  --pair1: #bc8cff; --pair1-bg: #2c1a4d; --pair1-ink: #e2c9ff; --pair2: #ff80c8; --pair2-bg: #4a1430; --pair2-ink: #ffd0ea;
  --use: #39c5cf; --use-bg: #0b3a40; --use-ink: #a5eef3;
  --plan: #bc8cff; --plan-bg: #2c1a4d; --plan-ink: #e2c9ff;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif;
  display: flex; flex-direction: column;
}
header { padding: 14px 20px 6px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
header h1 { margin: 0; font-size: 20px; }
header p { margin: 0; color: var(--sub); font-size: 13px; }
.stage { flex: 1 1 auto; min-height: 380px; position: relative; padding: 0 16px; }
svg#map { width: 100%; height: 100%; display: block; background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; }
.nojs { padding: 12px 20px; color: var(--sub); }

/* map nodes */
.node rect.box { fill: var(--panel); stroke: var(--rule); stroke-width: 1.5; transition: stroke .3s, stroke-width .3s; }
.node .bar { transition: opacity .3s; }
.node.hot rect.box, .node.hot .cylbody { stroke: var(--accent); stroke-width: 3.5; }
.node.dashed rect.box { stroke-dasharray: 6 5; }
.ntitle { font-size: 15px; font-weight: 700; fill: var(--ink); }
.nsub { font-size: 12px; fill: var(--sub); }
.nstat { font-size: 12.5px; font-weight: 600; fill: var(--accent); }
.frame rect { fill: none; stroke: var(--c-core); stroke-width: 1.5; stroke-dasharray: 8 6; }
.frame text { font-size: 13px; font-weight: 700; fill: var(--c-core); }
.cylbody { fill: var(--panel2); stroke: var(--c-store); stroke-width: 1.5; transition: stroke .3s, stroke-width .3s; }
.cyltop { fill: var(--panel); stroke: var(--c-store); stroke-width: 1.5; }
.row text { font-size: 12px; fill: var(--ink); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.row rect { fill: var(--ok-bg); opacity: 0; }
.row.new rect { animation: rowflash 1.6s ease-out; }
.row.disp text { fill: var(--eval); }
@keyframes rowflash { 0% { opacity: 1; } 100% { opacity: 0; } }
.gate rect.box { fill: var(--panel); stroke: var(--rule); }
.gate.eval rect.box { fill: var(--eval-bg); stroke: var(--eval); }
.gate.pass rect.box { fill: var(--ok-bg); stroke: var(--ok); }
.gate.block rect.box { fill: var(--bad-bg); stroke: var(--bad); }
.gate .lamp { fill: var(--rule); }
.gate.eval .lamp { fill: var(--eval); }
.gate.pass .lamp { fill: var(--ok); }
.gate.block .lamp { fill: var(--bad); }
.gate .gstat { font-size: 12.5px; fill: var(--sub); }
.gate.pass .gstat { fill: var(--ok); font-weight: 600; }
.gate.block .gstat { fill: var(--bad); font-weight: 600; }
.gate.eval .gstat { fill: var(--eval); font-weight: 600; }
/* A node that does not exist yet: drawn faint and dashed so arrows pointing at it still have a target. */
.node { transition: opacity .5s; }
.node.ghost { opacity: .5; }
.node.ghost rect.box, .node.ghost .cylbody, .node.ghost .cyltop { stroke-dasharray: 6 5; }
.path { fill: none; stroke: var(--path); stroke-width: 2; transition: stroke .3s, stroke-width .3s; }
.path.dash { stroke-dasharray: 5 5; }
.path.active { stroke: var(--accent); stroke-width: 3.5; }
.card rect { fill: var(--card-bg); stroke: var(--card-line); stroke-width: 1.5; }
.card text { font-size: 12.5px; font-weight: 600; fill: var(--card-ink); }
.card.ok rect { fill: var(--ok-bg); stroke: var(--ok); }
.card.ok text { fill: var(--ok); }
/* Pair colors: two cards that will merge share one color from the moment they leave. At most two pairs per map. */
.card.pair1 rect { fill: var(--pair1-bg); stroke: var(--pair1); }
.card.pair1 text { fill: var(--pair1-ink); }
.card.pair2 rect { fill: var(--pair2-bg); stroke: var(--pair2); }
.card.pair2 text { fill: var(--pair2-ink); }
.card.pop { transform-box: fill-box; transform-origin: center; animation: pop .35s ease-out; }
@keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }
.clock { opacity: 0; transition: opacity .4s; }
.clock.on { opacity: 1; }
.clock circle { fill: var(--panel); stroke: var(--c-batch); stroke-width: 2; }
.clock line { stroke: var(--c-batch); stroke-width: 2; stroke-linecap: round; }
.toast rect { fill: var(--ink); opacity: .88; }
.toast text { fill: var(--bg); font-size: 12px; font-weight: 600; }

/* bottom panel */
.panel { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px 20px; padding: 12px 20px 16px; align-items: start; }
.narr { background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; padding: 12px 16px; min-height: 132px; }
.narr .meta { color: var(--faint); font-size: 12px; font-weight: 600; }
.narr .trig { font-weight: 700; color: var(--eval); }
.narr .trig.clock-t { color: var(--c-batch); }
.narr h2 { margin: 2px 0 6px; font-size: 17px; }
.narr h2 code { font-size: 14px; }
.chip { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; line-height: 19px; margin: 2px 4px 0 0; }
.chip.data { background: var(--chip-data-bg); color: var(--chip-data-ink); }
.chip.store { background: var(--chip-store-bg); color: var(--chip-store-ink); }
.chip.warn { background: var(--chip-warn-bg); color: var(--chip-warn-ink); }
.narr .note { color: var(--sub); font-size: 13px; margin-top: 4px; }
.narr .src { color: var(--faint); font-size: 11.5px; margin-top: 4px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.side { display: flex; flex-direction: column; gap: 10px; min-width: 330px; }
.btns { display: flex; flex-wrap: wrap; gap: 6px; }
.btns button, .btns select {
  font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--rule);
  background: var(--panel); color: var(--ink); cursor: pointer;
}
.btns button.primary { background: var(--c-core); border-color: transparent; color: #fff; min-width: 84px; }
.btns button:focus-visible, .btns select:focus-visible, .dot:focus-visible { outline: 2px solid var(--c-core); outline-offset: 2px; }
.timeline { display: flex; gap: 10px; flex-wrap: wrap; }
.chapter { display: flex; flex-direction: column; gap: 4px; }
.chapter span { font-size: 11px; color: var(--faint); white-space: nowrap; }
.chapter .dots { display: flex; gap: 4px; }
.dot {
  width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--rule); background: var(--panel);
  font-size: 10.5px; color: var(--sub); cursor: pointer; padding: 0; font-family: inherit;
}
.dot.done { background: var(--chip-store-bg); border-color: var(--ok); color: var(--ok); }
.dot.cur { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
.legend { color: var(--faint); font-size: 12px; }
@media (max-width: 900px) {
  .panel { grid-template-columns: 1fr; }
  .side { min-width: 0; }
}
/* Recording mode: controls leave the frame, the map fills it, and the step title becomes a subtitle on the map. */
/* The subtitle sits in its own row above the map, never over it, so it cannot hide a box. */
.subtitle { display: none; order: -1; margin: 0 0 8px; padding: 8px 14px;
  background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; }
.subtitle .meta { color: var(--faint); font-size: 12px; font-weight: 600; }
.subtitle .ttl { font-size: 17px; font-weight: 700; }
body.recording .panel { display: none; }
body.recording .stage { display: flex; flex-direction: column; padding-bottom: 16px; }
body.recording svg#map { flex: 1 1 auto; height: auto; min-height: 0; }
body.recording .subtitle { display: block; }
/* Detail panel: a table of what a box stores. Opened only by the viewer, never by a step. */
.node.has-detail { cursor: pointer; outline: none; }
.node.has-detail:hover rect.box, .node.has-detail:hover .cylbody,
.node.has-detail:focus-visible rect.box, .node.has-detail:focus-visible .cylbody { stroke: var(--c-core); stroke-width: 3; }
.dtag rect { fill: var(--panel); stroke: var(--rule); stroke-width: 1; stroke-dasharray: 3 2; }
.dtag text { font-size: 11px; font-weight: 600; fill: var(--sub); }
.dtag.now rect, .dtag.plan rect, .dtag.both rect { stroke-dasharray: none; }
.dtag.now rect { fill: var(--use-bg); stroke: var(--use); }
.dtag.plan rect { fill: var(--plan-bg); stroke: var(--plan); }
.dtag tspan.now { fill: var(--use-ink); }
.dtag tspan.plan { fill: var(--plan-ink); }
.detail { position: fixed; top: 16px; right: 16px; z-index: 20; width: min(520px, calc(100vw - 32px)); max-height: calc(100vh - 32px);
  display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--rule); border-radius: 12px;
  box-shadow: 0 8px 28px rgba(0, 0, 0, .25); }
.detail[hidden] { display: none; }
.dthead { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 12px 14px 6px; }
.dthead h2 { margin: 0; font-size: 16px; overflow-wrap: anywhere; }
.dthead button { flex: none; font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 8px; border: 1px solid var(--rule);
  background: var(--panel); color: var(--ink); cursor: pointer; }
.dthead button:focus-visible { outline: 2px solid var(--c-core); outline-offset: 2px; }
.dtscroll { overflow: auto; padding: 0 14px 14px; }
.dtscroll p { margin: 0 0 8px; color: var(--sub); font-size: 13px; }
.dtscroll p.dtlegend { font-size: 12px; margin-bottom: 4px; }
.dtscroll p.dtlegend.now { color: var(--use-ink); }
.dtscroll p.dtlegend.plan { color: var(--plan-ink); }
.detail table { width: 100%; table-layout: fixed; border-collapse: collapse; font-size: 13px; }
.detail th { text-align: left; font-size: 12px; color: var(--faint); border-bottom: 1px solid var(--rule); padding: 4px 8px; }
.detail td { vertical-align: top; padding: 6px 8px; border-bottom: 1px solid var(--rule); overflow-wrap: anywhere; }
.detail th:nth-child(1), .detail td:nth-child(1) { width: 34%; }
.detail th:nth-child(2), .detail td:nth-child(2) { width: 26%; }
.detail td.f, .detail td.v { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
.detail tr.now td { background: var(--use-bg); }
.detail tr.now td:first-child { box-shadow: inset 3px 0 0 var(--use); }
.detail tr.plan td { background: var(--plan-bg); }
.detail tr.plan td:first-child { box-shadow: inset 3px 0 0 var(--plan); }
.usetag { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 8px; font: 600 11px/17px -apple-system, "Apple SD Gothic Neo", sans-serif;
  color: var(--bg); }
.usetag.now { background: var(--use); }
.usetag.plan { background: var(--plan); }
@media (prefers-reduced-motion: no-preference) {
  .detail { animation: dtin .16s ease-out; }
  @keyframes dtin { 0% { opacity: 0; transform: translateY(-6px); } 100% { opacity: 1; transform: none; } }
}
body.recording .detail { display: none; }
/* Pan and zoom: touch-action none lets pointer events drive the drag instead of the page scroll. */
svg#map { cursor: grab; touch-action: none; }
svg#map.panning, svg#map.panning * { cursor: grabbing !important; }
body.recording svg#map { cursor: default; touch-action: auto; }
body.recording .zoombtn { display: none; }
/* Legend: an overlay at the map's top-left. It is a sibling of the svg, so pointer events inside it never start a pan. */
.maplegend { position: absolute; top: 12px; left: 28px; z-index: 5; max-width: min(250px, calc(100% - 56px)); max-height: calc(100% - 24px);
  display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--rule); border-radius: 10px;
  box-shadow: 0 2px 10px rgba(0, 0, 0, .12); font-size: 12.5px; }
.maplegend[hidden] { display: none; }
.lgtoggle { flex: none; display: flex; align-items: center; gap: 6px; width: 100%; font: inherit; font-size: 12.5px; font-weight: 700; text-align: left;
  padding: 5px 10px; border: 0; border-radius: 10px; background: transparent; color: var(--ink); cursor: pointer; }
.lgtoggle::after { content: "▾"; margin-left: auto; color: var(--faint); }
.lgtoggle[aria-expanded="false"]::after { content: "▸"; }
.lgtoggle:focus-visible { outline: 2px solid var(--c-core); outline-offset: 1px; }
.lgbody { overflow: auto; padding: 0 10px 8px; }
.lgbody[hidden] { display: none; }
.lgrow { display: flex; align-items: center; gap: 8px; padding: 2px 0; color: var(--sub); line-height: 1.35; }
.lgrow.color { color: var(--ink); }
.lgsw { flex: none; width: 26px; display: flex; justify-content: center; align-items: center; }
.lgsw .lgbar { width: 22px; height: 14px; box-sizing: border-box; background: var(--panel2); border: 1px solid var(--rule); border-left: 4px solid; border-radius: 3px; }
.lgsw svg { display: block; overflow: visible; }
.lgsep { height: 1px; background: var(--rule); margin: 5px 0; }
.lgsw .lgtag { font-size: 9px; font-weight: 700; line-height: 13px; padding: 0 4px; border-radius: 7px; border: 1px solid var(--use); background: var(--use-bg); color: var(--use-ink); }
body.recording .maplegend { display: none; }
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <p id="intro"></p>
</header>
<noscript><p class="nojs">이 지도는 JavaScript가 켜져 있어야 그려집니다.</p></noscript>

<div class="stage">
  <svg id="map" viewBox="0 0 1400 830" preserveAspectRatio="xMidYMid meet" role="group" aria-label="구성 요소와 데이터 흐름 지도">
    <g id="paths"></g>
    <g id="nodes"></g>
    <g id="cards"></g>

  <div class="subtitle" id="subtitle" aria-hidden="true"></div>

    <div class="lgbody" id="lgBody"></div>
  </div>
</div>

<div class="panel">
  <div class="narr" id="narr" aria-live="polite"></div>
  <div class="side">
    <div class="btns">
      <button type="button" class="primary" id="btnPlay">▶ 재생</button>
      <button type="button" id="btnPrev" aria-label="이전 단계">◀</button>
      <button type="button" id="btnNext" aria-label="다음 단계">▶▶</button>
      <select id="speed" aria-label="재생 속도">
        <option value="1.5">느리게</option>
        <option value="1" selected>보통</option>
        <option value="0.65">빠르게</option>
      </select>
      <button type="button" id="btnZoomIn" class="zoombtn" aria-label="확대">＋</button>
      <button type="button" id="btnZoomOut" class="zoombtn" aria-label="축소">−</button>
      <button type="button" id="btnFull">전체 지도</button>

    </div>
    <div class="timeline" id="timeline"></div>
    <div class="legend">키보드: 스페이스 재생/정지 · ← → 이동 · + − 확대/축소 · 점을 누르면 그 단계로 · 지도는 끌어서 이동, Ctrl/⌘+휠로 확대</div>
  </div>
</div>

<aside class="detail" id="detail" role="dialog" aria-labelledby="dtTitle" hidden>
  <div class="dthead">
    <h2 id="dtTitle"></h2>
    <button type="button" id="dtClose">닫기 (Esc)</button>
  </div>
  <div class="dtscroll">
    <p id="dtCaption"></p>
    <p class="dtlegend now" id="dtLegendNow"><span class="usetag now">사용 중</span> <span id="dtLegendNowText"></span></p>
    <p class="dtlegend plan" id="dtLegendPlan"><span class="usetag plan">사용 예정</span> <span id="dtLegendPlanText"></span></p>
    <table>
      <thead><tr><th>필드</th><th>예시</th><th>뜻</th></tr></thead>
      <tbody id="dtBody"></tbody>
    </table>
  </div>
</aside>

<script>
// ===== DATA: replace everything in this block with verified facts. The engine below stays as is. =====
// SAMPLE domain: one photo upload becoming an album card. Every value here is illustrative.
const META = {
  title: "SAMPLE 사진 한 장이 앨범에 뜨기까지",
  intro: "SAMPLE 예시: 사진 한 장을 올리는 경우. 노란 카드가 실려 가는 데이터, 원통이 쌓이는 곳, 규칙 칸이 조건을 검사하는 문입니다.",
  startTitle: "재생을 누르면 사진 한 장이 지도를 따라 움직입니다",
  useLabel: "SAMPLE 화면이 지금 쓰는 값",
  planLabel: "SAMPLE 화면이 쓰기로 한 값",
  startNote: "각 단계는 \"무엇이 깨웠나 → 무엇이 실려 가나 → 어디에 쌓이나\" 순서로 보여 줍니다. 노란 [미확인]은 코드로 확인하지 못한 부분이고, 점선은 확인하지 못한 경로입니다.",
};

        d: `M${n.x},${n.y + ry} L${n.x},${n.y + n.h - ry} A${n.w / 2},${ry} 0 0 0 ${n.x + n.w},${n.y + n.h - ry} L${n.x + n.w},${n.y + ry}`,
      }, g);
      mk("ellipse", { class: "cyltop", cx: n.x + n.w / 2, cy: n.y + ry, rx: n.w / 2, ry }, g);
      txt(g, n.x + 14, n.y + 46, "ntitle", n.title);
      txt(g, n.x + 14, n.y + 63, "nsub", n.sub || "");
      ROWSLOT[n.id] = { g: mk("g", {}, g), x: n.x + 10, y: n.y + 76, w: n.w - 20, max: n.rows, items: [] };
    } else {
      mk("rect", { class: "box", x: n.x, y: n.y, width: n.w, height: n.h, rx: 10 }, g);
      if (n.color) mk("rect", { class: "bar", x: n.x, y: n.y + 10, width: 4, height: n.h - 20, rx: 2, fill: `var(${n.color})` }, g);
      txt(g, n.x + 16, n.y + 27, "ntitle", n.title);
      if (n.type === "gate") {
        mk("circle", { class: "lamp", cx: n.x + n.w - 20, cy: n.y + 21, r: 7 }, g);
        txt(g, n.x + 16, n.y + 55, "gstat", "대기", "s_" + n.id);
        continue;
      }
      txt(g, n.x + 16, n.y + 46, "nsub", n.sub || "");
      if (n.rows) ROWSLOT[n.id] = { g: mk("g", {}, g), x: n.x + 16, y: n.y + 60, w: n.w - 28, max: n.rows, items: [] };
    }
    if (n.detail) addDetailTag(g, n);
    // Shared by box and cyl: status line and clock.
    if (n.stat || n.ghost) txt(g, n.x + 16, n.y + n.h - (n.type === "cyl" ? 22 : 14), "nstat", "", "s_" + n.id);
    if (n.clock) {
      const c = mk("g", { id: "clock_" + n.id, class: "clock" }, g);
      const cx = n.x + n.w - 26, cy = n.y + 26;
      mk("circle", { cx, cy, r: 14 }, c);
      mk("line", { x1: cx, y1: cy, x2: cx, y2: cy - 8 }, c);
      mk("line", { x1: cx, y1: cy, x2: cx + 6, y2: cy + 3 }, c);
    }
  }
}

// ── Verbs a step may use ──────────────────────────────────────────────────
function el(id, what) {
  const e = document.getElementById(id);
  if (!e) throw new Error(`[flow-map] ${what}`);
  return e;
}
function setStat(id, s) { el("s_" + id, `상태 줄이 없는 노드 "${id}" (stat: true가 필요)`).textContent = s; }
function setGate(id, state, s) {
  el("n_" + id, `NODES에 없는 gate "${id}"`).setAttribute("class", "node gate " + (state || ""));
  setStat(id, s);
}
function exist(id, on) {
  el("n_" + id, `NODES에 없는 노드 "${id}"`).classList.toggle("ghost", !on);
  setStat(id, on ? "● 생성됨" : "아직 없음");
}
function clock(id, on) { el("clock_" + id, `clock이 없는 노드 "${id}"`).classList.toggle("on", on); }
function hot(id, ctx) {
  const g = el("n_" + id, `NODES에 없는 노드 "${id}"`);
  if (ctx.instant) return;
  g.classList.add("hot");
  setTimeout(() => g.classList.remove("hot"), 1400 * speedK());
}
function renderRows(id) {
  const slot = ROWSLOT[id];
  slot.g.replaceChildren();
  slot.items.slice(-slot.max).forEach((it, i) => {
    const r = mk("g", { class: "row" + (it.fresh ? " new" : "") + (it.disp ? " disp" : "") }, slot.g);
    mk("rect", { x: slot.x - 4, y: slot.y + i * 20 - 2, width: slot.w + 8, height: 19, rx: 4 }, r);
    txt(r, slot.x, slot.y + i * 20 + 12, "", it.text);
    it.fresh = false;
  });
}
function addRow(id, text, ctx, opts = {}) {
  const slot = ROWSLOT[id];
  if (!slot) throw new Error(`[flow-map] 줄을 쌓을 수 없는 노드 "${id}" (rows가 필요)`);
  const same = opts.key ? slot.items.find(it => it.key === opts.key) : null;
  if (same) { same.text = text; same.fresh = !ctx.instant; same.disp = !!opts.disp; }
  else slot.items.push({ text, key: opts.key, disp: !!opts.disp, fresh: !ctx.instant });
  renderRows(id);
}
function clearRows() { for (const id of Object.keys(ROWSLOT)) { ROWSLOT[id].items = []; renderRows(id); } }

function toast(x, y, s, ctx) {
  if (ctx.instant) return;
  const g = mk("g", { class: "toast" }, gCards);
  const t = txt(g, x + 10, y + 16, "", s);
  const w = t.getComputedTextLength() + 20;
  const r = mk("rect", { x, y, width: w, height: 24, rx: 6 }, null);
  g.insertBefore(r, t);
  setTimeout(() => g.remove(), 2600 * speedK());
}

// Initial state is derived from NODES, so a new flow never edits this function.
function resetMap() {
  clearRows();
  for (const n of NODES) {
    if (n.type === "gate") setGate(n.id, "", "대기");
    else if (n.ghost) exist(n.id, false);
    else if (n.stat) setStat(n.id, "");
    if (n.clock) clock(n.id, false);
  }
  gCards.replaceChildren();
  document.querySelectorAll(".path.active").forEach(p => { p.classList.remove("active"); if (!p.dataset.join) p.setAttribute("marker-end", "url(#arrow)"); });
  document.querySelectorAll(".node.hot").forEach(p => p.classList.remove("hot"));
}

// ── Motion ────────────────────────────────────────────────────────────────
let runId = 0;
class Cancelled extends Error {}
let speedOverride = null;
let flyLog = null; // set only by flowSelfCheck to learn which paths a step animates
const speedK = () => speedOverride ?? Number(document.getElementById("speed").value);
const ease = t => (t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);

function sleep(ms, ctx) {
  if (ctx.instant) return Promise.resolve();
  return new Promise((res, rej) => setTimeout(() => (ctx.id === runId ? res() : rej(new Cancelled())), ms * speedK()));
}

// Fallback keeps the page alive when VIEW.full is missing, so the data error is shown instead of a blank page.
let view = (VIEW.full || [0, 0, 1400, 830]).slice();
function setView(v) { view = v.slice(); svg.setAttribute("viewBox", v.join(" ")); }
function camera(name, ctx) {
  const target = VIEW[name];
  if (ctx.instant || reduceMotion) { setView(target); return Promise.resolve(); }
  const from = view.slice();
  const dur = 750 * speedK();
  return new Promise((res, rej) => {
    const t0 = performance.now();
    const tick = now => {
      if (ctx.id !== runId) return rej(new Cancelled());
      // rAF timestamps can predate t0 (and lag badly in a background tab); clamp so the box never goes negative.
      const k = ease(Math.max(0, Math.min(1, (now - t0) / dur)));
      setView(from.map((a, i) => a + (target[i] - a) * k));
      k < 1 ? requestAnimationFrame(tick) : res();
    };
    requestAnimationFrame(tick);
  });
}

// ── User pan and zoom. They only call setView, so the next step's camera simply overrides them. ──
function zoomBy(f, cx, cy) {
  const [x, y, w, h] = view, fw = VIEW.full[2];
  f = Math.min(Math.max(w * f, fw / 6), fw * 1.2) / w;
  if (f === 1) return;
  const px = cx === undefined ? x + w / 2 : cx, py = cy === undefined ? y + h / 2 : cy;
  setView([px - (px - x) * f, py - (py - y) * f, w * f, h * f]);
}
function initPanZoom() {
  const toView = (cx, cy) => new DOMPoint(cx, cy).matrixTransform(svg.getScreenCTM().inverse());
  const off = () => document.body.classList.contains("recording");
  let drag = null, moved = false;
  svg.addEventListener("pointerdown", ev => {
    if (off() || ev.button > 0 || drag) return;
    drag = { id: ev.pointerId, sx: ev.clientX, sy: ev.clientY, v: view.slice(), on: false };
  });
  svg.addEventListener("pointermove", ev => {
    if (!drag || ev.pointerId !== drag.id) return;
    const dx = ev.clientX - drag.sx, dy = ev.clientY - drag.sy;
    // Below ~4 px it stays a click; capture starts only once it is a drag, so a plain click still reaches the box.
    if (!drag.on) {
      if (Math.hypot(dx, dy) < 4) return;
      drag.on = true; svg.setPointerCapture(ev.pointerId); svg.classList.add("panning");
    }
    const r = svg.getBoundingClientRect(), u = Math.max(drag.v[2] / r.width, drag.v[3] / r.height); // viewBox units per px (meet)
    setView([drag.v[0] - dx * u, drag.v[1] - dy * u, drag.v[2], drag.v[3]]);
  });
  const end = ev => {
    if (!drag || ev.pointerId !== drag.id) return;
    moved = drag.on; drag = null; svg.classList.remove("panning");
    // The click that follows a drag is swallowed below; clear the flag if none comes.
    if (moved) setTimeout(() => { moved = false; }, 0);
  };
  svg.addEventListener("pointerup", end);
  svg.addEventListener("pointercancel", end);
  svg.addEventListener("click", ev => { if (moved) { ev.stopPropagation(); ev.preventDefault(); moved = false; } }, true);
  // Ctrl/meta + wheel (also a trackpad pinch) zooms; a plain wheel is left alone so the page scrolls.
  svg.addEventListener("wheel", ev => {
    if (off() || !(ev.ctrlKey || ev.metaKey)) return;
    ev.preventDefault();
    const p = toView(ev.clientX, ev.clientY);
    zoomBy(Math.exp(ev.deltaY * 0.01), p.x, p.y);
  }, { passive: false });
  document.getElementById("btnZoomIn").addEventListener("click", () => zoomBy(1 / 1.25));
  document.getElementById("btnZoomOut").addEventListener("click", () => zoomBy(1.25));
}

function cardClass(opts) {
  if (opts.pair !== undefined && opts.pair !== 1 && opts.pair !== 2) throw new Error(`[flow-map] pair는 1 또는 2만 씁니다 (받은 값: ${opts.pair})`);
  return (opts.ok ? " ok" : "") + (opts.pair ? " pair" + opts.pair : "");
}
function makeCard(label, cls) {
  const g = mk("g", { class: "card" + cls }, gCards);
  const t = txt(g, 0, 0, "", label);
  const w = t.getComputedTextLength() + 18;
  const r = mk("rect", { x: -w / 2, y: -13, width: w, height: 26, rx: 13 }, null);
  g.insertBefore(r, t);
  t.setAttribute("x", -w / 2 + 9);
  t.setAttribute("y", 4.5);
  return g;
}
const pathEnd = (id, f) => { const p = el("p_" + id, `PATHS에 없는 경로 "${id}"`); return p.getPointAtLength(f * p.getTotalLength()); };

// Two or more cards fly to one junction at the same time, become one card there, and leave on `to`.
// spec: { from: [[path, label], ...], to: [path, label], pair: 1 | 2, dur }
async function merge(spec, ctx) {
  const start = pathEnd(spec.to[0], 0);
  for (const [p] of spec.from) {
    const e = pathEnd(p, 1);
    if (Math.hypot(e.x - start.x, e.y - start.y) > 4) throw new Error(`[flow-map] merge: "${p}" 끝점이 "${spec.to[0]}" 시작점과 만나지 않습니다`);
  }
  const cls = cardClass(spec);
  if (ctx.instant) return;
  await Promise.all(spec.from.map(([p, label]) => fly(p, label, ctx, { pair: spec.pair, dur: spec.dur })));
  const holder = mk("g", { transform: `translate(${start.x},${start.y})` }, gCards);
  const c = makeCard(spec.to[1], cls + " pop");
  holder.appendChild(c);
  try { await sleep(450, ctx); } finally { holder.remove(); }
  await fly(spec.to[0], spec.to[1], ctx, { pair: spec.pair, dur: spec.dur });
}

// The reverse of merge: one card reaches a junction and leaves as several cards at once, one per path.
// spec: { from: [path, label], to: [[path, label], ...], dur }
async function split(spec, ctx) {
  const end = pathEnd(spec.from[0], 1);
  for (const [p] of spec.to) {
    const s = pathEnd(p, 0);
    if (Math.hypot(s.x - end.x, s.y - end.y) > 4) throw new Error(`[flow-map] split: "${p}" 시작점이 "${spec.from[0]}" 끝점과 만나지 않습니다`);
  }
  if (ctx.instant) return;
  await fly(spec.from[0], spec.from[1], ctx, { dur: spec.dur });
  await Promise.all(spec.to.map(([p, label]) => fly(p, label, ctx, { dur: spec.dur })));
}

function fly(pathId, label, ctx, opts = {}) {
  // Looked up before the instant shortcut so a misspelled path fails on a jump too, not only during playback.
  const path = el("p_" + pathId, `PATHS에 없는 경로 "${pathId}"`);
  if (ctx.instant) return Promise.resolve();
  const cls = cardClass(opts);
  if (flyLog) flyLog.add(pathId);
  const len = path.getTotalLength();
  const g = makeCard(label, cls);
  // A leg that ends at a merge junction has no arrowhead: the arrow belongs to the path leaving it.
  const tip = on => (path.dataset.join ? null : path.setAttribute("marker-end", on ? "url(#arrow-on)" : "url(#arrow)"));
  const on = () => { path.classList.add("active"); tip(true); };
  const off = () => { path.classList.remove("active"); tip(false); };
  on();
  // Without an explicit dur a long path keeps a readable card speed (about 0.4 px/ms, never under 1.4 s).
  const dur = (opts.dur || Math.max(1400, len / 0.4)) * speedK();
  return new Promise((res, rej) => {
    const t0 = performance.now();
    const tick = now => {
      if (ctx.id !== runId) { g.remove(); off(); return rej(new Cancelled()); }
      const raw = reduceMotion ? 1 : Math.max(0, Math.min(1, (now - t0) / dur));
      const k = ease(raw);
      const p = path.getPointAtLength((opts.reverse ? 1 - k : k) * len);
      g.setAttribute("transform", `translate(${p.x},${p.y})`);
      if (raw < 1) { requestAnimationFrame(tick); return; }
      setTimeout(() => { g.remove(); off(); }, 250);
      res();
    };
    requestAnimationFrame(tick);
  });
}

// ── Detail panel ──────────────────────────────────────────────────────────
// Pure viewer UI: it reads NODES and never touches map state, so jumps, playback and flowSelfCheck are unaffected.
const detailEl = document.getElementById("detail");
const dtBody = document.getElementById("dtBody");
let detailOpener = null;
function openDetail(n, opener) {
  if (document.body.classList.contains("recording")) return;
  const d = n.detail, has = k => d.rows.some(r => useKind(r) === k);
  detailOpener = opener;
  document.getElementById("dtTitle").textContent = n.title;
  const cap = document.getElementById("dtCaption");
  cap.textContent = d.caption || ""; cap.hidden = !d.caption;
  document.getElementById("dtLegendNow").hidden = !has("now");
  document.getElementById("dtLegendNowText").textContent = META.useLabel || "사용 중인 값";
  document.getElementById("dtLegendPlan").hidden = !has("plan");
  document.getElementById("dtLegendPlanText").textContent = META.planLabel || "사용 예정인 값";
  dtBody.replaceChildren(...d.rows.map(r => {
    const tr = document.createElement("tr");
    const kind = useKind(r);
    if (kind) tr.className = kind;
    for (const [cls, text] of [["f", r.f], ["v", r.v || "-"], ["", r.d]]) {
      const td = document.createElement("td");
      if (cls) td.className = cls;
      td.textContent = text;
      tr.appendChild(td);
    }
    if (kind) {
      const tag = document.createElement("span");
      tag.className = "usetag " + kind; tag.textContent = kind === "now" ? "사용 중" : "사용 예정";
      tr.firstChild.appendChild(tag);
    }
    return tr;
  }));

  detailEl.querySelector(".dtscroll").scrollTop = 0;
  document.getElementById("dtClose").focus();
}
function closeDetail() {
  if (detailEl.hidden) return;
  detailEl.hidden = true;
  if (detailOpener) detailOpener.focus();
  detailOpener = null;
}

// ── Legend ────────────────────────────────────────────────────────────────
// Viewer UI outside the svg: it reads NODES, STEPS and PATHS only, so it is not part of the map snapshot.
function buildLegend() {
  const box = document.getElementById("maplegend"), body = document.getElementById("lgBody"), btn = document.getElementById("lgToggle");
  const colored = NODES.filter(n => n.type !== "frame" && n.color).map(n => n.color);
  const usedColors = new Set(NODES.some(n => n.type === "cyl") ? [...colored, "--c-store"] : colored);
  const labels = META.colorLabels || {};
  const row = (sw, text, cls) => {
    const r = document.createElement("div"); r.className = "lgrow" + (cls ? " " + cls : "");
    const s = document.createElement("span"); s.className = "lgsw"; s.innerHTML = sw;
    const t = document.createElement("span"); t.textContent = text;
    r.append(s, t); return r;
  };
  const rows = LEGEND_COLORS.filter(([tok]) => usedColors.has(tok))
    .map(([tok, def]) => row(`<span class="lgbar" style="border-left-color:var(${tok})"></span>`, labels[tok] || def, "color"));
  // shortcut: the merge test reads the step source text, so a merge called through an alias is missed; use merge( directly.
  const shapes = [
    [NODES.some(n => n.type === "cyl"), `<svg width="22" height="16" viewBox="0 0 22 16"><path d="M2,4 V12 A9,3 0 0 0 20,12 V4" fill="var(--panel2)" stroke="var(--c-store)" stroke-width="1.5"/><ellipse cx="11" cy="4" rx="9" ry="3" fill="var(--panel)" stroke="var(--c-store)" stroke-width="1.5"/></svg>`, "원통 = 데이터가 쌓이는 곳 (DB, 인덱스)"],
    [NODES.some(n => n.type === "gate"), `<svg width="22" height="14" viewBox="0 0 22 14"><rect x="1" y="1" width="20" height="12" rx="3" fill="var(--eval-bg)" stroke="var(--eval)" stroke-width="1.5"/><circle cx="16" cy="7" r="2.5" fill="var(--eval)"/></svg>`, "규칙 칸 = 조건을 보고 보낼지 말지 정하는 곳"],
    [DASHED.size > 0, `<svg width="22" height="6" viewBox="0 0 22 6"><path d="M1,3 H21" stroke="var(--faint)" stroke-width="2" stroke-dasharray="4 3"/></svg>`, "점선 = 확인하지 못했거나 아직 없는 경로"],
    [NODES.some(n => n.ghost), `<svg width="22" height="14" viewBox="0 0 22 14" opacity=".5"><rect x="1" y="1" width="20" height="12" rx="3" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 3"/></svg>`, "흐린 상자 = 아직 만들어지지 않은 것"],
    [NODES.some(n => n.dashed), `<svg width="22" height="14" viewBox="0 0 22 14"><rect x="1" y="1" width="20" height="12" rx="3" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 3"/></svg>`, "점선 테두리 상자 = 있는지 확인하지 못한 것"],
    [STEPS.some(s => String(s.run).includes("merge(")), `<svg width="24" height="14" viewBox="0 0 24 14"><rect x="1" y="1" width="10" height="12" rx="6" fill="var(--pair1-bg)" stroke="var(--pair1)" stroke-width="1.5"/><rect x="13" y="1" width="10" height="12" rx="6" fill="var(--pair1-bg)" stroke="var(--pair1)" stroke-width="1.5"/></svg>`, "같은 색 카드 = 한곳에서 합쳐지는 데이터"],
    [NODES.some(n => n.detail), `<span class="lgtag">사용 중</span>`, `"사용 중 / 예정" 표시가 붙은 상자 = 누르면 필드 표가 열림`],
  ].filter(x => x[0]).map(([, sw, text]) => row(sw, text));
  body.replaceChildren(...rows, ...(rows.length && shapes.length ? [Object.assign(document.createElement("div"), { className: "lgsep" })] : []), ...shapes);
  if (!body.children.length) return;
  const KEY = "flowmap-legend:" + location.pathname;
  let open = innerWidth >= 700;
  try { const v = localStorage.getItem(KEY); if (v === "1" || v === "0") open = v === "1"; } catch (e) { /* storage may be blocked */ }
  const apply = () => { btn.setAttribute("aria-expanded", String(open)); body.hidden = !open; };
  btn.addEventListener("click", () => { open = !open; apply(); try { localStorage.setItem(KEY, open ? "1" : "0"); } catch (e) { /* storage may be blocked */ } });
  apply();
  box.hidden = false;
}

// ── Narration and timeline ────────────────────────────────────────────────
const chips = (a, c) => (a || []).map(s => `<span class="chip ${c}">${s}</span>`).join("");
const subtitle = document.getElementById("subtitle");
// Recording shows only the header and the map, so the step title moves onto the map as a subtitle.
function setRecording(on) { document.body.classList.toggle("recording", on); if (on) closeDetail(); }
function narrate(i) {
  if (i === 0) {
    narr.innerHTML = `<div class="meta">시작 전</div><h2>${META.startTitle}</h2><div class="note">${META.startNote}</div>`;
    subtitle.innerHTML = `<div class="ttl">${META.startTitle}</div>`;
    return;
  }
  const s = STEPS[i - 1];
  subtitle.innerHTML = `<div class="meta">${i} / ${STEPS.length} · ${CH[s.ch]} · 트리거: ${s.trig}</div><div class="ttl">${s.title}</div>`;
  narr.innerHTML =
    `<div class="meta">${i} / ${STEPS.length} · ${CH[s.ch]} · <span class="trig ${s.clockTrig ? "clock-t" : ""}">트리거: ${s.trig}</span></div>` +
    `<h2>${s.title}</h2>` +
    (s.data ? `<div>${chips(s.data, "data")}</div>` : "") +
    (s.store ? `<div>${chips(s.store, "store")}</div>` : "") +
    (s.warn ? `<div>${chips([s.warn], "warn")}</div>` : "") +
    (s.note ? `<div class="note">${s.note}</div>` : "") +
    (s.src ? `<div class="src">근거: ${s.src}</div>` : "");
}

const dots = [];
function buildTimeline() {
  const tl = document.getElementById("timeline");
  CH.forEach((name, ci) => {
    const c = document.createElement("div"); c.className = "chapter";
    c.innerHTML = `<span>${ci + 1}. ${name}</span>`;
    const row = document.createElement("div"); row.className = "dots";
    STEPS.forEach((s, si) => {
      if (s.ch !== ci) return;
      const b = document.createElement("button");
      b.type = "button"; b.className = "dot"; b.textContent = si + 1;
      b.setAttribute("aria-label", `${si + 1}단계: ${s.title}`);
      b.addEventListener("click", () => { stopPlay(); goto(si + 1); });
      row.appendChild(b); dots[si] = b;
    });
    c.appendChild(row); tl.appendChild(c);
  });
}
function markDots(i) { dots.forEach((d, k) => { d.classList.toggle("done", k + 1 < i); d.classList.toggle("cur", k + 1 === i); }); }

// ── Player ────────────────────────────────────────────────────────────────
let cur = 0;
let playing = false;
const btnPlay = document.getElementById("btnPlay");

// A jump rebuilds every earlier step instantly, then animates only the target step.
async function goto(i) {
  i = Math.max(1, Math.min(STEPS.length, i));
  const ctxInstant = { instant: true, id: ++runId };
  const my = ctxInstant.id;
  cur = i;
  resetMap();
  narrate(i); markDots(i);
  try {
    for (let k = 0; k < i - 1; k++) await STEPS[k].run(ctxInstant);
    const ctx = { instant: false, id: my };
    await camera(STEPS[i - 1].view, ctx);
    await STEPS[i - 1].run(ctx);
    if (playing && my === runId) {
      await sleep(1600, ctx);
      if (i < STEPS.length) goto(i + 1); else stopPlay();
    }
  } catch (e) {
    if (!(e instanceof Cancelled)) throw e;
  }
}
function startPlay() { playing = true; btnPlay.textContent = "❚❚ 정지"; goto(cur >= STEPS.length ? 1 : cur + 1); }
function stopPlay() { playing = false; btnPlay.textContent = "▶ 재생"; }

// ── Video export: the viewer records this tab while it plays from step 1, then saves a .webm. ──
// Uses the browser's tab capture, so Chrome asks for permission once per recording. No upload anywhere.
let recorder = null;
const btnRec = document.getElementById("btnRec");
async function recordVideo() {
  if (recorder) { recorder.stop(); return; } // second press stops early and still saves
  let stream;
  try {
    stream = await navigator.mediaDevices.getDisplayMedia({ video: { displaySurface: "browser", frameRate: 30 }, audio: false, preferCurrentTab: true });
  } catch (e) {
    console.warn("[flow-map] recording was not started: " + e.message);
    return;
  }
  const type = ["video/webm;codecs=vp9", "video/webm"].find(t => MediaRecorder.isTypeSupported(t));
  const chunks = [];
  recorder = new MediaRecorder(stream, type ? { mimeType: type } : undefined);
  recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    setRecording(false);
    stream.getTracks().forEach(t => t.stop());
    recorder = null; btnRec.textContent = "● 영상으로 저장";
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(chunks, { type: "video/webm" }));
    a.download = (META.title || "flow-map").replace(/[\\/:*?"<>|]/g, "_") + ".webm";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  };
  stream.getVideoTracks()[0].addEventListener("ended", () => recorder && recorder.stop());
  btnRec.textContent = "■ 녹화 멈추고 저장";
  stopPlay(); cur = 0; resetMap(); narrate(0); markDots(0); setView(VIEW.full);
  // Controls are hidden while recording; Esc or the browser's "stop sharing" bar ends it early.
  setRecording(true);
  await new Promise(r => setTimeout(r, 300)); // let the layout settle before the first frame
  recorder.start();
  await new Promise(r => setTimeout(r, 600));
  startPlay();
  // Keep the final step on screen briefly so the video does not cut on the last motion.
  while (recorder && playing) await new Promise(r => setTimeout(r, 200));
  if (recorder) { await new Promise(r => setTimeout(r, 1500)); if (recorder) recorder.stop(); }
}

// ── Self-check: run in a browser before anyone sees the page. ─────────────
// Returns plain JSON so any browser driver can read it. ok is true only when every list is empty.
function snapshot() {
  const out = [];
  for (const e of gNodes.querySelectorAll("*")) {
    const cls = [...e.classList].filter(c => c !== "hot" && c !== "new").join(".");
    const t = e.tagName === "text" ? e.textContent : "";
    if (cls || t) out.push(`${e.closest("[id^=n_]")?.id}|${e.tagName}|${cls}|${t}`);
  }
  return out;
}
function snapDiff(a, b) {
  const sa = new Set(a), sb = new Set(b);
  const onlyA = a.filter(x => !sb.has(x)).slice(0, 2), onlyB = b.filter(x => !sa.has(x)).slice(0, 2);
  return onlyA.length || onlyB.length ? `재생에만: ${onlyA.join(", ") || "없음"} / 점프에만: ${onlyB.join(", ") || "없음"}` : "";
}
function edgeDist(p, n) {
  const dx = Math.max(n.x - p.x, 0, p.x - (n.x + n.w)), dy = Math.max(n.y - p.y, 0, p.y - (n.y + n.h));
  if (dx || dy) return Math.hypot(dx, dy);
  return Math.min(p.x - n.x, n.x + n.w - p.x, p.y - n.y, n.y + n.h - p.y);
}
// A merge junction is a point where at least three path ends meet (two legs in, one path out).
function isJunction(pt) {
  let n = 0;
  for (const id of Object.keys(PATHS)) {
    const p = document.getElementById("p_" + id), L = p.getTotalLength();
    for (const s of [0, L]) { const q = p.getPointAtLength(s); if (Math.hypot(q.x - pt.x, q.y - pt.y) <= 4) n++; }
  }
  return n >= 3;
}
function checkPaths(res) {
  const boxes = NODES.filter(n => n.type !== "frame");
  for (const id of Object.keys(PATHS)) {
    const p = document.getElementById("p_" + id);
    const L = p.getTotalLength();
    const bad = new Set();
    // Skip 8px at each end: an arrow legitimately touches the boxes it connects.
    for (let s = 8; s <= L - 8; s += 3) {
      const pt = p.getPointAtLength(s);
      for (const b of boxes) {
        if (pt.x > b.x + 1 && pt.x < b.x + b.w - 1 && pt.y > b.y + 1 && pt.y < b.y + b.h - 1) bad.add(b.id);
      }
    }
    if (bad.size) res.through.push(`${id} → ${[...bad].join(", ")} 상자를 지나감`);
    for (const [end, s] of [["시작", 0], ["끝", L]]) {
      const pt = p.getPointAtLength(s);
      const near = Math.min(...NODES.map(n => edgeDist(pt, n)));
      if (near > 4 && !isJunction(pt)) res.dangling.push(`${id} ${end}점 (${Math.round(pt.x)},${Math.round(pt.y)})이 어느 상자 가장자리에도 닿지 않음`);
    }
  }
}
// The camera of a step must show both boxes at the ends of every path that step animates.
function checkFraming(res, k, pathIds) {
  const s = STEPS[k - 1], [vx, vy, vw, vh] = VIEW[s.view];
  const cut = new Set();
  for (const id of pathIds) {
    const p = document.getElementById("p_" + id);
    for (const at of [0, p.getTotalLength()]) {
      const pt = p.getPointAtLength(at);
      for (const n of NODES) {
        if (n.type === "frame" || edgeDist(pt, n) > 4) continue;
        if (n.x < vx - 2 || n.y < vy - 2 || n.x + n.w > vx + vw + 2 || n.y + n.h > vy + vh + 2) cut.add(n.id);
      }
    }
  }
  if (cut.size) res.framing.push(`${k}단계: view "${s.view}"가 ${[...cut].join(", ")} 상자를 자름`);
}
function checkHidden(res, k) {
  for (const n of NODES) {
    const e = document.getElementById("n_" + n.id);
    const cs = getComputedStyle(e);
    if (cs.display === "none" || cs.visibility === "hidden" || e.classList.contains("hidden") || e.style.opacity === "0") {
      res.hidden.push(`${k}단계: ${n.id}가 숨겨져 있음 (아직 없는 노드는 ghost로 흐리게)`);
    }
  }
}

window.flowSelfCheck = async function (opts = {}) {
  const speed = opts.speed ?? 0.12;
  const stepTimeout = opts.stepTimeoutMs ?? 20000;
  const res = { ok: false, data: DATA_ERRORS.slice(), leftover: [], through: [], dangling: [], framing: [], orphan: [], hidden: [], playback: [], restore: [] };
  if (res.data.length) return res;
  const sample = JSON.stringify({ META, NODES, CH, STEPS }).match(/SAMPLE/g);
  if (sample) res.leftover.push(`SAMPLE 문구 ${sample.length}곳이 남아 있음`);
  checkPaths(res);

  const errs = res.playback;
  const onErr = e => errs.push(String(e.message || e));
  const onRej = e => { if (!(e.reason instanceof Cancelled)) errs.push(String((e.reason && e.reason.message) || e.reason)); };
  addEventListener("error", onErr);
  addEventListener("unhandledrejection", onRej);
  const withTimeout = (p, ms, label) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error(label)), ms))]);
  speedOverride = speed;
  try {
    // 1. Real playback, start to end, with motion.
    stopPlay(); runId++; cur = 0;
    startPlay();
    const deadline = performance.now() + stepTimeout * STEPS.length;
    while (playing && !errs.length && performance.now() < deadline) await new Promise(r => setTimeout(r, 50));
    if (playing) errs.push(`재생이 ${cur}단계에서 끝나지 않음`);
    else if (cur !== STEPS.length) errs.push(`재생이 ${cur}단계에서 멈춤`);
    stopPlay(); runId++;

    // 2. Each step played from a jump must equal the same steps rebuilt instantly.
    // Along the way, collect every box some step uses: a card leaves or reaches it, or its state changes.
    const used = new Set();
    const initial = new Set(INITIAL_SNAPSHOT);
    for (let k = 1; k <= STEPS.length; k++) {
      flyLog = new Set();
      try { await withTimeout(goto(k), stepTimeout, `${k}단계 이동이 끝나지 않음`); }
      catch (e) { errs.push(`${k}단계: ${e.message}`); continue; }
      checkFraming(res, k, flyLog);
      for (const pid of flyLog) {
        const p = document.getElementById("p_" + pid);
        for (const at of [0, p.getTotalLength()]) {
          const pt = p.getPointAtLength(at);
          for (const n of NODES) if (n.type !== "frame" && edgeDist(pt, n) <= 4) used.add(n.id);
        }
      }
      flyLog = null;
      const played = snapshot();
      for (const line of played) if (!initial.has(line)) used.add(line.split("|")[0].slice(2));
      const id = ++runId;
      resetMap();
      try { for (let j = 0; j < k; j++) await STEPS[j].run({ instant: true, id }); }
      catch (e) { errs.push(`${k}단계 빠른 재구성: ${e.message}`); continue; }
      const d = snapDiff(played, snapshot());
      if (d) res.restore.push(`${k}단계: ${d}`);
      checkHidden(res, k);
    }
    // A playback error stops steps early, which would flag every later box as unused; report the error alone.
    for (const n of errs.length ? [] : NODES) {
      if (n.type !== "frame" && !used.has(n.id)) res.orphan.push(`${n.id}: 어느 단계도 쓰지 않는 상자 (카드가 오가지도, 상태가 바뀌지도 않음)`);
    }
    // 3. Reset after the last step must give back the page as it first loaded.
    resetMap();
    const d = snapDiff(snapshot(), INITIAL_SNAPSHOT);
    if (d) res.restore.push(`처음으로 되돌리기: ${d.replace("재생에만", "되돌린 뒤에만").replace("점프에만", "처음에만")}`);
  } finally {
    speedOverride = null; flyLog = null;
    removeEventListener("error", onErr);
    removeEventListener("unhandledrejection", onRej);
    runId++; cur = 0; resetMap(); narrate(0); markDots(0); setView(VIEW.full);
  }
  res.ok = ["data", "leftover", "through", "dangling", "framing", "orphan", "hidden", "playback", "restore"].every(k => !res[k].length);
  return res;
};

// ── Start ─────────────────────────────────────────────────────────────────
let INITIAL_SNAPSHOT = [];
if (DATA_ERRORS.length) {
  narr.innerHTML = `<div class="meta">데이터 오류</div><h2>지도를 그리지 못했습니다</h2><div class="note">${DATA_ERRORS.join("<br>")}</div>`;
} else {
  build();
  buildTimeline();
  buildLegend();
  // Pausing lets the current step finish so the map never stops half-updated.
  btnPlay.addEventListener("click", () => (playing ? stopPlay() : startPlay()));
  document.getElementById("btnPrev").addEventListener("click", () => { stopPlay(); goto(cur - 1); });
  document.getElementById("btnNext").addEventListener("click", () => { stopPlay(); goto(cur + 1); });
  document.getElementById("dtClose").addEventListener("click", closeDetail);
  initPanZoom();
  document.getElementById("btnFull").addEventListener("click", () => camera("full", { instant: false, id: runId }).catch(() => {}));
  // Shown only where tab capture and MediaRecorder exist (desktop Chrome, Edge, Firefox).
  if (navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia && window.MediaRecorder) {
    btnRec.hidden = false;
    btnRec.addEventListener("click", () => { recordVideo(); });
  }
  document.addEventListener("keydown", ev => {
    if (ev.key === "Escape" && !detailEl.hidden) { ev.preventDefault(); closeDetail(); return; }
    if (ev.target.closest("select, input, textarea, .detail")) return;
    if ((ev.key === "+" || ev.key === "=" || ev.key === "-") && !ev.ctrlKey && !ev.metaKey && !ev.altKey) {
      if (!document.body.classList.contains("recording")) zoomBy(ev.key === "-" ? 1.25 : 1 / 1.25);
      return;
    }
    // A focused button already toggles on space by default; avoid a double toggle.
    if (ev.key === " ") { if (ev.target.closest("button")) return; ev.preventDefault(); btnPlay.click(); }
    else if (ev.key === "ArrowRight") { stopPlay(); goto(cur + 1); }
    else if (ev.key === "ArrowLeft") { stopPlay(); goto(cur - 1); }
    else if (ev.key === "Escape" && recorder) recorder.stop();
  });
  resetMap();
  INITIAL_SNAPSHOT = snapshot();
  narrate(0);
  markDots(0);
}
</script>
