id: repo-template-precedence-001
name: "Repository PR template and title rule win over the built-in format"
description: |
  The repo built by fixtures/template-repo.sh carries its own PR rules:
  `.github/pull_request_template.md` (What / Why / Test plan / Checklist, with
  HTML comments and checkboxes) and a CONTRIBUTING.md title rule
  `type(scope): subject (PROJ-123)`, which the last five merged PRs also follow.
  The branch's commit subjects use a different shape (`PROJ-77 feat: ...`).
  A correct run fills the repository template in its heading order instead of
  the built-in five sections, and titles the PR by the repository rule, e.g.
  `feat(report): add CSV export for order report (PROJ-77)`. The built-in QA
  table may still appear inside `## Test plan`.
tags:
  - template
  - title
inputs:
  prompt: |
    PR 만들어줘
    (저장소 상태는 첨부한 template-repo-state.md와 같다. gh 결과는 template-repo-gh.md다.)
  files:
    - path: template-repo-state.md
    - path: template-repo-gh.md
  # template-repo-state.md is the captured state of the repo that
  # fixtures/template-repo.sh builds, so a run without tools can take this task.
  # The repo itself is built by fixtures/template-repo.sh (a git repo cannot be
  # an inline fixture). Runs that cannot execute it cannot take this task.
expected:
  # `## Test plan` and `## Checklist` prove the template headings were kept.
  # `(PROJ-77)` at the end is the repo's title shape; the built-in shape puts the
  # ticket first. `## 배포 시 주의사항` is a built-in heading the template lacks,
  # so its presence means the built-in body replaced the template.
  output_contains:
    - "## Test plan"
    - "## Checklist"
    - "(PROJ-77)"
  output_not_contains:
    - "## 배포 시 주의사항"
  outcomes:
    - type: task_completed
graders:
  - type: text
    name: task_regex
    config:
      regex_match:
        - "(?i)(gh pr create|gh pr edit|pull request|PR)"
        - "(?i)(요약|주요 변경|확인 방법|기존 동작|git log)"
