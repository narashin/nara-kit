name: nara-pr-eval
description: Evaluation suite for PR generation skill.
skill: nara-pr
version: "1.0"
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: mock
  model: claude-sonnet-4.6
metrics:
  - name: task_completion
    weight: 1.0
    threshold: 0.8
    description: Did the skill generate a PR title and body with proper format and Korean content?
graders:
  - type: code
    name: real_run
    config:
      # Provenance gate, not a behavioural one: it asserts the graded output came
      # from a real skill run. Under `executor: mock` it fails every task by
      # construction -- that is the correct signal, because mock output grades the
      # eval's own description and fixture text, never the skill. Measurement goes
      # through `waza grade` on a real run; see CLAUDE.md.
      assertions:
        - "len(output) > 40"
        - "'Mock response for:' not in output"
  - type: text
    name: pr_structure
    config:
      regex_match:
        - "(?i)(gh pr create|gh pr edit|pull request|PR)"
        - "(?i)(요약|주요 변경|확인 방법|기존 동작|git log)"
tasks:
  - "tasks/*.yaml"
