name: nara-rewrite-eval
description: Evaluation suite for meaning-preserving rewrites for readers who lack the project context.
skill: nara-rewrite
version: "1.0"
config:
  trials_per_task: 1
  timeout_seconds: 600
  parallel: false
  executor: copilot-sdk
  model: claude-sonnet-4.6
metrics:
  - name: task_completion
    weight: 1.0
    threshold: 0.8
    description: Did the skill return a single final rewrite (no analysis, grade or audit trail) that keeps requirements as requirements and leaves numbers and identifiers untouched, return findings only in review mode, and redirect grading requests?
graders:
  - type: code
    name: real_run
    config:
      # Provenance gate, not a behavioural one: it asserts the graded output came
      # from a real skill run. Under `executor: mock` it fails every task by
      # construction -- that is the correct signal, because mock output grades the
      # eval's own description and fixture text, never the skill. Measurement goes
      # through `waza grade` on a real run; see CLAUDE.md.
      assertions:
        - "len(output) > 40"
        - "'Mock response for:' not in output"
tasks:
  - "tasks/*.yaml"
