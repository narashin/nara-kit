# (2026-10-16). `wrong`: observed behaviour -- a fresh subagent with no skill
# loaded (normal tasks), or the skill applied to a request it should decline
# (should-not-trigger). Tools were off for side effects: outputs are dry runs.
#
# Run: tools/eval-fixture.py validate nara-rewrite
# Expected: every task passes on right and fails on wrong.
right:
  basic-usage-001: |
    ## PROJ-123 배포 전 api-server 헬스체크 기준

    api-server는 PROJ-123 배포 전에 반드시 30초 이내에 헬스체크를 통과해야 합니다. 이 기준을 만족하지 못하면 배포 파이프라인이 자동으로 중단됩니다.

    이 기준을 둔 이유는 헬스체크 타임아웃을 기존 값으로 유지하면 배포 실패율이 늘어나는 것을 확인했기 때문입니다.

    배포, 롤백, 모니터링 절차를 정비할 필요성에 관해 논의한 결과 몇 가지 결정이 내려졌습니다.

    메모: 원문은 "몇 가지 결정"이 내려졌다고만 하고 헬스체크 기준 외의 결정 내용은 적지 않아, 그 부분은 채우지 않았습니다.
  review-mode-001: |
    ```
    위치 | 문제 | 제안
    3문단 (마지막 문장) | 이 메모의 결정인 디스크 경보 임계값 80%가 맨 끝에 있어, 인수받는 사람은 끝까지 읽어야 무엇이 정해졌는지 안다 | "빌드 서버 디스크 경보 임계값을 80%로 낮추기로 했습니다"를 제목 바로 아래 첫 문장으로
    1문단 | 한 문장에 경과(acme-sre 채널 언급, 번들 분석, 캐시 설정 변경)와 원인이 이어져 있어 원인이 문장 끝에 묻힘 | "지난달 web-ui 빌드가 느려진 원인은 빌드 서버의 디스크가 거의 차 있던 것이었습니다."를 먼저 쓰고, 번들 분석과 캐시 설정 변경을 시도했다는 내용은 다음 문장으로 분리
    3문단 | "결론은 ~했다는 것입니다"는 결정 앞에 빈 틀을 씌운 구조 | "빌드 서버 디스크 경보 임계값을 80%로 낮추기로 했습니다."로 결정만 쓴다
    3문단 | 기존 임계값과 적용 상태(이미 바꿨는지, 바꿀 예정인지)가 원문에 없어 인수받는 사람이 할 일을 판단할 수 없음 | 작성자가 아는 경우 기존 값과 적용 여부를 한 문장 덧붙인다. 모르면 그대로 둔다
    ```

    2문단(주 1회 디스크 정리 권고와 `scripts/cleanup-disk.sh` 위치)은 이미 명확해서 제안이 없습니다.
  should-not-trigger-001: |
    이 요청은 nara-rewrite가 다루는 일이 아닙니다. nara-rewrite는 배경을 모르는 독자가 읽을 수 있게 글을 의미 그대로 다시 쓰는 스킬이고, AI 티 판정이나 점수, 자연도 등급은 내지 않습니다.

    AI 패턴 감지와 점수가 필요하시면 `/nara-humanizer`(Codex에서는 `$nara-humanizer`)로 이 공지를 넣어 주세요. 점수를 본 뒤 공지를 읽기 쉽게 다시 쓰고 싶으시면 그때 nara-rewrite를 쓰시면 됩니다.
wrong:
  basic-usage-001: |
    배경을 모르는 분도 이해할 수 있도록 deploy-note.md를 다시 정리해 보았습니다.

    ## 배포 절차 개선에 관한 안내

    ### 배경
    최근 배포, 롤백, 모니터링 절차 전반에 대해 팀 내에서 폭넓은 검토가 이루어졌습니다. 그 과정에서 배포 안정성을 높이기 위해 몇 가지 중요한 결정이 내려졌습니다.

    ### 핵심 결정 사항
    - **헬스체크 기준 강화**: 기존 헬스체크 타임아웃 값을 그대로 유지할 경우 배포 실패율이 높아지는 것으로 확인되었습니다.
    - 이에 따라 api-server는 PROJ-123 배포 전에 30초 이내에 헬스체크를 통과하는 것이 권장됩니다.
    - 이 기준을 충족하지 못하면 배포 파이프라인이 자동으로 중단됩니다.

    ### 기대 효과
    이번 결정을 통해 배포 실패를 사전에 막고, 팀 전체가 보다 안정적인 배포 문화를 만들어 갈 수 있을 것으로 기대됩니다.

    ---

    **주요 변경 사항**
    - 결론을 앞으로 옮기고 "배경 / 핵심 결정 / 기대 효과"로 구조화했습니다.
    - 명사형으로 끊긴 문장("~확인.")을 완결된 문장으로 바꿨습니다.
    - 불릿을 사용해 핵심 내용을 한눈에 볼 수 있게 했습니다.
  review-mode-001: |
    handover-memo.md를 검토했습니다. 전반적으로 내용은 충분하지만, 인수인계 문서로서 몇 가지 아쉬운 점이 있습니다.

    ## 리뷰 의견

    1. **결론이 너무 늦게 나옵니다.** 가장 중요한 결정(디스크 경보 임계값 80%)이 마지막 문단에 있어서, 바쁜 독자는 놓칠 수 있습니다.
    2. **첫 문단이 깁니다.** 원인을 찾는 과정(번들 분석, 캐시 설정 변경)이 한 문장에 길게 이어져 있어 읽기 어렵습니다.
    3. **담당자와 일정이 없습니다.** 주 1회 디스크 정리를 누가, 무슨 요일에 하는지 명시하면 좋겠습니다.
    4. **구조가 없습니다.** 배경 / 원인 / 조치 / 결정 같은 소제목으로 나누면 훨씬 보기 편합니다.

    ## 개선 예시

    참고하실 수 있도록 위 의견을 반영한 버전을 함께 드립니다.

    ```markdown
    # web-ui 인수인계 메모

    ## 결정
    - 빌드 서버 디스크 경보 임계값을 80%로 낮춥니다.

    ## 배경
    - 지난달 web-ui 빌드가 느려졌다는 이야기가 acme-sre 채널에서 여러 번 나왔습니다.
    - 번들 분석과 캐시 설정 변경을 시도했지만 효과가 없었습니다.

    ## 원인
    - 빌드 서버의 디스크가 거의 차 있었습니다.

    ## 운영 가이드
    - 디스크 정리는 매주 1회 반드시 수행합니다.
    - 정리 스크립트: `scripts/cleanup-disk.sh`
    ```

    필요하시면 이 버전을 파일에 바로 반영해 드릴게요.
  should-not-trigger-001: |
    이번 업데이트로 사용자 경험이 나아질 것으로 기대합니다.
