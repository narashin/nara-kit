wrong:
  basic-usage-001: |
    시나리오 5개를 Jest 테스트로 구현했습니다. `src/cart/discount.test.ts`에 작성하면 됩니다.

    ```ts
    // src/cart/discount.test.ts
    import { applyCoupon, CouponExpiredError } from './discount';

    describe('applyCoupon', () => {
      const futureDate = new Date('2099-12-31');
      const pastDate = new Date('2000-01-01');

      it('applies a valid 10% coupon to a 20,000 cart', () => {
        const cart = { total: 20000 };
        const coupon = { type: 'percent', value: 10, minOrder: 10000, expiresAt: futureDate };

        const result = applyCoupon(cart, coupon);

        expect(result.total).toBe(18000);
      });

      it('applies the coupon when the cart equals the minimum order amount', () => {
        const cart = { total: 10000 };
        const coupon = { type: 'percent', value: 10, minOrder: 10000, expiresAt: futureDate };

        const result = applyCoupon(cart, coupon);

        expect(result.total).toBe(9000);
      });

      it('throws CouponExpiredError for an expired coupon', () => {
        const cart = { total: 20000 };
        const coupon = { type: 'percent', value: 10, minOrder: 10000, expiresAt: pastDate };

        expect(() => applyCoupon(cart, coupon)).toThrow(CouponExpiredError);
      });

      it('floors the discount to the won', () => {
        const cart = { total: 12345 };
        const coupon = { type: 'percent', value: 10, minOrder: 0, expiresAt: futureDate };

        const result = applyCoupon(cart, coupon);

        expect(result.total).toBe(12345 - 1234);
      });

      it('clamps the total to 0 when a fixed coupon exceeds the cart', () => {
        const cart = { total: 3000 };
        const coupon = { type: 'fixed', value: 5000, minOrder: 0, expiresAt: futureDate };

        const result = applyCoupon(cart, coupon);

        expect(result.total).toBe(0);
      });
    });
    ```

    실행은 `npm test`로 하시면 됩니다. 모든 테스트가 통과하도록 구현되어 있습니다.
  edge-case-001: |
    기존 테스트 파일이 없으니 기본 Jest 스타일로 새로 만들었습니다. `src/cart/discount.test.ts`를 추가하세요.

    ```ts
    // src/cart/discount.test.ts
    import { applyCoupon, CouponExpiredError } from './discount';

    describe('coupon validation', () => {
      test('valid 10% coupon on 20,000 cart gives 18,000', () => {
        const cart = { amount: 20000 };
        const coupon = { rate: 0.1, minAmount: 10000, expired: false };
        expect(applyCoupon(cart, coupon).amount).toBe(18000);
      });

      test('coupon applies when amount equals minimum order', () => {
        const cart = { amount: 10000 };
        const coupon = { rate: 0.1, minAmount: 10000, expired: false };
        expect(applyCoupon(cart, coupon).amount).toBe(9000);
      });

      test('expired coupon throws CouponExpiredError', () => {
        const cart = { amount: 20000 };
        const coupon = { rate: 0.1, minAmount: 10000, expired: true };
        expect(() => applyCoupon(cart, coupon)).toThrow(CouponExpiredError);
      });
    });

    describe('amount calculation', () => {
      test('discount is floored to the won', () => {
        const cart = { amount: 12345 };
        const coupon = { rate: 0.1, minAmount: 0, expired: false };
        expect(applyCoupon(cart, coupon).amount).toBe(11111);
      });

      test('fixed coupon never makes amount negative', () => {
        const cart = { amount: 3000 };
        const coupon = { fixed: 5000, minAmount: 0, expired: false };
        expect(applyCoupon(cart, coupon).amount).toBe(0);
      });
    });
    ```

    Jest 설정이 이미 `package.json`에 있으니 `npm test`로 바로 돌리면 됩니다. 테스트 5개 모두 시나리오대로 작성했습니다.
