    | 2 | amount calculation | 원 단위 내림(12,345원 → 할인 1,234원), 정액 쿠폰 음수 방지(0원) | 같은 파일에 `describe` 블록 추가 |

    시나리오 파일에 우선순위 표시가 없어 파일 순서대로, 검증 도메인을 먼저 둡니다(계산 도메인이 유효 쿠폰 생성 픽스처에 기대므로). 신규 파일 1개, 기존 파일 수정 0개입니다. 패턴은 `describe`/`it` + `expect`, 쿠폰·장바구니는 파일 상단 팩토리 함수, 만료 판정은 `jest.useFakeTimers().setSystemTime(...)`로 시각을 고정하고 mock은 쓰지 않습니다(순수 함수 가정, 소스 확인 후 확정). 도메인마다 `npx jest src/cart/discount.test.ts`로 통과 확인 후 다음으로 넘어가고, 끝나면 `npm test` 전체를 돌립니다.

