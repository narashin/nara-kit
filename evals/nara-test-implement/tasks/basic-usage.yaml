id: basic-usage-001
name: Implement test code from scenarios document
description: |
  Verifies that the skill reads existing test files as golden samples, detects
  project tooling, and implements test code domain-by-domain from a scenarios
  document, running verification after each domain.
tags:
- basic
- happy-path
inputs:
  prompt: |
    시나리오 구현해줘 docs/test-scenarios/scenarios-detailed.md
    (시나리오 파일은 첨부한 scenarios-detailed.md와 같다.)
  files:
  - path: scenarios-detailed.md
expected:
  output_contains:
  - test
  output_not_contains:
  - S2
  - S3
  - Candidate Discovery
  outcomes:
  - type: task_completed
graders:
- type: text
  name: task_regex
  config:
    regex_match:
    - (?i)(domain|golden sample|pipeline|test|implement)
    - (?i)(domain|도메인)
    - (?i)(implement|구현)
