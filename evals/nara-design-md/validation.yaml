wrong:
  adopt-mode-001: |
    `tailwind.config.ts`의 theme 값을 바탕으로 `design.md`를 작성했습니다.

    ````markdown
    # Design System

    React + Tailwind CSS 프로젝트의 디자인 가이드입니다. 모든 값은 `tailwind.config.ts`의 `theme`에서 가져왔습니다.

    ## Colors

    | 이름 | Tailwind 클래스 | 값 | 용도 |
    |---|---|---|---|
    | Primary | `bg-primary`, `text-primary` | #3659FF | 주요 버튼, 링크, 강조 |
    | White | `bg-white` | #FFFFFF | 기본 배경 |
    | Black | `text-black` | #000000 | 기본 텍스트 |
    | Positive | `text-positive` | #3CC926 | 성공, 완료 상태 |
    | Negative | `text-negative` | #FF334B | 오류, 삭제, 경고 |

    ### Gray scale

    | 단계 | 값 | 권장 용도 |
    |---|---|---|
    | gray-100 | #FCFCFC | 페이지 배경 |
    | gray-200 | #EFEFEF | 카드·섹션 배경 |
    | gray-300 | #DFDFDF | 구분선, 테두리 |
    | gray-500 | #949494 | 보조 텍스트, placeholder |
    | gray-700 | #555555 | 본문 보조 텍스트 |
    | gray-900 | #111111 | 제목 텍스트 |

    ## Border Radius

    | 이름 | 클래스 | 값 |
    |---|---|---|
    | Default | `rounded` | 5px |

    모든 버튼, 입력창, 카드에 `rounded`를 사용합니다.

    ## Typography

    Tailwind 기본 폰트 스케일을 사용합니다 (config에 별도 정의 없음).

    - 제목: `text-2xl font-bold text-gray-900`
    - 본문: `text-base text-gray-700`
    - 캡션: `text-sm text-gray-500`

    ## Spacing

    Tailwind 기본 spacing 스케일(4px 단위)을 사용합니다.

    ## Components

    ### Button

    ```tsx
    <button className="bg-primary text-white rounded px-4 py-2">확인</button>
    <button className="bg-white text-primary border border-primary rounded px-4 py-2">취소</button>
    ```

    ### Input

    ```tsx
    <input className="border border-gray-300 rounded px-3 py-2 placeholder:text-gray-500" />
    ```

    ## 주의사항

    - `theme.colors`를 `extend` 없이 덮어썼기 때문에 Tailwind 기본 색상(`blue-500`, `red-500` 등)은 사용할 수 없습니다. 정의된 색상만 사용하세요.
    - gray-400, 600, 800은 정의되어 있지 않습니다.
    ````

    프로젝트 루트에 `design.md`로 저장하시면 됩니다. Typography와 Spacing은 config에 정의가 없어 Tailwind 기본값 기준으로 적었으니, 팀에서 쓰는 폰트나 간격 규칙이 있으면 알려주세요. 반영하겠습니다.
  audit-mode-001: |
    DESIGN.md 내용은 확인했습니다. 다만 드리프트는 문서와 실제 코드를 비교해야 알 수 있는데, 현재 프로젝트에는 컴포넌트나 스타일 코드가 없어서 비교 대상이 없습니다.

    DESIGN.md에 정의된 기준은 이렇습니다.

    | 분류 | 토큰 | 값 |
    |---|---|---|
    | colors | primary | #3659FF |
    | colors | canvas | #FFFFFF |
    | colors | hairline | #DFDFDF |
    | colors | ink | #000000 |
    | rounded | 200 | 5px |
    | spacing | 500 | 20px |

    규칙으로는 primary를 액션 요소에만 쓰고, 콘텐츠 영역 배경에는 쓰지 않으며, 컴포넌트에 hex 값을 직접 쓰지 않는다는 것이 있습니다.

    코드가 있으면 다음 순서로 점검하겠습니다.

    1. 컴포넌트·CSS 파일에서 hex 색상, px 값 직접 사용 검색 (`grep -rnE '#[0-9a-fA-F]{6}|[0-9]+px' src/`)
    2. 찾은 값을 위 토큰 표와 대조해 문서에 없는 값, 토큰과 다른 값을 분류
    3. primary 색이 배경으로 쓰인 곳 확인
    4. 문서에 있지만 코드에서 쓰이지 않는 토큰 확인

    컴포넌트 코드 경로를 알려주시거나 파일을 붙여넣어 주시면 바로 비교해 드리겠습니다.

    참고로 문서 자체에도 보완하면 좋을 점이 있습니다. rounded와 spacing이 각각 한 단계만 정의되어 있어서, 코드에서 4px이나 8px 같은 값이 나오면 위반인지 미정의인지 판단하기 어렵습니다.
  no-trigger-001: |
