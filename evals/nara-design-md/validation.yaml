right:
  adopt-mode-001: |
    DESIGN.md adopt 모드로 진행했고, 템플릿 선택 단계에서 멈췄습니다 (pending escalation). 아직 파일은 쓰지 않았습니다.

    **1. 프로젝트 스캔 결과 (`tailwind.config.ts`)**

    `theme.colors`와 `theme.borderRadius`를 `extend` 없이 직접 덮어쓰고 있어서, Tailwind 기본 팔레트(`blue-500` 등)와 `rounded-md` 같은 기본 radius 스케일은 이 프로젝트에 존재하지 않습니다. 실제로 쓸 수 있는 토큰은 아래가 전부입니다.

    | Tailwind 키 | 값 | DESIGN.md 역할 후보 |
    |---|---|---|
    | `primary` | `#3659FF` | `colors.primary` |
    | `white` | `#FFFFFF` | `colors.canvas` 후보 |
    | `black` | `#000000` | `colors.ink` 후보 |
    | `positive` | `#3CC926` | `colors.positive` |
    | `negative` | `#FF334B` | `colors.negative` |
    | `gray.100` ~ `gray.900` (100/200/300/500/700/900) | `#FCFCFC` `#EFEFEF` `#DFDFDF` `#949494` `#555555` `#111111` | surface / hairline / muted / body 후보 |
    | `borderRadius.DEFAULT` | `5px` | `rounded` 단일 값 |

    이름이 그대로 역할인 것은 primary, positive, negative 셋뿐입니다. `black`과 `gray.900` 중 무엇이 본문 텍스트인지, `gray.300`이 테두리인지 같은 역할 매핑은 설정 파일만으로는 관찰되지 않습니다. 추측으로 채우지 않고, 컴포넌트(`./components/**/*.tsx`, `./pages/**/*.tsx`) 클래스 사용을 스캔해서 확정합니다. 지금 작업 디렉터리에는 그 소스가 없어서 이 부분은 `[UNVERIFIED]`로 남아 있습니다.

    설정에 없는 것: typography(폰트·크기 계층), spacing(기본 스케일 그대로), shadow, breakpoints. 이 값들은 CSS·`package.json`·컴포넌트 스캔에서 나와야 하고, 거기서도 안 보이면 Known Gaps에 적습니다. gray 스케일에 400/600/800이 비어 있다는 점도 함께 기록할 예정입니다.

    **2. 디자인 성격 판단 (템플릿 매칭 기준)**

    색 온도는 차가운 블루 primary에 무채색 gray 계열이라 cool/neutral 쪽입니다. 다크 계열 surface 토큰이 없어서 light-first로 보이지만 이건 설정에서 추론한 것이라 `[UNVERIFIED]`입니다. radius가 5px 하나뿐이라 shape 언어는 살짝 둥근 단일 스케일입니다. spacing 밀도와 레이아웃 패턴(sidebar / single-column / grid)은 컴포넌트를 봐야 판단할 수 있습니다.

    **3. 다음 순서**

    템플릿 이름은 추측하지 않고 [getdesign.md](https://getdesign.md/) 갤러리에서 위 성격과 맞는 2~3개를 골라 제안드립니다. 선택하시면 이렇게 설치합니다.

    ```bash
    npx getdesign@latest add <template-name>
    ```

    설치 뒤에는 템플릿의 frontmatter(colors / typography / rounded / spacing / components)를 위 실측 토큰으로 바꾸고, 본문 섹션은 템플릿의 문체와 구조를 유지한 채 값만 프로젝트 것으로 교체합니다. 본문에는 raw hex 대신 `{colors.primary}` 같은 토큰 참조만 씁니다. 마지막으로 본문의 모든 `{colors.*}` `{rounded.*}` 참조가 frontmatter에 있는지 검증하고 Completeness Score(5개 기준)를 보고한 뒤 프로젝트 루트에 `DESIGN.md`로 저장합니다.

    - artifact: 아직 없음 (예정: `DESIGN.md`) · side effects: 없음

    → ESCALATE: (1) 컴포넌트 소스 경로(`components/`, `pages/`)를 열 수 있게 해 주시면 역할 매핑과 성격 판단을 확정하고 getdesign.md 템플릿 후보 2~3개를 제안하겠습니다. (2) 이미 염두에 둔 getdesign 템플릿이 있으면 이름을 알려 주세요.
  audit-mode-001: |
    디자인 드리프트 audit: DESIGN.md 파싱은 끝났지만 비교할 코드가 없어 drift 판정은 보류했습니다 (pending escalation).

    **DESIGN.md에서 읽은 기준 (Test Project)**

    토큰은 colors 4개(`primary` `#3659FF`, `canvas` `#FFFFFF`, `hairline` `#DFDFDF`, `ink` `#000000`), `rounded.200` = 5px, `spacing.500` = 20px입니다. typography와 components 섹션은 정의되어 있지 않습니다. 규칙은 세 개입니다. `{colors.primary}`는 actionable 요소에만 쓴다, content 영역 배경으로 쓰지 않는다, 컴포넌트에 raw hex를 쓰지 않는다.

    **코드 스캔**

    작업 디렉터리에서 스캔할 소스(컴포넌트, CSS, Tailwind 설정)를 찾지 못했습니다. 코드 쪽 관찰이 0건이라 Undocumented / Unused / Deviated / Don't violations 어느 칸도 채울 근거가 없습니다. 이 상태에서 6개 토큰을 전부 "Unused"로 적으면 코드가 없다는 사실을 드리프트로 둔갑시키는 셈이라 그렇게 보고하지 않았습니다. Score도 분모를 만들 관찰이 없어 산출하지 않았습니다.

    **소스를 받으면 확인할 것**

    hex 값 기준으로 매칭합니다. 코드의 hardcoded hex가 위 4색 중 하나와 같으면 그 토큰을 써야 할 자리(Undocumented), 4색에 없는 hex면 미정의 값, 이름은 다른데 값이 같으면 Deviated로 분류합니다. radius·spacing은 5px·20px 밖의 값을 찾고, `bg-primary`가 콘텐츠 영역 컨테이너에 쓰인 곳과 컴포넌트 안의 raw hex는 Don't 위반으로 잡습니다. 소스만으로 검증할 수 없는 값(런타임에만 정해지는 색 등)은 `[UNVERIFIED]`로 따로 두고 Score 분모에서 뺍니다. 결과는 Design Drift Report 형식으로 드립니다.

    - artifact: 없음 · side effects: 없음

    → ESCALATE: 스캔할 코드 경로를 알려 주세요 (예: `src/`, `components/`, `tailwind.config.ts`).
