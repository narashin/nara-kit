    2단계는 [getdesign.md](https://getdesign.md/) 갤러리에서 템플릿을 고르는 것입니다. 템플릿 이름은 제가 추측하지 않으니, 갤러리에서 원하는 것을 골라 알려주세요. 선택하시면 아래 명령으로 설치한 뒤 프로젝트 값으로 토큰을 교체하겠습니다.

    ```bash
    npx getdesign@latest add <name>
    ```

    - 상태: skipped (토큰 원천 없음, 템플릿 미선택)
    - artifact: 없음 (`DESIGN.md` 미생성)

    Spring Boot REST API 엔드포인트는 화면 디자인 토큰이 없는 백엔드 작업이라, 프론트엔드 코드가 생기면 그때 스캔 결과로 DESIGN.md를 채울 수 있습니다.

    → ESCALATE: getdesign.md 갤러리에서 사용할 템플릿 이름을 알려주세요.
