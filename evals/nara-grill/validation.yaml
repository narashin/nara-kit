# Grader-validation table for nara-grill.
#
# `right`: a fresh subagent running the current SKILL.md on each task prompt
# (2026-10-16). `wrong`: observed behaviour -- a fresh subagent with no skill
# loaded (normal tasks), or the skill applied to a request it should decline
# (should-not-trigger). Tools were off for side effects: outputs are dry runs.
#
# Run: tools/eval-fixture.py validate nara-grill
# Expected: every task passes on right and fails on wrong.
right:
  basic-usage-001: |
    검토 대상 설계를 찾지 못했습니다. 작업 디렉터리가 비어 있어서 설계 문서도, 현재 알림을 어떻게 가져오는지(폴링 주기, 엔드포인트, 인증 방식) 보여 줄 코드도 없습니다. 그래서 사실 조사로 확인한 것은 없고, 아래 질문은 모두 웹소켓 푸시 설계라면 어떤 형태든 먼저 정해야 하는 결정들입니다. 설계 문서나 기존 코드가 있으면 함께 주시면 됩니다. 그러면 여기서 가정한 부분을 실제 사실로 바꿔서 다시 보겠습니다.

    가정: 지금은 클라이언트가 주기적으로 알림 API를 폴링하고 있고, 이를 서버 푸시로 바꾸려는 상황이라고 봤습니다. 사용자·탭 수 같은 규모 수치는 받은 것이 없어서 연결 수나 부하는 아직 판단하지 않았습니다.

    미룬 질문이 있습니다. 같은 알림이 두 번 뜨지 않게 하는 중복 제거 키는 Q2(전달 보장)의 답에 달려 있습니다. 재전송을 하면 중복이 일상이 되고, 유실을 허용하면 중복은 드뭅니다. 게이트웨이를 여러 대 둘 때 어느 인스턴스가 어떤 사용자의 소켓을 들고 있는지 맞추는 방식은 Q5(규모)에 달려 있습니다.

    Q1. 검토할 설계의 원본이 있나요?
    - A: 설계 문서나 관련 코드를 공유한다
    - B: 아직 없고, 이 대화에서 아래 결정부터 정한다
    - 권고: A. 기존 폴링 구현과 인증 방식을 봐야 Q3·Q4의 권고가 추측에서 사실로 바뀝니다.

    Q2. 탭이 잠깐 끊긴 사이에 생긴 알림은 어떻게 하나요?
    - A: 재연결 때 마지막으로 받은 이벤트 이후분을 다시 보낸다 (at-least-once)
    - B: 다음 페이지 로드 전까지 잃어도 된다 (at-most-once)
    - C: 푸시는 at-most-once로 두고, 재연결 직후 기존 알림 API를 한 번 조회해서 빈 구간을 메운다
    - 권고: C. 서버에 이벤트 재생용 저장소를 새로 두지 않고 이미 있는 API로 유실을 막을 수 있습니다.

    Q3. 웹소켓 핸드셰이크 인증은 무엇으로 하나요?
    - A: 기존 세션 쿠키를 업그레이드 요청에 그대로 쓴다
    - B: 짧게 사는 토큰을 따로 발급해 첫 메시지로 보낸다
    - 권고: 게이트웨이가 웹앱과 같은 도메인이면 A에 Origin 검사 추가, 다른 도메인이면 B. 쿠키 방식은 Origin 검사가 없으면 다른 사이트가 사용자 소켓을 여는 공격(CSWSH)에 열립니다.

    Q4. 프록시가 웹소켓 업그레이드를 막는 환경에서는 어떻게 하나요?
    - A: 기존 폴링으로 자동 전환한다
    - B: "실시간 알림을 쓸 수 없음"을 보여 주고 멈춘다
    - 권고: A. 폴링이 이미 있으니 그대로 남기면 지금보다 나빠지는 사용자가 생기지 않습니다.

    Q5. 동시 접속 규모는 어느 정도인가요? (사용자 수, 사용자당 열어 두는 탭 수, 하루 알림 수)
    - A: 수치를 알려 준다
    - B: 게이트웨이 한 대로 충분한 규모로 가정하고 진행한다
    - 권고: A. 게이트웨이를 한 대로 끝낼지, 인스턴스 간 브로드캐스트가 필요한지가 이 수치로 갈립니다.

    답 형식: `Q1 A, Q2 C, Q3 A, Q4 A, Q5 B`처럼 번호별로 답해 주세요. 수치나 자료는 같이 붙여 주시면 됩니다.
  frontier-round-001: |
    설계 노트를 읽고 확인할 수 있는 사실부터 정리했습니다. 이번 검토용으로 체크아웃된 저장소가 없어서, 기존 폴링 구현, 세션 쿠키 속성, 게이트웨이가 놓일 도메인은 코드로 확인하지 못했습니다. 아래에서 그 부분이 걸린 권고는 조건부로 적었습니다.

    문서의 수치로 계산한 규모는 이렇습니다. 동시 소켓은 1,200명 × 최대 3탭이라 최대 3,600개이고, 모두가 동시에 접속한 경우의 상한입니다. 알림은 1,200명 × 하루 40건으로 약 48,000건/일, 하루 전체에 고르게 퍼지면 초당 0.6건 정도입니다. 다만 한 알림이 사용자의 탭 수만큼 팬아웃되므로 소켓 쓰기는 그 최대 3배입니다. 이 규모면 처리량보다는 연결 유지와 재연결 처리가 설계의 무게중심입니다. 수치를 대조할 CSV가 없어서 수치 검증은 하지 않았고, 위 값은 문서에 적힌 수치를 곱한 것뿐입니다.

    가정: "새 승인 요청이 2초 안에 보인다"는 목표는 탭이 연결돼 있을 때 기준이고, 끊긴 탭이 따라잡는 시간은 포함하지 않는다고 봤습니다.

    미룬 질문이 하나 있습니다. 작성자가 적은 4번(중복 제거 키를 event id로 할지 (type, entity id, timestamp)로 할지)은 Q1의 답에 달려 있습니다. 재전송을 고르면 중복이 정상 경로가 되어 서버가 붙인 event id가 사실상 필수이고, 유실 허용을 고르면 중복이 드물어 더 가벼운 키로도 됩니다. Q1이 정해지면 다음 라운드에 묻겠습니다.

    Q1. 탭이 몇 초 끊긴 동안 생긴 알림은 어떻게 하나요? (작성자 1번)
    - A: 재연결 때 마지막으로 받은 이벤트 이후분을 다시 보낸다 (at-least-once). 게이트웨이나 큐에 이벤트 보관과 재생 위치 관리가 필요합니다
    - B: 다음 페이지 로드 전까지 잃는다 (at-most-once)
    - C: 푸시는 at-most-once로 두고, 재연결 직후 `/api/notifications`를 한 번 조회해 빈 구간을 메운다
    - 권고: C. 승인 요청이 조용히 사라지는 것은 B로는 받아들이기 어렵고, A는 재생 저장소를 새로 만들어야 합니다. 이미 있는 API로 같은 효과를 냅니다.

    Q2. 핸드셰이크 인증은 무엇으로 하나요? (작성자 2번)
    - A: 세션 쿠키를 업그레이드 요청에 그대로 쓴다
    - B: `/api/ws-token`에서 짧게 사는 토큰을 받아 첫 메시지로 보낸다
    - 권고: 게이트웨이가 web-ui와 같은 도메인으로 노출되면 A에 Origin 검사를 더하고, 다른 도메인이면 B. 쿠키 방식은 Origin 검사가 없으면 다른 사이트가 사용자 소켓을 여는 공격(CSWSH)에 열립니다. 게이트웨이 도메인은 확인하지 못했습니다.

    Q3. 프록시가 업그레이드를 막을 때는 어떻게 하나요? (작성자 3번)
    - A: 기존 30초 폴링으로 자동 전환한다
    - B: "실시간 알림을 쓸 수 없음"을 보여 주고 멈춘다
    - 권고: A. 지금 폴링으로 알림을 받는 사용자가 이 변경 뒤에 오히려 못 받게 되면 회귀입니다. 폴링 코드는 이미 있으니 남기는 비용도 작습니다.

    Q4. "같은 토스트를 두 번 보이지 않는다"는 탭 하나 안에서인가요, 한 사용자의 모든 탭에 걸쳐서인가요?
    - A: 탭 하나 안에서만. 탭 3개를 열어 두면 토스트도 3번 뜬다
    - B: 탭 전체에서 한 번. 탭끼리 조율(BroadcastChannel 등)이 필요하다
    - 권고: B는 구현이 늘어나니, 탭마다 뜨는 것이 실제로 불편한지 먼저 정해 주세요. 배지 숫자는 어느 쪽이든 모든 탭에서 같이 올라가야 합니다. 이 질문은 Q1과 무관하게 지금 답할 수 있어서 이번 라운드에 넣었습니다.

    Q5. 게이트웨이를 여러 대 두나요?
    - A: 한 대로 시작한다. 최대 3,600 연결은 한 대로 감당할 수 있는 규모이지만, 그 한 대가 재시작하면 전원이 재연결합니다
    - B: 여러 대를 둔다. 큐 이벤트를 모든 인스턴스가 받아 자기 소켓만 걸러 보내거나, 사용자별 라우팅이 필요하다
    - 권고: B를 모든 인스턴스 구독 방식으로. 이 규모에서는 브로드캐스트 비용이 작고, 배포 중 재시작에도 알림이 끊기지 않습니다. Q1에서 C를 고르면 재연결 폭주 때 `/api/notifications` 조회가 한꺼번에 몰리니 재연결에 지터를 두는 것까지 같이 정해야 합니다.

    답 형식: `Q1 C, Q2 A, Q3 A, Q4 A, Q5 B`처럼 번호별로 답해 주세요.
wrong:
  basic-usage-001: |
    웹소켓으로 알림을 실시간 푸시하는 설계는 흔한 패턴이지만, 운영에 들어가면 자주 문제가 되는 지점이 몇 가지 있습니다. 구체적인 설계 문서는 주시지 않아서 일반적인 관점에서 짚어볼게요.

    ## 1. 연결 관리
    - 서버 여러 대로 스케일아웃할 때, 특정 사용자의 소켓이 어느 인스턴스에 붙어 있는지 어떻게 찾나요? Redis Pub/Sub 같은 브로커로 팬아웃하는 방식이 일반적입니다.
    - 로드밸런서에서 sticky session이 필요한지, 유휴 연결 타임아웃은 얼마인지 확인해야 합니다.
    - heartbeat(ping/pong)로 죽은 연결을 정리하는 로직이 있나요?

    ## 2. 메시지 유실
    - 연결이 잠깐 끊긴 동안 발생한 알림은 어떻게 하나요? 재연결 시 마지막으로 받은 이벤트 ID를 보내 놓친 것을 다시 받는 방식을 권장합니다.
    - 재전송을 하면 중복이 생기므로 클라이언트에서 이벤트 ID 기반 중복 제거가 필요합니다.

    ## 3. 인증
    - 핸드셰이크에서 쿠키를 쓸지 토큰을 쓸지 정해야 합니다. 쿠키를 쓴다면 Origin 검사로 CSWSH(Cross-Site WebSocket Hijacking)를 막아야 합니다.
    - 연결 중 세션이 만료되거나 권한이 바뀌면 소켓을 끊는 처리가 있나요?

    ## 4. 폴백
    - 일부 프록시나 방화벽은 웹소켓을 막습니다. SSE나 롱폴링 폴백을 둘지 검토하세요.

    ## 5. 부하
    - 동시 접속 수, 탭당 연결 수, 초당 메시지 수를 추정해 두면 게이트웨이 사이징에 도움이 됩니다.
    - 다중 탭이면 BroadcastChannel로 연결 하나만 유지하는 방법도 있습니다.

    ## 6. 관측성
    - 연결 수, 재연결률, 전송 지연, 유실률을 메트릭으로 남기세요.

    설계 문서를 공유해 주시면 이 항목들을 기준으로 더 구체적으로 봐드릴게요.
  frontier-round-001: |
    설계 노트 잘 봤습니다. 목표(2초 내 표시)는 명확하고 구조도 표준적입니다. 작성자가 남긴 열린 항목 4개에 대한 의견과, 추가로 보이는 부분을 정리했습니다.

    ## 열린 항목에 대한 의견

    **1. 전달 보장**: at-least-once를 추천합니다. 승인 요청 알림은 놓치면 업무가 막히는 종류라 유실이 더 큰 문제입니다. 재연결 시 클라이언트가 마지막 이벤트 ID를 보내고, 게이트웨이나 api-server가 그 이후 이벤트를 다시 보내는 방식이면 됩니다.

    **2. 핸드셰이크 인증**: `/api/ws-token`으로 짧은 수명 토큰을 발급하는 방식을 추천합니다. 쿠키를 재사용하면 구현은 간단하지만 Origin 검사를 빠뜨리면 CSWSH에 노출됩니다. 토큰 방식은 게이트웨이가 세션 저장소에 직접 붙지 않아도 된다는 장점도 있습니다.

    **3. 폴백**: 기존 30초 폴링을 폴백으로 유지하는 게 좋습니다. 이미 있는 코드이고, 프록시 환경 사용자에게 기능이 아예 사라지는 것보다 낫습니다.

    **4. 중복 제거**: 1번을 at-least-once로 정하면 중복은 정상 상황이 되므로, 서버가 부여한 이벤트 ID로 dedup하는 게 맞습니다. (type, entity id, timestamp) 조합은 타임스탬프 정밀도나 같은 엔티티에 대한 연속 이벤트 때문에 충돌하거나 놓칠 수 있습니다.

    ## 추가로 검토할 부분

    - **규모**: 1,200 DAU × 최대 3탭 = 동시 연결 최대 약 3,600개, 하루 알림 약 48,000건(초당 1건 미만)입니다. 게이트웨이 한 대로도 충분한 수준이라 처음부터 복잡한 클러스터링은 필요 없어 보입니다. 다만 이중화는 고려하세요.
    - **다중 탭**: 탭마다 토스트가 뜨면 같은 알림이 3번 보입니다. BroadcastChannel로 한 탭만 토스트를 띄우거나 리더 탭만 연결을 유지하는 방법을 검토해 보세요.
    - **재연결 폭주**: 게이트웨이 배포나 재시작 시 3,600개 연결이 한꺼번에 재접속합니다. 지수 백오프 + 지터를 넣어야 합니다.
    - **이벤트 보관**: at-least-once로 재전송하려면 이벤트를 얼마나 보관할지(예: 사용자별 최근 N건 또는 M분) 정해야 합니다.
    - **배지 정합성**: 푸시로 배지를 +1 하다 보면 실제 개수와 어긋날 수 있습니다. 재연결이나 탭 포커스 시 `/api/notifications`로 개수를 한 번 동기화하는 게 안전합니다.
    - **관측성**: 연결 수, 재연결률, 이벤트 생성부터 클라이언트 표시까지의 지연을 측정해야 2초 목표 달성 여부를 확인할 수 있습니다.

    정리하면 at-least-once + 이벤트 ID dedup + 단기 토큰 인증 + 폴링 폴백 조합을 추천합니다. 이 방향으로 정하시면 상세 설계를 이어서 같이 잡아볼게요.
