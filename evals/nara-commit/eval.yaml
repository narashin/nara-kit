name: nara-commit-eval
description: Evaluation suite for commit message generation skill.
skill: nara-commit
version: "1.0"
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: claude-sonnet-4.6
metrics:
  - name: task_completion
    weight: 1.0
    threshold: 0.8
    description: Did the skill generate a properly formatted conventional commit message?
graders:
  - type: code
    name: real_run
    config:
      # Provenance gate, not a behavioural one: it asserts the graded output came
      # from a real skill run. Under `executor: mock` it fails every task by
      # construction -- that is the correct signal, because mock output grades the
      # eval's own description and fixture text, never the skill. Measurement goes
      # through `waza grade` on a real run; see CLAUDE.md.
      assertions:
        - "len(output) > 40"
        - "'Mock response for:' not in output"
  - type: text
    name: commit_format
    config:
      regex_match:
        - "(?i)(feat|fix|docs|style|refactor|perf|test|chore|ci|revert):"
        - "(?i)(git diff --cached|staged|스테이징)"
tasks:
  - "tasks/*.yaml"
