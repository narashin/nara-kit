id: basic-usage-001
name: Commit message generation from staged changes
description: |
  Test that the skill analyzes staged git changes and generates a conventional
  commit message with the correct TICKET-ID prefix and type classification.
tags:
- basic
- happy-path
inputs:
  prompt: |
    /commit PROJ-111 커밋 메시지 생성해줘
    (저장소 상태는 첨부한 staged-diff.md와 같다.)
  files:
  - path: staged-diff.md
expected:
  output_contains:
  - PROJ-111
  output_not_contains:
  - git push
  - --no-verify
  outcomes:
  - type: task_completed
graders:
- type: text
  name: task_regex
  config:
    regex_match:
    - '(?i)(feat|fix|docs|style|refactor|perf|test|chore|ci|revert):'
    - (?i)(git diff --cached|staged|스테이징)
    - (git diff --cached|staged)
