  should-not-trigger-001: |
    이 요청은 `nara-research`가 맡는 일이 아닙니다 (skipped).

    `nara-research`는 결정 하나를 위해 외부 선행 사례를 비교하거나 남의 스킬·워크플로를 증류하는 스킬입니다. 이미 가진 API 설계의 구멍을 찔러 보는 일은 사실 조사 후 결정 질문을 한 라운드로 묻는 `/nara-grill`이 담당합니다.

    - 수행한 것: 없음 (외부 조사 0, 리포트 0)
    - next: `/nara-grill`에 API 설계 문서나 엔드포인트 목록을 붙여 다시 요청해 주세요. 이미 코드 diff가 있다면 `/nara-code-review`가 맞습니다
wrong:
  basic-usage-001: |
    `ext-release-checklist`를 살펴봤습니다. 결론부터 말하면 **이 체크리스트 절차는 스킬로 두는 게 좋아 보입니다.** 단계가 고정돼 있고 매번 같은 순서로 반복되는 작업이라 스킬화의 이점이 큽니다.

    ## nara-kit이 가져올 만한 것

    1. **외부 부작용 직전의 하드 스톱**: 태그 푸시, 패키지 배포, 공지처럼 되돌리기 어려운 작업 전에 정확한 명령을 출력하고 `go` 입력을 기다리는 방식은 아주 좋은 패턴입니다. 릴리스 관련 스킬에 그대로 넣을 만합니다.
    2. **실패 시 자동 롤백 금지 + INCIDENT 기록**: 부작용이 이미 일어난 뒤 실패하면 롤백하지 않고 부분 상태를 `release/INCIDENT.md`에 남기고 멈추는 것도 안전한 설계입니다.
    3. **릴리스 로그 기록**: 버전, 날짜, 담당자를 `release/LOG.md`에 남기는 건 추적성에 도움이 됩니다.
    4. **시작 전 체크리스트 검증**: 미완료 항목이 있으면 시작을 거부하는 게이트도 유용합니다.
    5. **정책 노브 분리**: 체크리스트 경로, 스모크 명령, 공지 채널, 로그 경로를 설정값으로 뺀 점은 재사용성을 높여줍니다.

    ## 조심할 점

    - 스모크 실패 시 재시도를 아예 금지하는 건 flaky 테스트가 있는 환경에서는 너무 엄격할 수 있습니다. 1회 재시도 옵션 정도는 고려해 볼 만합니다.
    - `#acme-release` 같은 채널명은 설정으로 빼야 합니다(이미 노브로 되어 있음).

    ## 추천

    `nara-release-checklist` 같은 이름으로 독립 스킬을 새로 만들고, 위 5가지를 모두 반영하는 걸 추천합니다. 원하시면 SKILL.md 초안을 바로 작성해 드릴게요.
  should-not-trigger-001: |
    조사를 시작하기 전에 어떤 결정을 위한 조사인지가 필요합니다. 지금 요청에는 내려야 할 결정도, 비교할 API 설계 자체도 없어서 여기서 멈춥니다.

    선행 사례 조사는 결정 하나를 정해 두고, 현재안을 baseline으로 보존한 채 외부 사례(다른 서비스나 오픈소스가 같은 문제를 어떻게 풀었는지)와 비교해 `docs/research/YYMMDD-<slug>.md` 리포트로 남깁니다. 예를 들면 이런 형태의 결정입니다.

    - 페이지네이션을 offset으로 할지 cursor로 할지
    - 부분 수정을 PATCH(JSON Merge Patch)로 할지 전용 액션 엔드포인트로 할지
    - 에러 응답을 RFC 9457 Problem Details로 맞출지 자체 포맷을 유지할지

    다음 두 가지를 알려주세요.

    1. 이 조사로 정하려는 결정 하나
    2. 현재 API 설계안(문서나 스펙 붙여넣기). 이게 baseline이 됩니다

    ```
    research: none (결정 없음)
    mode: prior-art
    sources: 0 (pinned 0 / unpinned 0 / unreadable 0)
    claims: 0 (cited 0 / unverified 0)
    verdict: 결정 미정으로 조사 보류 · confidence low
    distill: n/a
    ```
