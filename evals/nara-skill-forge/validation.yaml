# Grader-validation table for nara-skill-forge.
#
# `right`: a fresh subagent running the current SKILL.md on each task prompt
# (2026-10-16). `wrong`: observed behaviour -- a fresh subagent with no skill
# loaded (normal tasks), or the skill applied to a request it should decline
# (should-not-trigger). Tools were off for side effects: outputs are dry runs.
#
# Run: tools/eval-fixture.py validate nara-skill-forge
# Expected: every task passes on right and fails on wrong.
right:
  basic-usage-001: |
    nara-commit 기준선 점검을 마쳤고 수정 테마 승인을 기다립니다 (pending escalation). waza와 서브에이전트를 쓸 수 없어 이번 실행 전체를 `dry_run`으로 표시했고, 점수는 지어내지 않았습니다. SKILL.md는 아직 한 글자도 바꾸지 않았습니다.

    **Phase 0: 정적 점검 (수동 경로)**

    `which waza && waza check skills/nara-commit && waza tokens count skills/nara-commit` 를 실행할 수 없어 compliance 점수와 토큰 수는 없습니다. 대신 손으로 확인한 결과는 이렇습니다.

    - frontmatter: `name: nara-commit`이 디렉터리명과 같고 description에 USE FOR / DO NOT USE FOR가 있습니다. 문제 없음.
    - 링크: 출력 계약 포인터 `../nara-now/references/output-contract.md` 하나뿐이고, 파일이 없을 때 건너뛰라는 문구가 있습니다. 문제 없음.
    - 본문 길이: 짧고 references 없음. 토큰 예산 문제는 보이지 않지만 실측은 [UNVERIFIED: waza 없음].
    - runtime-neutrality 게이트: 스캔 패턴(`in Claude Code`, `~/.claude/skills/` 고정 경로 등)에 걸리는 줄은 없습니다. 다만 Step 5의 "`git commit`은 Claude가 실행하지 않는다"는 런타임 하나를 주어로 씁니다. 패턴 히트는 아니라 P0는 아니고, 아래 테마 4에 묶었습니다.

    **Phase 1: eval 구성**

    작업 트리에 `evals/nara-commit/`이 없어 `waza init` / `waza new eval` 대신 task 3개를 본문에서 직접 설계했습니다. 아직 파일로 쓰지 않았습니다 (planned).

    - 정상: `/nara-commit PROJ-111` + 같은 관심사의 소스·테스트 staged → `PROJ-111 fix: ...` 한 줄
    - 경계: 티켓 인자 없이 호출, 브랜치 `feature/PROJ-111-retry-limit`
    - 범위: "푸시해줘" 같은 요청은 이 스킬을 타지 않음

    grader 검증(맞는 답 하나, 틀린 답 하나를 넣어 앞엣것만 통과하는지)을 손으로 돌렸습니다. 정규식 `^[A-Z]+-\d+ (feat|fix|docs|style|refactor|perf|test|chore|ci|revert): .+` 는 `PROJ-111 fix: Limit token refresh retries`를 통과시키고 `fix: limit retries`를 떨어뜨려 쓸 만합니다. 반면 "subject가 대문자로 시작" 검사는 저장소 기존 커밋(`PROJ-108 fix: Session 갱신 실패 시 ...`)처럼 맞는 한국어 subject를 떨어뜨리기 때문에 너무 엄격한 가짜 지표라 뺐습니다.

    **Phase 2~3: 실행과 채점**

    EPT 실행은 task마다 새 서브에이전트 2회가 필요한데 이번에는 띄울 수 없어 수행하지 못했습니다. 같은 맥락에서 제가 직접 채점하면 낙관 편향이 생기므로, 아래는 본문을 task에 대어 본 desk-check이고 grader 점수가 아닙니다 [UNVERIFIED].

    ```
    ## Forge Iteration 0 (baseline, dry_run)
    ### Static (waza check): Compliance N/A · Tokens N/A/N/A · Violations 수동 점검 0건
    ### Execution (EPT): | Task | Pass | Score | Steps | Duration | Unclear |
    |   정상 (티켓 인자)  | 미실행 | N/A | N/A | N/A | 1 |
    |   경계 (인자 없음)  | 미실행 | N/A | N/A | N/A | 2 |
    |   범위 밖 요청      | 미실행 | N/A | N/A | N/A | 0 |
    ### Qualitative: Unclear {subject 언어, 72자 기준 대상} · Discretionary {브랜치에서 티켓 추출, 분리 제안 기준}
    ### Fix: 승인 대기 → ratchet 미시작
    (Convergence: 0/2 consecutive clears)
    ```

    desk-check에서 나온 수정 테마 후보입니다. ratchet 우선순위(틀린 행동 → 모호한 문구 → 침묵 → 구조) 순서입니다.

    1. **티켓 ID 출처 (틀린 행동 위험)**: 인자가 없으면 무조건 `NO-ISSUE`라서, 브랜치가 `feature/PROJ-111-retry-limit`이어도 `NO-ISSUE fix: ...`가 나옵니다. 인자 → 브랜치명의 티켓 패턴 → `NO-ISSUE` 순서로 정하고, 브랜치에서 가져왔다면 출처를 밝히도록 한 줄 추가.
    2. **subject 언어 (모호)**: "대문자 동사 시작"은 영어를 전제하는데 언어 규칙이 없어, 한국어 subject를 쓰는 저장소에서 판단이 갈립니다. 최근 `git log`의 subject 언어를 따르고, 대문자 규칙은 영어일 때만 적용하도록 정리.
    3. **72자 기준 대상 (모호)**: Format은 subject 72자, Error Handling은 "커밋 메시지 72자 초과"라고 해서 티켓 ID·type 포함 여부가 엇갈립니다. 한 줄 전체 기준으로 통일.
    4. **자기모순 문구 (구조)**: 스킬이 `git commit`을 실행하지 않는데 Error Handling에 pre-commit hook 실패 대응이 있습니다. "사용자가 직접 커밋하다 hook이 실패하면 메시지를 고치는 데만 돕는다"로 바꾸고, Step 5의 "Claude가"를 "에이전트가"로 중립화.

    분리 제안 기준(소스와 그 테스트는 한 관심사로 본다)도 침묵 지점이지만, 위 네 가지보다 영향이 작아 이번 후보에서 뺐습니다.

    - artifact: 없음 (SKILL.md 미변경, eval task는 계획만)
    - side effects: 없음 (waza·외부 LLM 호출 0건)

    → ESCALATE: 위 테마로 Phase 4를 진행할까요? 진행하면 테마 하나씩 `SKILL.md.forge-bak` 스냅샷을 뜬 뒤 고치고, 새 서브에이전트로 다시 채점해 하나라도 나빠지면 되돌립니다(ratchet). 다만 지금 환경에서는 재채점이 불가능해 어떤 수정도 kept로 확정할 수 없으므로, waza를 설치하고 서브에이전트를 쓸 수 있는 세션에서 이어 가는 것을 권합니다.

    답 형식: `진행 1,2,3,4` (번호 선택) 또는 `중단`
  ratchet-restore-001: |
    그 수정은 유지하지 않고 스냅샷으로 되돌립니다 (planned, 아직 적용 안 함). 노린 태스크가 좋아졌더라도, 이전에 통과하던 grader가 하나라도 깨지면 ratchet 규칙상 회귀이기 때문입니다.

    처리 순서는 이렇습니다.
    1. 되돌리기: 수정 전에 떠 둔 `SKILL.md.forge-bak`(git repo에서 작업 트리가 깨끗했다면 `git stash`)을 SKILL.md 위에 덮어씁니다. 스냅샷 없이 고쳤다면 자동으로 되돌릴 기준이 없으니, 수정 전 내용을 어디서 복원할지 먼저 정해야 합니다.
    2. 기록: 이번 시도를 ratchet 로그에 `restored`로 남깁니다. 어떤 테마였는지, 어떤 태스크의 어느 grader가 깨졌는지를 같이 적습니다.
    3. 다음 테마로 이동: 같은 테마를 그대로 다시 시도하지 않고, 우선순위상 다음 테마(실패 grader, 불명확한 지점, 재량으로 메운 부분, waza 지적 순)로 갑니다. 이 스킬이라면 8행 `in Claude Code`와 10행 `~/.claude/skills/sample-weak`의 runtime-lock이 아직 남아 있으면 그것이 P0입니다.
    4. 다시 채점할 때는 수정한 대화와 다른 새 서브에이전트로, 태스크마다 두 번 돌립니다. 두 번의 결과가 엇갈리면 그 태스크는 통과가 아니라 미결로 둡니다.

    하나 확인할 것이 있습니다. 깨진 grader가 원래부터 맞는 출력을 떨어뜨리는 grader일 수도 있습니다. 그 경우에도 grader 조건을 느슨하게 풀어 통과시키지는 않습니다. 맞는 출력과 틀린 출력을 하나씩 넣어 그 grader가 둘을 가르는지 따로 검증하고, 결함이면 grader를 고친 뒤 기준선을 다시 잡습니다. 이것은 스킬 수정과 섞지 않고 별도 단계로 둡니다.

    side effects: 0 (아직 아무 파일도 되돌리거나 고치지 않음)

    → ESCALATE: 지금 작업 트리에 `SKILL.md.forge-bak` 스냅샷이 있나요? 있으면 그것으로 되돌리고 다음 테마로 넘어가겠습니다.

    "있음" 또는 "없음"으로 답해 주세요.
  runtime-gate-001: |
    sample-weak 기준선 점검 완료, 수정 전 승인 대기 (pending escalation). 이번 실행은 `dry_run`입니다.

    Phase 0에서 실행할 명령은 아래와 같습니다. waza 실행 결과를 확인하지 못해 점수를 만들지 않았고, SKILL.md의 수동 경로(frontmatter, 링크, 본문 길이 직접 감사)로 대신했습니다.

    ```bash
    which waza && waza check skills/sample-weak && waza tokens count skills/sample-weak
    grep -nE "(in Claude Code|Claude Code skill|Claude Code only|Cursor only|Codex only|~/\.claude/skills/[a-z]|/plugin install)" weak-skill.md
    ```

    runtime 중립성 검사에서 두 군데가 걸렸습니다. 같은 SKILL.md가 Claude Code와 Codex 양쪽에 배포되는데, 이 두 줄은 Codex 쪽 에이전트가 "나와 상관없는 스킬"로 읽게 만듭니다. 그래서 수정 1회차의 P0 테마로 둡니다.
    - 8행 `This skill helps you format things in Claude Code.`: 단일 runtime 문구
    - 10행 `Install to ~/.claude/skills/sample-weak.`: 한 runtime 설치 경로에 고정, 중립 대안 없음

    ```
    ## Forge Iteration 0 (baseline, dry_run)
    ### Static (waza check): Compliance N/A (dry_run, 수동 감사) · Tokens N/A · Violations runtime-lock 2건 (8행, 10행), description에 USE FOR / DO NOT USE FOR 없음, 본문에 입력과 출력 규칙 없음
    ### Execution (EPT): 미실행 · evals/sample-weak 없음, 채점할 태스크 없음
    ### Qualitative: Unclear "format"의 대상과 결과 형식 · "figure out what to do" · Discretionary 입력 종류, 출력 형식, 실패 처리 전부
    ### Fix: 미적용 (CHECKPOINT 대기)
    (Convergence: 0/2 consecutive clears)
    ```

    Phase 1에서 태스크를 만들지 못한 이유는 본문이 무엇을 어떤 형식으로 포매팅하는지 말하지 않아서입니다. 이 상태로 grader를 쓰면 제가 정한 동작을 채점하게 되어 ratchet의 기준이 비게 됩니다. 그래서 Phase 2 실행과 Phase 3 채점도 하지 않았습니다.

    계획한 수정 테마는 한 회차에 하나씩, 이 순서입니다. 매 회차 전에 `weak-skill.md.forge-bak`로 스냅샷을 두고, 새 서브에이전트로 다시 채점해 하나라도 나빠지면 스냅샷으로 되돌립니다.
    1. runtime-lock (P0): 8행을 runtime 중립 문장으로 바꾸고, 10행의 고정 설치 경로는 지우거나 runtime마다 해석되는 설명으로 바꿉니다
    2. description: 무엇을 포매팅하는지와 USE FOR / DO NOT USE FOR를 넣어 라우팅이 걸리게 합니다
    3. Steps: 입력 종류, 출력 형식, 판단이 안 설 때의 처리를 적어 "figure out what to do"를 없앱니다

    side effects: 0 (파일 수정 없음, 외부 LLM 호출 없음)

    → ESCALATE: 두 가지 답이 필요합니다.
    - 이 스킬이 포매팅하는 대상과 결과 형식은 무엇인가요? (예: Markdown 표, JSON, 커밋 메시지 중 무엇이고 어떤 규칙으로 바꾸는지) 이 답이 있어야 eval 태스크와 grader를 만들고 2, 3번 테마를 진행할 수 있습니다.
    - 1번 runtime-lock 수정부터 Phase 4를 시작해도 될까요?

    "대상: ..., 1번 진행" 형식으로 답해 주세요.
  should-not-trigger-001: |
    이 요청은 nara-skill-forge가 다루는 일이 아닙니다. skill-forge는 에이전트 스킬을 분석하고 eval로 채점하면서 개선하는 스킬이라, Pull Request를 만들지 않습니다.

    `/nara-pr`(Codex에서는 `$nara-pr`)로 요청해 주세요. 기준 브랜치 대비 커밋을 분석해 PR 제목과 본문을 만들어 드립니다.
wrong:
  basic-usage-001: |
    nara-commit SKILL.md를 강화한 버전입니다. 주요 개선점은 다음과 같습니다.

    - 티켓 ID가 인자로 없으면 브랜치명에서 추출하도록 추가
    - scope 지원 (`feat(api):` 형식)
    - 커밋 본문(body) 작성 규칙 추가
    - 생성 후 바로 커밋까지 실행하도록 흐름 단순화
    - Examples 보강

    ```markdown
    ---
    name: nara-commit
    description: >-
      Analyze staged git changes, generate a conventional commit message with ticket ID prefix, and commit.
      USE FOR: "commit", "커밋 메시지", "commit message", "/nara-commit TICKET-ID", 커밋 생성, 커밋해줘.
      DO NOT USE FOR: git push, PR creation, branch management.
    ---

    # commit — Git 커밋 메시지 생성 및 커밋

    ## Steps

    1. `git diff --cached --stat`으로 staged 변경 확인. 없으면 `git add -A`로 스테이징.
    2. `git diff --cached`로 변경 의도와 범위 파악.
    3. 티켓 ID: 인자 → 브랜치명(`feature/PROJ-111-...`) → 없으면 `NO-ISSUE`.
    4. 아래 Format으로 메시지 생성. 필요하면 scope와 body 포함.
    5. `git commit -m "<message>"`로 커밋한다.

    ## Commit Message Format

    ```
    <TICKET-ID> <type>(<scope>): <Subject>

    <body: 변경 이유와 내용을 bullet로>
    ```

    - `<type>`: feat | fix | docs | style | refactor | perf | test | chore | ci | revert
    - `<Subject>`: 대문자 동사 시작, 현재형, 72자 이내.

    ## Examples

    - `PROJ-111 fix(session): Limit token refresh retries`
    - `OPS-999 fix(ticket): Fix ticket re-open logic`
    - `NO-ISSUE docs: Update README for setup instructions`

    ## Error Handling

    - pre-commit hook 실패 → 에러 수정 후 재시도. 급하면 `--no-verify` 사용.
    - 72자 초과 → 축약.
    ```

    이 버전으로 교체하시면 됩니다. 커밋까지 한 번에 처리돼서 사용성이 크게 좋아질 거예요.
  ratchet-restore-001: |
    수정 후에 다른 task의 grader가 깨졌다면 몇 가지 방법이 있습니다.

    1. **grader가 너무 엄격한지 먼저 확인하세요.** `sample-weak` 스킬은 원래 "Formats stuff." 수준으로 아주 모호해서, 기존 grader도 그 모호한 동작에 맞춰져 있을 가능성이 큽니다. 스킬을 더 구체적으로 고치면 출력 형식이 바뀌면서 정확 문자열 매칭 같은 grader가 깨지는 경우가 흔합니다. 이런 경우에는 grader의 기대값을 새 동작에 맞게 업데이트하면 됩니다.

    2. **수정 범위를 나눠 보세요.** 한 번에 description, Steps, 설치 경로 설명을 모두 바꿨다면, 어떤 변경이 영향을 줬는지 알기 어렵습니다. 변경을 하나씩 적용하면서 어느 지점에서 깨지는지 확인하세요.

    3. **깨진 task가 중요하지 않다면 일단 진행해도 됩니다.** 새로 고친 부분이 주요 task들을 통과시키고 있고, 깨진 task가 엣지 케이스라면 전체 점수가 올랐는지를 기준으로 판단하셔도 됩니다. 나중에 그 task만 따로 보완하면 됩니다.

    4. **정말 회귀라면 해당 부분만 되돌리세요.** `git diff`로 바뀐 부분을 보고, 깨진 task와 관련된 문장만 원래대로 돌린 뒤 다시 테스트해 보세요.

    참고로 이 스킬은 Steps가 "Look at the input / Do the formatting / Return the result"로 너무 추상적이라, 어떤 포맷을 다루는지(예: Markdown, JSON, 코드)와 입력이 없을 때의 동작을 명시하는 것부터 하시는 게 좋겠습니다. 깨진 grader의 내용을 보여 주시면 수정할지 되돌릴지 같이 판단해 드릴게요.
  runtime-gate-001: |
    sample-weak 스킬을 개선한 버전입니다. 가장 큰 문제는 description과 Steps가 너무 모호해서 Claude Code가 언제 이 스킬을 써야 하는지, 무엇을 해야 하는지 판단할 수 없다는 점이었습니다.

    ```markdown
    ---
    name: sample-weak
    description: >-
      Format Markdown, JSON, or YAML text into a consistent style.
      Use when the user says "format this", "정리해줘", "포맷 맞춰줘", or pastes
      unformatted Markdown/JSON/YAML. Do not use for code refactoring or translation.
    ---

    # Sample Formatter

    This skill formats text in Claude Code. Install it to `~/.claude/skills/sample-weak`
    and invoke it with `/sample-weak`.

    ## Steps

    1. Detect the input format (Markdown, JSON, YAML). If it cannot be determined, ask the user.
    2. Apply the formatting rules:
       - JSON: 2-space indent, keys in original order
       - YAML: 2-space indent, no trailing spaces
       - Markdown: one blank line between blocks, `-` for bullets
    3. Return only the formatted result in a fenced code block with the detected language.

    ## Rules

    - Do not change values or wording, only formatting.
    - If the input is invalid (e.g., broken JSON), report the error location instead of guessing.
    ```

    주요 변경 사항:
    - description에 대상 포맷, 트리거 문구, 사용하지 않을 경우를 추가했습니다.
    - Steps를 실제로 실행 가능한 수준으로 구체화했습니다.
    - 값을 바꾸지 않는다는 규칙과 잘못된 입력 처리 방식을 추가했습니다.
    - 사용법(`/sample-weak`)을 명시했습니다.
  should-not-trigger-001: |
    Skill Forge로 진행하겠습니다. 먼저 대상 스킬을 정해야 합니다. 현재 디렉터리에 `skills/` 아래 SKILL.md가 보이지 않아 forge할 대상을 특정하지 못했습니다.

    Phase 0(정적 분석)에서 실행할 명령은 다음과 같습니다.

    ```bash
    which waza && waza check skills/<name> && waza tokens count skills/<name>
    ```

    대상이 PR 생성 스킬(예: `nara-pr`)이라면 그 스킬을 기준으로 다음 순서로 진행합니다.

    1. Phase 0: waza check, 토큰 수, runtime-neutrality gate 점검
    2. Phase 1: `evals/nara-pr/` 확인, 없으면 task 2~4개와 결정적 grader 작성 후 grader 판별 검증
    3. Phase 2: task마다 새 서브에이전트 2회 실행
    4. Phase 3: `waza grade`로 baseline 기록 후 보고, 승인 받으면 Phase 4 수정 진행

    어떤 스킬을 forge할지 알려 주세요. (예: `nara-pr`)
