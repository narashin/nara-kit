name: nara-skill-forge-eval
description: Evaluation suite for skill-forge — static gate, EPT loop, regression ratchet, runtime-neutrality.
skill: nara-skill-forge
version: "1.0"
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: mock
  model: claude-sonnet-4.6
metrics:
  - name: task_completion
    weight: 1.0
    threshold: 0.8
    description: Did the skill run the waza static gate, execute via EPT subagents, grade, and keep-or-restore fixes through the ratchet?
graders:
  - type: code
    name: real_run
    config:
      # Provenance gate, not a behavioural one: it asserts the graded output came
      # from a real skill run. Under `executor: mock` it fails every task by
      # construction -- that is the correct signal, because mock output grades the
      # eval's own description and fixture text, never the skill. Measurement goes
      # through `waza grade` on a real run; see CLAUDE.md.
      assertions:
        - "len(output) > 40"
        - "'Mock response for:' not in output"
  - type: text
    name: forge_vocab
    config:
      regex_match:
        - "(?i)(waza check|ratchet|grader|EPT|converge|restore|snapshot|runtime)"
tasks:
  - "tasks/*.yaml"
