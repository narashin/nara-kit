name: nara-reflect-eval
description: Evaluation suite for session reflection and learning capture skill.
skill: nara-reflect
version: "1.0"
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: claude-sonnet-4.6
metrics:
  - name: task_completion
    weight: 1.0
    threshold: 0.8
    description: Did the skill route session learnings via the Session Reflect routing table (학습 | 타깃 | 동작 | 근거)?
graders:
  - type: code
    name: real_run
    config:
      # Provenance gate, not a behavioural one: it asserts the graded output came
      # from a real skill run. Under `executor: mock` it fails every task by
      # construction -- that is the correct signal, because mock output grades the
      # eval's own description and fixture text, never the skill. Measurement goes
      # through `waza grade` on a real run; see CLAUDE.md.
      assertions:
        - "len(output) > 40"
        - "'Mock response for:' not in output"
  - type: text
    name: reflect_sections
    config:
      regex_match:
        - "(?i)(Session Reflect|타깃|라우팅|routing)"
        - "(?i)(memory|handoff|discard|추천|세션|session)"
tasks:
  - "tasks/*.yaml"
