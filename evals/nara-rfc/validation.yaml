    # PROJ-222 주문 취소 API 설계 RFC

    ## 개요
    고객이 결제 완료 후 배송 전 단계의 주문을 직접 취소할 수 있도록 주문 취소 API를 새로 제공합니다. 현재는 CS 담당자가 어드민에서 수동으로 취소 처리하고 있어 처리 지연과 운영 비용이 발생하고 있습니다.

    ## 목표
    - 고객이 앱/웹에서 직접 주문을 취소할 수 있다.
    - 취소 시 결제 환불과 재고 복원이 자동으로 처리된다.
    - 부분 취소(주문 내 일부 상품 취소)를 지원한다.

    ## 비목표
    - 배송 시작 이후의 반품/교환 처리
    - 정산 시스템 변경

    ## API 설계

    ### 전체 취소
    ```
    POST /api/v1/orders/{orderId}/cancel
    ```
    Request
    ```json
    {
      "reason": "CHANGE_OF_MIND",
      "reasonDetail": "단순 변심"
    }
    ```
    Response `200 OK`
    ```json
    {
      "orderId": "ORD-20261016-0001",
      "status": "CANCELLED",
      "refundAmount": 35000,
      "cancelledAt": "2026-10-16T10:00:00+09:00"
    }
    ```

    ### 부분 취소
    ```
    POST /api/v1/orders/{orderId}/items/cancel
    ```
    ```json
    {
      "items": [{ "orderItemId": "OI-1", "quantity": 1 }],
      "reason": "CHANGE_OF_MIND"
    }
    ```

    ### 에러 코드
    | 코드 | HTTP | 설명 |
    |---|---|---|
    | ORDER_NOT_FOUND | 404 | 주문이 존재하지 않음 |
    | ORDER_NOT_CANCELLABLE | 409 | 배송 시작 이후 등 취소 불가 상태 |
    | ALREADY_CANCELLED | 409 | 이미 취소된 주문 |
    | REFUND_FAILED | 502 | PG 환불 실패 |

    ## 상태 전이
    `PAID → CANCEL_REQUESTED → CANCELLED`
    환불 실패 시 `CANCEL_REQUESTED`에 머무르며 재시도 큐로 이동합니다.

    ## 처리 흐름
    1. 주문 상태 검증 (PAID, PREPARING만 취소 가능)
    2. 주문 상태를 CANCEL_REQUESTED로 변경 (낙관적 락)
    3. PG 환불 API 호출
    4. 재고 복원 이벤트 발행 (`order.cancelled`)
    5. 상태를 CANCELLED로 변경하고 고객에게 알림 발송

    ## 멱등성
    클라이언트는 `Idempotency-Key` 헤더를 보내야 하며, 동일 키 요청은 24시간 동안 같은 응답을 반환합니다.

    ## 리스크
    - PG 환불 지연/실패 시 상태 불일치 → 재시도 큐 + 일 1회 대사 배치로 보완
    - 동시 취소 요청 → 낙관적 락으로 방지

    ## 일정
    - 1주차: API 및 상태 전이 구현
    - 2주차: PG 연동 및 재고 이벤트
    - 3주차: QA 및 배포

    ## 오픈 이슈
    - 부분 취소 시 쿠폰 할인 금액 안분 방식
    - 취소 사유 코드 목록 확정
  edge-case-001: |
    결제 시스템 리팩토링 RFC 초안을 작성했습니다. 세부 내용은 일반적인 결제 시스템 구조를 기준으로 가정했으니 실제 상황에 맞게 조정해 주세요.

    # [RFC] 결제 시스템 리팩토링

    - 작성일: 2026-10-16
    - 상태: Draft

    ## 1. 배경
    현재 결제 로직은 주문 서비스 안에 강하게 결합되어 있고, PG사별 연동 코드가 조건문으로 흩어져 있습니다. 신규 PG 추가나 결제 수단 추가 시 변경 범위가 넓고, 장애 발생 시 원인 추적이 어렵습니다.

    ## 2. 문제점
    - PG사별 분기 로직이 여러 곳에 중복되어 있음
    - 결제 상태 관리가 일관되지 않아 승인/취소 불일치가 종종 발생
    - 테스트 커버리지가 낮아 변경 시 회귀 위험이 큼

    ## 3. 목표
    - 결제 도메인을 별도 모듈(또는 서비스)로 분리
    - PG 연동을 Strategy 패턴 기반 어댑터로 추상화
    - 결제 상태를 명시적인 상태 머신으로 관리
    - 핵심 결제 흐름의 테스트 커버리지 80% 이상 확보

    ## 4. 제안
    ### 4.1 구조
    ```
    payment/
      domain/        # Payment, PaymentStatus, 상태 전이 규칙
      application/   # 승인, 취소, 환불 유스케이스
      adapter/pg/    # PgClient 인터페이스 + PG사별 구현
    ```

    ### 4.2 PG 어댑터 인터페이스
    ```kotlin
    interface PgClient {
        fun approve(request: ApproveRequest): ApproveResult
        fun cancel(request: CancelRequest): CancelResult
    }
    ```

    ### 4.3 상태 머신
    `READY → APPROVED → (PARTIAL_CANCELLED) → CANCELLED`, 실패 시 `FAILED`

    ### 4.4 마이그레이션 전략
    Strangler Fig 방식으로 신규 결제부터 새 모듈을 타게 하고, 기존 결제는 점진적으로 이관합니다. 피처 플래그로 트래픽 비율을 조절합니다.

    ## 5. 작업 항목
    - 결제 도메인 모델 및 상태 머신 구현
    - PgClient 인터페이스와 기존 PG 2종 어댑터 이관
    - 피처 플래그 기반 라우팅
    - 승인/취소 대사(reconciliation) 배치 추가

    ## 6. 영향 및 리스크
    - 이관 기간 동안 두 경로가 공존 → 모니터링 대시보드로 비교
    - 결제 장애는 매출 직결 → 단계적 롤아웃(1% → 10% → 50% → 100%)

    ## 7. 일정 (예상)
    - 1~2주: 도메인/어댑터 설계 및 구현
    - 3주: 피처 플래그 롤아웃
    - 4주: 전체 전환 및 레거시 제거

    ## 8. 열린 질문
    - 별도 서비스로 분리할지, 모놀리스 내 모듈로 둘지
    - 정산 시스템과의 인터페이스 변경 필요 여부
  should-not-trigger-001: |
    RFC 문서로 정리하겠습니다. 작성 전에 몇 가지 확인이 필요합니다.

    1. 이 RFC에 연결할 TICKET-ID가 무엇인가요? (예: `PROJ-123`) 파일은 `docs/rfc/<TICKET-ID>-rfc.md`로 저장합니다.
    2. 배경: 현재 PostgreSQL을 어떤 용도로 쓰고 있고, 어떤 문제(스키마 변경 부담, 확장성, 성능 등)가 있었나요?
    3. 제안 내용: MongoDB로 옮길 범위(전체 DB인지 특정 서비스·컬렉션인지)와 이관 방식, 백엔드·프론트엔드 쪽 작업이 있는지 알려 주세요.

    답을 주시면 RFC 템플릿(Background / Goal / Proposal / Work to do / Impact & Risk / Open Questions)의 모든 섹션을 채운 초안을 보여드리고, 확인 후 파일로 저장하겠습니다.
