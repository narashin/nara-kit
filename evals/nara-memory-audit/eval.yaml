name: nara-memory-audit-eval
description: >-
  Evaluation suite for the two-tier memory staleness audit.

  WHERE THE REAL GRADING IS: `regress.sh` in this directory. The skill's
  mechanical half is a bash script, so its behavior is asserted directly against
  the script — 15 hermetic cases, 35 assertions, verified on bash 3.2 and 5.x.
  Run `./regress.sh`; it exits non-zero on failure.

  WHAT THE TASKS BELOW ARE: recorded scenarios for the SKILL.md layer (routing,
  the read-only/approval contract, how the body teaches a reader to read an
  unresolvable check). Under `executor: mock` they are NOT behavioral graders —
  the mock echoes the prompt back and never invokes the skill, so no assertion
  here can distinguish a correct run from a deleted skill. They become
  discriminating only under a real executor. Do not read a green task run as
  evidence about the skill.
skill: nara-memory-audit
version: "1.0"
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: mock
  model: claude-sonnet-4.6
metrics:
  - name: task_completion
    weight: 1.0
    threshold: 0.8
    description: Did the run score the memory files and stop before mutating anything?
# Eval-level graders apply to EVERY task, so they assert only universally-true
# properties. Behavioural discrimination lives in each task's
# `expected.output_contains` / `output_not_contains`.
#
# `real_run` asserts the graded output came from a real skill run. It is
# unsatisfiable under `executor: mock` by construction — and that is the point.
# Mock output is the eval's own prompt, description and fixture text echoed back,
# so grading it measures this file against itself. Failing loudly under mock is
# the correct signal; passing quietly is the bug. Measurement runs through
# `waza grade` on a real run's JSON (see CLAUDE.md).
graders:
  - type: code
    name: real_run
    config:
      assertions:
        - "len(output) > 40"
        - "'Mock response for:' not in output"
tasks:
  - "tasks/*.yaml"
