id: edge-case-bootstrap-001
name: "First run without profile bootstraps and stops"
description: |
  In a repo with NO .claude/ui-diff/, the skill bootstraps repo-local files from templates
  and STOPS with a fill-me receipt. It does not open a browser or fabricate a diff.
tags:
  - edge-case
inputs:
  prompt: "ui-diff"
  files: []
expected:
  output_contains:
    - "env.md"
    - "login.local.md"
  output_not_contains:
    - "drift candidates: 1"
  outcomes:
    - type: task_completed
