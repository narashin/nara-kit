id: edge-case-bootstrap-001
name: "First run without profile bootstraps and stops"
description: |
  In a repo with NO .claude/ui-diff/, the skill bootstraps repo-local files from templates
  and STOPS with a fill-me receipt. It does not open a browser or fabricate a diff.
tags:
  - edge-case
inputs:
  prompt: "ui-diff"
  files: []
expected:
  output_contains:
    - "env.md"
    - "login.local.md"
  output_not_contains:
    - "drift candidates: 1"
  outcomes:
    - type: task_completed
graders:
  - type: text
    name: task_regex
    config:
      regex_match:
        - "(?i)(drift|side effects|driver|recorded only|env-diff|env.md)"
        - "(?i)(candidate|후보|regression vs intended|사람 판단|human|out of scope|bootstrap)"
