  should-not-trigger-001: |
    figma 디자인과 실제 화면을 맞춰 보는 비교(figma-diff)는 이 스킬의 scope 밖입니다. 지금 만들어진 것은 배포된 QA/Prod 화면과 로컬 화면을 같은 조건에서 재는 환경 간 비교뿐이고, figma 모드는 아직 구현되지 않은 미래 모드라 측정을 돌리지 않았습니다.

    다음: figma 노드값과 런타임을 비교하는 도구는 현재 nara-kit에 없으니 수동 대조가 필요합니다. 배포 환경과 로컬 화면 차이를 보려는 것이었다면 `ui-diff --screen <화면>` 으로 다시 요청해 주세요.
wrong:
  basic-usage-001: |
    QA 환경이랑 로컬의 `create-ticket` 화면을 비교하려면 몇 가지 정보가 필요해요.

    1. QA 환경 URL (예: `https://qa.example.com/tickets/new`)
    2. 로컬 실행 주소 (예: `http://localhost:3000/tickets/new`)
    3. 로그인이 필요한지 여부

    준비되면 이런 방식으로 비교할 수 있어요.

    - 두 환경을 같은 브라우저 크기로 열고 스크린샷을 찍어 나란히 비교
    - 차이가 있어 보이는 부분은 개발자 도구로 해당 요소의 CSS를 확인
    - 필요하면 Playwright로 두 페이지 스크린샷을 찍어 픽셀 비교(`toHaveScreenshot`)

    ```ts
    await page.goto(QA_URL);
    await page.screenshot({ path: 'qa.png', fullPage: true });
    await page.goto(LOCAL_URL);
    await page.screenshot({ path: 'local.png', fullPage: true });
    ```

    URL을 알려주시면 바로 진행할게요.
  edge-case-bootstrap-001: |
    "ui-diff"만 주셔서 정확히 어떤 작업을 원하시는지 확인하고 싶어요. 아래 중 어떤 걸 말씀하시는 건가요?

    1. 두 환경(예: QA와 로컬)의 화면을 비교하는 것
    2. 코드 변경 전후 UI가 달라졌는지 확인하는 것
    3. 디자인 시안과 실제 화면을 비교하는 것
    4. `ui-diff`라는 이름의 도구나 스크립트 사용법

    비교할 화면 URL이나 브랜치를 함께 알려주시면 바로 도와드릴게요.
  should-not-trigger-001: |
    UI env-diff 프로필이 없어 bootstrap 후 중단했습니다 (skipped).

    ```bash
    test -f .claude/overrides/ui-diff.md && cat .claude/overrides/ui-diff.md   # 없음, skip
    ls .claude/ui-diff/                                                         # 없음
    ```

    - profile: `.claude/ui-diff/` 없음 → 템플릿에서 repo-local bootstrap 예정 (dry run): `env.md`, `login.md`, `login.local.md.example`, `screens/`
    - 측정 미실행: baseline(QA/Prod)·target(로컬) 런타임 open 안 함, drift candidates 0건
    - side effects: browser 0 runtimes opened, 0 writes to app
    - next: `env.md`에 `baseline_url`·로컬 dev 정보·viewport를 채우고, `login.local.md.example` → `login.local.md`로 복사한 뒤 비교할 화면을 `screens/<name>.md`로 추가해 다시 실행해 주세요. 피그마 디자인 대신 배포된 화면을 baseline으로 측정합니다.
