# Grader-validation table for nara-ui-diff.
#
# `right`: a fresh subagent running the current SKILL.md on each task prompt
# (2026-10-16). `wrong`: observed behaviour -- a fresh subagent with no skill
# loaded (normal tasks), or the skill applied to a request it should decline
# (should-not-trigger). Tools were off for side effects: outputs are dry runs.
#
# Run: tools/eval-fixture.py validate nara-ui-diff
# Expected: every task passes on right and fails on wrong.
right:
  basic-usage-001: |
    UI env-diff 중단 (skipped: `.claude/ui-diff/` 프로필 없음, bootstrap 후 정지).

    ```bash
    test -f .claude/overrides/ui-diff.md && cat .claude/overrides/ui-diff.md   # 없음, skip
    mkdir -p .claude/ui-diff/screens
    cp skills/nara-ui-diff/references/templates/env.md                 .claude/ui-diff/env.md
    cp skills/nara-ui-diff/references/templates/login.md               .claude/ui-diff/login.md
    cp skills/nara-ui-diff/references/templates/login.local.md.example .claude/ui-diff/login.local.md.example
    cp skills/nara-ui-diff/references/templates/screens/example.md     .claude/ui-diff/screens/example.md
    ```

    - screen: `create-ticket` 요청했지만 `screens/create-ticket.md`가 없음 (bootstrap은 `example.md`만 깔아 줌)
    - 측정: 안 함. baseline URL·로컬 dev 명령·viewport가 비어 있어 양쪽을 같은 조건으로 열 수 없음
    - side effects: browser: 0 runtimes opened, 0 writes to app
    - artifact: `.claude/ui-diff/env.md`, `login.md`, `login.local.md.example`, `screens/example.md` (템플릿 그대로, 실값 없음)
    - next:
      1. `env.md`에 local_url·local_dev_cmd·baseline_url(QA)·viewport(width/height/device_scale_factor)·auth/context를 채운다
      2. `login.local.md.example`을 `login.local.md`로 복사해 로그인 정보를 넣는다 (SSO면 사람이 한 번 로그인해 storageState로 저장하는 쪽을 권장)
      3. `.gitignore`가 `.claude/ui-diff/login.local.md`와 `.claude/ui-diff/runs/`를 무시하는지 확인한다. 무시되지 않으면 다음 실행이 진행을 거부한다
      4. `screens/example.md`를 바탕으로 `screens/create-ticket.md`(진입 경로, 비교 대상 selector, ready signal)를 작성한 뒤 다시 `QA랑 로컬 UI 비교해줘 --screen create-ticket`
