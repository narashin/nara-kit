name: nara-ui-diff-eval
description: Evaluation suite for env-diff visual regression skill.
skill: nara-ui-diff
version: "1.0"
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: claude-sonnet-4.6
metrics:
  - name: task_completion
    weight: 1.0
    threshold: 0.8
    description: Did the skill measure computed-style/rect diffs across two runtimes and report only differing values as candidates, without leaking credentials or auto-verdicting?
graders:
  - type: code
    name: real_run
    config:
      # Provenance gate, not a behavioural one: it asserts the graded output came
      # from a real skill run. Under `executor: mock` it fails every task by
      # construction -- that is the correct signal, because mock output grades the
      # eval's own description and fixture text, never the skill. Measurement goes
      # through `waza grade` on a real run; see CLAUDE.md.
      assertions:
        - "len(output) > 40"
        - "'Mock response for:' not in output"
  - type: text
    name: env_diff_contract
    config:
      regex_match:
        - "(?i)(drift|side effects|driver|recorded only|env-diff|env.md)"
        - "(?i)(candidate|후보|regression vs intended|사람 판단|human|out of scope|bootstrap)"
tasks:
  - "tasks/*.yaml"
