  repo-already-decides-001: |
    프로토타입 불필요: 저장소 근거로 이미 결정됨

    A안(모든 셀을 따옴표로 감쌈)과 B안(필요할 때만 감싸고 내부 따옴표를 두 번 씀) 중 B안이 이미 구현·테스트·결정 기록까지 끝나 있어서 비교 프로토타입을 만들지 않았습니다.

    - Evidence: `src/export/csv.ts`의 `escapeCell()`이 `/[",\r\n]/`에 걸리는 값만 따옴표로 감싸고 `"`를 `""`로 바꿉니다. 주석에 RFC 4180 기준이라고 적혀 있고, PROJ-123으로 머지되어 모든 export가 이 함수를 씁니다.
    - Evidence: `src/export/csv.test.ts`의 테스트 4개가 B안의 동작을 고정합니다. `"acme"`는 따옴표 없이 그대로 두고, `'a"b'`는 `'"a""b"'`, `"a,b"`는 `'"a,b"'`, 줄바꿈이 든 값은 따옴표로 감쌉니다. A안으로 바꾸면 첫 테스트가 바로 깨집니다.
    - Evidence: `docs/adr/0007-csv-escaping.md`가 B안을 accepted로 기록했고, 근거는 acme-sre의 하위 importer가 따옴표로 감싼 숫자 셀을 거부한다는 점입니다. A안은 이 제약을 정면으로 위반합니다.

