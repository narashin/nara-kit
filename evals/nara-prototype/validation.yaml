wrong:
  basic-usage-001: |
    결론부터 말하면 **trailing-edge debounce**가 맞습니다. 세 기준을 모두 만족하는 건 trailing뿐이고, leading은 2번 기준에서 떨어집니다.

    `docs/prototypes/search-debounce/`에 넣을 harness는 아래와 같습니다. 검색 API는 지연 200ms짜리 fake로 대체하고, Vitest fake timer로 "acme"를 50ms 간격으로 입력합니다.

    `docs/prototypes/search-debounce/debounce.ts`
    ```ts
    export function leading<T extends unknown[]>(fn: (...args: T) => void, wait: number) {
      let timer: ReturnType<typeof setTimeout> | undefined;
      return (...args: T) => {
        if (timer === undefined) fn(...args);
        clearTimeout(timer);
        timer = setTimeout(() => { timer = undefined; }, wait);
      };
    }

    export function trailing<T extends unknown[]>(fn: (...args: T) => void, wait: number) {
      let timer: ReturnType<typeof setTimeout> | undefined;
      return (...args: T) => {
        clearTimeout(timer);
        timer = setTimeout(() => fn(...args), wait);
      };
    }
    ```

    `docs/prototypes/search-debounce/harness.test.ts`
    ```ts
    import { describe, it, expect, vi, beforeEach } from "vitest";
    import { leading, trailing } from "./debounce";

    const API_LATENCY = 200;

    function run(strategy: typeof leading) {
      const requests: string[] = [];
      let resultAt: number | undefined;
      const fakeSearch = (q: string) => {
        requests.push(q);
        setTimeout(() => { resultAt = Date.now(); }, API_LATENCY);
      };
      const search = strategy(fakeSearch, 300);
      let lastKeyAt = 0;
      "acme".split("").forEach((_, i, arr) => {
        vi.advanceTimersByTime(i === 0 ? 0 : 50);
        lastKeyAt = Date.now();
        search(arr.slice(0, i + 1).join(""));
      });
      vi.advanceTimersByTime(2000);
      return { requests, latency: resultAt === undefined ? undefined : resultAt - lastKeyAt };
    }

    describe.each([["leading", leading], ["trailing", trailing]])("%s", (_, strategy) => {
      beforeEach(() => { vi.useFakeTimers(); vi.setSystemTime(0); });
      it("1. at most 1 request", () => expect(run(strategy).requests.length).toBeLessThanOrEqual(1));
      it("2. final text searched", () => expect(run(strategy).requests.at(-1)).toBe("acme"));
      it("3. results within 700ms", () => expect(run(strategy).latency).toBeLessThanOrEqual(700));
    });
    ```

    실행 명령은 `npx vitest run docs/prototypes/search-debounce`입니다. 타이머 흐름을 따라가면 결과는 이렇게 나옵니다.

    | 기준 | leading | trailing |
    |---|---|---|
    | 1. 빠르게 "acme" 입력 시 요청 1회 이하 | 통과 (요청 1회, `q=a`) | 통과 (요청 1회, `q=acme`) |
    | 2. 마지막 입력값으로 검색 | 실패 (`a`만 검색됨) | 통과 |
    | 3. 마지막 키 입력 후 700ms 내 결과 | 실패 (최종 입력에 대한 결과 없음) | 통과 (300ms + 200ms = 500ms) |

    leading은 첫 글자에서 바로 요청을 보내고 이후 입력을 삼키기 때문에, 사용자가 실제로 원한 "acme"는 검색되지 않습니다. trailing은 지연 300ms를 더해도 API 지연이 400ms 이하면 3번 기준을 지킵니다. 실제 api-server 지연이 400ms를 넘는다면 대기 시간을 줄이는 걸 검토해야 합니다.

    `src/search/useSearch.ts`에는 trailing 300ms로 적용하는 걸 권장합니다.
  repo-already-decides-001: |
    A안과 B안을 각각 구현해서 같은 입력으로 비교해 봤습니다.

    ```ts
    // A: wrap every cell in double quotes
    export function escapeCellA(value: string): string {
      return `"${value.replace(/"/g, '""')}"`;
    }

    // B: quote only when needed (RFC 4180)
    export function escapeCellB(value: string): string {
      if (/[",\r\n]/.test(value)) {
        return `"${value.replace(/"/g, '""')}"`;
      }
      return value;
    }
    ```

    | 입력 | A 결과 | B 결과 |
    |---|---|---|
    | `acme` | `"acme"` | `acme` |
    | `a"b` | `"a""b"` | `"a""b"` |
    | `a,b` | `"a,b"` | `"a,b"` |
    | `a\nb` | `"a\nb"` | `"a\nb"` |
    | `42` | `"42"` | `42` |

    둘 다 RFC 4180을 만족하는 올바른 CSV를 만듭니다. 차이는 특수문자가 없는 셀에서 드러납니다.

    A안은 로직이 단순하고 예외 케이스를 신경 쓸 필요가 없습니다. 대신 파일 크기가 조금 커지고, 숫자 셀까지 따옴표로 감싸져서 일부 도구가 숫자를 문자열로 읽을 수 있습니다.

    B안은 결과가 더 깔끔하고 Excel이나 대부분의 파서와 호환이 좋습니다. 숫자 셀이 그대로 남는 것도 장점입니다.

    종합하면 B안이 더 나은 선택으로 보입니다. 참고로 현재 `src/export/csv.ts`가 이미 B안으로 구현되어 있고 ADR 0007에도 B안이 채택된 것으로 기록되어 있으니, 지금 구현을 그대로 유지하면 됩니다.
  should-not-trigger-001: |
    프로토타입을 만들지 못하고 경계 조사 단계에서 멈췄습니다 (Blocked).

    - 질문: 결제 화면 디자인 시안. 가르려는 결정 질문이 따로 주어지지 않아, 가설은 "결제 화면 레이아웃 A안과 B안 중 어느 쪽이 결제 완료까지 더 빠른가"로 임시로 두었습니다.
    - 경계 조사: 저장소 루트에서 `git check-ignore -q docs/prototypes/checkout-screen/`를 실행했으나 git 저장소가 아니어서 exit 128로 실패했습니다. 임시 경로가 git에 무시되는지 확인할 수 없어 `.gitignore`를 건드리지 않고 멈췄습니다.
    - 스택: 작업 디렉터리가 비어 있어 UI 스택, 컴포넌트, 토큰, 테스트 러너를 찾지 못했습니다.
    - artifact: 없음. 파일을 만들지 않았습니다.
    - next: git 저장소 안에서 `docs/prototypes/`를 `.gitignore`에 추가한 뒤, 비교할 결정 질문 하나와 측정 기준을 정해 다시 요청하세요.

    ```
    prototype: none (git 저장소 아님, docs/prototypes/ 무시 여부 확인 불가)
    kind: ui-variants
    runs: 1 (exit 0: 0 / nonzero: 1)
    fake: 0 연동 (없음)
    verdict: Blocked
    ```
