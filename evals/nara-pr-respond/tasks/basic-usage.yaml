id: basic-usage-001
name: "Respond to PR review comments with classify-verify-decide flow"
description: |
  Verifies that the skill fetches PR review comments, classifies each as
  blocking/suggestion/question/nitpick, verifies against the codebase,
  and decides accept, rebut, or hold for each comment.
tags:
  - basic
  - happy-path
inputs:
  prompt: |
    PR 리뷰 대응해줘
    (대상 PR은 acme-sre/web-ui#58이고 gh 결과는 첨부한 pr-review-comments.md와 같다.)
  files:
    - path: pr-review-comments.md
expected:
  output_contains:
    - "accept"
    - "review"
  output_not_contains:
    - "Great point!"
    - "Thanks for the suggestion!"
    - "You're right!"
  outcomes:
    - type: task_completed
graders:
  - type: text
    name: task_regex
    config:
      regex_match:
        - "(?i)(accept|rebut|hold|blocking|suggestion|review)"
