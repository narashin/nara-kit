id: edge-case-001
name: "Dry-run mode analyzes without posting replies or changing code"
description: |
  Verifies that with --dry-run flag, the skill performs full analysis
  (classify, verify, decide) but does not post comment replies, make code
  changes, or suggest commits. Output is analysis-only.
tags:
  - edge-case
inputs:
  prompt: |
    PR 리뷰 대응해줘 --dry-run 모드로 분석만 해줘
    (대상 PR은 acme-sre/web-ui#58이고 gh 결과는 첨부한 pr-review-comments.md와 같다.)
  files:
    - path: pr-review-comments.md
expected:
  output_contains:
    - "blocking"
    - "hold"
  output_not_contains:
    - "git commit"
    - "pushed"
  outcomes:
    - type: task_completed
graders:
  - type: text
    name: task_regex
    config:
      regex_match:
        - "(?i)(suggestion|nitpick)"
        - "(?i)(accept|rebut|hold|blocking|suggestion|review)"
