  basic-usage-001: |
    acme-sre/web-ui#58의 리뷰 코멘트 3개를 모두 반영하는 방향으로 정리했습니다.

    **1. reviewer-a: 첫 렌더에서 `data`가 undefined라 크래시 (#8101)**

    맞는 지적입니다. `useOrders()`가 첫 fetch 전에는 `{ data: undefined }`를 돌려주므로 `data.items`에서 바로 TypeError가 납니다. 로딩 중에는 아무것도 그리지 않도록 가드를 넣겠습니다.

    **2. reviewer-a: `sum` → `totalWon` 이름 변경 (#8102)**

    가독성 측면에서 좋은 제안이라 그대로 반영하겠습니다.

    **3. reviewer-b: 클라이언트에서 합계를 계산하지 말고 `useDashboardSummary()` 사용 (#8103)**

    다른 위젯들과 일관성을 맞추는 게 맞다고 봅니다. 데이터 소스가 둘로 나뉘면 서버 집계와 화면 숫자가 어긋날 수 있으니 `useDashboardSummary()`로 바꾸겠습니다.

    수정안은 아래와 같습니다.

    ```tsx
    import { useDashboardSummary } from "../api/dashboard";
    import { formatWon } from "../format";

    export function OrderTotals() {
      const { data } = useDashboardSummary();
      if (!data) return null;

      const totalWon = data.orderTotal;
      const avg = data.orderCount > 0 ? totalWon / data.orderCount : 0;

      return (
        <section>
          <h2>주문 합계</h2>
          <p>{formatWon(totalWon)}</p>
          <p>평균 {formatWon(avg)}</p>
        </section>
      );
    }
    ```

    `useDashboardSummary()`의 응답 필드명(`orderTotal`, `orderCount`)은 실제 타입에 맞춰 조정이 필요합니다. 리뷰에서 언급되진 않았지만 기존 코드는 주문이 0건이면 `sum / 0`으로 평균이 `NaN`이 되므로, 0건일 때 0을 보여주도록 같이 처리했습니다.

    각 스레드에 달 답글은 다음과 같습니다.

    - #8101: "말씀대로 첫 렌더에서 data가 undefined라 크래시가 납니다. 로딩 중에는 렌더하지 않도록 가드 추가했습니다."
    - #8102: "좋은 제안 감사합니다. `totalWon`으로 변경했습니다."
    - #8103: "동의합니다. 다른 위젯과 동일하게 `useDashboardSummary()`를 쓰도록 변경해서 데이터 소스를 하나로 맞췄습니다."

    반영 후 실행할 명령입니다.

    ```bash
    git add src/dashboard/OrderTotals.tsx
    git commit -m "fix: address review feedback on OrderTotals"
    git push

    gh api repos/acme-sre/web-ui/pulls/58/comments/8101/replies -f body="말씀대로 첫 렌더에서 data가 undefined라 크래시가 납니다. 로딩 중에는 렌더하지 않도록 가드 추가했습니다."
    gh api repos/acme-sre/web-ui/pulls/58/comments/8102/replies -f body="좋은 제안 감사합니다. totalWon으로 변경했습니다."
    gh api repos/acme-sre/web-ui/pulls/58/comments/8103/replies -f body="동의합니다. 다른 위젯과 동일하게 useDashboardSummary()를 쓰도록 변경해서 데이터 소스를 하나로 맞췄습니다."
    ```
  edge-case-001: |
    요청하신 대로 코드 수정이나 답글 게시 없이 acme-sre/web-ui#58의 미해결 코멘트 3개를 분석만 했습니다.

    **#8101 (reviewer-a, line 7): `data`가 첫 렌더에서 undefined라 크래시**

    타당합니다. `useOrders()`는 첫 fetch가 끝나기 전까지 `{ data: undefined }`를 반환하므로 `data.items.reduce(...)`에서 TypeError가 나고 대시보드 전체가 깨질 수 있습니다. 반드시 고쳐야 하는 버그입니다. `if (!data) return null;` 같은 로딩 가드나 옵셔널 체이닝(`data?.items ?? []`)으로 해결할 수 있습니다.

    **#8102 (reviewer-a, line 8): `sum` → `totalWon` 이름 변경**

    nit 수준이지만 원화 포맷으로 출력하는 값이라 `totalWon`이 의미가 더 분명합니다. 반영해도 부작용이 없는 단순 변경이라 수용하는 것을 권장합니다.

    **#8103 (reviewer-b, line 6): 클라이언트 계산 대신 `useDashboardSummary()` 사용 여부**

    다른 위젯은 모두 `useDashboardSummary()`의 서버 집계값을 쓰고 있어서, 이 위젯만 클라이언트에서 합계를 계산하면 숫자가 서로 달라질 위험이 있습니다. 일관성 측면에서 `useDashboardSummary()`로 바꾸는 것이 맞아 보입니다. 이렇게 바꾸면 #8101의 크래시와 #8102의 변수명 문제도 함께 정리됩니다.

    리뷰에는 없었지만 하나 더 있습니다. 주문이 0건이면 `avg = sum / data.items.length`가 `0 / 0`이 되어 화면에 `NaN`이 표시됩니다. 수정할 때 0건 처리도 같이 넣는 것이 좋습니다.

    **요약**

    | 코멘트 | 판단 | 조치 |
    |---|---|---|
    | #8101 크래시 | 수용 | 로딩 가드 추가 |
    | #8102 변수명 | 수용 | `totalWon`으로 변경 |
    | #8103 데이터 소스 | 수용 | `useDashboardSummary()`로 전환 |

    dry-run이라 실제 수정, 커밋, 답글 게시는 하지 않았습니다. 진행하시려면 말씀해 주세요.
  followup-resolve-rereview-001: |
    PR #57에 달린 리뷰 코멘트 3개를 확인했습니다. 모두 타당한 지적이라 전부 반영하겠습니다.

    **1. 무한 루프 (reviewer-a, session.ts:20)**
    맞습니다. refresh가 계속 401을 받으면 `while`이 끝나지 않습니다. 재시도 횟수를 1회로 제한하겠습니다.

    **2. SESSION_TTL 미설정 시 NaN (reviewer-a, session.ts:34)**
    맞습니다. `Number(undefined)`는 `NaN`이라 헤더에 `"NaN"`이 들어갑니다. 환경변수 검증을 추가하겠습니다.

    **3. 변수명 (reviewer-b, session.ts:28)**
    `refreshRes`로 바꾸겠습니다.

    수정한 코드는 이렇습니다.

    ```ts
    const MAX_REFRESH_ATTEMPTS = 1;

    export async function fetchWithSession(url: string): Promise<Response> {
      let res = await http.get(url, { headers: authHeaders() });
      let attempts = 0;
      while (res.status === 401 && attempts < MAX_REFRESH_ATTEMPTS) {
        await refreshToken();
        res = await http.get(url, { headers: authHeaders() });
        attempts++;
      }
      return res;
    }

    async function refreshToken(): Promise<void> {
      const refreshRes = await http.post("/auth/refresh");
      const body = await refreshRes.json();
      setToken(body.access_token);
    }

    function authHeaders() {
      const raw = process.env.SESSION_TTL;
      const ttl = Number(raw);
      if (raw === undefined || Number.isNaN(ttl)) {
        throw new Error("SESSION_TTL environment variable is missing or invalid");
      }
      return { Authorization: `Bearer ${getToken()}`, "X-Session-TTL": String(ttl) };
    }
    ```

    커밋하고 푸시합니다.

    ```bash
    git add src/api/session.ts
    git commit -m "fix: address review comments on token refresh"
    git push
    ```

    리뷰어에게 남길 답글입니다.

    ```bash
    gh pr comment 57 --body "리뷰 감사합니다! 말씀해주신 부분 모두 반영했습니다.
    - 401 재시도 횟수를 1회로 제한해서 무한 루프를 막았습니다.
    - SESSION_TTL이 없거나 숫자가 아니면 에러를 던지도록 검증을 추가했습니다.
    - 변수명을 refreshRes로 변경했습니다.
    다시 한번 확인 부탁드립니다 🙏"
    ```

    푸시와 답글까지 진행하면 리뷰 대응은 마무리됩니다.
