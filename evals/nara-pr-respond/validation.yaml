    ### Accepted (planned)
    | # | File:Line | Reviewer | Summary | Action |
    |---|-----------|----------|---------|--------|
    | 1 | src/api/session.ts:20 | @reviewer-a | 401이 계속 오면 while이 끝나지 않음 (blocking) | refresh 1회 + 재요청 1회로 제한. refresh 응답이 실패면 원래 401 응답을 그대로 반환 |
    | 2 | src/api/session.ts:28 | @reviewer-b | `r` → `refreshRes` (nitpick) | 1번 수정과 같은 함수라 함께 반영 |

    검증 근거. 20번 줄의 `while (res.status === 401)`은 이 PR이 추가한 줄입니다 (diff `+` 라인). 루프 탈출 조건은 재요청이 401이 아닌 것 하나뿐이고, `refreshToken()`은 `/auth/refresh` 응답 상태를 확인하지 않고 `body.access_token`을 그대로 저장합니다. 그래서 refresh가 401이면 같은 무효 토큰으로 재요청이 반복돼 리뷰어 지적대로 무한 루프가 됩니다. 수용합니다.

    수정 설계. 리뷰어 제안은 "시도 횟수 상한"이고, 상한을 1회로 두면 루프 자체가 필요 없어집니다. 실패 시 예외를 던지는 대신 원래 401 응답을 반환하는 쪽을 골랐습니다. 이 PR 이전의 `fetchWithSession`은 401을 그대로 돌려줬으므로, 이렇게 하면 호출부가 받는 `Promise<Response>` 계약이 PR 이전과 같게 유지되고 새 예외 경로가 생기지 않습니다. 28번 줄 이름 변경은 함수 안 지역 변수라 외부 참조가 없습니다.

    ```ts
    export async function fetchWithSession(url: string): Promise<Response> {
      const res = await http.get(url, { headers: authHeaders() });
      if (res.status !== 401) return res;
      const refreshed = await refreshToken();
      if (!refreshed) return res;
      return http.get(url, { headers: authHeaders() });
    }

    async function refreshToken(): Promise<boolean> {
      const refreshRes = await http.post("/auth/refresh");
      if (!refreshRes.ok) return false;
      const body = await refreshRes.json();
      setToken(body.access_token);
      return true;
    }
    ```

    영향 분석 한계. 받은 자료는 이 PR의 diff뿐이라 `fetchWithSession` 호출부와 관련 테스트는 확인하지 못했습니다. `http.post`의 반환값에 `.ok`가 있는지도 diff만으로는 알 수 없습니다 (`.json()`을 쓰니 Response 계열로 보이지만 [UNVERIFIED: `./http` 래퍼 정의 미확인]). 그래서 위 수정은 아직 파일에 적용하지 않았고 (planned), 적용 후 1번과 2번을 하나씩 반영하면서 각각 type-check와 관련 테스트를 돌려 확인합니다. 커밋 메시지 제안: `fix: 401 재시도를 refresh 1회로 제한해 무한 루프를 막는다`. 커밋은 직접 해 주세요.

