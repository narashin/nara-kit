    | 1 | src/api/session.ts:34 | @reviewer-a | `SESSION_TTL` 없으면 `NaN`이 헤더로 나감 | 변경 없는 context 줄, blame `1a2b3c4` (2026-03-02, PR보다 3개월 전) | not created |

    지적 자체는 맞습니다. `Number(undefined)`는 `NaN`이고 `String(NaN)`이 `X-Session-TTL` 헤더 값으로 나갑니다. 다만 `authHeaders`는 이 PR이 건드리지 않은 코드이고, PR이 이 동작을 새로 만들거나 더 나쁘게 만들지도 않습니다. 재요청 경로에서 `authHeaders()`가 한 번 더 불릴 뿐 헤더 값은 같습니다. 보안·데이터 손실·권한·공개 API 문제로 보이지도 않습니다. 리뷰어가 변경을 요청한 항목이라, 이 PR에서 고치지 않는 쪽으로 가려면 사용자 확인이 필요합니다.

