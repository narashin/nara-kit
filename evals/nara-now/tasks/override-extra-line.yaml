id: override-extra-line-001
name: "User override adds one status line"
description: |
  When ~/.claude/overrides/nara-now.md exists and asks for an extra collection,
  now performs it and appends the result as one line, without changing its recommendation.
tags:
  - override
inputs:
  prompt: |
    지금 뭐해

    (상태: 브랜치 feature/PROJ-123-export, 변경사항 없음, docs/ 아래 작업 문서 없음.
    `~/.claude/overrides/nara-now.md`가 있고 내용은 다음과 같다:
    "`~/.local/state/acme-loop/ledger.jsonl`을 읽어 kind가 applied인 줄과 unlinked인 줄을 세고
    '자동 수정 N건, 링크 해제 M건' 한 줄로 보인다."
    그 ledger.jsonl에는 다섯 줄이 있다: applied, rejected, applied, unlinked, extracted.)
  files: []
expected:
  output_contains:
    - "자동 수정 2건"
    - "링크 해제 1건"
    - "/nara-ac-draft"
  outcomes:
    - type: task_completed
