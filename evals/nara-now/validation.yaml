# Grader-validation table for nara-now.
#
# `right`: a fresh subagent running the current SKILL.md on each task prompt
# (2026-10-16). `wrong`: observed behaviour -- a fresh subagent with no skill
# loaded (normal tasks), or the skill applied to a request it should decline
# (should-not-trigger). Tools were off for side effects: outputs are dry runs.
#
# Run: tools/eval-fixture.py validate nara-now
# Expected: every task passes on right and fails on wrong.
right:
  basic-usage-001: |
    수집 (병렬 실행):
    ```
    git branch --show-current
    git status -s
    git log --oneline -5
    ls docs/requirements.md docs/plan.md docs/gap.md docs/handoff.md docs/product/*/prd.md
    ```

    ## 현재 상황
    - 브랜치: 확인된 브랜치 없음. 저장소에 커밋이 없어 `git log`가 비어 있고, 새 저장소라면 기본 브랜치(main)에 있는 상태입니다
    - 변경사항: 없음 (작업 디렉터리가 비어 있음)
    - 작업 문서: requirements.md 없음 | plan.md 없음 | gap.md 없음
    - 최근 작업: 커밋 없음
    - handoff: `docs/handoff.md` 없음

    프로젝트 메모리 조회는 skipped입니다 (조회할 기록 백엔드를 호출하지 않음). gap.md가 없는 것은 verify 전 단계라 정상입니다.

    ## 추천
    메인 브랜치에서 시작하는 새 작업입니다. 작업 브랜치를 만든 뒤 요구사항부터 정리하세요.
    - `git checkout -b feature/PROJ-123-<slug>`
    - `/nara-ac-draft PROJ-123` (티켓이 없으면 `/nara-ac-draft "<한 줄 의도>"`)
  edge-case-001: |
    수집 (병렬 실행):
    ```
    git branch --show-current
    git status -s
    git log --oneline -5
    ls docs/requirements.md docs/plan.md docs/gap.md docs/handoff.md docs/product/*/prd.md
    ```

    ## 현재 상황
    - 브랜치: main으로 간주 (커밋이 없는 새 저장소의 기본 브랜치. 작업 브랜치는 관찰되지 않음)
    - 변경사항: 없음
    - 작업 문서: requirements.md 없음 | plan.md 없음 | gap.md 없음
    - 최근 작업: 커밋 없음
    - handoff: `docs/handoff.md` 없음, 이전 세션에서 이어 갈 기록이 없습니다

    진행된 작업 흔적이 아직 없습니다. 프로젝트 메모리 조회는 skipped입니다.

    ## 추천
    main 브랜치이고 요구사항 문서가 없으므로, 브랜치를 만든 뒤 요구사항 정리부터 시작하세요.
    - `git checkout -b feature/PROJ-123-<slug>`
    - `/nara-ac-draft PROJ-123` (티켓이 없으면 `/nara-ac-draft "<한 줄 의도>"`)
  should-not-trigger-001: |
    함수 리팩터링은 세션 상황을 점검하는 nara-now가 맡는 일이 아닙니다. nara-now는 상태를 읽고 다음 명령을 알려 줄 뿐 코드를 고치지 않습니다.

    리팩터링은 코드 변경이므로 `/nara-implement`로 진행해 주세요. 대상 함수의 파일 경로와 이름, 바꾸고 싶은 방향(예: 분리, 이름 정리, 중복 제거)을 함께 알려 주시면 검증 게이트를 거쳐 staged 상태까지 진행합니다. 지금 요청에는 어떤 함수인지가 빠져 있어서, 그 정보부터 필요합니다.
wrong:
  basic-usage-001: |
    "now"만으로는 무엇을 원하시는지 정확히 알기 어렵네요. 현재 작업 디렉터리를 확인해 봤는데 비어 있고, 열려 있는 파일이나 진행 중인 작업도 보이지 않습니다.

    혹시 이런 걸 원하셨나요?

    - 지금 바로 시작할 작업이 있다면 무엇을 하려는지 알려주세요.
    - 현재 날짜나 시간을 물으신 거라면 말씀해 주세요.
    - 이전 대화를 이어가려는 거라면, 그때 하던 작업 내용을 간단히 공유해 주시면 이어서 도와드리겠습니다.
  edge-case-001: |
    이번 대화는 방금 시작되어서 이전에 어디까지 진행했는지에 대한 기록이 제게는 없습니다. 작업 디렉터리도 비어 있어서 파일이나 변경 이력에서 단서를 찾을 수도 없었습니다.

    이어서 진행하려면 아래 중 하나를 알려주세요.

    - 하던 작업의 주제나 목표
    - 마지막으로 손댄 파일이나 브랜치 이름
    - 이전 대화에서 남긴 메모나 요약

    그걸 바탕으로 남은 일을 정리해 드리겠습니다.
  should-not-trigger-001: |
    ## 현재 상황
    - 브랜치: 없음 (git 저장소 아님)
    - 변경사항: 없음
    - 작업 문서: requirements.md 없음 | plan.md 없음 | gap.md 없음
    - 최근 작업: 커밋 기록 없음

    ## 추천
    요구사항 미정리. `/nara-ac-draft "함수 리팩터링"`으로 요구사항 정리부터 시작하세요.
