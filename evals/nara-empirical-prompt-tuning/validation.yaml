# Grader-validation table for nara-empirical-prompt-tuning.
#
# `right`: a fresh subagent running the current SKILL.md on each task prompt
# (2026-10-16). `wrong`: observed behaviour -- a fresh subagent with no skill
# loaded (normal tasks), or the skill applied to a request it should decline
# (should-not-trigger). Tools were off for side effects: outputs are dry runs.
#
# Run: tools/eval-fixture.py validate nara-empirical-prompt-tuning
# Expected: every task passes on right and fails on wrong.
right:
  basic-usage-001: |
    EPT 시작 전 차단 (pending escalation): 튜닝 대상 `skills/nara-test-discover/SKILL.md`를 현재 작업 디렉터리에서 찾지 못했습니다.

    iteration 0(정적 점검)은 대상 파일의 frontmatter description이 약속하는 범위와 본문이 실제로 다루는 범위가 맞는지부터 보는 단계라, 파일 없이는 시작할 수 없습니다. 시나리오와 체크리스트도 그 본문에서 뽑아야 해서 지금 지어내지 않았습니다.

    경로를 확인해 주시면 이렇게 진행합니다. iteration 0에서 description과 본문의 간극을 먼저 맞추고, 실제 사용에 가까운 시나리오 2~3개(중간 난이도 1 + 엣지 1~2)와 시나리오별 요구사항 체크리스트 3~7개(최소 1개는 `[critical]`)를 고정합니다. 그다음 시나리오마다 새 subagent를 병렬로 띄워 빈 상태에서 대상 프롬프트대로 실행하게 하고, 제가 직접 다시 읽는 방식은 쓰지 않습니다. 평가는 양쪽에서 합니다. subagent의 self-report(unclear points, 재량으로 채운 부분, 단계별 trace)와 지시문 쪽 지표(성공 여부, accuracy %, tool_uses, duration, retry)를 함께 기록합니다. 고칠 때는 iteration마다 한 주제만 최소 diff로 바꾸고, 다음 iteration에는 항상 새 subagent를 씁니다. 새 unclear point 0개, accuracy 개선 +3 이하, step·duration 변동이 임계 안에 드는 라운드가 2번 연속 나오면 멈추고 hold-out 시나리오 1개로 과적합을 확인합니다.

    참고로 eval suite까지 포함한 스킬 강화나 벤치마크가 목적이라면 `/nara-skill-forge`가 맞는 도구입니다. 지시문 문구 자체를 실행 기반으로 다듬는 것이 목적이면 이 흐름 그대로 갑니다.

    - artifact: 없음 (실행 전) · subagent dispatch: 0회 · side effects: 없음

    → ESCALATE: `nara-test-discover` SKILL.md의 실제 경로를 알려 주시거나 해당 저장소 루트에서 다시 요청해 주세요.
  edge-case-001: |
    EPT skipped: empirical evaluation skipped: dispatch unavailable.

    이 튜닝의 핵심은 지시문을 쓴 쪽이 아닌, 빈 상태의 새 subagent가 실제로 실행해 보고 unclear points와 재량으로 채운 부분을 보고하는 것입니다. Agent tool을 쓸 수 없는 환경에서 그걸 제가 직접 다시 읽는 것으로 대신하면, 자기 글을 객관적으로 볼 수 없다는 편향 때문에 결과가 무효가 됩니다. 그래서 대체 평가를 하지 않았고 `skills/nara-pr-respond/SKILL.md`는 수정하지 않았습니다.

    dispatch 없이 할 수 있는 건 description과 본문 범위를 맞춰 보는 정적 점검 하나뿐인데, 이번에는 그 대상 파일도 현재 작업 디렉터리에서 찾지 못해 진행하지 않았습니다.

    - artifact: 없음 · subagent dispatch: 0회 · side effects: 없음
    - next: Agent tool을 쓸 수 있는 별도 세션에서 `/nara-empirical-prompt-tuning skills/nara-pr-respond/SKILL.md`를 다시 실행해 주세요. 그 세션에서는 시나리오별로 새 subagent를 띄워 self-report와 지표를 받아 평가합니다.
  should-not-trigger-001: |
    이 요청은 이 스킬이 다루는 일이 아닙니다 (skipped).

    - 이 스킬은 이미 있는 지시문을 실행 기반으로 다듬는 용도입니다. 코드 리뷰 자동화 스킬을 새로 만드는 일은 스킬 작성(authoring)이라 범위 밖입니다.
    - 실행한 것: 없음 · artifact: 없음 · side effects: 없음
    - next: 새 스킬 작성은 `skill-development`로 시작해 주세요. 다만 로컬 diff 리뷰라면 `/nara-code-review`, 원격 PR 리뷰라면 `/nara-pr-review`가 이미 있으니 새로 만들기 전에 그쪽으로 충분한지 먼저 확인해 보시길 권합니다.
wrong:
  basic-usage-001: |
    `skills/nara-test-discover/SKILL.md`를 열어 보려 했는데, 현재 작업 디렉터리에 해당 파일이 없습니다.

    ```bash
    ls skills/nara-test-discover/SKILL.md
    # No such file or directory
    ```

    다른 저장소에 있는 파일이라면 그 저장소 루트에서 다시 요청하시거나, SKILL.md 내용을 붙여넣어 주세요.

    내용을 받으면 이렇게 튜닝하겠습니다.

    1. 스킬의 목적과 트리거 조건(description)이 본문 절차와 맞는지 확인
    2. 단계마다 모호한 지시를 찾아 구체화. 예를 들어 "적절히", "필요하면" 같은 표현은 조건을 명시하는 문장으로 바꿈
    3. 입력이 없거나 잘못됐을 때의 처리, 출력 형식 같은 빠진 부분 보완
    4. 중복되거나 서로 충돌하는 지시 정리
    5. 수정 전후 diff와 각 변경 이유를 함께 제시

    테스트 시나리오를 발굴하는 스킬이라면 시나리오의 범위(단위·통합·E2E), 우선순위 기준, 출력 템플릿이 명확한지를 특히 보겠습니다.
  edge-case-001: |
    `skills/nara-pr-respond/SKILL.md`를 찾아봤지만 현재 작업 디렉터리에는 해당 파일이 없습니다.

    ```bash
    ls skills/nara-pr-respond/SKILL.md
    # No such file or directory
    ```

    파일이 있는 저장소에서 다시 요청하시거나 SKILL.md 내용을 붙여넣어 주세요.

    Agent tool을 쓸 수 없는 환경이라고 하셨는데, 이 경우 제가 직접 프롬프트를 읽고 개선하는 방식으로 진행하면 됩니다. 내용을 받으면 다음을 검토하겠습니다.

    1. description의 트리거 문구와 본문 절차가 일치하는지
    2. 리뷰 코멘트를 수용·반박·보류로 나누는 판단 기준이 구체적인지
    3. 코멘트가 없거나 PR을 찾을 수 없을 때의 처리가 있는지
    4. 코멘트 답글 게시처럼 외부에 영향을 주는 동작 전에 확인 단계가 있는지
    5. 출력 형식이 명확한지

    그다음 수정안을 diff로 드리고 각 변경 이유를 설명하겠습니다. 가능하면 실제 PR 리뷰 코멘트 예시 두세 개를 함께 주시면, 수정한 프롬프트로 그 예시를 직접 처리해 보며 모호한 부분이 남았는지 확인하겠습니다.
  should-not-trigger-001: |
    코드 리뷰 자동화 스킬을 대상 프롬프트로 고정하고 empirical prompt tuning 루프로 진행합니다. 기존 파일이 없어 최소 초안을 먼저 대상으로 둡니다.

    대상 초안 (`skills/code-review-auto/SKILL.md`)

    ```markdown
    ---
    name: code-review-auto
    description: >-
      Review local staged/committed changes and report bugs and risks.
      USE FOR: "코드 리뷰 자동화", "리뷰 돌려줘".
      DO NOT USE FOR: remote PR review.
    ---

    # code-review-auto

    1. `git diff --cached` (없으면 `git diff HEAD~1`)로 변경을 수집한다.
    2. 파일별로 버그, 보안, 성능, 가독성 관점에서 문제를 찾는다.
    3. 각 발견에 파일:라인, 심각도(high/medium/low), 근거를 붙인다.
    4. 수정은 하지 않고 리포트만 출력한다.
    ```

    Iter 0, 정적 점검 결과입니다. description은 "staged/committed"라고 하는데 본문 1단계는 staged가 없을 때만 HEAD~1을 보므로 둘 다 있는 경우의 우선순위가 불명확합니다. 심각도 판정 기준이 없고, 변경이 아예 없을 때의 처리가 없습니다. iter 1 전에 이 세 군데를 정합시켜야 합니다.

    평가 시나리오

    1. median: staged 파일 3개, 그중 하나에 null 처리 누락
    2. edge: staged 없음, 최근 커밋만 있음
    3. edge: 변경 전혀 없음

    요구사항 체크리스트

    - [critical] 발견마다 파일:라인과 근거가 붙는다
    - [critical] 코드를 수정하지 않는다
    - 변경이 없으면 리뷰하지 않고 안내 후 중단한다
    - 심각도가 정의된 기준으로 매겨진다
    - 출력 형식이 시나리오 간 동일하다

    다음 단계는 시나리오별로 새 서브에이전트를 띄워 실행시키는 것입니다.

    ```
    Agent(subagent_type="general-purpose", prompt="<대상 SKILL.md 전문> + 시나리오 1 + self-report 계약")
    Agent(subagent_type="general-purpose", prompt="<대상 SKILL.md 전문> + 시나리오 2 + self-report 계약")
    Agent(subagent_type="general-purpose", prompt="<대상 SKILL.md 전문> + 시나리오 3 + self-report 계약")
    ```

    이 환경에서는 서브에이전트 실행 결과가 없으므로 empirical evaluation skipped 상태입니다. 작성자가 직접 다시 읽어 평가하는 것은 하지 않습니다.

    - 상태: recorded only (초안 + iter 0 정적 점검 + 시나리오·체크리스트 준비)
    - 다음: 서브에이전트 실행이 가능한 세션에서 iter 1 dispatch
