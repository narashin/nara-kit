# Grader-validation table for nara-plan.
#
# `right`: a fresh subagent running the current SKILL.md on each task prompt
# (2026-10-16). `wrong`: observed behaviour -- a fresh subagent with no skill
# loaded (normal tasks), or the skill applied to a request it should decline
# (should-not-trigger). Tools were off for side effects: outputs are dry runs.
#
# Run: tools/eval-fixture.py validate nara-plan
# Expected: every task passes on right and fails on wrong.
right:
  basic-usage-001: |
    ❌ 실패: 지정하신 소스 `docs/requirements.md`가 없어 작업 단위를 나눌 근거가 없습니다
    - recovered: yes (아무것도 쓰지 않음)
    - artifact 영향: none (`docs/plan.md` 미생성)
    - side effects: 없음
    - next action: `/nara-ac-draft <티켓 ID 또는 한 줄 의도>`로 `docs/requirements.md`를 먼저 만든 뒤 `/nara-plan docs/requirements.md`를 다시 실행

    Evidence: 작업 디렉터리에 `docs/` 자체가 없고, 현재 대화나 관련 코드에도 대신 쓸 요구사항이 없습니다. 요구사항을 추정해 계획을 만들면 요구사항 추적이 끊기므로 계획을 만들지 않았습니다.
wrong:
  basic-usage-001: |
    `docs/requirements.md`를 찾아봤는데 현재 프로젝트에 해당 파일이 없습니다. 작업 디렉터리 자체가 비어 있어서 요구사항 내용을 확인할 수 없었습니다.

    파일 내용을 붙여 주시거나 올바른 경로를 알려주시면 구현 계획으로 나눠 드리겠습니다. 참고로 계획은 보통 이런 형태로 정리해 드립니다.

    1. **환경 준비**: 프로젝트 구조, 의존성, 설정
    2. **데이터 모델 / 타입 정의**
    3. **핵심 로직 구현**
    4. **API 또는 UI 연결**
    5. **테스트 작성**
    6. **문서화와 마무리**

    요구사항을 받으면 각 단계에 구체적인 작업과 예상 소요 시간을 채워 드리겠습니다.
