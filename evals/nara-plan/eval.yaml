name: nara-plan-eval
description: Evaluation suite for splitting a spec into independently verifiable vertical work units.
skill: nara-plan
version: "1.0"
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: mock
  model: claude-sonnet-4.6
metrics:
  - name: task_completion
    weight: 1.0
    threshold: 0.8
    description: Did the skill produce vertical work units with per-requirement traceability and no horizontal type/API/UI/test-only units?
graders:
  - type: code
    name: real_run
    config:
      # Provenance gate, not a behavioural one: it asserts the graded output came
      # from a real skill run. Under `executor: mock` it fails every task by
      # construction -- that is the correct signal, because mock output grades the
      # eval's own description and fixture text, never the skill. Measurement goes
      # through `waza grade` on a real run; see CLAUDE.md.
      assertions:
        - "len(output) > 40"
        - "'Mock response for:' not in output"
tasks:
  - "tasks/*.yaml"
