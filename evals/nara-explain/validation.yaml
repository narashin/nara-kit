  pr-scope-pinned-001: |
    팀원분께 보낼 설명입니다.

    **5773196: eval-fixture에 hermetic `claude -p` 생성 모드 추가**

    이 커밋은 eval 도구 `tools/eval-fixture.py`에 `generate` 서브커맨드를 새로 넣어서, 스킬 평가를 실제 모델 출력으로 돌릴 수 있게 만든 변경입니다. 이제 Copilot 없이도 스킬 벤치마크를 완전히 자동으로 실행할 수 있게 됐어요.

    주요 내용은 다음과 같습니다.

    - `generate` 명령: `claude -p`를 설정·MCP·툴을 모두 끈 상태로 실행하고, SKILL.md와 관련 references를 시스템 프롬프트로 붙여서 각 task에 대한 출력을 만듭니다. 결과는 `results/<skill>-gen/<task>.json`에 저장됩니다.
    - `validate --right-from gen`: 손으로 쓴 right 항목 대신 생성된 출력을 써서 grader를 검증합니다.
    - 생성 당시 SKILL.md의 해시를 저장해 두고, 스킬이 바뀌면 경고를 띄웁니다.
    - `--model`로 모델을 고정할 수 있고, `BENCH_GEN_TIMEOUT` 환경변수로 타임아웃(기본 300초)을 조정할 수 있습니다.
    - 참조 문서는 다른 스킬의 references까지 모두 따라가서 포함합니다.

    그 밖에 CHANGELOG.md와 CLAUDE.md에도 관련 설명이 추가됐습니다. 정리하면, 스킬 성능을 실제로 측정하는 정식 벤치마크 경로가 생긴 커밋이라고 보시면 됩니다.
  should-not-trigger-001: |
    ❌ 실패: 설명할 변경을 찾지 못했습니다.

    - 대상: "이 PR" (번호·URL·브랜치 미지정), 청자 미지정이라 기본값인 팀원(Tech peer)으로 잡았습니다.
    - 비교 고정 시도: `git rev-parse --abbrev-ref HEAD`, `git merge-base main HEAD`, `git diff --stat main...HEAD`를 실행하려 했지만 현재 작업 디렉터리가 비어 있고 git 저장소가 아니어서 base..head를 고정할 수 없습니다.
    - 읽은 코드가 없으므로 결과 없음으로 멈춥니다. `docs/explain/` 파일은 만들지 않았고 `check_explain.py`도 실행하지 않았습니다.

    이 스킬은 변경을 다른 사람에게 설명하는 자료를 만듭니다. 버그 여부 판정(리뷰 결론)은 내리지 않습니다. 버그를 찾는 리뷰가 목적이면 로컬 변경은 `/nara-code-review`, 원격 PR은 `/nara-pr-review`가 맞습니다.

    → 다음 행동: PR URL이나 번호, 또는 비교할 브랜치를 알려주세요. 리뷰라면 `/nara-pr-review <PR URL>`로 다시 요청해 주세요.
