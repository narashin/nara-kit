wrong:
  basic-usage-001: |
    PM분께 공유하실 수 있도록 일반적인 웹 서비스 인증 플로우를 정리했습니다. 현재 작업 디렉터리에는 코드가 없어서, 가장 흔한 구조(아이디/비밀번호 로그인 + 토큰 기반 세션)를 기준으로 썼습니다. 실제 서비스 구조와 다르면 알려주세요.

    # 로그인은 이렇게 동작합니다

    ## 한 줄 요약
    사용자가 로그인하면 서버가 "출입증(토큰)"을 발급하고, 이후 요청마다 이 출입증을 보여주면서 본인임을 증명합니다.

    ## 단계별 흐름
    1. **로그인 화면**: 사용자가 이메일과 비밀번호를 입력합니다.
    2. **서버 확인**: 서버가 저장된 정보와 비교해 맞는지 확인합니다. 비밀번호는 원문이 아니라 암호화된 형태로만 저장됩니다.
    3. **출입증 발급**: 맞으면 서버가 짧은 유효기간(예: 15분~1시간)의 액세스 토큰과, 더 긴 유효기간의 리프레시 토큰을 발급합니다.
    4. **서비스 이용**: 이후 화면을 열 때마다 앱이 액세스 토큰을 함께 보내고, 서버는 토큰만 보고 누구인지 판단합니다.
    5. **자동 연장**: 액세스 토큰이 만료되면 앱이 리프레시 토큰으로 새 출입증을 받아옵니다. 사용자는 다시 로그인할 필요가 없습니다.
    6. **로그아웃**: 토큰을 폐기해 더 이상 사용할 수 없게 합니다.

    ## PM 관점에서 중요한 포인트
    - **세션 유지 시간**: 리프레시 토큰 유효기간이 "로그인 유지" 기간을 결정합니다. 보안과 편의성의 트레이드오프입니다.
    - **SSO/소셜 로그인**: 구글·사내 SSO 등을 붙이면 2단계(비밀번호 확인)를 외부 서비스가 대신합니다.
    - **실패 처리**: 비밀번호 오류 횟수 제한, 계정 잠금, 비밀번호 재설정 플로우가 사용자 경험에 직접 영향을 줍니다.
    - **다중 기기**: 기기별로 토큰이 따로 발급되므로 "다른 기기에서 로그아웃" 같은 기능을 설계할 수 있습니다.

    ## 자주 받는 질문
    - **왜 가끔 다시 로그인하라고 하나요?** 리프레시 토큰까지 만료됐거나 보안상 강제 만료된 경우입니다.
    - **비밀번호를 서버가 알고 있나요?** 아니요. 복원 불가능한 형태로만 저장합니다.

    실제 프로젝트 코드나 아키텍처 문서를 주시면 그 구조에 맞춰 다시 정리해 드리겠습니다. 슬라이드 형태가 필요하시면 말씀해 주세요.
