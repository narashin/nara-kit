id: edge-case-001
name: Brief Slack message explanation
description: |
  When user requests a brief explanation for Slack, the skill should produce
  a concise output (max 5 bullet points) instead of a full Markdown document.
tags:
- edge-case
inputs:
  prompt: |
    이번 PR 변경사항 슬랙에 올릴 수 있게 짧게 설명해줘
    (현재 PR과 diff는 첨부한 pr-diff.md와 같다.)
  files:
  - path: pr-diff.md
expected:
  output_not_contains:
  - '# 목차'
  - '## 아키텍처'
  - docs/explain
  outcomes:
  - type: task_completed
graders:
- type: text
  name: task_regex
  config:
    regex_match:
    - (?i)(설명|explain|audience|대상|Audience|목적)
