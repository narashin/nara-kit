wrong:
  should-not-trigger-001: |
    Slack→Jira 처리를 시작하려 했지만 입력에서 Slack 스레드 permalink를 찾지 못했습니다.

    - parse: 링크 0건. `https://<workspace>.slack.com/archives/<channel_id>/p<TS>` 형태의 URL이 없어 `{channel_id, thread_ts}`를 만들 수 없습니다.
    - fetch / classify / dedup / draft: 처리할 스레드가 없어 진행하지 않았습니다.

    ```
    Slack→Jira batch done (skipped).
    - processed: 0 · created: 0 · linked: 0 · dropped: 0
    - side effects: none (jira 0 created + 0 comments + 0 links · slack 0 read)
    - next: 티켓으로 만들 Slack 스레드 링크를 붙여 주세요
    ```

    티켓화할 스레드 링크를 주시면 Bug/Feature 분류, 중복 검사, 영어 draft 순서로 진행하겠습니다. 설명하실 코드도 함께 주셨다면 그 내용은 이번 입력에 포함되지 않았습니다.
  bug-classify-001: |
    스레드 내용을 바탕으로 Jira 티켓 초안을 정리했습니다. 저는 지금 Jira에 직접 생성할 수 없어서, 아래 내용을 복사해 등록하시면 됩니다.

    **제목:** 정산 페이지 다운로드 버튼 클릭 시 무반응

    **유형:** 버그

    **설명:**
    정산 페이지에서 다운로드 버튼을 눌러도 아무 반응이 없습니다. 사용자 말로는 어제까지는 정상 동작했습니다.

    - 환경: Chrome 최신 버전
    - 재현 단계: 정산 페이지 진입 → 다운로드 버튼 클릭
    - 기대 결과: 파일 다운로드 시작
    - 실제 결과: 아무 반응 없음
    - 원본 스레드: https://example.slack.com/archives/C0123456789/p1700000000000001

    **우선순위(제안):** High (어제부터 갑자기 발생했고 정산 업무에 영향이 있어 보입니다)

    **추가로 확인하면 좋은 것:** 브라우저 콘솔 에러, 네트워크 탭에서 다운로드 API 응답 코드, 어제 이후 배포 이력. 어제까지 됐다고 하니 최근 배포가 원인일 가능성이 높아 보입니다.

    원하시면 담당자나 컴포넌트도 지정해서 다시 정리해 드릴게요.
  feature-classify-001: |
    스레드를 기능 요청 티켓으로 정리했습니다. 아래 내용을 Jira에 등록하시면 됩니다.

    **제목:** 정산 내역 엑셀 일괄 다운로드 기능 추가

    **유형:** Story (기능 요청)

    **설명:**
    사용자가 정산 내역을 확인할 때마다 화면에서 직접 복사해야 해서 번거롭다는 요청이 있었습니다. 정산 내역 전체를 엑셀 파일로 한 번에 내려받을 수 있는 기능을 추가합니다.

    원본 스레드: https://example.slack.com/archives/C0123456789/p1700000000000002

    **인수 조건(제안):**
    - 정산 페이지에 "엑셀 다운로드" 버튼이 있다
    - 버튼을 누르면 현재 조회 조건(기간, 필터)에 맞는 정산 내역 전체가 .xlsx 파일로 다운로드된다
    - 파일에는 화면에 보이는 컬럼(일자, 금액, 상태 등)이 모두 포함된다
    - 데이터가 많아도(예: 1만 건 이상) 다운로드가 실패하지 않는다

    **우선순위(제안):** Medium

    **참고:** 기간·필터 적용 여부, 포함할 컬럼, CSV로도 충분한지는 요청자에게 한 번 확인해 보시는 걸 추천합니다.
  known-issue-001: |
    스레드를 보니 개발자분이 이미 ABC-321로 등록돼 있다고 답하셨네요. 그래도 사용자 제보 내용을 기록해 두는 게 좋으니 티켓 초안을 정리했습니다.

    **제목:** 로그인 후 간헐적으로 흰 화면 표시

    **유형:** 버그

    **설명:**
    로그인 직후 가끔 흰 화면(빈 화면)이 표시된다는 사용자 제보입니다. 재현 빈도는 "가끔"으로, 항상 발생하지는 않습니다.

    - 재현 단계: 로그인 → (간헐적으로) 흰 화면
    - 기대 결과: 로그인 후 메인 화면 정상 표시
    - 실제 결과: 흰 화면
    - 원본 스레드: https://example.slack.com/archives/C0123456789/p1700000000000003
    - 관련 티켓: ABC-321 (개발팀에서 이미 확인 중이라고 언급)

    **우선순위(제안):** High (로그인 직후 화면이 안 보이면 서비스 이용이 막힘)

    새 티켓으로 만드실 경우 ABC-321과 "relates to"로 연결해 두시면 됩니다. 중복이 확실하면 새로 만들지 말고 ABC-321에 이번 제보 내용을 코멘트로 남기는 방법도 있습니다.
