name: nara-slack-to-jira-eval
description: Evaluation suite for the slack-to-jira ticket creation skill.
skill: nara-slack-to-jira
version: "1.0"
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: claude-sonnet-4.6
metrics:
  - name: task_completion
    weight: 1.0
    threshold: 0.8
    description: Correct classification + English draft + no create before approval.
graders:
  - type: code
    name: real_run
    config:
      # Provenance gate, not a behavioural one: it asserts the graded output came
      # from a real skill run. Under `executor: mock` it fails every task by
      # construction -- that is the correct signal, because mock output grades the
      # eval's own description and fixture text, never the skill. Measurement goes
      # through `waza grade` on a real run; see CLAUDE.md.
      assertions:
        - "len(output) > 40"
        - "'Mock response for:' not in output"
  - type: text
    name: draft_gate
    config:
      regex_match:
        - "(?i)(draft|승인|approve)"
tasks:
  - "tasks/*.yaml"
