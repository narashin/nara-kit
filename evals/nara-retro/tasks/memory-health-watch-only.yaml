id: memory-health-watch-only-001
name: "Watch-level memory health does not recommend grooming"
description: |
  After the memory write, the health summary reports watch-level files only
  (score 1). The receipt must carry the health line and must not send the
  user to /nara-grooming, because nothing scores 2 or more.
tags:
  - memory-health
inputs:
  prompt: |
    회고해줘. 이번 세션에서 사용자가 "PR 본문은 앞으로 한국어로 써"라고 교정했어. 메모리에 저장할 만한 교정이야.
    메모리를 쓴 뒤 돌린 건강 검사(audit.sh --summary) 출력은 이랬어:
    total 12 | flagged 0 | watch 2
    1 watch project-doc-location.md ref_validity
    1 watch slack-channel.md ref_validity
  files: []
expected:
  output_contains:
    - "total 12 | flagged 0 | watch 2"
  output_not_contains:
    - "/nara-grooming"
  outcomes:
    - type: task_completed
