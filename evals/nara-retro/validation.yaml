  skill-incident-redaction-001: |
    Skill-incident note for `prep`, with all project details removed. One thing up front: `prep` has since been merged into `nara-ac-draft`. The current skill already says to copy source AC word for word, with no paraphrasing, summarizing or reordering. So the fix below is a mechanical check, not another rule.

    ## Meta Feedback Summary
    - Target: `prep` (now `nara-ac-draft`, external-source mode)
    - Failure plane: 지시 해석
    - Cause: hypothesis (not reproduced here; either a stale pre-merge `prep` copy ran, or the current verbatim rule was not followed)
    - Privacy status: generalized

    ## Generalized Friction
    - Situation: localizing a tracker/wiki spec into `docs/requirements.md` where the source AC were precise and carried a compound limit rule (a per-group cap plus a different cap across groups)
    - Problem: AC were paraphrased instead of copied verbatim; the paraphrase dropped a qualifying condition
    - Impact: the lost nuance surfaced only later at `gap`, after work had been built on the localized AC
    - Control: none (no fresh-context rerun against the same source yet)

    ## Proposed Improvement
    - Change: add a deterministic verbatim check to `nara-ac-draft` after the "copy external source" step. Every source AC line must appear byte-identical (whitespace-normalized) in `docs/requirements.md`. Any mismatch fails with `❌ 실패:` listing the drifted lines instead of writing the file. Add an eval task whose source AC hold a compound conditional limit. Separately, the upgrade note already tells users to remove the old `prep` install; `nara-now` could flag a lingering old copy.
    - Deciding check: rerun on a source with compound conditional AC; each source AC line is found unchanged in `docs/requirements.md`, and a hand-paraphrased draft is rejected by the check
    - Preserve: `[draft]` AC are still generated only when the source has none; ambiguous source AC still go to Open Questions instead of being rewritten

    ## Redaction Receipt
    - Removed: project codename, repo remote, branch name, ticket ID, spec page URL, person name, domain-specific AC text
    - Kept: abstract pattern only (precise compound AC paraphrased during localization, caught late at gap)
    - Unsafe details included: none

    Nothing was written to memory or files (chat only). To apply it, run `/nara-skill-forge nara-ac-draft` in the nara-kit repo.
wrong:
  basic-usage-001: |
    오늘 세션 회고입니다.

    **잘된 점**
    - 작업 범위를 먼저 정하고 시작해서 중간에 방향이 크게 흔들리지 않았습니다.
    - 변경 후 바로 확인하는 습관 덕분에 문제를 빨리 잡았습니다.

    **아쉬운 점**
    - 초반에 요구사항을 충분히 확인하지 않아 한 번 되돌아간 부분이 있었습니다.
    - 커밋 단위가 다소 컸습니다.

    **배운 것**
    1. 구현 전에 요구사항과 예외 케이스를 먼저 정리하면 재작업이 줄어든다.
    2. 작은 단위로 커밋하면 리뷰와 롤백이 쉬워진다.
    3. 테스트를 먼저 돌려 기준선을 확인해 두면 회귀 여부를 판단하기 쉽다.

    **어디에 남길지**
    - 팀이 같이 지킬 규칙(요구사항 선확인, 작은 커밋)은 repo의 `CLAUDE.md`나 `CONTRIBUTING.md`에 추가하세요.
    - 개인적인 교훈은 노션이나 개인 회고 노트에 날짜별로 정리해 두면 좋습니다.
    - 반복해서 쓰게 될 절차라면 체크리스트로 만들어 PR 템플릿에 넣는 것도 방법입니다.

    원하시면 위 내용을 `docs/retro/2026-10-16.md` 파일로 저장해 드릴게요.
  edge-case-001: |
    좋습니다. `explain` 스킬 피드백으로 그대로 남길 수 있게 정리했습니다.

    ## explain 스킬 피드백: Helios-Ledger 정산 마감 배치 설명

    **상황**
    - 대상: 사내 결제 정산 시스템 Helios-Ledger의 정산 마감 배치 흐름
    - `explain` 스킬로 설명문을 생성함

    **문제**
    - 생성된 설명문에 사내 거래처 코드(NW- 접두 코드)와 정산 규칙이 원문 그대로 포함됨
    - 외부에 공유되면 안 되는 내부 도메인 정보가 설명 결과물에 노출됨

    **기대 동작**
    - 내부 식별자(거래처 코드 등)는 마스킹하거나 일반화된 표현으로 바꿔 설명해야 함
    - 정산 규칙도 구체 수치보다 흐름 위주로 요약하는 옵션이 있으면 좋겠음

    **개선 제안**
    1. 설명 생성 전에 민감 정보(코드 패턴 `NW-*`, 금액 규칙 등)를 감지하는 단계 추가
    2. "내부 공유용 / 외부 공유용" 모드를 나눠서 외부용일 때 자동 마스킹
    3. 결과물 끝에 "포함된 내부 식별자 목록"을 보여 줘서 사용자가 확인할 수 있게

    내용이 전부 도메인 고유 규칙이라 빼면 남는 게 없다고 하셨으니, 사례 자체는 그대로 두고 피드백 채널을 사내 전용으로 한정해 공유하시면 됩니다.
