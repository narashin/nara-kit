  should-not-trigger-001: |
    이건 회고 요청이 아니라 코드 리뷰 요청이라 이 스킬이 맡지 않습니다. 회고는 일한 과정과 환경을 돌아보는 것이고, 변경사항의 품질 검토는 다른 스킬이 합니다.

    - 원격 PR(URL이나 번호가 있는 경우)이면 `/nara-pr-review <PR URL 또는 번호>`
