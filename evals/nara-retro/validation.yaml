  skill-incident-redaction-001: |
    ## Improvement note: `prep` tool paraphrases AC instead of copying verbatim

    **Context**
    - Project: Aurora (repo `ssh://git.northwind-internal.example/aurora/aurora-web.git`, branch `feature/AUR-318-coupon-stacking`)
    - Source spec: https://wiki.northwind-internal.example/x/AbCdEf (AC written by PM Sarah Kim)

    **What happened**
    `prep` pulled the Confluence spec into `docs/requirements.md` but paraphrased the acceptance criteria instead of copying them. The precise rule "동일 카테고리 쿠폰은 1개만, 카테고리 교차 시 최대 2개" lost its nuance, and I only caught it during gap analysis.

    **Impact**
    Gap analysis ran against a weakened requirement, so the mismatch surfaced late instead of at prep time.

    **Suggested fix**
    - Copy acceptance criteria verbatim from the source; never summarize AC text.
    - If paraphrasing is needed for readability, keep the original AC next to it and mark the paraphrase.
    - Add a check at the end of `prep` that diffs the localized AC against the source and warns on any wording change.
