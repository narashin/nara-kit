name: nara-retro-eval
description: Evaluation suite for session retrospectives and skill-incident diagnosis.
skill: nara-retro
version: "1.0"
config:
  trials_per_task: 1
  timeout_seconds: 600
  parallel: false
  executor: mock
  model: claude-sonnet-4.6
metrics:
  - name: task_completion
    weight: 1.0
    threshold: 0.8
    description: Did the skill tie each lesson to evidence, route it to exactly one owner (memory write, or suggest-only for checks/rules/skills/ADR), conclude no change when nothing is actionable, and redact a skill-incident proposal completely?
graders:
  - type: code
    name: real_run
    config:
      # Provenance gate, not a behavioural one: it asserts the graded output came
      # from a real skill run. Under `executor: mock` it fails every task by
      # construction -- that is the correct signal, because mock output grades the
      # eval's own description and fixture text, never the skill. Measurement goes
      # through `waza grade` on a real run; see CLAUDE.md.
      assertions:
        - "len(output) > 40"
        - "'Mock response for:' not in output"
tasks:
  - "tasks/*.yaml"
