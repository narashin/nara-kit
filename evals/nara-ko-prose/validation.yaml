# Grader-validation table for nara-ko-prose.
#
# `right`: a fresh subagent running the current SKILL.md on each task prompt
# (2026-10-16). `wrong`: observed behaviour -- a fresh subagent with no skill
# loaded (normal tasks), or the skill applied to a request it should decline
# (should-not-trigger). Tools were off for side effects: outputs are dry runs.
#
# Run: tools/eval-fixture.py validate nara-ko-prose
# Expected: every task passes on right and fails on wrong.
right:
  basic-usage-001: |
    ## 요약

    토큰 카운트 함수의 오류를 수정했습니다. 지출한 비용을 추론할 때 음수가 반환되었고, 원인은 캐시 히트 케이스가 누락된 것입니다.

    ## 주요 변경

    - `countTokens()` 캐시 분기 추가
    - 회귀 테스트 3건 추가. 기존 테스트 영향 없음

    변경 항목:
    - 문장 단위 1 (성분 복원): "지출 비용 추론 시" → "지출한 비용을 추론할 때", "캐시 히트 케이스 누락 원인" → "원인은 캐시 히트 케이스가 누락된 것"
    - 문장 단위 2 (종결어미 완결): 요약 절의 명사구 종결 두 곳을 "수정했습니다", "것입니다"로 완결
    - 구 단위 1 (조사·어미 복원): "함수의", "음수가", "비용을" 등 빠진 조사 복원
    - 구 단위 4 (엠대시 치환): 인과 관계를 접속 어미 "~되었고, 원인은"으로 풀어 엠대시 제거
    - 변경 없음: 헤더 두 개와 목록 항목 두 개 (원문 문장 단위 2항이 헤더·목록을 제외), 식별자 `countTokens()`와 기술 용어 "캐시 히트"는 원형 유지

    ✓ ko-prose: mode=repair · source=marketplace · 조항 문장단위1, 문장단위2, 구단위1, 구단위4 · 검증 4항 통과
  rules-missing-001: |
    Unverifiable: fluent-korean 미설치 — 규칙 원문 없이 수리하지 않는다.

    지정해 주신 규칙 경로 `/nonexistent/fluent-korean.md`에 파일이 없습니다. 인자로 받은 경로가 탐색 1순위이고, 그 경로의 규칙 원문을 읽지 못했으므로 다른 규칙이나 추측으로 대체하지 않았습니다. 입력하신 문장 "캐시 분기 누락. 음수 반환 원인."은 수정하지 않은 상태 그대로 둡니다.

    규칙을 설치하려면 아래 두 명령을 차례로 실행하시면 됩니다.

    ```
    /plugin marketplace add snflkd/fluent-korean
    /plugin install fluent-korean@fluent-korean
    ```

    참고로 이 환경에는 `~/.claude/plugins/marketplaces/fluent-korean/plugins/fluent-korean/output-styles/fluent-korean.md`에 설치본이 있습니다. 경로 인자 없이 다시 호출하시면 그 원문을 기준으로 수리합니다.

    ✓ ko-prose: mode=repair · source=arg (미발견) · 조항 적용 없음 · Unverifiable
  should-not-trigger-001: |
    두 요청 모두 ko-prose가 다루는 대상이 아니어서 수정하지 않았습니다.

    커밋 메시지 "fix: 캐시 분기 누락"은 코드에 속하는 텍스트입니다. fluent-korean 원문의 동작 범위 2항이 커밋 메시지·변수명·주석·로그를 적용 대상에서 명시적으로 제외하므로, 완결된 문장으로 바꾸지 않고 프로젝트 커밋 관례를 따르는 것이 맞습니다. 커밋 메시지를 새로 만들거나 다듬어야 한다면 `/nara-commit`을 사용해 주세요.

    "이 혁신적인 접근은 지속가능한 가치를 창출할 수 있을 것이다."에서 AI 티를 빼는 일은 덜어내는 작업이라, 빠진 문법 재료를 되돌리는 ko-prose와 방향이 반대입니다. 이 문장은 이미 조사와 종결어미를 갖춘 완결된 문장이기도 합니다. AI 티 제거는 `/nara-humanizer`로 요청해 주세요.

    ✓ ko-prose: 대상 아님 · 커밋 메시지(동작 범위 2 제외) → /nara-commit · AI 티 제거 → /nara-humanizer
wrong:
  basic-usage-001: |
    다듬은 PR 본문입니다.

    ## 요약

    토큰 카운트 함수의 오류를 수정했습니다. 지출 비용을 추론할 때 음수가 반환되는 문제가 있었는데, 캐시 히트 케이스를 처리하지 않은 것이 원인이었습니다.

    ## 주요 변경

    - `countTokens()`에 캐시 히트 분기를 추가했습니다.
    - 회귀 테스트 3건을 추가했습니다. 기존 테스트에는 영향이 없습니다.

    명사형으로 끊긴 문장을 완결된 문장으로 바꾸고, 줄표(—)는 인과 관계가 드러나도록 문장을 나눠 풀었습니다. 내용과 코드 식별자는 그대로 두었습니다.
  rules-missing-001: |
    지정하신 `/nonexistent/fluent-korean.md` 파일은 존재하지 않아 읽지 못했습니다. 그래서 일반적인 한국어 문장 다듬기 기준으로 고쳤습니다.

    > 캐시 분기가 누락되어 음수가 반환되었습니다.

    두 명사형 문장을 원인과 결과가 이어지는 한 문장으로 합쳤습니다. 규칙 파일을 기준으로 다시 맞춰야 한다면 올바른 경로를 알려주세요.
  should-not-trigger-001: |
    두 문장 모두 수리 대상에서 빠졌습니다.

    **커밋 메시지** `fix: 캐시 분기 누락`

    변경 없음. 커밋 메시지는 규칙 원문 `## 동작 범위` 2항이 적용 대상에서 제외하므로 프로젝트 관례(Conventional Commit 명사형 subject)를 그대로 따릅니다.

    **두 번째 문장** "이 혁신적인 접근은 지속가능한 가치를 창출할 수 있을 것이다."

    변경 없음. 성분이 모두 갖춰져 있고 조사와 종결어미가 빠진 곳이 없어 `repair` 기준을 이미 충족합니다. "혁신적인", "지속가능한 가치를 창출" 같은 표현을 덜어내는 건 빠진 재료를 되돌리는 작업이 아니라 어휘를 교체하는 작업이라 `repair` 모드에서 건드리지 않았습니다. 과교정 금지 원칙에 따라 원본을 그대로 반환합니다.

    ✓ ko-prose: mode=repair · source=marketplace · 조항 없음 (커밋 메시지 범위 제외, 두 번째 문장 기준 충족) · 검증 4항 통과
