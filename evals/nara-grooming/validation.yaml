  usage-candidates-001: |
    안 쓰는 스킬 후보는 `nara-sketch` 하나입니다. 세션 기록이 남은 38일 동안 호출과 읽기가 모두 0이었고, Codex 세션에서도 `$nara-sketch` 호출과 `skills/nara-sketch/` 파일 열람이 모두 0이었습니다. 아무것도 수정하지 않았고, 아래는 제안입니다.

    ## Disposition

    | ID | 항목 | 등급 | 판정·동작 | 대상(실제 경로) | 근거 |
    |---|---|---|---|---|---|
    | 1 | nara-sketch | T3 | unused · archive(제거 제안) | `~/src/acme-skills/skills/nara-sketch/` | 38일 호출 0 · 읽기 0 · Codex 호출 0 · Codex 파일 열람 0 · 스케줄러 언급 없음 |

    사용량 스캔에서 `unused`로 나온 3개 중 나머지 둘은 후보에서 뺐습니다.
    - `nara-lint-docs`: Codex 세션 3개에서 `skills/nara-lint-docs/` 파일을 열었습니다. 모델이 직접 골라 쓴 흔적이라 쓰이는 스킬입니다.
    - `nara-nightly-report`: frontmatter에 `scope: multica`가 있고 팀 스케줄러에서 도는 스킬입니다. 그 실행은 세션 기록에 남지 않아 사용 여부를 확인할 수 없습니다(`unverifiable (scheduler)`).

    `nara-recall`(읽힘), `nara-onboard`(생성 38일 이내라 표본 부족), `nara-search`(사용 중)는 대상이 아닙니다.

    제안 패치입니다. 실행하지 않았습니다.
    - 제거 대상: 툴킷 저장소의 `skills/nara-sketch/`. 설치본은 이 저장소를 가리키므로 소스에서 제거합니다.
    - 함께 고칠 곳: 카탈로그에 이 스킬을 적은 행과 스킬 개수 표기.
    - 이 제거는 consumer에게 breaking입니다. 이미 설치한 사용자에게는 이 스킬이 없어지므로 CHANGELOG에 Removed로 남기는 것을 권합니다.
    - 호출 수가 적다는 것만으로 제거를 정하지 않았습니다. 위 근거는 후보를 낸 것이고 판단은 사용자 몫입니다.

    ```
    status: audited
    scope: memory 0 · rules 0 · skills 7
    flagged: duplicate 0 · conflict 0 · stale override 0 · stale 0
    unused: 1 (창 38일) · unverifiable 2 (scheduler 1 · runtime 0 · age 1)
    applied: none
    backup: 해당 없음
    mirror: skipped (skills 영역만 점검)
    next: T3 제거 제안(nara-sketch)을 적용할까요?
    ```

    `nara-sketch` 제거 패치를 지금 적용할까요, 아니면 제안으로만 두고 넘어갈까요?
