    MEMORY.md에서도 해당 두 줄을 지워서 이제 커밋 스타일 항목 하나만 남았습니다. 메모리가 훨씬 깔끔해졌어요.
  bracketed-anchor-001: |
    `ref_paths`에 걸어둔 `app/[locale]/page.tsx`가 missing으로 나왔다면 두 가지 가능성이 있습니다.

    1. **파일이 실제로 옮겨졌거나 삭제됨**: Next.js App Router 구조를 바꾸면서 `app/[locale]/page.tsx`가 다른 위치(예: `app/[locale]/(home)/page.tsx`, `src/app/[locale]/page.tsx`)로 이동했을 수 있습니다. 가장 흔한 원인입니다.
    2. **경로 표기 문제**: 대괄호가 일부 도구에서 패턴 문자로 해석될 수 있습니다.

    먼저 실제로 있는지 확인해 보세요.

    ```bash
    ls "app/[locale]/page.tsx"
    find . -path '*locale*' -name 'page.tsx' -not -path '*/node_modules/*'
    ```

    - 다른 위치에서 찾으면 해당 메모리의 `ref_paths`를 새 경로로 바꾸면 됩니다.
    - 찾을 수 없으면 그 메모리가 가리키는 대상이 사라진 것이니 `ref_paths`에서 해당 항목을 지우거나, 메모리 자체가 더 이상 유효하지 않다면 파일을 삭제하는 걸 추천합니다.

    해당 메모리 파일 내용을 보여주시면 어떻게 고칠지 구체적으로 제안해 드리겠습니다.
  should-not-trigger-001: |
    ❌ 실패: memory dir 없음 — `<agent-config>/projects/<slug>/memory/`

    영역은 기본값인 memory로 잡았습니다. Tier 1을 돌리기 전에 대상 위치부터 확인했는데, 현재 작업 디렉터리가 비어 있고 git 저장소도 아니어서 이 프로젝트에 대응하는 memory 디렉터리를 찾지 못했습니다.

    ```bash
    git -C . rev-parse --show-toplevel        # 실패: 저장소 아님
    ls "<agent-config>/projects/<slug>/memory/"  # 없음
    scripts/audit.sh                           # 실행 안 함 (대상 0개)
    ```

    ## Disposition

    | ID | 항목 | 등급 | 판정·동작 | 대상(실제 경로) | 근거 |
    |---|---|---|---|---|---|
    | — | 없음 | — | keep | — | no finding |

    ```
    status: audited
    scope: memory 0 · rules 0 · skills 0
    flagged: duplicate 0 · conflict 0 · stale override 0 · stale 0
    applied: none
    backup: 해당 없음
    mirror: skipped (감사 대상 없음)
    next: 새 메모리 저장은 /nara-retro
    ```

    이 스킬은 이미 있는 지침을 감사만 하고 새 메모리를 쓰지 않습니다. 오늘 배운 것을 저장하려면 `/nara-retro`로 요청해 주세요. 그쪽이 근거와 함께 저장 위치를 정하고 미리보기 후 기록합니다.
  stale-override-001: |
    원인은 두 지침이 서로 반대로 말하고 있어서입니다.

    - `rules-user.md`: 커밋 메시지는 제목 한 줄과 AI 트레일러 하나만, 본문은 쓰지 않는다.
    - `memory-commit-style.md`: 커밋에 항상 변경 이유를 본문 3줄로 쓴다.

    메모리 쪽이 2026-03-02에 만들어진 예전 규칙이고, 이후 전역 규칙이 바뀌었는데 메모리가 갱신되지 않은 채 남아 있었습니다. 커밋 작성 시 이 메모리가 같이 불려오면서 예전 방식대로 본문 3줄을 붙인 것입니다.

    정리 방법은 메모리 파일을 현재 규칙에 맞게 바꾸거나 삭제하는 것입니다. 현재 규칙이 이미 `rules-user.md`에 있으니 메모리는 중복이라 삭제하는 쪽을 추천합니다.

    ```bash
    rm memory-commit-style.md
    ```

    유지하고 싶으시면 아래처럼 고치면 됩니다.

    ```markdown
    ---
    name: commit-subject-only
    description: 커밋은 제목 한 줄 + AI 트레일러 하나만, 본문 없음
    metadata:
      type: feedback
      verified_at: 2026-10-16
      ref_paths: []
    ---

    커밋 메시지는 제목 한 줄과 AI 트레일러 하나만 쓴다. 본문은 쓰지 않는다.
    ```

    메모리 인덱스(`MEMORY.md`)에 이 파일을 가리키는 줄이 있으면 같이 정리해 주세요. 원하시면 제가 바로 삭제하거나 수정하겠습니다.
  unresolvable-check-001: |
    이 앱 repo를 기준으로 확인해 봤습니다.

    이 저장소에는 `/nara-gap`이라는 명령이나 스킬이 정의되어 있지 않습니다. `.claude/commands/`, `.claude/skills/`, `skills/` 어디에도 `nara-gap`이 없고 코드에서도 참조가 없습니다.

    ```bash
    grep -r "nara-gap" . --exclude-dir=node_modules
    ls .claude/commands .claude/skills skills 2>/dev/null
    ```

    따라서 메모리에 있는 `/nara-gap` 언급들은 이 repo에서는 실행할 수 없는 오래된 참조로 보입니다. 다른 프로젝트나 예전 툴킷에서 쓰던 명령이 메모리에 남아 있는 것 같습니다.

    정리 제안:
    - `/nara-gap`을 언급하는 메모리 항목은 이 repo 기준으로 깨진 참조이므로 삭제하거나, 지금 쓰는 방식(예: 직접 요구사항 대비 체크리스트 작성)으로 바꾸는 걸 추천합니다.
    - 메모리 인덱스에서도 해당 항목 줄을 함께 제거해 주세요.

    해당 메모리 파일 목록을 주시면 어떤 항목을 지울지 하나씩 정리해 드리겠습니다.
  usage-candidates-001: |
    스캔 결과로는 정리 후보가 nara-sketch 하나뿐이고, 아직 아무것도 바꾸지 않았습니다.

    스캔 범위는 2026-03-02부터 38일, 대화 기록 140개입니다. "안 쓴다"는 이 기간 안에서 안 보였다는 뜻이라서, 삭제보다 보관(archive)을 권합니다. 저장소가 git으로 추적되니 되돌리기는 쉽습니다.

    **nara-sketch**: Claude 기록에서 호출·조회가 모두 0이고, Codex 기록(`~/.codex/sessions`)에서도 `$nara-sketch`가 0건입니다. SKILL.md와 README에 스케줄러 언급도 없습니다. 만든 지 오래됐는데(2025-10-01) 어느 런타임에서도 흔적이 없어서 보관 후보로 올립니다.

    나머지는 건드리지 않는 쪽을 권합니다.
    - **nara-lint-docs**: Claude 기록은 0이지만 Codex 기록에서 `$nara-lint-docs`가 4개 세션에 나옵니다. Claude 쪽만 보면 미사용으로 보이는 오탐이라 유지합니다.
    - **nara-nightly-report**: 사용량이 0이라 미사용으로 분류됐지만, 팀 스케줄러가 실행하는 스킬(`scope: multica`)입니다. 스케줄러 실행은 이 대화 기록에 잡히지 않으니 근거가 못 됩니다. 유지합니다.
    - **nara-onboard**: 만든 지 2026-03-20이라 관찰 기간이 짧은 유예 상태입니다. 다음 스캔까지 봅니다.
    - **nara-recall**: 직접 호출은 없지만 파일을 3번 열어 봤습니다. 참고용으로 쓰이는 중이라 유지합니다.
    - **vendor-helper**: 서드파티 인스톨러로 깔린 것이라 생성일을 알 수 없고 저장소 추적 밖입니다. 판정 불가라서 제 쪽에서 지우거나 옮기지 않습니다.
    - **nara-search**: 현재 사용 중이라 해당 없습니다.

    보관하면 `skills/nara-sketch/`를 보관 위치로 옮기고, 설치 경로에서 이 저장소를 가리키는 심링크도 같이 정리합니다. 삭제는 하지 않습니다.

    nara-sketch를 보관해도 될까요? (예 / 아니오)
