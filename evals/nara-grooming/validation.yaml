#
# `right`: a fresh subagent running the current SKILL.md on each task prompt
# (2026-10-16). `wrong`: observed behaviour -- a fresh subagent with no skill
# loaded (normal tasks), or the skill applied to a request it should decline
# (should-not-trigger). Tools were off for side effects: outputs are dry runs.
#
# Run: tools/eval-fixture.py validate nara-grooming
# Expected: every task passes on right and fails on wrong.
right:
  basic-usage-001: |
    memory 감사 완료, 아직 아무것도 고치지 않았다 (pending escalation: T1 수정 승인 필요).

    대상은 `~/.claude/projects/-work-web-ui/memory/`의 파일 3개다(`MEMORY.md` 제외). Tier 1에서 2개가 2점(suspect)으로 걸려 Tier 2 의미 검증까지 돌렸고, 나머지 1개는 0점이라 그대로 둔다. memory 디렉터리는 git 저장소 밖이라 수정 대상은 모두 T1이다.

    ## Disposition

    | ID | 항목 | 등급 | 판정·동작 | 대상(실제 경로) | 근거 |
    |---|---|---|---|---|---|
    | G1 | 코드 리뷰 스킬 안내 (`/code-review`) | T1 | stale → fix | `~/.claude/projects/-work-web-ui/memory/reference_review_skill.md` + `MEMORY.md` 3번째 줄 | Tier 1 `skill_ref_broken: ["/code-review"]`, 120일. 설치된 스킬에 `/code-review`는 없고 `/nara-code-review`가 있다. Tier 2: STALE. 최소 수정은 본문과 인덱스 줄의 `/code-review`를 `/nara-code-review`로 바꾸고 `verified_at`을 갱신하는 것 |
    | G2 | 금요일 배포 금지 | T1 | stale → fix (정책 유지 여부는 사용자 확인) | `~/.claude/projects/-work-web-ui/memory/project_deploy_freeze.md` | Tier 1 `ref_validity 0%`, 140일. 앵커 `ops/deploy-calendar.md`가 저장소에 없다. Tier 2: 앵커는 STALE, 정책 자체는 `UNVERIFIABLE [requires 팀 배포 정책 원문]`. 정책이 살아 있으면 실제 근거 위치로 앵커를 바꾸고 `verified_at` 갱신, 폐기됐으면 `memory/archive/`로 옮기고 인덱스 줄 제거 |
    | G3 | 커밋 제목 영어 + 티켓 접두사 | — | keep | `~/.claude/projects/-work-web-ui/memory/feedback_commit_style.md` | Tier 1 0점(healthy). 앵커 없는 원칙이라 썩을 것이 없다 |

    ## Exceptions

    - G2의 정책 사실(금요일 배포를 정말 안 하는지)은 외부 정보라 판정하지 않았다. 앵커를 지워 신호만 끄는 수정은 하지 않는다.
    - memory MCP 레코드는 이번에 읽지 못했다. G1·G2의 쌍둥이 레코드가 있으면 파일만 고쳐도 옛 내용이 계속 recall된다.

    ```
    status: audited
    scope: memory 3 · rules 0 · skills 0
    flagged: duplicate 0 · conflict 0 · stale override 0 · stale 2
    applied: none
    backup: 해당 없음 (승인 시 수정 전 `~/.local/state/nara-grooming/<run-id>/`에 복사하고 바이트 동일 확인)
    mirror: skipped (MCP 레코드 미확인, 승인 묶음에서 함께 처리)
    next: T1 승인 질문 (아래)
    ```

    → ESCALATE: T1 수정 승인 요청. G1은 `/code-review`를 `/nara-code-review`로 고칠지, G2는 금요일 배포 금지가 아직 유효한지(유효하면 실제 근거 경로, 아니면 archive)를 알려 주세요.

    답 형식: `G1 승인`, `G2 유효 <근거 경로>` 또는 `G2 archive`
  bracketed-anchor-001: |
    `app/[locale]/page.tsx`는 여러 프레임워크의 동적 라우트 관례라 대괄호까지가 진짜 파일명입니다. 그래서 이 missing은 먼저 읽는 쪽(검사기)을 의심해야 하고, 신호를 끄려고 `ref_paths`에서 앵커를 지우거나 고쳐 쓰면 안 됩니다. 앵커를 지우면 ref_validity와 code_drift 신호가 그 파일에 대해 영구히 꺼집니다.

    이 대화에는 해당 memory 파일도 앱 저장소도 없어서 직접 확인은 못 했습니다. 원인 후보는 셋이고 이 순서로 보면 됩니다.

    1. 설치된 `audit.sh`가 옛 사본인 경우. 현행 소스는 항목을 앞뒤 공백과 감싼 따옴표 한 쌍만 벗기고 값 안의 `[` `]`는 그대로 둡니다. 예전처럼 대괄호 문자를 통째로 지우는 사본이면 `app/locale/page.tsx`를 찾으니 항상 missing이 납니다.
    2. `CLAUDE_PROJECT_DIR`이 앱 저장소가 아닌 경우. 상대 경로 항목은 `$CLAUDE_PROJECT_DIR` 아래에서 먼저 찾고 그다음 현재 cwd 기준으로 찾으므로, 다른 디렉터리에서 돌리면 없다고 나옵니다.
    3. 파일이 정말 없어진 경우. 이때만 `stale`입니다.

    ```bash
    ls -- "$CLAUDE_PROJECT_DIR/app/[locale]/page.tsx"
    CLAUDE_PROJECT_DIR=<앱 저장소> bash <설치본>/scripts/audit.sh <memory 파일>
    diff <설치본>/scripts/audit.sh <nara-kit 소스>/skills/nara-grooming/scripts/audit.sh
    ```

    경로는 꼭 따옴표로 감싸 주세요. 셸이 `[locale]`을 글롭으로 해석합니다.

    ## Disposition

    | ID | 항목 | 등급 | 판정·동작 | 대상(실제 경로) | 근거 |
    |---|---|---|---|---|---|
    | 1 | `app/[locale]/page.tsx`를 앵커로 둔 memory 파일 | 미확인 | keep | 미확인 | 대괄호 경로는 정상 파일명이고 실패는 읽는 쪽 문제일 가능성이 큼 |
    | 2 | 대괄호를 벗기는 `audit.sh` 사본(1번 원인일 때) | T3 (nara-kit 소스) | fix 제안 | `skills/nara-grooming/scripts/audit.sh` 소스 | 설치본은 고치지 않고 소스에서 고친 뒤 재설치 |

    ## Exceptions

    - memory 파일과 앱 저장소가 이 대화에 없어 파일 존재 여부와 설치본 버전을 확인하지 못했습니다. 위 세 명령 결과가 판정을 정합니다.

    ```
    status: audited
    scope: memory 1 · rules 0 · skills 0
    flagged: duplicate 0 · conflict 0 · stale override 0 · stale 0
    applied: none
    backup: 해당 없음
    mirror: skipped (변경 없음)
    next: 위 세 명령 결과를 알려 주세요. 파일이 있는데 missing이면 검사기 소스 패치 제안을 드리겠습니다
    ```
  should-not-trigger-001: |
    새로 배운 것을 메모리에 쓰는 일은 이 스킬의 몫이 아닙니다. nara-grooming은 이미 저장된 메모리와 규칙이 서로 겹치거나 충돌하거나 낡았는지 감사하는 스킬이라 새 메모리를 쓰지 않습니다.

    오늘 배운 것을 근거와 함께 정리해 저장하려면 `/nara-retro`로 요청해 주세요. 저장 전에 미리보기를 보여 주고 어디에 둘지(메모리, 규칙, 스킬 수정 등)도 함께 정해 줍니다.

    상태: skipped (요청 범위 밖). next: `/nara-retro`로 다시 요청.
  stale-override-001: |
    방금 바로잡으신 동작이 지속 지침 하나로 곧장 이어져서, 낡은 메모리가 현재 규칙을 덮어쓴 경우(stale override)로 판정했습니다.

    ```
    교정된 동작: 커밋에 본문 3줄을 붙임
    → 그 동작을 요구한 지침: memory-commit-style.md:10 "커밋 메시지에 본문 3줄로 변경 이유를 반드시 쓴다." (description인 :3도 같은 내용)
    → 현재 소유자의 지침: rules-user.md:4 "커밋 메시지는 제목 한 줄과 AI 트레일러 하나만 쓴다. 본문은 쓰지 않는다."
    → 충돌: 본문을 반드시 쓰라 vs 본문을 쓰지 마라
    ```

    참고로 기계 점검(Tier 1)만으로는 이 파일이 걸리지 않습니다. `verified_at: 2026-03-02`라 228일 지나 age만 1점이고, `ref_paths: []`는 반박할 앵커가 없어 100%, 코드나 스킬 참조도 없어 합계 1점(watch)입니다. 이번 판정의 근거는 점수가 아니라 위 교정 사슬입니다.

    ## Disposition

    | ID | 항목 | 등급 | 판정·동작 | 대상(실제 경로) | 근거 |
    |---|---|---|---|---|---|
    | 1 | commit-body-required 메모리 | 미확인 (memory dir이면 보통 T1) | stale override · archive | memory-commit-style.md (실제 경로 미확인) | :10이 rules-user.md:4와 충돌하고 방금 교정된 동작을 그대로 설명함 |
    | 2 | Git 커밋 규칙 | 미확인 | keep | rules-user.md (실제 경로 미확인) | 현재 소유자. 바꿀 것 없음 |

    ## Exceptions

    - 파일 이름만 받아 실제 경로와 등급을 확인하지 못했습니다. 승인 전에 아래로 등급을 정합니다. git 오류나 깨진 링크는 "추적 안 됨"으로 읽지 않습니다.

    ```bash
    realpath <memory-commit-style.md 경로>
    git -C "$(dirname <실제 경로>)" rev-parse --show-toplevel
    git ls-files --error-unmatch -- <rel>
    ```

    archive는 지우는 게 아니라 `memory/archive/`로 옮기고 `MEMORY.md`에서 그 줄을 빼는 것입니다. nara-retro는 같은 내용을 memory MCP에도 저장하므로 같은 승인 묶음에서 그쪽 레코드도 supersede해야 다시 recall되지 않습니다. 옮기기 전에 원본을 자동 로드되지 않는 영속 위치(`~/.local/state/nara-grooming/<run-id>/`)에 복사하고 바이트 동일을 확인합니다. 옮긴 뒤에는 `MEMORY.md` 포인터 수와 파일 수를 맞춰 보고, 커밋 메시지를 한 번 다시 만들어 본문 없이 나오는지 확인합니다.

    ```
    status: audited
    scope: memory 1 · rules 1 · skills 0
    flagged: duplicate 0 · conflict 0 · stale override 1 · stale 0
    applied: none
    backup: 해당 없음
    mirror: skipped (승인 전)
    next: T1 승인 질문 (아래)
    ```

    T1 승인: 등급 확인 결과가 T1이면 1번 메모리를 백업한 뒤 `memory/archive/`로 옮기고 `MEMORY.md` 줄 제거와 MCP 레코드 supersede까지 진행할까요? (예 / 아니오)
  unresolvable-check-001: |
    `/nara-gap`은 경로가 아니라 호출 형태(Form B)의 스킬 언급이라, 앱 저장소에 `skills/` 트리가 없다는 사실과는 관계가 없습니다. 이 형태는 "그 스킬이 설치돼 있다"는 주장이라 설치 루트에서 판정합니다.

    ```bash
    for r in "${CLAUDE_CONFIG_DIR:-$HOME/.claude}/skills" "$HOME/.codex/skills" "$HOME/.agents/skills"; do
      ls -d "$r/nara-gap" 2>/dev/null
    done
    CLAUDE_PROJECT_DIR=<앱 저장소> bash <nara-grooming>/scripts/audit.sh <memory 파일>
    ```

    결과는 세 갈래입니다.

    - 어느 루트에든 `nara-gap`이 있으면 정상이고 점수에 아무것도 더하지 않습니다.
    - 모든 루트에 없으면 `skill_ref_broken`(+1점)입니다. 지워진 스킬은 어느 저장소에서 봐도 없으니 깨진 것으로 봅니다.
    - 읽을 수 있는 루트가 하나도 없으면 `skill_ref_unknown`이고 0점입니다. 확인하지 못한 검사일 뿐 결함이 아니라서 `stale`로 분류하지 않고, 이번 실행이 못 본 범위로만 적습니다.

    `CLAUDE_PROJECT_DIR`을 툴킷 저장소로 바꾸는 방법은 `skills/<name>/` 경로 주장(Form A) 판정용이라 이 언급에는 필요 없습니다.

    ## Disposition

    | ID | 항목 | 등급 | 판정·동작 | 대상(실제 경로) | 근거 |
    |---|---|---|---|---|---|
    | — | 없음 | — | keep | — | no finding (memory 파일이 아직 없어 판정 전) |

    ## Exceptions

    - 이 대화에 memory 디렉터리와 파일이 없어 `/nara-gap`을 언급한 파일 목록과 각 파일의 점수를 확인하지 못했습니다. 위 명령을 그 memory가 다루는 앱 저장소에서 돌려야 판정이 나옵니다.

    ```
    status: partial
    scope: memory 0 · rules 0 · skills 0
    flagged: duplicate 0 · conflict 0 · stale override 0 · stale 0
    applied: none
    backup: 해당 없음
    mirror: skipped (대상 없음)
    next: 감사할 memory 디렉터리 경로를 알려 주세요. 앱 저장소에서 Tier 1을 돌려 /nara-gap 언급별 판정을 드리겠습니다
    ```
