    **some/tool v4.0.0** (2026-09-02)
    더 빠른 JSON 파서가 추가됐고 Node 18 지원이 빠졌습니다. 메이저 버전이라 Node 18 환경을 쓰고 있다면 업그레이드 전에 런타임부터 올려야 합니다. 파서 성능 향상은 반가운 변화이니, Node 20 이상이라면 업그레이드를 추천합니다.

    **acme/workbench v2.5.0** (2026-09-03)
    - 차단 조건(blocker)이 작업을 거부하는 대신 라벨로 표시됩니다.
    - 적용된 필터를 바(bar)에 모두 이름으로 보여 줍니다.

    UX 개선 위주라 업그레이드 부담이 적습니다. 특히 "거부 대신 라벨" 방식은 우리 도구에도 참고할 만한 패턴이니, 비슷한 기능을 직접 만들어 넣는 것도 고려해 볼 만합니다.

    **acme/workbench v2.5.1** (2026-09-04)
    유지보수 릴리스입니다. 특별한 변경 사항은 없습니다.

    정리하면 some/tool은 Node 버전 확인 후 업그레이드, acme/workbench는 2.5.1로 바로 올려도 됩니다.
