name: nara-incident-eval
description: Evaluation suite for incident analysis report generation skill.
skill: nara-incident
version: "1.0"
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: claude-sonnet-4.6
metrics:
  - name: task_completion
    weight: 1.0
    threshold: 0.8
    description: Did the skill produce a structured incident report with hypotheses and evidence?
graders:
  - type: code
    name: real_run
    config:
      # Provenance gate, not a behavioural one: it asserts the graded output came
      # from a real skill run. Under `executor: mock` it fails every task by
      # construction -- that is the correct signal, because mock output grades the
      # eval's own description and fixture text, never the skill. Measurement goes
      # through `waza grade` on a real run; see CLAUDE.md.
      assertions:
        - "len(output) > 40"
        - "'Mock response for:' not in output"
  - type: text
    name: incident_report_content
    config:
      regex_match:
        - "(?i)(incident-report\\.md|가설|hypothesis|root cause)"
        - "(?i)(evidence|증거|Proposed Fix|Side Effects)"
tasks:
  - "tasks/*.yaml"
