# Grader-validation table for nara-incident.
#
# `right`: a fresh subagent running the current SKILL.md on each task prompt
# (2026-10-16). `wrong`: observed behaviour -- a fresh subagent with no skill
# loaded (normal tasks), or the skill applied to a request it should decline
# (should-not-trigger). Tools were off for side effects: outputs are dry runs.
#
# Run: tools/eval-fixture.py validate nara-incident
# Expected: every task passes on right and fails on wrong.
right:
  basic-usage-001: |
    장애 분석 리포트 작성 (recorded only, status: Blocked). 재현 수단을 확보하지 못해 어떤 가설도 "유력"으로 올리지 않았습니다.

    - artifact: `docs/incident-report.md` (Ticket: PROD-555, Severity: Major [미확인: 영향 범위 데이터 없음])
    - 조회: `mcp__jira__jira_get_issue(issue_key="PROD-555")` 호출 대상이지만 티켓 본문이 입력에 없어, 보고 문장 "주문 API 간헐 500"만 근거로 정리했습니다
    - 재현: 실패. 작업 디렉터리에 주문 API 코드, 에러 로그, 실패 요청 샘플이 없어 failing test나 curl 재현 스크립트를 만들 대상이 없습니다
    - 가설 3개 (전부 확신도 낮음, 코드 근거 없음 [미확인: 코드베이스 없음]):
      - A: 동시 주문 시 재고 차감 경쟁 조건(락·트랜잭션 격리)으로 예외가 500으로 새어 나옴. 반증: 동시성 없는 단건 요청에서도 500이 나면 기각
      - B: 하위 의존(결제·재고 API, DB 커넥션 풀) 타임아웃이나 풀 고갈이 처리되지 않은 예외로 전파. 반증: 500 시각과 하위 지연·풀 사용률이 무관하면 기각
      - C: 특정 입력(쿠폰 없음, 옵션 null 등)에서 null 처리 누락. 반증: 실패 요청 페이로드가 정상 요청과 같으면 기각
    - 반대 심문: "간헐"이라는 보고만으로는 A·B 쪽으로 기울기 쉬운데, 그건 증거가 아니라 통념입니다. 배포 직후부터인지, 특정 인스턴스에서만인지에 따라 세 가설 모두 뒤집힐 수 있어 수정 방향은 리포트에 후보로만 적었습니다
    - 코드 변경: 없음 (분석 단계)
    - next: 아래 자료를 주시면 재현부터 다시 돌리겠습니다
      1. 500 응답의 스택 트레이스 또는 에러 로그 (발생 시각 포함)
      2. 실패한 요청 샘플 1~2건 (HAR 또는 curl)
      3. 주문 API 저장소 경로와 최근 배포 이력
  edge-case-001: |
    OPS-123 장애 분석 리포트 작성, 상태 **Blocked** (recorded only, 코드 수정 없음). 재현 수단을 만들 코드와 환경이 없어 어느 가설도 "유력"으로 올리지 않았다.

    - artifact: `docs/incident-report.md` (Severity: Major, 현상: 평일 9:00~9:30 `GET /orders` 약 3%가 504, 게이트웨이 타임아웃 10초)
    - 가설 4개, 전부 확신도 중간 이하:
      - A. 10/12 배포로 추가된 `status` 필터가 인덱스 없이 orders를 훑어 10초에 근접한다. 근거는 슬로우 쿼리 9초 초과 로그와 "status 인덱스 없음" 코멘트, 배포 후 빈도 증가 제보뿐이다.
      - B. 같은 시간대 `daily-settlement` 배치의 전체 스캔이 I/O·락 경합을 만든다. 배치 시간을 옮겨도 재현이 안 됐다는 코멘트는 단독 원인이라는 쪽에 불리하다.
      - C. 오전 9시 트래픽 피크에 DB 커넥션 풀이 고갈돼 대기 시간이 쌓인다 [미확인: 풀 지표 없음].
      - D. A와 B가 겹칠 때만 10초를 넘는다(교차 조건). 3%라는 간헐성과 가장 잘 맞지만 검증된 것은 없다.
    - Evidence: 저장소에 코드가 없어 `파일:라인` 근거는 0건이다. 모든 근거가 티켓 본문·코멘트(OPS-123)다 [미확인: 쿼리 구현 위치, 인덱스 정의, 배치 SQL].
    - 반대 심문: status 인덱스만 추가하면 A는 풀리지만 B·C가 원인이라면 증상만 줄어든다. 수정 방향(인덱스 추가, 배치 분리)은 제안으로만 적었다.
    - side effects: jira 0 (OPS-123 조회만)
    - next: 재현에 필요한 것을 확보해 다시 `/nara-incident OPS-123` 실행. 필요 항목은 (1) `GET /orders` 핸들러와 쿼리 코드가 있는 저장소, (2) 운영 규모 orders 데이터가 있는 DB에서 `EXPLAIN` 실행 권한, (3) 9시대 슬로우 쿼리 로그와 커넥션 풀 지표, (4) `daily-settlement` 실행 시각과 SQL.
  should-not-trigger-001: |
    `/nara-incident`는 원인 분석 리포트만 만들고 코드는 건드리지 않는 스킬이라, "고쳐줘"라는 이 요청에는 맞지 않습니다.

    - 원인 분석이 이미 끝나 있다면 `/nara-incident-fix`가 그 분석을 근거로 테스트부터 작성해 수정합니다.
    - 원인이 이미 분명한 단순 버그라면 `/nara-implement`로 바로 수정하면 됩니다.
    - 원인을 아직 모르면 먼저 `/nara-incident`로 분석부터 하는 것을 권합니다.

    어느 경우든 NullPointerException이 난 스택 트레이스와 해당 파일 경로가 필요합니다. 지금 메시지에는 둘 다 없습니다.

    - status: skipped (리포트 작성 안 함)
    - next: 스택 트레이스와 파일 경로를 붙여 `/nara-implement` 또는 `/nara-incident-fix` 실행
wrong:
  basic-usage-001: |
    주문 API에서 간헐적으로 500 에러가 나는 상황이군요. 지금은 코드나 로그가 없어서 정확한 원인을 짚기는 어렵지만, 간헐적 500 에러에서 흔히 보이는 원인과 확인 순서를 정리해 드릴게요.

    **자주 보이는 원인**

    1. DB 커넥션 풀 고갈: 트래픽이 몰릴 때 커넥션을 못 얻어 타임아웃이 나며 500으로 떨어지는 경우가 많습니다. 피크 시간대에 몰리는지 확인해 보세요.
    2. 외부 연동 타임아웃: 결제, 재고 같은 외부 API가 느려지거나 실패할 때 예외 처리가 없으면 그대로 500이 됩니다.
    3. 동시성 문제: 같은 주문이나 재고를 동시에 수정하면서 락 충돌, 데드락, 낙관적 락 예외가 날 수 있습니다.
    4. 특정 입력 데이터: 일부 주문만 null 필드나 예상 밖 값을 갖고 있어서 그 주문에서만 예외가 나는 경우도 있습니다.
    5. 배포 직후 특정 인스턴스 문제: 여러 인스턴스 중 하나만 설정이 다르거나 메모리가 부족한 경우입니다.

    **확인해 보면 좋은 것**

    - 500이 난 요청의 서버 로그와 스택 트레이스
    - 에러 발생 시각과 트래픽, DB 커넥션 사용량 그래프의 상관관계
    - 실패한 요청의 공통점 (특정 사용자, 특정 상품, 특정 인스턴스 등)
    - 최근 배포 이력

    PROD-555 티켓 내용이나 에러 로그, 관련 코드를 붙여 주시면 원인을 더 구체적으로 좁혀 드릴게요.
  edge-case-001: |
    OPS-123 분석 결과입니다.

    **원인**

    10/12 배포에서 `GET /orders`에 `status` 필터가 추가됐는데, `orders.status`에 인덱스가 없어서 풀스캔이 발생하고 있습니다. 슬로우 쿼리 로그에 9초 넘는 쿼리가 찍혀 있고, 게이트웨이 타임아웃이 10초라서 조금만 느려지면 504가 납니다. 오전 9시대에는 `daily-settlement` 배치가 같은 테이블을 전체 스캔하니 부하가 겹쳐 타임아웃을 넘기는 것입니다.

    **해결 방법**

    ```sql
    CREATE INDEX idx_orders_status ON orders (status);
    ```

    이 인덱스를 추가하면 문제가 해결됩니다. 추가로 배치 시간을 새벽으로 옮기면 더 안전합니다.

    인덱스 생성 마이그레이션을 작성해서 바로 적용하시면 되고, 적용 후 504가 사라지는지 모니터링하시면 됩니다.
  should-not-trigger-001: |
    장애 분석 리포트 (Blocked).

    이 단계는 분석과 리포트만 만들고 코드는 수정하지 않습니다. 그런데 분석에 필요한 입력이 없어 재현을 시작하지 못했습니다.

    - 현상: NullPointerException 발생 [미확인: 스택 트레이스, 발생 위치, 재현 입력 없음]
    - 재현(feedback loop): 시도 불가. 작업 디렉터리에 소스 코드가 없고, 예외가 나는 클래스·메서드·라인을 특정할 정보가 없습니다.
    - 가설: 재현 증거가 없어 어떤 가설도 "유력"으로 올리지 않았습니다. 일반적인 후보(초기화 안 된 필드, 조회 결과 null 미처리, 외부 응답 누락 필드)는 근거 없이 나열하지 않습니다.
    - artifact: `docs/incident-report.md`는 상태 `Blocked`로만 기록할 수 있어 아직 쓰지 않았습니다 (skipped).

    필요한 것: NPE 스택 트레이스 전체, 해당 소스 파일, 재현 입력이나 요청 예시.

    → 위 정보를 주시면 `/nara-incident`로 리포트를 만들고, 수정은 그 리포트를 기반으로 `/nara-incident-fix`에서 진행합니다.
