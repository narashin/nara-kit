    타임존 기능 요구사항을 정리해 봤습니다. 프로젝트에 아직 코드가 없어서, 일반적인 웹 서비스의 타임존 지원을 기준으로 작성했습니다.

    # 타임존 기능 요구사항

    ## 개요
    사용자가 자신의 타임존을 설정하고, 서비스 안의 모든 날짜·시간을 그 타임존 기준으로 볼 수 있게 한다.

    ## 기능 요구사항

    1. 사용자 프로필에 타임존 설정 항목을 추가한다 (IANA 타임존, 예: `Asia/Seoul`).
    2. 처음 가입할 때 브라우저 타임존(`Intl.DateTimeFormat().resolvedOptions().timeZone`)을 자동으로 감지해 기본값으로 넣는다.
    3. 서버는 모든 시간을 UTC로 저장하고, 화면에 보여줄 때 사용자 타임존으로 변환한다.
    4. 날짜 입력(예약, 마감일 등)은 사용자 타임존 기준으로 받아 UTC로 변환해 저장한다.
    5. 시간 표시 옆에 타임존 약어(KST, JST 등)를 함께 보여준다.
    6. 서머타임(DST)이 있는 지역도 올바르게 처리한다.

    ## 인수 조건

    - 사용자가 타임존을 `America/New_York`으로 바꾸면 목록 화면의 모든 시간이 뉴욕 시간으로 바뀐다.
    - 타임존을 설정하지 않은 사용자는 브라우저 타임존 기준으로 시간이 보인다.
    - `Asia/Seoul` 사용자가 오후 3시로 입력한 일정은 DB에 06:00 UTC로 저장된다.
    - DST 전환일에도 시간이 한 시간씩 밀리지 않는다.

    ## 기술 제안

    - 프론트엔드: `date-fns-tz` 또는 `dayjs` + timezone 플러그인
    - 백엔드: DB 컬럼은 `timestamptz`(PostgreSQL) 사용
    - API 응답은 ISO 8601 UTC 문자열(`2026-10-16T06:00:00Z`)로 통일

    ## 작업 순서 제안

    1. DB 스키마에 `users.timezone` 컬럼 추가
    2. 프로필 설정 화면에 타임존 선택 드롭다운 추가
    3. 공통 날짜 포맷 유틸 작성 후 기존 날짜 표시 부분 교체
    4. 입력 폼 변환 로직 적용
    5. DST 경계 케이스 테스트 작성

    필요하시면 바로 구현을 시작하겠습니다. 어떤 프레임워크를 쓰시는지 알려주시면 그에 맞춰 코드를 작성해 드릴게요.
