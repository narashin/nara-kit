    - **US-2**: As a 고객, I want 배송이 끝난 주문은 배송 완료일을 목록에서 확인하기를, so that 어떤 주문이 언제 도착했는지 한눈에 구분할 수 있다.

    ## Functional Requirements
    - **FR-1**: As a 고객, I want 주문 목록에서 각 주문의 배송 예정일을 바로 확인하기를, so that 주문 상세에 들어가지 않고도 언제 받을 수 있는지 알 수 있다.
    - **FR-2**: As a 고객, I want 배송이 끝난 주문은 배송 완료일을 목록에서 확인하기를, so that 어떤 주문이 언제 도착했는지 한눈에 구분할 수 있다.

    ## Acceptance Criteria

    ### AC-1 (US-1, Happy)
    `browser-visible: yes`
