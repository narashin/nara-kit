    - Given 네이밍 규칙에 어긋나는 식별자가 있을 때
      When 정리 작업을 수행하면
      Then 규칙에 맞게 이름이 변경되고 모든 참조가 함께 갱신된다

    ### US-4: 동작 보존
    개발자로서, 정리 후에도 기능이 그대로이길 원한다.

    **AC (초안)**
    - Given 정리 전 테스트가 통과하던 상태일 때
      When 정리 작업을 마치면
      Then 기존 테스트가 모두 통과하고 타입체크·린트 오류가 늘지 않는다

    ## 비범위
    - 기능 추가나 동작 변경
    - 아키텍처 재설계
