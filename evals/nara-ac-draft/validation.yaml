    [NOT FOUND] 현재 프로젝트에서 소스 코드를 찾지 못했다.

    ## User Stories

    ### US-1: 사용하지 않는 코드 제거
    개발자로서, 사용하지 않는 함수·import·변수를 제거하고 싶다. 코드를 읽을 때 혼란을 줄이기 위해서다.

