      Then 의도된 로깅을 제외한 디버그 호출은 모두 제거된다

    ### US-3: 포맷·네이밍 일관성
    개발자로서, 포맷과 네이밍 규칙이 파일마다 같기를 원한다. 리뷰에서 스타일 논쟁을 줄이기 위해서다.

