    # 로그인 기능 요구사항

    ## 개요
    OAuth2 기반 소셜/외부 로그인을 제공하고, 인증 후 세션은 Redis에 저장한다.

    ## 기능 요구사항

    1. **OAuth2 로그인**
       - Authorization Code Grant 방식을 사용한다 (PKCE 적용).
       - 지원 Provider: Google, GitHub (추후 확장 가능하도록 Provider 추상화).
       - 로그인 버튼 클릭 시 Provider 인증 페이지로 리다이렉트한다.
       - 콜백에서 `state` 파라미터를 검증해 CSRF를 방지한다.
       - 인가 코드를 Access Token으로 교환하고 사용자 프로필(이메일, 이름, 프로필 이미지)을 조회한다.

    2. **사용자 계정 처리**
       - 최초 로그인 시 사용자 계정을 자동 생성한다.
       - 기존 사용자는 Provider + Provider User ID로 식별해 로그인 처리한다.

    3. **세션 관리 (Redis)**
       - 로그인 성공 시 세션 ID를 생성해 Redis에 저장한다. (key: `session:{sessionId}`, value: userId, 생성 시각, 만료 시각)
       - 세션 TTL은 30분, 요청이 있을 때마다 TTL을 갱신한다 (sliding expiration).
       - 세션 ID는 `HttpOnly`, `Secure`, `SameSite=Lax` 쿠키로 전달한다.
       - 로그아웃 시 Redis에서 세션을 삭제하고 쿠키를 만료시킨다.

    4. **인증 미들웨어**
       - 보호된 API는 쿠키의 세션 ID로 Redis를 조회해 인증한다.
       - 세션이 없거나 만료되면 401을 반환한다.

    ## 비기능 요구사항
    - 로그인 처리 응답 시간 500ms 이내 (Provider 호출 제외).
    - Redis 장애 시 로그인 불가 상태를 명확한 에러로 안내한다.
    - Client Secret 등 민감 정보는 환경변수로 관리한다.

    ## 인수 조건 (Acceptance Criteria)

    ```gherkin
    Scenario: 신규 사용자가 Google로 로그인한다
      Given 가입 이력이 없는 사용자가
      When Google 로그인을 완료하면
      Then 계정이 생성되고 세션이 Redis에 저장되며 메인 페이지로 이동한다

    Scenario: 기존 사용자가 로그인한다
      Given 이미 가입된 사용자가
      When OAuth2 로그인을 완료하면
      Then 기존 계정으로 로그인되고 새 세션이 발급된다

    Scenario: state 값이 일치하지 않는다
      Given 콜백 요청의 state가 저장된 값과 다를 때
      When 콜백을 처리하면
      Then 로그인이 거부되고 에러 페이지가 표시된다

    Scenario: 세션이 만료된다
      Given 30분간 요청이 없던 사용자가
      When 보호된 API를 호출하면
      Then 401이 반환되고 로그인 페이지로 이동한다

    Scenario: 로그아웃한다
      Given 로그인된 사용자가
      When 로그아웃하면
      Then Redis 세션이 삭제되고 쿠키가 만료된다
    ```

    ## 다음 단계
    1. OAuth2 Provider 앱 등록 및 Client ID/Secret 발급
    2. Redis 연결 설정
    3. 로그인/콜백/로그아웃 엔드포인트 구현
    4. 인증 미들웨어 구현 및 테스트 작성

    Provider 목록이나 세션 만료 시간 등 조정할 부분이 있으면 말씀해 주세요.
