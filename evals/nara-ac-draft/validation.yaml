    - Given 코드베이스에 어디서도 참조되지 않는 export가 있을 때
      When 정리 작업을 수행하면
      Then 해당 export는 삭제된다
    - Given 파일에 사용되지 않는 import가 있을 때
      When 정리 작업을 수행하면
      Then 린터 경고 없이 해당 import가 제거된다

    ### US-2: 디버그 로그 제거
    개발자로서, 남아 있는 console.log 같은 디버그 출력을 없애고 싶다. 운영 로그에 노이즈가 섞이지 않게 하기 위해서다.

    **AC (초안)**
    - Given 소스에 디버그용 로그 호출이 남아 있을 때
