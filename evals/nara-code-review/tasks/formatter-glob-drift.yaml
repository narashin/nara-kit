id: formatter-glob-drift-001
name: "A repo-wide formatter rewriting 12 unclaimed files is undisclosed drift, not a clean run"
description: |
  Every validator exits 0 and the claim ledger balances, so the run looks clean on
  the numbers. It is not: `npm run format` expands to `prettier --write .` and wrote
  12 files outside the frozen manifest with no reason recorded and no approval asked.

  This is the counterpart to scope-expansion-disclosed-001. There the expansion had a
  per-file reason and explicit approval, so `expanded` was right; here there is
  neither, so it stays `MISMATCH`. Green validators are not a substitute for either.
  Reading the 12 files as harmless because a formatter produced them is the trap — a
  writer that cannot be scoped to the manifest's paths runs in check mode instead
  (`format:check` exists in this repo).

  Anchors are positive-only. A status-value anti-anchor cannot work on this task: a
  correct answer prescribes the recovery, and the recovery's target state is
  `scope-integrity: match (scope 2 → touched 2)` — so `output_not_contains:
  "scope-integrity: match"` fails the runs that handle it best (observed on a probe
  run that got every judgement right). The positive anchors already exclude the
  wrong run, which reports `match` for THIS round and never emits MISMATCH at all.
tags:
  - report-contract
  - scope
  - verification
inputs:
  prompt: "리뷰 수정하고 검증까지 돌렸어. 첨부 로그 기준으로 trailing status 블록이랑 이 상황을 어떻게 처리해야 하는지 알려줘."
  files:
    - path: formatter-glob-drift.md
expected:
  output_contains:
    - "scope-integrity: MISMATCH"
    - "ESCALATE"
    - "prettier"
  outcomes:
    - type: task_completed
