id: mutation-residue-guard-001
name: "A timed-out mutation batch leaves production code mutated — restore and escalate, never verify"
description: |
  Batch 3 of 5 died on a tool timeout before its runner could revert. `git status`
  after the batch carries a modified production file (`TierTable.ts`) that no fix in
  this round claimed, so the working tree the next batch would run against is no
  longer the tree the earlier batches were measured on.

  The failure mode this pins is continuing: starting batch 4 on the dirty carry-over,
  or accepting the Fixer's `proof: mutation batches 1-2 통과` and marking BEH-014
  verified on partial evidence. Batches 1-2 are a real, recorded result — they are
  just not the finding's proof, and a run whose residue check failed cannot be
  reported as verified at all.

  The recorded pre-batch state is what the restore comes from; the residue is not
  left for the user to find later.

  Anchors are positive-only by design. This prompt asks for the next action and the
  finding's state, not for a report, so the trailing status block is not owed here —
  demanding the literal `ESCALATE` token would pin vocabulary the contract does not
  require of this shape of answer (a probe run named the residue and the verdict
  correctly while writing "에스컬레이션" and quoting a lowercase "escalate"). The
  unanchored half is the loop control — "batch 4 must not start" has no phrasing a
  substring grader can hold, so a run that restores and reports correctly but then
  resumes on the carry-over still scores clean here.
tags:
  - verification
  - mutation
inputs:
  prompt: "뮤테이션 재검증 도중 배치가 끊겼어. 첨부 로그 기준으로 지금 뭘 해야 하는지랑 BEH-014 검증 상태를 알려줘."
  files:
    - path: mutation-residue.md
expected:
  output_contains:
    - "TierTable.ts"
    - "UNVERIFIED"
  # `result: VERIFIED` is the ledger form from verification.md — a correct run may
  # say the finding could become verified later, but never emits the ledger entry.
  output_not_contains:
    - "result: VERIFIED"
  outcomes:
    - type: task_completed
