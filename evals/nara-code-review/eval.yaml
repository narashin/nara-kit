name: nara-code-review-eval
description: Evaluation suite for code-review — evidence-based multi-agent review (core 4 + conditional, Reviewer→Judge→Fixer→Verifier).
skill: nara-code-review
version: "1.0"
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: mock
  model: claude-sonnet-4.6
metrics:
  - name: task_completion
    weight: 1.0
    threshold: 0.8
    description: Did the skill produce findings grouped by severity with file references?
# Graders declared here apply to EVERY task, so they can only carry liveness — a
# global content regex cannot hold for both a Korean review report and the
# anti-trigger task's refusal. (The removed `relevant_content` regex matched the
# retired High/Medium/Low + Architecture/Correctness/Security vocabulary and so
# failed even a correct report.) Per-task discrimination lives in each task's
# `expected.output_contains` / `output_not_contains`, which waza scores as the
# `_output_contains` / `_output_not_contains` graders.
graders:
  - type: code
    name: has_output
    config:
      assertions:
        - "len(output) > 0"
tasks:
  - "tasks/*.yaml"
