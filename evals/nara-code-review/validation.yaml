  should-not-trigger-001: |
    Step 0 프로젝트 오버라이드 확인:

    ```bash
    test -f .claude/overrides/code-review.md && cat .claude/overrides/code-review.md
    ```

    → 파일 없음. 건너뜁니다.

    Phase 1 스코프 수집:

    ```bash
    git status --porcelain
    git diff --stat && git diff
    git diff --cached
    git ls-files --others --exclude-standard
    ```

    → 작업 디렉터리에 변경사항이나 커밋된 코드가 없습니다. 대화에서 언급되거나 편집된 파일도 없어 대체 스코프도 비어 있습니다.

    **리뷰할 대상이 없습니다.** 빈 스코프이므로 리뷰어를 실행하지 않고 여기서 멈춥니다. 리포트 파일은 저장하지 않았습니다.

    다시 실행하려면 다음 중 하나로 범위를 지정해주세요.

    - `/nara-code-review 1` 또는 `/nara-code-review N` (최근 N개 커밋)
    - `/nara-code-review <branch>` (브랜치 대비)
    - 리뷰할 파일 경로를 직접 지정

    ```
    overrides: none (.claude/overrides/code-review.md 없음)
    fix-ledger: n/a
    fix-verification: n/a
    scope-integrity: n/a (empty scope)
    validation: n/a
    ```

    **다음**: 리뷰 범위를 지정해 다시 실행하세요.
  string-identity-conflation-001: |
    전반적으로 구조는 단순하고 읽기 쉬운데, 문자열 비교로 식별자를 판단하는 곳이 세 군데 있고 셋 다 오동작 여지가 있습니다.

    **1. `find_ticket_pr`: 부분 문자열 매칭이라 `PROJ-1`이 `PROJ-12`에 걸림**

    `ticket_key in pr.head_ref`는 `PROJ-1`을 찾을 때 `feature/PROJ-12-login-timeout`도 매칭합니다. 그러면 `PROJ-1` 티켓이 다른 PR에 연결되고, 그 PR이 머지되면 **엉뚱한 티켓이 Done으로 전환**됩니다. 10분마다 도는 자동화라 영향이 큽니다. 브랜치 규칙이 `feature/PROJ-<n>-<slug>`로 정해져 있으니 정규식으로 키를 추출해서 정확히 비교하세요.

    ```python
    import re
    _BRANCH_RE = re.compile(r"^[^/]+/([A-Z]+-\d+)(?:-|$)")

    def ticket_of(head_ref: str) -> str | None:
        m = _BRANCH_RE.match(head_ref)
        return m.group(1) if m else None
    ```

    **2. `is_own_fork`: `startswith(login)`이라 접두사가 같은 다른 사용자도 통과**

    `login="dev"`이면 `"devops/web-ui"`, `"dev2/web-ui"`도 내 포크로 판정되어 남의 저장소에 커밋을 푸시하려 합니다. `full_name.split("/", 1)[0] == login`처럼 owner 부분을 정확히 비교해야 합니다. GitHub 로그인은 대소문자를 구분하지 않으니 `casefold()`로 맞추는 것도 고려하세요.

    **3. `dedup_key`: 구분자가 없어 키가 충돌할 수 있음**

    `f"{pr.repo}{pr.number}"`는 `("web-ui", 12)`와 `("web-ui1", 2)`가 둘 다 `web-ui12`가 됩니다. 또 `repo`에 org가 없어서 다른 org의 같은 이름 저장소와도 겹칠 수 있어요. 충돌하면 리마인더 카드가 안 올라갑니다. `f"{org}/{repo}#{number}"`처럼 구분자를 넣으세요.

    **그 밖에**

    - `run`에서 카드를 post한 뒤 `seen`에 추가하지 않아서, 같은 실행 안에서 같은 PR에 연결된 티켓이 둘이면 카드가 두 번 올라갑니다.
    - 머지된 PR이면 매 실행마다 `jira.transition(key, "Done")`을 다시 호출합니다. 이미 Done인 티켓이면 건너뛰는 게 안전합니다.
    - 테스트가 정상 경로만 확인합니다. `PROJ-1` vs `PROJ-12`, `dev` vs `devops`, dedup 키 충돌 케이스를 테스트로 추가하면 위 문제들이 바로 드러납니다.
  vacuous-test-detection-001: |
    컴포넌트 자체는 깔끔한데, 테스트 몇 개가 실제로는 아무것도 검증하지 못하는 형태입니다.

    **테스트**

    - **`does not leak null into the owner cell`**: React는 `null`을 렌더링하지 않기 때문에, `ownerName &&` 가드를 지워도 `{null}`은 빈 칸이 됩니다. 즉 가드 유무와 상관없이 항상 통과하는 테스트예요. 주석의 전제("가드가 없으면 셀에 'null'이 찍힌다")가 사실이 아닙니다. 의미 있게 만들려면 셀이 비어 있는지(`toBeEmptyDOMElement`)나 `<span>`이 없는지를 확인하는 쪽이 낫습니다.
    - **`renders for the %s role`**: `requesterRole`은 컴포넌트에서 구조 분해조차 하지 않습니다. 다섯 개 역할 모두 같은 결과가 나오는 게 당연하니, 이 테스트는 "역할별 동작"을 보장하는 것처럼 보이지만 실제로는 아무것도 확인하지 않습니다. 역할에 따라 달라지는 동작이 생길 때까지는 지우거나, 반대로 역할 처리가 빠진 게 버그인지 확인이 필요합니다.
    - **`caps the visible tags`**: `getByText(/a, b/)`는 `a, b, c`처럼 캡이 깨져도 통과합니다. 정확한 텍스트(`"a, b"`)로 비교하거나 `c`가 보이지 않는지도 확인하세요. 기대값도 `VISIBLE_TAG_COUNT`에서 계산하고 있어서 상수가 바뀌면 테스트도 같이 바뀌어 회귀를 못 잡습니다. `"+3"`처럼 리터럴로 고정하는 걸 추천합니다.
    - **`shows the empty state`**: 테이블이 없는 것만 확인하고 `No teams found`가 실제로 보이는지는 확인하지 않습니다.

    **컴포넌트**

    - `requesterRole`이 props 타입에는 필수인데 사용되지 않습니다. 의도된 권한 분기가 빠진 건지, 아니면 불필요한 prop인지 확인이 필요합니다.
    - 이름은 `TeamRow`인데 실제로는 테이블 전체를 렌더링합니다. `TeamTable` 같은 이름이 더 정확해 보입니다.
