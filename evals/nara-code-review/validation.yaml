wrong:
  authz-consistency-001: |
    변경사항 살펴봤습니다. 전체적으로 공동 소유자(co-owner)를 소유자로 취급하려는 의도는 이해되는데, 레이어마다 "소유자"의 정의가 달라져서 일관성이 깨진 부분이 있습니다.

    **1. 백엔드 `is_owner`와 삭제 가드의 정의가 어긋남**

    직렬화기는 이제 co-owner에게 `is_owner = True`를 내려주지만, `DELETE /groups/{gid}`는 여전히 `require_primary_owner`라서 co-owner는 403을 받습니다. 프론트가 이 플래그를 보고 삭제 버튼을 노출하면, co-owner는 버튼을 누르고 403을 보게 됩니다. `is_owner` 하나로 편집 권한과 삭제 권한을 동시에 표현하려 해서 생기는 문제라, `can_edit` / `can_delete`처럼 동작별 플래그로 나누는 걸 권합니다.

    **2. 프론트 목록은 서버 플래그를 쓰지 않고 로컬에서 다시 계산함**

    `group.owner_id === user.id || user.is_admin`으로 직접 계산하고 있어서, 이번 백엔드 변경이 목록 화면에는 반영되지 않습니다. co-owner는 편집 버튼조차 안 보이게 됩니다. 의도가 "co-owner도 편집 가능"이라면 이 화면은 여전히 막혀 있는 셈입니다. 서버가 내려주는 값을 단일 기준으로 쓰도록 바꾸는 게 좋겠습니다.

    **3. `ResourceCard.tsx`**

    `group.is_owner`로 삭제 버튼을 노출하므로 1번 문제를 그대로 갖고 있습니다. 다만 현재 어디서도 import되지 않는 컴포넌트라 지금 당장 사용자 영향은 없어 보입니다. 쓰지 않는 코드라면 지우거나, 쓸 계획이라면 삭제 권한 기준을 맞춰두는 게 좋습니다.

    **4. 테스트**

    백엔드 삭제 가드 테스트만 있고, `is_owner` 플래그 의미나 프론트 버튼 노출 조건을 검증하는 테스트가 없습니다. co-owner 기준으로 직렬화 결과와 버튼 노출을 확인하는 테스트를 추가하면 이번 같은 불일치를 잡을 수 있습니다.

    요약하면, 권한 판단을 서버의 동작별 플래그 하나로 모으고 프론트는 그것만 소비하도록 정리하는 방향을 추천드립니다.
  basic-usage-001: |
    커밋 전에 보시기 좋게 정리해드릴게요.

    **커밋 전에 고치는 게 좋아 보이는 것**

    - **`is_owner`와 삭제 권한 불일치**: 직렬화기는 co-owner도 `is_owner = True`로 내려주는데, 삭제 엔드포인트는 `require_primary_owner`라 co-owner는 403입니다. 이 플래그로 삭제 버튼을 보여주는 곳이 생기면 "버튼은 보이는데 누르면 실패"하는 상황이 됩니다. 편집/삭제 권한을 분리한 플래그(`can_edit`, `can_delete`)로 나누는 걸 추천합니다.
    - **프론트 목록의 로컬 재계산**: 목록 화면은 서버 값 대신 `owner_id === user.id || is_admin`으로 직접 계산하고 있어서, 이번 변경 의도(co-owner 편집 허용)가 화면에 반영되지 않습니다. 서버 플래그를 쓰도록 맞추는 게 좋겠습니다.

    **참고 사항**

    - `ResourceCard.tsx`는 어디서도 쓰이지 않습니다. 같은 문제(`is_owner`로 삭제 노출)를 안고 있으니, 안 쓸 거면 삭제를 고려해보세요.
    - 테스트가 백엔드 삭제 가드만 커버합니다. `is_owner` 의미와 버튼 노출 조건에 대한 테스트를 추가하면 좋겠습니다.

    권한 기준을 한 곳으로 모으는 정리만 하면 커밋해도 괜찮아 보입니다.
  edge-case-001: |
    네, 리뷰해드릴게요! 그런데 아직 리뷰할 코드가 보이지 않네요.

    아래 중 편한 방법으로 공유해주세요.

    - 코드나 diff를 그대로 붙여넣기 (`git diff` 출력 등)
