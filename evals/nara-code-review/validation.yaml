    **BEH-014 검증 상태**

    아직 "검증 완료"로 보기 어렵습니다. 19개 중 8개만 돌았고, 그중 MUT-007은 살아남았어요. Fixer가 남긴 ledger의 `proof: mutation batches 1-2 통과`는 사실과도 맞지 않습니다(배치 2에 생존 뮤턴트가 있음). 지금은 "검증 진행 중 / 미완료"로 표시하고, 전체 배치가 끝나고 생존 뮤턴트가 정리된 다음에 완료로 바꾸는 게 맞습니다.
