    pending escalation: 이번 실행은 applied로 보고할 수 없습니다. `npm run format`이 스코프 밖 12개 파일을 다시 써서 scope-integrity와 fix-ledger가 둘 다 MISMATCH입니다.

    **왜 MISMATCH인가.** 스코프는 Phase 1에서 2개 파일로 고정됐는데 실제로 바뀐 파일은 14개입니다. 늘어난 12개에는 쓰기 전 사유 기록이 없고, 쓰기 전에 사용자에게 알리지도 승인을 받지도 않았습니다. `expanded`는 사유, 사전 고지, 명시 승인 세 가지가 모두 있을 때만 쓸 수 있고 지금은 하나도 없습니다. 지금 승인해도 바뀌지 않습니다. 사후 승인으로는 MISMATCH가 `expanded`가 되지 않습니다. 이 12개는 어떤 finding에도 매핑되지 않으니 ledger 기준으로도 changed-but-unclaimed 12건입니다.

    **원인은 검증 단계의 쓰기 명령입니다.** `format` 스크립트가 `prettier --write .`라서 대상이 repo 전체로 고정돼 있습니다. 파일을 다시 쓰는 검증 도구는 매니페스트 파일을 경로 인자로 넘겨 실행하거나 check 모드로만 실행해야 합니다. `npm run format:check`도 `prettier --check .`라 경로가 고정돼 있으니 쓸 수 없고, 아래처럼 경로를 직접 줍니다.

    **tsc·jest 통과도 그대로 믿을 수 없습니다.** 두 명령은 exit 0이었지만 12개 외부 파일이 다시 쓰인 트리에서 측정한 값입니다. 그리고 로그에는 finding별 Verifier 증거(관찰된 hunk가 finding 위치와 겹치는지, failure_path가 더 이상 성립하지 않는지)가 없습니다. 그래서 수정 2건은 아직 unverified입니다.

    처리 순서:
    1. 12개 파일을 format 이전 상태로 되돌립니다. Phase 1의 staged diff가 2개 파일뿐이었으니 이 12개는 format 전에는 변경이 없던 파일입니다. 되돌리기 전에 `git diff --name-only`로 12개 목록을 확인하고, 각 파일에 format 말고 다른 변경이 섞이지 않았는지 봅니다. 되돌리는 명령은 `git restore -- <12개 파일>`인데 워킹트리를 덮어쓰는 작업이라 승인을 받은 뒤 실행합니다.
    2. `git status --porcelain`이 스코프 2개 파일만 보여 주는지 확인합니다.
    3. 포맷은 스코프 파일에만 돌립니다: `npx prettier --check src/checkout/CouponInput.tsx tests/checkout/CouponInput.test.tsx` (필요하면 `--write`, 대상은 같은 두 파일).
