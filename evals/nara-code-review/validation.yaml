    참고로 "전부 고치기"는 권한 로직이나 데이터 처리처럼 동작이 바뀌는 수정도 포함될 수 있어서, 그런 항목은 적용 전에 한 번 확인받는 방식으로 진행하는 걸 추천드립니다.
  formatter-glob-drift-001: |
    로그 보면 수정 자체(2개 파일, 2건)와 타입체크·테스트는 모두 통과했는데, 문제는 `npm run format` 단계입니다. `prettier --write .`가 저장소 전체를 대상으로 돌아서 리뷰 범위 밖의 파일 12개까지 수정됐어요.

    **이 상황 처리 방법**

    1. 범위 밖 12개 파일의 변경을 되돌리세요. 리뷰와 무관한 포맷 변경이 섞이면 diff가 지저분해지고, 리뷰어가 실제 변경을 찾기 어렵습니다.
       ```bash
       git status --porcelain   # 변경 목록 확인
       git checkout -- <범위 밖 파일들>   # 또는 git restore
       ```
       staged 상태라면 `git restore --staged --worktree <파일>`을 쓰면 됩니다.
    2. 포맷은 변경한 파일에만 적용하세요.
       ```bash
       npx prettier --write src/checkout/CouponInput.tsx tests/checkout/CouponInput.test.tsx
       ```
    3. 되돌린 뒤 `tsc`, `jest`를 다시 한 번 돌려서 결과가 그대로인지 확인하면 좋습니다.
    4. 저장소 전체 포맷 정리가 필요하다면, 그건 별도 커밋(예: `chore: format`)으로 분리하는 걸 추천합니다.

    **trailing status 블록**

    정해진 형식이 따로 있다면 그 형식을 알려주시면 맞춰드릴게요. 일반적인 요약으로 적으면 이렇습니다.

    ```
    수정: 2건 적용 (2개 파일)
    범위: 리뷰 범위 밖 파일 12개가 포맷터에 의해 변경됨 → 되돌림 필요
    검증: tsc 통과, jest 22/22 통과 (format 되돌린 뒤 재확인 권장)
    오버라이드: 없음
    ```

    범위 밖 파일을 되돌리고 나면 범위 항목은 "일치"로 바꿔 적으시면 됩니다.
  mutation-residue-guard-001: |
