    - 💥 영향: 머지되지 않은 티켓이 Done으로 닫히고, 엉뚱한 PR 번호로 리마인더 카드가 올라갑니다. 자기 PR은 영영 찾지 못할 수 있습니다. 10분마다 자동으로 실행되므로 사람이 보기 전에 상태가 바뀝니다.
    - counterevidence_checked: `run()` 안에 결과 PR의 키를 다시 확인하는 단계 없음. `tickets`/`prs` 정렬 보장 없음. `test_finds_pr_by_ticket`은 키가 하나뿐인 정확 일치 케이스만 다룸.
