  fix-risk-gate-001: |
    `/nara-code-review`는 제가 알고 있는 명령이 아니라서 그대로 실행할 수는 없어요. 아마 별도로 설치된 스킬이나 커스텀 명령인 것 같습니다.

    대신 코드 리뷰와 수정은 직접 도와드릴 수 있습니다. `--fix=all`이 "찾은 문제를 전부 고쳐달라"는 의미라면, 다음을 알려주시면 리뷰 후 수정안까지 바로 적용해드릴게요.

    - 리뷰할 변경사항 (diff를 붙여넣거나 파일 경로)
