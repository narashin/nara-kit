    5. Verifier 단계를 다시 합니다. finding 2건 각각 hunk가 위치와 겹치는지, failure_path가 해소됐는지, R1이면 회귀 테스트가 통과하는지 확인한 뒤에만 verified로 올립니다. 수정이 있었으니 baseline `9f8e7d6`부터 최종 상태까지 final baseline review도 한 번 돌립니다.
    6. 12개 파일 포맷 정리가 필요하면 이 리뷰와 분리된 별도 변경으로 다룹니다. 이 리뷰 커밋에 섞으면 안 됩니다. 이미 커밋에 들어갔다면 amend로 빼야 합니다.

