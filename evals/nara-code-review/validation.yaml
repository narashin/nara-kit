    [SEC-002] 한 capability 플래그가 서버 규칙이 다른 두 행동(edit, delete)을 함께 게이팅하면 안 된다
      📍 backend serializer::serialize | ⚖️ confirmed | E2 | 신뢰도 88 | R3
      📝 preconditions: 사용자가 공동 소유자(`has_permission(..., role="owner")` 참)이고 primary owner도 admin도 아니다.
         failure_path: `serialize`가 이 사용자에게 `is_owner = true`를 내려준다. 같은 사용자의 `DELETE /groups/{gid}`는 `require_primary_owner`에 막혀 403이 된다(`test_co_owner_cannot_delete`가 이 403을 고정). 그래서 `is_owner`로 Delete를 게이팅하는 소비자는 누르면 반드시 실패하는 버튼을 공동 소유자에게 보여준다. 응답 필드 의미가 바뀐 것이라 API 계약 변경이기도 하다.
      💥 영향: `ResourceCard`가 어딘가에서 import되거나, 프론트가 SEC-001을 `is_owner`로 고치거나, 이 응답을 쓰는 다른 클라이언트가 있으면 공동 소유자에게 403으로 끝나는 파괴적 컨트롤이 노출된다. 서버 가드는 그대로라 권한 상승은 아니다(SEC-004 반려 참고).
      ✏️ 수정안: 서버가 행동별 플래그(`can_edit`, `can_delete`)를 각 백엔드 가드와 1:1로 계산해 내려준다. `can_delete`는 `require_primary_owner`와 같은 판정을 쓴다. `is_owner`는 원래 의미(primary owner 또는 admin)로 되돌리거나 deprecate한다.
      🧪 검증 방법: 공동 소유자·primary owner·admin·무관 사용자 4케이스로 `can_edit`/`can_delete` 값을 단언하고, `can_delete == true`인데 DELETE가 403인 조합이 없음을 단언하는 테스트.

    [SEC-001] 클라이언트 게이팅은 서버가 내려준 인가 신호에서 파생돼야 하고 로컬에서 다시 계산하면 안 된다
      📍 frontend 목록 컴포넌트::Row 렌더 (`isOwner` 로컬 재계산) | ⚖️ confirmed | E2 | 신뢰도 90 | R3
      📝 preconditions: 같은 공동 소유자 사용자.
         failure_path: 서버는 `is_owner = true`를 내려주지만 프론트는 `group.owner_id === user.id || user.is_admin`만 계산해 false가 된다. Edit과 Delete가 모두 숨는다. "소유자"의 정의가 서버 `serialize`와 프론트 Row에 따로 존재하고, 이번 변경으로 둘이 어긋났다.
      💥 영향: `serialize`가 공동 소유자에게 열어 준 의미가 화면에 전혀 반영되지 않는다. 다음 변경에서 한쪽만 고치면 화면과 서버가 다시 갈라진다.
      ✏️ 수정안: 로컬 계산을 지우고 서버 신호를 쓴다. 단 SEC-002를 먼저 처리해야 한다. 지금 `group.is_owner`로 바로 바꾸면 Delete가 공동 소유자에게 열린다. 해결 순서는 SEC-002 → SEC-001이고, Edit은 `can_edit`, Delete는 `can_delete`로 따로 게이팅한다.
      🧪 검증 방법: 공동 소유자 fixture로 Row를 렌더해 Edit/Delete 표시가 서버 플래그와 일치하는지 단언하는 테스트. 역할 값을 바꿔도 렌더가 같으면 실패하도록 짠다.

