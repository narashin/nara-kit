name: nara-planning-eval
description: Evaluation suite for the planning-bundle skill that keeps unsourced numbers out of the body, surfaces conflicts between source documents before assembling derived docs, keeps interview PII out of the repo, and writes references as meaning instead of bare IDs.
skill: nara-planning
version: "1.0"
config:
  trials_per_task: 1
  timeout_seconds: 600
  parallel: false
  executor: mock
  model: claude-sonnet-4.6
metrics:
  - name: task_completion
    weight: 1.0
    threshold: 0.8
    description: Did the skill record evidence without personal data, label requested placeholder numbers as assumptions while leaving measured baselines open, flag documents that state the same fact differently instead of picking one, end with exactly one next step, and avoid bare ID references?
graders:
  - type: code
    name: real_run
    config:
      # Provenance gate, not a behavioural one: it asserts the graded output came
      # from a real skill run. Under `executor: mock` it fails every task by
      # construction -- that is the correct signal, because mock output grades the
      # eval's own description and fixture text, never the skill. Measurement goes
      # through `waza grade` on a real run; see CLAUDE.md.
      assertions:
        - "len(output) > 40"
        - "'Mock response for:' not in output"
tasks:
  - "tasks/*.yaml"
