  # iteration 2 baseline: kept PII out but asked no decision and routed nowhere
  interview-intake-001: |
    인터뷰를 환불 관리자 승인 PRD(`docs/product/refund-approval/prd.md`)에 근거로 넣었습니다. 다만 이 인터뷰는 PRD가 세운 문제를 받쳐 주지 않고 다른 문제를 가리키고 있어서, 문제 정의는 그대로 두고 맨 아래에 질문을 하나 남겼습니다.

    PRD의 문제는 "자동 환불 때문에 부정 환불이 생긴다"라는 가정입니다. 그런데 인터뷰에서는 부정 환불 이야기가 한 번도 나오지 않았습니다. 고객이 답답했던 건 지연이 아니라 환불이 "실패"로만 뜨고 이유가 안 보인 점이었고, 이유만 알려 주면 기다릴 수 있다고 했습니다. 그리고 승인 절차 때문에 며칠 걸리면 카드사에 이의제기하겠다고 했습니다. 승인을 넣으면 오히려 차지백이 늘 수 있다는 신호라서, 승인 대기 시간 상한을 열린 질문으로 올렸습니다. 코드도 같은 쪽을 가리킵니다. 지금 환불 상태는 요청됨, 환불됨, 실패 세 가지뿐이고 실패 사유를 담을 필드가 없습니다. 그래서 현재 구조로는 사유를 보여 주고 싶어도 보여 줄 데이터가 없습니다.

    PRD에서 바꾼 곳은 이렇습니다.
    - 커버리지의 "문제와 근거"는 **가정 상태를 유지**했습니다. 근거 칸에는 인터뷰 1건(표본 1명)이 부정 환불이 아닌 다른 문제를 가리킨다고 적었고, 필요한 것은 "부정 환불 데이터, 또는 문제 재정의 결정"으로 바꿨습니다.
    - "근거" 섹션을 새로 만들고 인터뷰 요약, 고객 발언 원문, 코드에서 확인한 사실, 표본 1명이라는 한계를 적었습니다. "다른 쇼핑몰은 단계별로 보여 준다"는 고객이 어디인지 기억하지 못해서 `[UNVERIFIED]`로 표시했습니다.
    - 열린 질문에 네 가지를 추가했습니다. 문제 정의, 승인 대기 시간 상한, 실패 사유 노출 여부와 문구, 단계별 진행 상태 표시를 이번 범위에 넣을지입니다.
    - 결정 로그는 건드리지 않았습니다. 이번에 결정된 건 없습니다.

    **참가자의 이름, 전화번호, 이메일은 일부러 옮기지 않았습니다.** PRD에는 "단골 고객 1명, 최근 한 달 환불 2건"으로만 적었습니다. 원본 메모에는 연락처가 그대로 있으니 저장소에 커밋하지 않는 게 좋겠습니다. 원본 파일은 수정하지 않았고, 커밋도 하지 않았습니다.

    문제 정의를 어떻게 할지 정해 주세요.
    1. 부정 환불 가정을 유지한다. 이 경우 부정 환불 실제 데이터를 먼저 구해야 합니다.
    2. 인터뷰가 가리키는 문제(실패 사유를 알 수 없고 진행 상태가 안 보임)로 바꾼다.
    3. 두 문제를 따로 세워서 함께 다룬다.

    1, 2, 3 중 하나로 답해 주세요.
  # iteration 2 baseline: placeholder tag instead of [가정], no status
  fill-numbers-001: |
    질문은 맨 아래에 하나 있어요. 그 전까지 PRD는 내일 공유할 수 있는 모양까지 채웠고, 대신 숫자는 "정해진 값"처럼 보이지 않게 처리했어요.

    숫자를 그냥 적당히 넣으면, 내일 읽는 사람은 문서에 적힌 숫자를 합의된 목표로 받아들여요. 그 숫자가 근거 없이 나온 거라는 사실은 문서 밖으로 새어 나가지 않고요. 그래서 숫자는 넣되, 본문에서 숫자마다 바로 옆에 `[제안값 · 미확정]`을 붙이고 문서 맨 위에도 공유용 안내를 한 줄 넣었어요. 결정 로그에는 숫자를 하나도 올리지 않았어요.

    제가 임의로 넣은 숫자는 아래 네 개가 전부예요. 공유 전에 이것만 훑어보면 돼요.

    - 승인 기준 금액: 100,000 이상. 코드의 환불 금액에 통화 정보가 없어서 통화 단위도 미정으로 적었어요.
    - 부정 환불 금액: 기준선 대비 50% 감소
    - 승인 처리 시간: 중앙값 24시간 이내
    - 승인 대상 비율(관리자 부하 가드레일): 전체 환불 요청의 10% 이하

    숫자 말고 나머지는 근거에서 채웠어요. 현재 동작은 코드로 확인했는데, 고객이 요청하면 결제 게이트웨이 환불이 즉시 실행되고 금액 분기도 사람 개입도 없어요. 이걸 바탕으로 문제의 현황, 가치 제안, KPI 계산식, 범위와 제외 항목, 승인 대기·반려 상태가 추가되는 흐름, 인수 기준 초안을 썼어요. 역할이 둘이고 승인이 있어서 정책 문서가 필요한 조건이라 `policy.md` 초안도 새로 만들었어요. 다만 "부정 환불이 실제로 생긴다"는 문제 자체는 여전히 근거가 없어서 가정 표시를 그대로 뒀고, 커버리지 표의 KPI와 범위 행도 확정으로 바꾸지 않았어요. 문서 상태도 drafting 그대로예요.

    수정·생성 파일:
    - `docs/product/refund-approval/prd.md` (수정)
    - `docs/product/refund-approval/policy.md` (신규)

    커밋은 하지 않았어요.

    승인 기준 금액과 KPI 목표치는 누가 확정하나요? 그리고 확정 전이라도 위 네 숫자를 "제안값" 표시를 단 채로 내일 공유해도 괜찮을까요? (결정자 이름만 알려주시면 열린 질문에 적어 둘게요)
  # iteration 3 skill run that missed the order-vs-refund amount conflict
  conflicting-sources-001: |
    화면 설계서를 만들었습니다 (applied).
    - 묶음: `docs/product/refund-approval/` · status: drafting (아직 기획 작성 중이라는 뜻입니다)
    - 만든 것: `screens.md` 한 장에 고객 화면 2개(주문 상세, 내 환불 목록)와 관리자 화면 2개(환불 승인 대기 목록, 환불 승인 상세)를 나눠 담았습니다. 화면마다 누가 보는지, 버튼을 누르면 무엇이 되는지, 막히면 무엇이 보이는지를 정책·흐름·인수 기준(개발이 "다 됐다"를 판단하는 조건)에서만 가져왔고, 정해지지 않은 문구와 빈 화면·오류 화면은 지어내지 않고 "미정"으로 적었습니다.
    - 검토 중 발견: 승인 버튼이 두 번 눌리면 지급이 두 번 나갈 수 있는데 처리 방법이 없고, 승인 뒤 지급이 실패했을 때 보여 줄 것과 고액 환불 요청 순간의 안내 여부도 정해지지 않았습니다. 이 셋은 기획 결정이라 PRD의 열린 질문으로 옮겼습니다. 그리고 "내 환불 목록"은 기존 화면인데 지금 환불 코드는 환불 건을 저장하지 않아, 목록이 어디서 데이터를 읽는지 개발 확인이 필요합니다(설계서 이슈 절).
    - 커버리지(기획에 꼭 있어야 할 정보 6가지를 채운 정도): 확정 5 · 가정 1 (부정 환불 지급액을 절반으로 줄인다는 목표치) · 미결 0
    - 개발로 넘기기 전에: 목표치를 확정하거나 "가정인 채로 진행"을 정해 주셔야 묶음을 개발 단계로 넘길 수 있습니다. 설계서 자체는 지금 디자인·개발과 공유해도 됩니다.
    - 다음: 위 세 가지와 거절 시 고객 문구·알림 방식은 화면 시안 전에 정할 선택이라 `/nara-grill`이 맡습니다. 정해지면 설계서를 다시 만들고, 시안이 필요하면 그다음 `/nara-design-studio`로 이어 갑니다.

    ```
    bundle: docs/product/refund-approval/
    status: drafting
    coverage: required 5/6 confirmed · assumed 1 · open 0 · n/a 0
    claims: body 3 (sourced 2 / assumed 1)
    decisions: 3 (sourced 3 / unsourced 0)
    next: nara-grill
    ```
    화면에 걸린 미정 결정 네 가지를 `/nara-grill`로 이어서 정할까요?
  # baseline: asked for the feature, never routed to nara-plan
  should-not-trigger-001: |
    어떤 기능을 쪼갤지부터 알려주셔야 진행할 수 있습니다. 지금 대화에는 "이 기능"이 가리키는 스펙도, 티켓도, 앞선 논의도 없습니다. 이 상태에서 추측으로 나누면 실제 기능과 맞지 않는 분할이 나옵니다.

    기능을 알려주시면 이런 기준으로 나누겠습니다. 각 PR은 따로 머지해도 빌드와 테스트가 깨지지 않아야 하고, 리뷰어가 한 번에 판단할 수 있는 크기여야 합니다. API만 담은 PR, UI만 담은 PR처럼 레이어별로 자르지 않습니다. 대신 사용자가 확인할 수 있는 동작 하나를 끝까지 관통하는 단위로 자르는 것이 기본입니다. 공용 타입이나 DB 마이그레이션처럼 여러 PR이 함께 기대는 기반 작업만 맨 앞에 별도 PR로 뺍니다. PR마다 목표, 포함 범위, 완료 기준, 먼저 머지되어야 하는 PR을 함께 적어 드리겠습니다.

    어떤 기능인가요? 아래 중 하나만 주셔도 됩니다.
    - 기능 설명 몇 줄 (무엇을, 누가, 왜 쓰는지)
    - Jira 티켓 키나 Confluence 스펙 링크
    - 관련 브랜치나 저장소 경로
