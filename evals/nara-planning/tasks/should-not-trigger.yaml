id: should-not-trigger-001
name: "Splitting a decided feature into PR-sized work routes to nara-plan"
description: |
  The feature is decided and the user wants code work units. That is nara-plan's
  job, so the skill should redirect instead of creating or updating a planning
  bundle.
tags:
  - routing
  - negative
inputs:
  prompt: "이 기능을 PR 단위 작업으로 쪼개줘"
  files: []
expected:
  output_contains:
    - "nara-plan"
  output_not_contains:
    - "bundle: docs/product"
  outcomes:
    - type: task_completed
