# Grader-validation table for nara-claim-audit.
#
# `right`: a fresh subagent running the current SKILL.md on each task prompt
# (2026-10-16). `wrong`: observed behaviour -- a fresh subagent with no skill
# loaded (normal tasks), or the skill applied to a request it should decline
# (should-not-trigger). Tools were off for side effects: outputs are dry runs.
#
# Run: tools/eval-fixture.py validate nara-claim-audit
# Expected: every task passes on right and fails on wrong.
right:
  basic-usage-001: |
    수치 감사 대기 (pending escalation): 대조할 기획서와 CSV 위치를 아직 받지 못했습니다.

    - 현재 작업 디렉터리에는 기획 md도 CSV 스냅샷도 없어서 `--doc`, `--data` 두 경로가 모두 비어 있습니다. CSV 위치는 추측해서 훑지 않는 것이 이 감사의 규칙이라 여기서 멈췄습니다.
    - 경로를 받으면 아래 명령을 읽기 전용으로 실행하고, 스크립트 출력을 그대로 근거로 씁니다. 값을 제가 다시 계산하지 않습니다.
      ```bash
      python3 <skill>/assets/audit.py --doc <spec>.md --data <csv-dir> --json
      ```
    - 판정은 마커(`<!-- src: <file>.csv | count rows where ... -->`)가 달린 수치에만 나오며 match / mismatch / mapping_failure / syntax_error / intentional 로 갈립니다. mismatch는 문서가 틀렸을 수도, CSV가 낡았을 수도 있어서 두 가능성을 함께 보여드리고, 결론은 그 CSV 스냅샷(mtime 함께 표기) 기준으로만 냅니다.
    - 문서에 마커가 하나도 없으면 자동 판정 대신 `--bootstrap`으로 후보 수치와 CSV 힌트만 제안합니다.
    - artifact: 없음 (아직 실행 전) · side effects: 없음

    → ESCALATE: 감사할 기획서 md 경로와 CSV 스냅샷 디렉터리 경로를 알려주세요. (예: `docs/plan/spec-x.md`, `data/snapshots/`)
  edge-case-unmapped-001: |
    수치 감사 대기 (pending escalation): 감사 대상 문서와 CSV 디렉터리가 지정되지 않았습니다.

    - 작업 디렉터리에 기획 md와 CSV가 없어서 `audit.py`를 돌릴 입력이 없습니다. `--data` 없이 CSV 위치를 추측하지 않는 것이 규칙이라 실행하지 않았습니다.
    - 경로를 주시면 읽기 전용으로 이렇게 실행합니다.
      ```bash
      python3 <skill>/assets/audit.py --doc <spec>.md --data <csv-dir>
      ```
    - 마커가 가리키는 컬럼이 CSV 헤더에 없거나 파일이 없거나 필터 결과가 0행이면, 그 주장은 0으로 세지 않고 `mapping_failure`로 격리하면서 실제 헤더 목록을 함께 보여드립니다. 그 값은 교체 대상에서도 빠지고, 나머지 주장은 계속 판정합니다.
    - artifact: 없음 (실행 전) · side effects: 없음

    → ESCALATE: 감사할 기획서 md 경로와 CSV 스냅샷 디렉터리 경로를 알려주세요.
  should-not-trigger-001: |
    이 요청은 수치 감사가 아닙니다 (skipped).

    - 이 스킬은 기획 문서 속 수치 주장을 CSV 스냅샷과 대조하는 일만 합니다. "요구사항 대비 구현이 얼마나 됐는지"는 `docs/requirements.md`와 코드베이스를 비교해 점수를 내는 갭 분석의 몫입니다.
    - 실행한 것: 없음 · artifact: 없음 · side effects: 없음
    - next: `/nara-gap` (요구사항 문서가 아직 없으면 먼저 `/nara-ac-draft`)
wrong:
  basic-usage-001: |
    기획서 수치를 데이터와 대조하려면 두 가지가 필요한데, 지금 작업 디렉터리에는 둘 다 보이지 않습니다.

    1. 대조할 기획서 파일 (markdown, 문서 링크, 또는 본문 붙여넣기)
    2. 비교 기준이 될 데이터 (CSV, 엑셀, 쿼리 결과, 대시보드 수치 등)

    둘을 주시면 이렇게 진행하겠습니다. 먼저 기획서에서 수치가 들어간 문장을 모두 뽑아 목록으로 만들고, 각 수치가 데이터의 어떤 값에 해당하는지 짝을 지은 다음, 실제 값을 계산해서 일치·불일치를 표로 정리합니다. 데이터에서 근거를 찾을 수 없는 수치는 따로 표시해 두고 어떤 데이터가 더 있으면 확인 가능한지 같이 적겠습니다.

    결과 예시는 다음과 같은 모양이 됩니다.

    | 문서 위치 | 문서 수치 | 데이터 값 | 판정 | 비고 |
    |---|---|---|---|---|
    | 2장 첫 문단 | 활성 사용자 1,200명 | 1,184명 | 불일치 | 반올림 표기인지 확인 필요 |
    | 3장 표 | 전환율 4.2% | 4.2% | 일치 | |

    기획서와 데이터 파일 경로를 알려주시거나 내용을 붙여넣어 주세요.
  edge-case-unmapped-001: |
    수치 감사를 시작하려면 대상이 있어야 하는데, 현재 프로젝트에는 감사할 문서나 데이터 파일이 없습니다.

    어떤 걸 감사하길 원하시는지 알려주세요.

    - 문서 속 숫자가 실제 데이터와 맞는지 확인하는 것이라면: 문서 파일과 원본 데이터(CSV, 엑셀, 쿼리 결과 등)
    - 보고서 내부 수치끼리 앞뒤가 맞는지(합계, 비율, 증감률) 확인하는 것이라면: 보고서 본문만 있어도 됩니다
    - 코드나 설정에 박힌 숫자(임계값, 한도 등)를 점검하는 것이라면: 해당 파일 경로

    자료를 주시면 수치마다 출처와 실측값, 일치 여부를 표로 정리해 드리고, 근거를 확인할 수 없는 수치는 따로 모아 보여드리겠습니다.
  should-not-trigger-001: |
    수치 감사를 진행하려면 대상 기획 문서와 CSV 스냅샷 디렉터리가 필요합니다. 현재 프로젝트에서 둘 다 지정되지 않아 감사를 실행하지 않고 멈췄습니다.

    실행할 명령은 다음과 같습니다 (읽기 전용, `--apply` 없음).

    ```bash
    python3 <skill>/assets/audit.py --doc <spec>.md --data <csv-dir>
    ```

    - 문서: 미지정 (작업 디렉터리에 기획 md 없음)
    - CSV: 미지정. CSV 위치는 추측해서 훑지 않습니다
    - 판정: 실행 전이라 없음
    - 상태: skipped

    요구사항 문서의 수치 주장에는 `<!-- src: users.csv | count rows where status=active -->` 같은 마커가 달려 있어야 스크립트가 대조할 수 있습니다. 마커가 없는 문서라면 `--bootstrap`으로 후보 수치부터 뽑을 수 있습니다.

    → ESCALATE: 감사할 기획 문서(`--doc`) 경로와 비교할 CSV 디렉터리(`--data`) 경로를 알려주세요.
