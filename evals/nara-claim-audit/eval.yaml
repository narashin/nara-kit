name: nara-claim-audit-eval
description: Evaluation suite for numeric claim auditing against CSV snapshots.
skill: nara-claim-audit
version: "1.0"
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: claude-sonnet-4.6
metrics:
  - name: task_completion
    weight: 1.0
    threshold: 0.8
    description: Did the skill run the audit script rather than computing values itself, classify each claim mechanically, and refuse to guess at unmapped or ungrammatical markers?
graders:
  - type: code
    name: real_run
    config:
      # Provenance gate, not a behavioural one: it asserts the graded output came
      # from a real skill run. Under `executor: mock` it fails every task by
      # construction -- that is the correct signal, because mock output grades the
      # eval's own description and fixture text, never the skill. Measurement goes
      # through `waza grade` on a real run; see CLAUDE.md.
      assertions:
        - "len(output) > 40"
        - "'Mock response for:' not in output"
  - type: text
    name: audit_contract
    config:
      regex_match:
        - "(?i)(match|mismatch|mapping_failure|syntax_error|판정)"
        - "(?i)(csv|mtime|스냅샷|snapshot)"
tasks:
  - "tasks/*.yaml"
