  basic-usage-001: |
    `src/api/orders.ts` 파일을 찾을 수 없어서, 일반적인 주문 API를 가정하고 테스트 시나리오를 정리했어요. 실제 코드와 다를 수 있으니 파일을 공유해 주시면 맞춰서 다듬을게요.

    **주문 생성 (POST /orders)**
    1. 유효한 상품 ID와 수량으로 주문하면 201과 주문 ID가 반환된다
    2. 수량이 0 이하이면 400 에러가 반환된다
    3. 존재하지 않는 상품 ID면 404가 반환된다
    4. 재고보다 많은 수량을 주문하면 409(재고 부족)가 반환된다
    5. 인증 토큰이 없으면 401이 반환된다

    **주문 조회 (GET /orders/:id)**
    6. 본인 주문을 조회하면 주문 상세가 반환된다
    7. 다른 사용자의 주문을 조회하면 403이 반환된다
    8. 없는 주문 ID면 404가 반환된다

    **주문 목록 (GET /orders)**
    9. 페이지네이션 파라미터(page, size)에 맞게 결과가 반환된다
    10. 주문이 없는 사용자는 빈 배열을 받는다

    **주문 취소 (DELETE /orders/:id 또는 PATCH status)**
    11. 결제 전 주문은 취소된다
    12. 이미 배송된 주문은 취소가 거부된다
    13. 같은 주문을 두 번 취소하면 멱등하게 처리되거나 409가 반환된다

    **기타**
    14. 동시에 같은 상품을 주문할 때 재고가 음수가 되지 않는다
    15. DB 오류 시 500과 함께 부분 저장 없이 롤백된다

    원하시면 이걸 Jest/Vitest 테스트 코드로도 바로 만들어 드릴게요.
  edge-case-001: |
    `recommendation-engine.ts`에 대한 테스트 코드를 작성했습니다. 기존 테스트가 없으니 새 파일로 만들었습니다.

    ```ts
    // src/services/recommendation-engine.test.ts
    import { recommend, Item } from "./recommendation-engine";

    const items: Item[] = [
      { id: "a", category: "book", score: 10 },
      { id: "b", category: "music", score: 12 },
      { id: "c", category: "book", score: 9 },
    ];

    describe("recommend", () => {
      it("returns empty array when limit is 0", () => {
        expect(recommend(items, { viewed: [], purchased: [] }, 0)).toEqual([]);
      });

      it("excludes viewed items", () => {
        const res = recommend(items, { viewed: ["a"], purchased: [] });
        expect(res.map((i) => i.id)).not.toContain("a");
      });

      it("sorts by score", () => {
        const res = recommend(items, { viewed: [], purchased: [] });
        expect(res[0].id).toBe("b");
      });

      it("respects limit", () => {
        expect(recommend(items, { viewed: [], purchased: [] }, 2)).toHaveLength(2);
      });
    });
    ```

    `npx jest src/services/recommendation-engine.test.ts`로 실행해 보세요. 기본 동작은 모두 커버됩니다.
