# Grader-validation table for nara-roadmap.
#
# `right`: a fresh subagent running the current SKILL.md on each task prompt
# (2026-10-16). `wrong`: observed behaviour -- a fresh subagent with no skill
# loaded (normal tasks), or the skill applied to a request it should decline
# (should-not-trigger). Tools were off for side effects: outputs are dry runs.
#
# Run: tools/eval-fixture.py validate nara-roadmap
# Expected: every task passes on right and fails on wrong.
right:
  basic-usage-001: |
    메모 내용을 먼저 되짚겠습니다. acme-sre 팀은 장애가 나면 회고 문서를 쓰기로 되어 있지만, 실제로는 절반쯤만 쓰이고 쓴 것도 후속 조치가 흐지부지된다는 이야기가 나왔습니다. 회고 템플릿은 위키에 하나 있습니다.

    메모에 있지만 출처나 확정한 사람이 없는 것은 이렇게 두겠습니다.
    - "절반쯤만 쓴다": [UNVERIFIED: 들은 말이고 실제로 센 수치가 아님]
    - "12월까지는 정리돼야 한다": [UNVERIFIED: 누가 정한 마감인지 모름]
    - 팀이 쓸 수 있는 시간: [UNVERIFIED: 아무도 말하지 않음]
    - 위키 템플릿의 마지막 수정 시점: [UNVERIFIED: 모름]

    선택지 비교(템플릿 개선, 점검 절차 도입, 도구 도입, 보류 등)와 마일스톤은 Q1, Q4, Q5 답에 걸려 있어서 이번 라운드에서는 묻지 않습니다. 원하는 변화와 쓸 수 있는 시간, 마감이 정해져야 안을 실질적으로 비교할 수 있기 때문입니다.

    Q1. 이번에 달라져야 하는 것은 무엇인가요?
    - A. 회고 작성률을 올린다
    - B. 쓴 회고의 후속 조치가 끝까지 추적되게 한다
    - C. 둘 다
    - 권고: C. 메모에 나온 불만이 두 가지(작성 누락, 후속 조치 흐지부지)이고, 회고를 써도 후속 조치가 사라지면 작성률만 올린 효과가 작기 때문입니다.

    Q2. 이 일은 누군가의 요청인가요, 직접 제안하시는 탐색인가요?
    - A. 이해관계자 요청(팀장 등, 누구인지 함께 적어 주세요)
    - B. 직접 제안하는 탐색
    - C. 모름

    Q3. 이 변화로 혜택을 보는 사람은 누구인가요?
    - A. 당직자(같은 장애를 반복해서 겪지 않음)
    - B. 팀장이나 관리자(후속 조치 현황 파악)
    - C. 둘 다
    - D. 그 밖의 사람(적어 주세요)

    Q4. "12월" 마감은 어떻게 다룰까요?
    - A. 누가 정했는지 확인해서 고정 마감으로 둔다
    - B. 마감 없음으로 둔다
    - C. 모름(미확인으로 두고 진행)
    - 권고: A 또는 B. 근거 없는 마감에 맞추면 범위를 잘못 자를 수 있어서, 확인되기 전까지는 계획에 반영하지 않는 편이 안전합니다.

    Q5. 이 일에 쓸 수 있는 시간은 어느 정도인가요?
    - A. 한 사람이 주당 몇 시간 이하
    - B. 한 사람이 주당 반나절 이상
    - C. 여러 사람이 나눠서
    - D. 모름

    Q6. 권한은 어디까지 있나요?
    - A. 위키 템플릿은 팀원 누구나 고칠 수 있다
    - B. 후속 조치 티켓 규칙(보드, 필수 필드 등)을 바꾸려면 승인이 필요하다(누구 승인인지 적어 주세요)
    - C. 둘 다 모름
    - 해당하는 것을 모두 골라 주세요.

    Q7. 새 도구(회고 관리 도구, 자동화 등) 도입을 선택지에 넣을까요?
    - A. 넣는다
    - B. 넣지 않는다(기존 위키와 티켓 안에서 해결)
    - C. 비교해 보고 정한다

    답은 `Q1 C, Q2 A 팀장, ...`처럼 번호와 선택만 주셔도 되고, 모르면 "모름"이라고 적어 주세요.
  draft-roadmap-001: |
    **목표와 결정 제약**

    장애 회고 작성률을 올리고, 회고에서 나온 후속 조치가 끝까지 추적되게 합니다. 혜택은 당직자(같은 장애를 다시 겪지 않음)와 팀장(후속 조치 현황 파악)이 봅니다. 근거는 팀장의 요청입니다(요청, 탐색 아님).

    | 제약 | 상태 | 내용 |
    |---|---|---|
    | 마감 | 고정 | 없음. 앞서 들은 "12월"은 확인 결과 근거가 없었음 |
    | 역량 | 미확인 | 한 사람이 주당 반나절 정도 [UNVERIFIED: 확정 전] |
    | 권한 (템플릿, 위키) | 고정 | 팀원 누구나 수정 가능 |
    | 권한 (PROJ 보드에 후속 조치 티켓 강제) | 협상 가능 | 팀장 승인 필요 |
    | 도구 | 고정 | 새 도구는 도입하지 않음 |
    | 기존 작업 | 고정 | 위키 템플릿 하나, 후속 조치는 PROJ-123 같은 티켓으로 흩어져 있음 |
    | 유지보수 | 미확인 | 월 1회 점검을 계속할 담당 [UNVERIFIED: 담당 미정] |

    **권고 방향**

    기존 위키 템플릿을 개선하고, 월 1회 후속 조치 점검으로 흩어진 티켓을 모아 봅니다. 새 도구 없이 이미 있는 위키와 티켓 안에서 끝나고, 권한도 지금 있는 범위(템플릿 수정)로 시작할 수 있기 때문입니다.

    범위 상태:
    - 합의: 템플릿 개선, 월 1회 후속 조치 점검
    - 권고: 템플릿 개정 전에 현재 작성률과 후속 조치 상태를 한 번 세어 기준선을 둔다(나중에 "작성률이 올랐다"를 관찰로 말하려면 비교 기준이 필요합니다), 회고 문서 안에 후속 조치 목록과 티켓 링크를 적는 칸을 둔다(월 점검이 한 곳에서 출발할 수 있게)
    - 후보: PROJ 보드에 후속 조치 티켓 규칙을 강제한다

    보류, 제외한 대안:
    - 새 도구 도입: 제외 · 하지 않기로 정하셨습니다
    - PROJ 보드 강제: 보류 · 팀장 승인이 필요하고, 월 점검만으로 추적이 되는지 먼저 봐야 필요 여부를 판단할 수 있습니다

    **마일스톤**

    M1 기준선과 템플릿 개정
    - 결과: 회고 작성자가 후속 조치를 티켓 링크와 함께 한 곳에 적고, 팀은 개선 전 상태를 숫자로 안다
    - 범위(포함, 제외): 포함 최근 장애 대비 회고 문서 유무와 후속 조치 티켓 상태 집계 1회, 위키 템플릿에 후속 조치 칸 추가 · 제외 새 도구, PROJ 보드 규칙 변경
    - 완료 증거: 기준선 집계 결과가 위키에 기록되어 있고, 개정 이후 처음 나온 장애 회고가 개정 템플릿으로 작성되어 후속 조치 칸이 채워져 있다
    - 의존성: 최근 장애 목록을 어디서 볼지 [UNVERIFIED: 장애 목록의 출처 미확인]

    M2 첫 월간 후속 조치 점검
    - 결과: 흩어진 후속 조치 티켓의 상태를 한 번에 볼 수 있다
    - 범위(포함, 제외): 포함 개정 템플릿의 후속 조치 칸과 기존 PROJ 티켓을 모아 상태 확인 1회 · 제외 티켓 규칙 강제
    - 완료 증거: 첫 점검 결과(후속 조치별 상태)가 위키에 기록되어 팀장이 볼 수 있다
    - 의존성: M1, 점검 담당 결정

    M3 PROJ 보드 후속 조치 규칙 강제 (조건부)
    월 점검 결과에서 티켓이 흩어져 있어 추적이 여전히 안 된다고 나오면, 팀장 승인을 받아 진행합니다. 범위는 그때 정합니다. 점검 몇 회를 보고 판단할지는 정하지 않았습니다.

    **반복 운영**

    - 월 1회 후속 조치 점검: 매월 · 담당 미정 [UNVERIFIED: 담당 미정]

    **열린 가정과 결정**

    - 월 1회 점검을 누가 맡을지: 누가 정할지도 아직 정해지지 않았습니다
    - 주당 반나절 역량: 확정이 아니라서, 줄어들면 M1의 기준선 집계 범위를 좁혀야 할 수 있습니다
    - 최근 장애 목록의 출처: M1 기준선 집계가 여기에 달려 있습니다
    - 작성률 목표 수치: 정한 적이 없어 두지 않았습니다
    - M3 진행 여부: 월 점검 결과와 팀장 승인에 달려 있습니다

    **다음 행동**

    M1 기준선 집계를 위해 최근 장애 목록을 어디서 볼지 정합니다.

    로드맵 초안 완료 (recorded only).
    - 방향: 기존 위키 템플릿 개선 + 월 1회 후속 조치 점검, 새 도구 없음 · 범위: 후보 1 / 권고 2 / 합의 2
    - 마일스톤 3 · 반복 운영 1 · UNVERIFIED 3
    - artifact: chat-only (저장하려면 말씀해 주세요. `docs/plan/roadmap-postmortem-followup.md`에 씁니다)
    - next: 최근 장애 목록의 출처 정하기
  should-not-trigger-001: |
    이 요청은 로드맵이 아니라 작업 분할입니다. nara-roadmap은 방향이 아직 없는 상황에서 추진 방향과 마일스톤을 잡는 스킬이라, 이미 정한 기능을 PR 단위로 쪼개는 일은 하지 않습니다.

    `/nara-plan`(Codex에서는 `$nara-plan`)으로 요청해 주세요. 기능 스펙이나 `docs/requirements.md`를 주시면 독립적으로 검증할 수 있는 작업 단위로 나눠 `docs/plan.md`에 씁니다.
wrong:
  basic-usage-001: |
    메모 내용을 바탕으로 12월 완료를 목표로 한 추진 로드맵을 잡아봤습니다.

    ## 목표
    - 장애 회고 작성률 100% 달성
    - 후속 조치 완료율 90% 이상

    ## 단계별 로드맵

    ### 1단계 (10월 말까지): 현황 파악
    - 최근 6개월 장애 목록과 회고 작성 여부 집계
    - 후속 조치 티켓 완료율 측정
    - 팀원 대상 간단한 설문으로 회고를 안 쓰는 이유 파악
    - 담당: 팀 내 SRE 리드

    ### 2단계 (11월 중순까지): 템플릿 및 프로세스 개선
    - 위키 회고 템플릿을 최신화 (타임라인, 원인, 영향, 후속 조치 섹션 필수화)
    - 장애 종료 후 48시간 안에 회고 초안 작성을 규칙으로 정함
    - 후속 조치는 모두 Jira 티켓으로 등록하고 "postmortem" 라벨 부여

    ### 3단계 (11월 말까지): 추적 체계 구축
    - 후속 조치 대시보드 구성 (라벨 기반 필터)
    - 주간 회의에서 미완료 후속 조치 5분 리뷰

    ### 4단계 (12월): 정착 및 평가
    - 작성률·완료율 재측정 후 목표 달성 여부 확인
    - 회고 문화 개선 결과를 팀에 공유

    ## 필요 리소스
    - SRE 리드 1명, 주 4시간
    - 팀원 전원 회고 작성 참여

    ## 리스크
    - 장애가 몰리는 시기에는 회고 작성이 밀릴 수 있음 → 당직 다음 날 회고 시간 확보
    - 템플릿이 너무 무거우면 오히려 작성률이 떨어질 수 있음 → 필수 항목 최소화

    이 일정대로라면 12월까지 충분히 정리될 수 있을 것 같습니다. 필요하시면 Jira 에픽과 하위 티켓 구성도 만들어 드릴게요.
  draft-roadmap-001: |
    인터뷰 내용을 바탕으로 로드맵 초안을 정리했습니다.

    # 장애 회고 문화 개선 로드맵

    ## 목표
    - 장애 회고 작성률을 현재 약 50%에서 90%로 끌어올린다.
    - 후속 조치 완료율을 3개월 안에 80% 이상으로 만든다.

    ## Phase 1: 템플릿 개선 (1~2주차)
    - 위키 회고 템플릿을 간소화하고 후속 조치 섹션을 필수로 추가
    - 작성 예시 문서 1건 첨부
    - 담당: SRE 팀원 1명 (주당 반나절)

    ## Phase 2: 후속 조치 추적 (3~4주차)
    - 모든 후속 조치를 PROJ 보드에 티켓으로 등록하도록 규칙화
    - 티켓에 "postmortem" 라벨 부여 및 대시보드 구성

    ## Phase 3: 월간 점검 운영 (5주차~)
    - 매월 첫째 주 월요일에 후속 조치 점검 회의 진행
    - 점검 담당은 당직 로테이션 순서대로 돌아가며 맡음

    ## 일정 요약
    | 단계 | 기간 | 산출물 |
    |---|---|---|
    | Phase 1 | 10월 말 | 개선된 템플릿 |
    | Phase 2 | 11월 중순 | PROJ 보드 라벨 규칙, 대시보드 |
    | Phase 3 | 11월 말~ | 월간 점검 회의록 |

    ## 리스크
    - 주당 반나절 역량이 부족할 경우 Phase 2가 지연될 수 있음
    - 장애가 잦은 달에는 점검이 밀릴 수 있음

    이대로 진행하시면 연말 전에 정착시킬 수 있을 것으로 보입니다.
  should-not-trigger-001: |
    추진 방향을 같이 잡아보겠습니다. 아직 어떤 기능인지 대화에 나온 내용이 없어서, 먼저 하나만 여쭤볼게요.

    Q1. 다루려는 기능이나 상황이 무엇인가요? 무엇이 달라져야 하는지, 누가 혜택을 보는지 한두 줄로 알려 주시면 그 다음에 제약(역량, 마감, 권한, 기존 작업)과 선택지를 묻고 마일스톤으로 나눠 드리겠습니다.

    자유롭게 한두 줄로 답해 주세요.
