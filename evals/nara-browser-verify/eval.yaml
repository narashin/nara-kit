name: nara-browser-verify-eval
description: Evaluation suite for headless browser acceptance-criteria verification.
skill: nara-browser-verify
version: "1.0"
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: claude-sonnet-4.6
metrics:
  - name: task_completion
    weight: 1.0
    threshold: 0.8
    description: Did the skill judge browser-visible criteria per axis against real runtime evidence, refuse to upgrade unverified axes to Pass, and end with exactly one terminal status token?
graders:
  - type: code
    name: real_run
    config:
      # Provenance gate, not a behavioural one: it asserts the graded output came
      # from a real skill run. Under `executor: mock` it fails every task by
      # construction -- that is the correct signal, because mock output grades the
      # eval's own description and fixture text, never the skill. Measurement goes
      # through `waza grade` on a real run; see CLAUDE.md.
      assertions:
        - "len(output) > 40"
        - "'Mock response for:' not in output"
  - type: text
    name: verify_contract
    config:
      regex_match:
        - "(?i)(Status:\\s*(Pass|Fail|Blocked|Unverifiable)|축 판정|axis)"
        - "(?i)(unverifiable|evidence|증거|screenshot|network)"
tasks:
  - "tasks/*.yaml"
