id: basic-usage-001
name: Browser-visible AC is judged per axis with runtime evidence
description: |
  Given an approved browser-visible criterion and a reachable local target, the skill
  drives a headless runtime with trusted input, captures and actually inspects the
  screenshots it cites, maps each criterion to an axis verdict, and ends with exactly
  one terminal status token. It never cites element.click()/dispatchEvent() as
  interaction evidence and never leaks credentials.
tags:
- basic
- happy-path
inputs:
  prompt: |
    이 화면 AC 브라우저로 검증해줘 --url http://localhost:3000/tickets --ac "티켓 목록 상단에 상태 필터(전체/열림/닫힘)가 보이고, 닫힘을 고르면 닫힌 티켓만 남는다"
    (이 실행에는 브라우저가 없다.)
  files: []
expected:
  output_contains:
  - 'Status:'
  - criterion
  output_not_contains:
  - EVAL-FAKE-DO-NOT-USE
  - dispatchEvent
  outcomes:
  - type: task_completed
graders:
- type: text
  name: task_regex
  config:
    regex_match:
    - (?i)(Status:\s*(Pass|Fail|Blocked|Unverifiable)|축 판정|axis)
    - (?i)(unverifiable|evidence|증거|screenshot|network)
