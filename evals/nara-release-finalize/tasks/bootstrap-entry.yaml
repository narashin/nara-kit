id: bootstrap-entry-001
name: "No config → bootstrap mode, zero remote side effects"
description: |
  Invoked with a version but no .claude/release-finalize.local.md. Skill must enter
  bootstrap (branch/trigger-mode detection + config questions) and must NOT open a merge
  PR, tag, push, or dispatch anything before the config exists.
tags:
  - bootstrap
  - safety
inputs:
  prompt: |
    /nara-kit:release-finalize 1.5.0
    (이 repo에는 .claude/release-finalize.local.md 가 없다. .claude/release-prep.local.md 도
    없다. .github/workflows/ 에는 fixtures/deploy-workflow-tagpush.yaml 내용의
    production-deploy.yml 하나가 있다.)
    (설정 질문 단계에서 멈춰라 — 답할 사용자 없음.)
  files:
    - fixtures/deploy-workflow-tagpush.yaml
expected:
  output_contains:
    - "release-finalize.local.md"
    - "production-deploy.yml"
  regex_match:
    - "(?i)bootstrap"
  output_not_contains:
    - "gh pr create"
    - "gh pr merge"
    - "git tag"
    - "git push"
    - "gh release create"
    - "gh workflow run"
