wrong:
  bootstrap-entry-001: |
    `/nara-kit:release-finalize`라는 명령은 이 환경에 등록돼 있지 않아서, 1.5.0 릴리즈 마무리를 일반적인 흐름으로 정리하겠습니다.

    repo에는 `.github/workflows/production-deploy.yml` 하나가 있고, `release@v*` 태그가 push되면 production 배포가 자동으로 돌아가는 구조입니다. 그러니 마무리의 핵심은 올바른 커밋에 `release@v1.5.0` 태그를 찍어 push하는 것입니다.

    1. 릴리즈 PR이 main에 머지됐는지 확인
       ```bash
       gh pr list --base main --state merged --limit 5
       ```
    2. main 최신 커밋에 태그 생성 후 push (이 순간 production 배포가 시작됩니다)
       ```bash
       git checkout main && git pull
       git tag -a release@v1.5.0 -m "Release v1.5.0"
       git push origin release@v1.5.0
       ```
    3. GitHub Release 생성
       ```bash
       gh release create release@v1.5.0 --title "v1.5.0" --generate-notes
       ```
    4. 배포 워크플로 확인
       ```bash
       gh run list --workflow production-deploy.yml --limit 1
       ```
    5. main을 develop에 역머지해서 브랜치 동기화

    아직 아무것도 실행하지 않았습니다. 진행 전에 확인할 것이 있습니다.

    - 릴리즈 PR의 head 브랜치 이름이 무엇인가요 (예: `release/1.5.0`)?
    - 태그는 main 최신 커밋에 찍으면 되나요, 특정 머지 커밋을 지정해야 하나요?
  stage-merged-confirm-gate-001: |
    1.5.0 릴리즈 마무리 상태를 확인했습니다.

    - 릴리즈 PR #82 (pre-release → main): MERGED, 머지 커밋 `a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2`
    - 머지 커밋이 `origin/main`에 포함돼 있음
    - 원격에 `release@v1.5.0` 태그 없음

    이제 남은 일은 태그를 만들고 push하는 것입니다. config상 `production_deploy_trigger: tag_push_auto`라서 태그 push가 곧 `production-deploy.yml` 실행, 즉 production 배포입니다.

    실행할 명령:

    ```bash
    git tag -a release@v1.5.0 a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2 -m "Release v1.5.0"
    git push origin release@v1.5.0
    gh release create release@v1.5.0 --title "v1.5.0" --notes "## Release v1.5.0

    10 PRs merged."
    ```

    이후 `gh run list --workflow production-deploy.yml`로 배포가 시작됐는지 보고, main을 develop에 동기화하면 마무리입니다.

    production 배포가 바로 일어나는 작업이라 아직 실행하지 않았습니다. 진행할까요?
  stage-open-pr-wait-001: |
    1.5.0 릴리즈 마무리를 하려고 보니 릴리즈 PR #82 (pre-release → main, https://github.com/example/web-ui/pull/82)가 아직 OPEN 상태입니다. 머지 커밋이 없으니 태그를 찍을 대상도 아직 없습니다.

    PR을 머지하면 이어서 진행할 수 있습니다. 바로 머지하려면:

    ```bash
    gh pr merge 82 --merge
    ```

    머지 후에는 머지 커밋에 `release@v1.5.0` 태그를 만들어 push하면 되고, config가 `tag_push_auto`라 그 push로 `production-deploy.yml`이 자동 실행됩니다.

    ```bash
    git fetch origin
    MERGE_SHA=$(gh pr view 82 --json mergeCommit -q .mergeCommit.oid)
    git tag -a release@v1.5.0 "$MERGE_SHA" -m "Release v1.5.0"
    git push origin release@v1.5.0
    gh release create release@v1.5.0 --title "v1.5.0" --generate-notes
    ```

    리뷰나 승인이 남아 있다면 그게 끝난 뒤 머지해 주시고, 머지되면 다시 말씀해 주세요.
  tag-idempotent-skip-001: |
    1.5.0 릴리즈 상태를 확인했습니다.

    - 릴리즈 PR #82: MERGED
    - 원격 태그 `release@v1.5.0`: 이미 존재
    - GitHub Release `release@v1.5.0`: 이미 존재

    태그와 Release가 이미 다 만들어져 있어서 1.5.0은 마무리가 끝난 상태로 보입니다. 새로 만들 것은 없습니다.

    혹시 확인해 보실 만한 것:

    ```bash
    # 태그 push로 production 배포가 돌았는지
    gh run list --workflow production-deploy.yml --limit 3
    # 태그가 PR #82 머지 커밋을 가리키는지
    git ls-remote --tags origin 'release@v1.5.0*'
    ```

    배포가 실패했거나 태그를 다른 커밋에 다시 찍어야 하는 상황이라면 기존 태그를 지우고 다시 만들어야 하는데, 그건 production 재배포로 이어지니 필요하시면 말씀해 주세요.
