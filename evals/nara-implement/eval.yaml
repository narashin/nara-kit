name: nara-implement-eval
description: Evaluation suite for gated code-implementation skill (strategy approval, TDD option, no auto-commit).
skill: nara-implement
version: "1.0"
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: claude-sonnet-4.6
metrics:
  - name: task_completion
    weight: 1.0
    threshold: 0.8
    description: Did the skill propose a strategy before editing and stop at staged without committing?
graders:
  - type: code
    name: real_run
    config:
      # Provenance gate, not a behavioural one: it asserts the graded output came
      # from a real skill run. Under `executor: mock` it fails every task by
      # construction -- that is the correct signal, because mock output grades the
      # eval's own description and fixture text, never the skill. Measurement goes
      # through `waza grade` on a real run; see CLAUDE.md.
      assertions:
        - "len(output) > 40"
        - "'Mock response for:' not in output"
  - type: text
    name: implement_contract
    config:
      regex_match:
        - "(?i)(전략|strategy|direct|delegated)"
        - "(?i)(Pass|Fail|Blocked|Unverifiable)"
tasks:
  - "tasks/*.yaml"
