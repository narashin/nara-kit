  routing-001: |
    Here are three layout options for a support-ticket list. Each takes a different angle on how agents scan and triage tickets.

    **Option A: Classic table**
    A dense, sortable table: ID, subject, requester, priority, status, assignee, last updated. Filters (status, priority, assignee) sit in a bar above the table, with a search box on the right. Best for teams that triage a high volume and want everything in one glance.

    **Option B: Split view (inbox style)**
    A narrow ticket list on the left (subject, requester, a status dot, time) and the selected ticket's conversation on the right. Like an email client. Best when agents work through tickets one by one and reply often.

    **Option C: Kanban board**
    Columns for New, Open, Pending, and Resolved, with ticket cards (subject, priority tag, assignee avatar) that you drag between columns. Best for small teams that think about tickets as a workflow rather than a queue.

    Quick sketch of Option A to make it concrete:

    ```
    +---------------------------------------------------------------+
    | Tickets                                  [Search...] [+ New]  |
    | [Status v] [Priority v] [Assignee v]                          |
    +------+---------------------------+----------+------+----------+
    | ID   | Subject                   | Priority | Stat | Updated  |
    +------+---------------------------+----------+------+----------+
    | 1042 | Cannot reset password     | High     | Open | 2h ago   |
    | 1039 | Invoice wrong amount      | Medium   | Pend | 5h ago   |
    | 1031 | Dark mode request         | Low      | Done | 1d ago   |
    +------+---------------------------+----------+------+----------+
    ```

    My recommendation is Option A for most support teams, with Option B as a strong second if your agents spend most of their time replying. Tell me which one you like and I'll build it out as HTML.
  should-not-trigger-001: |
    Before I build anything, I need to know which design system this project uses.

    I checked `.claude/overrides/nara-design-studio.md` and it does not exist, so this project has no recorded pack yet. I also found no `defaultPackPath` in `references/settings.local.md` and no packs under `~/.claude/design-packs/`, so there is no pre-selected option.

    How should I set up the pack for the architecture-decision screen?

    - (a) Build a pack from a design system you already have, using `nara-design-pack-builder`. The source can be a component codebase, an npm package, a Storybook, or a CSS/token bundle.
    - (b) Convert a DESIGN.md: `python3 assets/runtime/designmd_to_pack.py --design <DESIGN.md> --out <packDir>`
    - (c) Point me at an existing pack path.
    - (d) Start a new design system from the bundled starter pack. It is T1 and token-only, and it would be greenfield with no starting-point IA.

    Once the pack is set, I will interview you until nothing in the brief is ambiguous. The first batch of questions:

    1. Screen type: should the RFC be a document-style detail page, or a multi-step flow (draft → review → publish)?
    2. Content regions: which sections must appear (Context, Alternatives, Decision, Consequences), and does a comparison table for the alternatives belong on the screen?
    3. Primary action: is "Publish to Confluence" the one main CTA? What happens after it is clicked: a confirmation modal, a success state, or a link to the published page?
    4. Should empty, loading, and error states (for example, a publish failure) be designed now or left out of this pass?

    Once there are no open questions, I will give you a 3–6 bullet summary of the spec to approve. After you say go, I will build 3 candidate directions at `styled` fidelity and serve them with `serve.py`.

    Answer with a, b, c or d, plus answers to questions 1–4.
