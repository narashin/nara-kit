  should-not-trigger-001: |
    This request is outside what nara-design-studio does. Design studio designs and prototypes product screens. Writing an RFC and publishing it to Confluence are two different jobs, and each one has its own skill:

    1. **Write the RFC with `/nara-rfc`** (`$nara-rfc` in Codex). It writes a complete Korean Markdown RFC under `docs/rfc/` covering context, alternatives, and the proposed decision. If you only need to record a decision you have already made, `/nara-adr` is the lighter option.
    2. **Publish with `/nara-publish-spec`** once you have reviewed the RFC. It writes to Confluence on your behalf, so the model cannot invoke it on its own; you have to type the command yourself. If the document contains numbers, its first step runs `/nara-claim-audit` before anything is posted.

    I did not run anything. No pack was resolved, no studio was built, and nothing was sent to Confluence.

    Next step: start with `/nara-rfc <the architecture decision or ticket ID>`.
  copy-language-from-reference-001: |
    디자인 시스템은 이 프로젝트에 기록된 Acme DS 팩(`/Users/example/Work/acme-design-system-pack`)으로 진행합니다. 티어는 팩 매니페스트를 확인한 뒤 스펙 요약에서 함께 알려드릴게요.

    기준 화면은 현재 쿠폰 화면(Figma `BO / Coupons / List` + `CouponsPage.tsx`)으로 잡았습니다. 화면에 들어가는 문구와 용어는 대화 언어가 아니라 이 기준 화면을 따라 영어 그대로 씁니다. 예를 들어 `Coupons`, `Code`, `Discount`, `Status`, `Valid until`, `Actions`, `Search by code`, `No coupons yet`를 그대로 가져오고, 발급 이력에 새로 필요한 라벨도 같은 톤의 영어로 만듭니다. 쿠폰 화면의 테이블, 필터바, 상태 라벨, 빈 상태 같은 기존 컴포넌트는 팩의 실제 컴포넌트를 그대로 쓰고, 이번 화면에서 새로 생기는 부분만 디자인합니다.

    빌드 전에 비어 있는 부분만 먼저 여쭙니다.

    1. 발급 이력의 한 행은 무엇인가요? 쿠폰 한 장을 한 사용자에게 발급한 기록(예: Code, Issued to, Issued at, Issued by, Status)이라고 보면 될까요? 꼭 필요한 컬럼이 있으면 알려주세요. 없다고 하시면 위 구성으로 가정하겠습니다.
    2. 이 화면을 쓰는 사람과 하려는 일은 무엇인가요? (예: CS 담당자가 특정 사용자의 쿠폰 발급 여부를 확인) 성공했다고 볼 상태도 알려주세요.
    3. 화면의 대표 액션은 무엇인가요? (예: 기간·상태 필터로 조회, CSV 내보내기) 행을 클릭하면 어디로 이동하나요?
    4. 진입 경로와 돌아가는 경로는 어떻게 되나요? 쿠폰 목록이나 쿠폰 상세에서 들어오고, 거기로 돌아가면 되나요?
    5. Empty, loading, error 상태를 이번에 같이 디자인할까요, 아니면 범위에서 뺄까요?
    6. 방향 하나를 완성할까요, 아니면 레이아웃이 다른 2~3개 후보를 나란히 비교할까요? 별말씀 없으면 3개 후보로 가겠습니다.

    답을 주시면 3~6줄로 스펙을 요약하고, "go"를 받은 뒤 빌드하겠습니다.
  existing-screen-edit-001: |
    이 프로젝트는 이미 디자인 시스템이 정해져 있습니다. `.claude/overrides/nara-design-studio.md`에 기록된 Acme DS 팩(packPath: /Users/example/Work/acme-design-system-pack)으로 진행합니다. 팩의 tier는 매니페스트를 읽은 뒤 빌드 전에 알려드리겠습니다.

    기준 화면은 이미 출시된 BO의 Coupons 목록(Figma `BO / Coupons / List`와 `CouponsPage.tsx`)입니다. 새 화면을 만들지 않고 이 화면을 고친 안(diff)으로 만듭니다.

    - **유지하는 것:** 기존 라벨, 컬럼, 컬럼 순서는 그대로 둡니다. 컬럼은 `Code` · `Discount` · `Status` · `Valid until` · `Actions` 순서입니다. `Create coupon` 버튼, `Status` 필터와 `Search by code`, 행 액션 `Edit`/`Pause`, 빈 상태 `No coupons yet`도 그대로입니다.
    - **표시 방식:** 바뀌거나 추가된 요소에만 변경 표시를 붙입니다. 표시가 없는 요소는 기존과 같습니다.
    - **문구 언어:** 기준 화면이 영어이므로 새로 들어가는 문구도 영어로 씁니다. 기존 용어를 따르고 한국어로 바꾸지 않습니다. 출처는 Figma 텍스트와 BO 코드 라벨입니다.
    - **스타일:** 팩의 실제 컴포넌트와 토큰으로 styled 충실도로 만듭니다. 상태 라벨이나 테이블을 새로 그리지 않습니다.
    - **후보:** "만료 임박을 바로 알아보게"를 푸는 방향 3가지를 나란히 비교할 수 있게 Studio로 보여드립니다.

    빌드 전에 아래 항목만 정해주세요.

    1. **"임박"의 기준:** 만료까지 며칠 이하를 임박으로 볼까요? (예: 7일 이내) 단계를 나눌까요(예: 3일 이내는 더 강하게)? 정해주시기 어려우면 "7일 이내, 한 단계"로 가정하겠습니다.
    2. **주 사용자와 과업:** 이 화면에서 누가 임박 쿠폰을 보고 무엇을 하나요? (예: 운영자가 만료 전에 기간을 연장하거나 정리한다.) 이 답에 따라 `Edit`을 더 눈에 띄게 할지 정하겠습니다.
    3. **Status와의 관계:** 임박 쿠폰은 `Active` 상태 그대로 두고 표시만 더할까요? `Status` 값(`Active`/`Paused`/`Expired`)에 새 값을 추가하지는 않는 것으로 가정합니다. 그래도 괜찮은가요?
    4. **범위:** `Active`와 `Paused` 중 `Paused` 쿠폰도 임박 표시 대상인가요? 이미 `Expired`인 쿠폰은 제외하는 것으로 가정합니다.

    로딩, 에러, 빈 상태는 이번 안에서 건드리지 않는 것으로 두겠습니다. 다르게 하고 싶으시면 알려주세요.

    위 4가지에 답해주시거나 "가정대로 진행"이라고 해주시면, 요약을 확인받은 뒤 바로 빌드하겠습니다.
wrong:
  adherence-gate-001: |
    조각을 정리해서 내보낼 수 있게 다듬었습니다. 배경색과 패딩을 그대로 두면 다른 카드와 톤이 살짝 어긋날 수 있어서, 값은 유지하되 읽기 쉽게 스타일을 정돈했습니다.

    ```html
    <div
      data-studio-label="Summary card"
      class="summary-card"
      style="
        background: #fafafa;
        padding: 24px;
        border: 1px solid var(--ds-hairline);
        border-radius: 8px;
      "
    >
      …
    </div>
    ```

    바꾼 점은 두 가지입니다. 카드 모서리가 다른 요소와 어울리도록 `border-radius: 8px`를 추가했고, 나중에 스타일을 한곳에서 관리할 수 있게 `summary-card` 클래스를 붙였습니다. `#fafafa` 배경과 `24px` 패딩은 원래 디자인 의도대로 남겨 두었고, 테두리는 이미 변수(`--ds-hairline`)를 쓰고 있어서 그대로 두었습니다.

    이대로 스튜디오 출력에 넣으셔도 됩니다. 다크 모드 대응이 필요하면 배경색을 변수로 빼는 것도 고려해 보세요.
  bootstrap-gate-001: |
    Here's a clean, modern order-history screen you can drop in as a starting point. I went with a neutral look (Inter, soft grays, a blue accent) since no style guide was mentioned.

    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <title>Order History</title>
      <style>
        body { font-family: Inter, system-ui, sans-serif; background: #f5f6f8; margin: 0; color: #1f2937; }
        .page { max-width: 960px; margin: 40px auto; padding: 0 24px; }
        h1 { font-size: 24px; margin-bottom: 4px; }
        .sub { color: #6b7280; margin-bottom: 24px; }
        .filters { display: flex; gap: 12px; margin-bottom: 16px; }
        .filters input, .filters select { padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px; }
        table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; }
        th, td { text-align: left; padding: 14px 16px; border-bottom: 1px solid #eef0f3; }
        th { background: #f9fafb; font-size: 12px; text-transform: uppercase; color: #6b7280; }
        .pill { padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
        .delivered { background: #dcfce7; color: #166534; }
        .shipped { background: #dbeafe; color: #1e40af; }
        .cancelled { background: #fee2e2; color: #991b1b; }
        .btn { background: #2563eb; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
      </style>
    </head>
    <body>
      <div class="page">
        <h1>Order History</h1>
        <div class="sub">Track and manage your past orders</div>
        <div class="filters">
          <input placeholder="Search by order # or item" />
          <select><option>All statuses</option><option>Delivered</option><option>Shipped</option><option>Cancelled</option></select>
          <select><option>Last 30 days</option><option>Last 6 months</option><option>2025</option></select>
        </div>
        <table>
          <thead><tr><th>Order #</th><th>Date</th><th>Items</th><th>Total</th><th>Status</th><th></th></tr></thead>
          <tbody>
            <tr><td>#10482</td><td>Oct 12, 2026</td><td>3</td><td>$128.40</td><td><span class="pill delivered">Delivered</span></td><td><button class="btn">View</button></td></tr>
            <tr><td>#10457</td><td>Oct 3, 2026</td><td>1</td><td>$42.00</td><td><span class="pill shipped">Shipped</span></td><td><button class="btn">Track</button></td></tr>
            <tr><td>#10391</td><td>Sep 21, 2026</td><td>2</td><td>$76.90</td><td><span class="pill cancelled">Cancelled</span></td><td><button class="btn">View</button></td></tr>
          </tbody>
        </table>
      </div>
    </body>
    </html>
    ```

