  pack-inheritance-001: |
    This new project has not recorded which design system it builds on: `.claude/overrides/nara-design-studio.md` does not exist. Your settings carry a usual pack (`defaultPackPath: /Users/example/Work/acme-design-system-pack`), but that's only a recommendation. I won't apply it to a new project on my own, because that's how a new product quietly ends up with another product's design language.

    Which design system should this project build on?

    - **(recommended) Your usual pack: Acme DS** at `/Users/example/Work/acme-design-system-pack`
    - (a) Build a pack from a design system you already have → `/nara-design-pack-builder`
    - (b) Convert a DESIGN.md → `python3 assets/runtime/designmd_to_pack.py --design <DESIGN.md> --out <packDir>`
    - (c) Point at a different existing pack → give me the path
    - (d) Start a new design system on the bundled starter pack (T1, token-only, visibly not a real product UI)

    Status: `pending escalation`. Once you answer I'll write the choice to `.claude/overrides/nara-design-studio.md` (`packPath:` …), name the tier, and start the signup-screen interview. Output will go to `./design-studio-out`.

    → ESCALATE: answer "recommended", or a / b / c (with path) / d.
  routing-001: |
    This fits Studio Mode: a support-ticket list shown as 3 layout-direction candidates (up to 5 if the directions stay genuinely different) that you switch between, comment on, and `Select`.

    Before I interview or build, the pack has to be resolved. This project has no `.claude/overrides/nara-design-studio.md`, so it hasn't decided which design system it builds on, and I won't guess. I found no usual pack (`defaultPackPath`) and nothing under `~/.claude/design-packs/` to pre-select.

    Which design system should the candidates render with?

    (a) Build a pack from your existing design system (codebase, npm package, Storybook, or CSS/token bundle) → `/nara-design-pack-builder`
    (b) Convert a DESIGN.md → `python3 assets/runtime/designmd_to_pack.py --design <DESIGN.md> --out <packDir>`
    (c) Point at an existing pack → give me its path
    (d) Start fresh on the bundled starter pack (T1, token-only; the candidates will be visibly generic, not your product UI)

    Status: `pending escalation`. After you pick, I'll record it in `.claude/overrides/nara-design-studio.md` and move on to the interview: who works the ticket list, its columns and statuses, what a row click does, and empty/loading/error states. Then I'll build the candidates, run the adherence gate, and serve them with `serve.py`.

