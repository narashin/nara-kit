# Grader-validation table for nara-design-studio.
#
# `right`: a fresh subagent running the current SKILL.md on each task prompt
# (2026-10-16). `wrong`: observed behaviour -- a fresh subagent with no skill
# loaded (normal tasks), or the skill applied to a request it should decline
# (should-not-trigger). Tools were off for side effects: outputs are dry runs.
#
# Added 2026-11-17 (copy-language-from-reference-001, existing-screen-edit-001):
# `right` is a fresh subagent on the SKILL.md that carries the copy-language and
# existing-screen-edit rules. `wrong` for existing-screen-edit is a fresh subagent on
# the SKILL.md before those rules (keeps the columns, never says changes get marked).
# `wrong` for copy-language is a fresh subagent with no skill loaded: it kept the copy
# English unprompted, so it fails on the suite-level relevance grader (no interview,
# no Studio flow), not on the language assertions. The Korean-copy failure this task
# guards was seen in a real session but did not reproduce here, so those assertions
# are not yet backed by an observed wrong output.
#
# Run: tools/eval-fixture.py validate nara-design-studio
# Expected: every task passes on right and fails on wrong.
right:
  adherence-gate-001: |
    내보내기 전에 adherence 게이트부터 돌렸습니다. 이 조각은 지금 상태로는 내보낼 수 없습니다.

    ```
    python3 assets/runtime/check_adherence.py out/summary-card.html --pack <packPath>
    ```

    예상 결과는 exit `1`, 위반 2건입니다.

    ```
    out/summary-card.html:1: raw-hex: #fafafa — use a pack token via var(--ds-*)
    out/summary-card.html:1: raw-px: 24px — use a pack token via var(--ds-*)
    adherence: 1 file(s) checked against built-in defaults — 2 violation(s)
    ```

    `border: 1px solid var(--ds-hairline)`은 통과합니다. `1px`은 기본 허용 목록(`0px`, `1px`)에 있고 색은 이미 토큰입니다.

    고칠 내용은 이렇습니다.

    - `background: #fafafa` → `background: var(--ds-surface)`. 팩 토큰 중 값이 `#fafafa`인 것이 `--ds-surface`라서 그대로 대응됩니다.
    - `padding: 24px` → 팩의 spacing 토큰으로 바꿔야 합니다. 그런데 현재 팩 토큰 목록(`globalCssPaths`의 `tokens/tokens.css`)에는 spacing 토큰이 없습니다. 이 값을 다른 px로 바꾸거나 제가 토큰을 지어내면 게이트를 우회하는 것일 뿐이라 하지 않았습니다.

    ```html
    <div data-studio-label="Summary card" style="background: var(--ds-surface); padding: var(--ds-space-…); border: 1px solid var(--ds-hairline)">…</div>
    ```

    상태: `pending escalation`. 수정 후 게이트를 다시 돌려 exit `0`이 나올 때까지 serve·내보내기는 하지 않습니다.

    → ESCALATE: 이 카드의 안쪽 여백에 쓸 spacing 토큰을 정해 주세요.
    1. 팩에 spacing 토큰이 따로 있으면 그 이름을 알려 주세요 (예: `--ds-space-300`).
    2. 없으면 팩의 토큰 파일에 spacing 토큰을 추가한 뒤 그 토큰을 쓰겠습니다 (팩 소유자 확인 필요).
  bootstrap-gate-001: |
    Before I interview or build anything, this project needs to decide which design system the order-history page builds on. I checked `.claude/overrides/nara-design-studio.md` and it does not exist, so no decision has been recorded and I will not infer one. I also found no usual pack in `references/settings.local.md` (`defaultPackPath`) and no pack under `~/.claude/design-packs/`, so there is no pre-selected option.

    Which design system should this project build on?

    (a) **Build a pack from a design system you already have**: a component codebase, an installed npm package, a Storybook, or a published CSS/token bundle. This runs `/nara-design-pack-builder`.
    (b) **Convert a DESIGN.md**: `python3 assets/runtime/designmd_to_pack.py --design <DESIGN.md> --out <packDir>`. Lands at T2 if the file has a `components:` block, T1 if not.
    (c) **Point at an existing pack**: give me its path (the directory holding `_ds_manifest.json`).
    (d) **Start a new design system**: the bundled starter pack (T1, token-only). The design would be visibly T1, not your real product UI.

    Status: `pending escalation`. I will record your answer in `.claude/overrides/nara-design-studio.md` so this project is asked only once, then start the order-history interview.

    → ESCALATE: answer with a, b, c (plus the path), or d.
  greenfield-detection-001: |
    Pack: **Acme DS, tier T2** (`namespace: Acme`, real components on `window.Acme`). No pack decision is recorded in `.claude/overrides/nara-design-studio.md` yet, so I am treating this manifest as the proposed pack; confirm it below and I will record it there so the project is not asked again.

    **Greenfield detected.** The manifest has no `startingPoints`, so it tells me which components exist (Button, Table, StatusChip) but not what a ticket list in this product looks like. I derived that from the manifest; it is not a question for you.

    What that changes for the build:

    - **Visible IA becomes the candidate axis.** The 3 Studio candidates will differ first on nav shape and page skeleton, not on decoration. For example: A = left sidebar + full-width Table with filters above it, B = top tabs by status + Table, C = sidebar + Table with a filter rail and pagination at the bottom.
    - **Reused verbatim, never redrawn:** `Acme.Table` for the list, `Acme.StatusChip` for status, `Acme.Button` for actions. Only genuinely new UI (filter bar layout, page header) is token-built, using `--ds-*` tokens.
    - **Non-visible IA is decided for you and shown next to the candidates.** Overrule any of it through comments:

    ```
    statuses : Open / In progress / Resolved / Closed   (Resolved = positive, Closed = neutral, others = neutral, via StatusChip)
    row click: → ticket detail
    sort     : newest first
    page size: 20
    ```

    - **Write-back:** when you finalize a handoff, I will propose adding this screen to Acme DS's `startingPoints` with the decisions above in its `note`, so the next screen comes back brownfield. I will confirm first, since the pack may be shared.

    Status: `pending escalation`. Nothing is built yet; these are the remaining blockers in the Readiness Rubric.

    → ESCALATE:
    1. Use Acme DS (`org/acme-design-system`) for this project and record it? yes / no
    2. Who uses this list, and what is the one main action (open a ticket, triage, assign)?
    3. Which columns must the Table show (e.g. ID, title, requester, assignee, status, updated)?
    4. Entry and back path, and what happens on empty, loading, and error states (designed, or out of scope for this pass)?
  pack-decision-recorded-001: |
    Pack: **Acme DS**, from the decision recorded in `.claude/overrides/nara-design-studio.md` (`packPath: /Users/example/Work/acme-design-system-pack`). Tier comes from that pack's `_ds_manifest.json` (`pack.tier`), which I read next along with `startingPoints` to decide whether an order-history screen already has real IA to adopt. That file is not readable from this workspace, so I can't state the tier yet and won't guess one.

    ```
    cat /Users/example/Work/acme-design-system-pack/_ds_manifest.json
    ```

    I'm not asking which design system to use; the project already decided that.

    Now the interview for the order-history screen (Studio Mode, 3 candidates, styled by default):

