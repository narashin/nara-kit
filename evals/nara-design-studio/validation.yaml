right:
  adherence-gate-001: |
    내보내기 전에 adherence 게이트부터 돌렸습니다. 이 조각은 지금 상태로는 내보낼 수 없습니다.

    ```
    python3 assets/runtime/check_adherence.py out/summary-card.html --pack <packPath>
    ```

    예상 결과는 exit `1`, 위반 2건입니다.

    ```
    out/summary-card.html:1: raw-hex: #fafafa — use a pack token via var(--ds-*)
    out/summary-card.html:1: raw-px: 24px — use a pack token via var(--ds-*)
    adherence: 1 file(s) checked against built-in defaults — 2 violation(s)
    ```

    `border: 1px solid var(--ds-hairline)`은 통과합니다. `1px`은 기본 허용 목록(`0px`, `1px`)에 있고 색은 이미 토큰입니다.

    고칠 내용은 이렇습니다.

    - `background: #fafafa` → `background: var(--ds-surface)`. 팩 토큰 중 값이 `#fafafa`인 것이 `--ds-surface`라서 그대로 대응됩니다.
    - `padding: 24px` → 팩의 spacing 토큰으로 바꿔야 합니다. 그런데 현재 팩 토큰 목록(`globalCssPaths`의 `tokens/tokens.css`)에는 spacing 토큰이 없습니다. 이 값을 다른 px로 바꾸거나 제가 토큰을 지어내면 게이트를 우회하는 것일 뿐이라 하지 않았습니다.

    ```html
    <div data-studio-label="Summary card" style="background: var(--ds-surface); padding: var(--ds-space-…); border: 1px solid var(--ds-hairline)">…</div>
    ```

    상태: `pending escalation`. 수정 후 게이트를 다시 돌려 exit `0`이 나올 때까지 serve·내보내기는 하지 않습니다.

    → ESCALATE: 이 카드의 안쪽 여백에 쓸 spacing 토큰을 정해 주세요.
    1. 팩에 spacing 토큰이 따로 있으면 그 이름을 알려 주세요 (예: `--ds-space-300`).
    2. 없으면 팩의 토큰 파일에 spacing 토큰을 추가한 뒤 그 토큰을 쓰겠습니다 (팩 소유자 확인 필요).
