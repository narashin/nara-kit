    2. Which fields per order (e.g. order number, date, items, total, status), and which status values appear? I'll reuse the pack's own status component if it has one.
    3. What does clicking an order do: open an order detail page, expand inline, or something else? Any row actions (reorder, cancel, download invoice)?
