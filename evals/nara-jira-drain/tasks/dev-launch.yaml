id: dev-launch-001
name: "구현 큐 티켓 → herdr worktree create + claude 초기 인자 gate-as-stop 프롬프트 (dry-run)"
description: |
  Given a jira-triage queue issue for an 구현 ticket, jira-drain --dry-run must
  assemble (not execute) a herdr worktree create on the feature/<KEY>-<slug> branch
  from the local_path in local config (~/.claude/jira-triage.md), then a herdr pane
  run that starts claude with the gate-as-stop prompt as its initial argument.
  session_group is ignored (herdr has no groups). Must never emit headless
  (claude -p / --print), the retired aoe commands, or a merge.
tags:
  - launch
  - dev
  - dry-run
inputs:
  prompt: |
    아래 Multica 큐 이슈를 jira-drain --dry-run 으로 처리. 조립 커맨드만 출력 (herdr/Multica 쓰기 금지).
    로컬 config(~/.claude/jira-triage.md)에 PROJ.fe.local_path = /Users/x/web-ui 로 채워져 있다고 가정.
    issue metadata: jira_key=PROJ-425, triage_type=구현, sub_repo=fe,
      repo=git.example.com/acme-sre/web-ui, session_group=web-ui, pr_language=en
    issue title: "[PROJ-425] 구현: Add UI tooltips"
  files: []
expected:
  output_contains:
    - "herdr worktree create"
    - "/Users/x/web-ui"
    - "herdr pane run"
    - "claude --permission-mode auto"
    - "PR_RESULT"
  output_not_contains:
    - "claude -p"
    - "--print"
    - "aoe add"
    - "aoe send"
graders:
  - type: text
    name: task_regex
    config:
      regex_match:
        - "feature/PROJ-425"
