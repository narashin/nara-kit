name: nara-jira-drain-eval
description: Evaluation suite for the jira-drain aoe launcher skill (Stage 2 of jira-triage loop).
skill: nara-jira-drain
version: "1.0"
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: claude-sonnet-4.6
metrics:
  - name: task_completion
    weight: 1.0
    threshold: 0.8
    description: Correct aoe launch assembly (group/worktree) + gate-as-stop prompt, with guard stops, no headless/merge.
graders:
  - type: code
    name: real_run
    config:
      # Provenance gate, not a behavioural one: it asserts the graded output came
      # from a real skill run. Under `executor: mock` it fails every task by
      # construction -- that is the correct signal, because mock output grades the
      # eval's own description and fixture text, never the skill. Measurement goes
      # through `waza grade` on a real run; see CLAUDE.md.
      assertions:
        - "len(output) > 40"
        - "'Mock response for:' not in output"
  - type: text
    name: launch_or_guard
    config:
      regex_match:
        - "(?i)(aoe add|local_path|수동|중단|실패)"
tasks:
  - "tasks/*.yaml"
