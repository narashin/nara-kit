name: nara-adr-eval
description: Evaluation suite for adr — architecture decision record creation.
skill: nara-adr
version: "1.0"
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: claude-sonnet-4.6
metrics:
  - name: task_completion
    weight: 1.0
    threshold: 0.8
    description: Did the skill produce an ADR with context, options, and consequences?
graders:
  - type: code
    name: real_run
    config:
      # Provenance gate, not a behavioural one: it asserts the graded output came
      # from a real skill run. Under `executor: mock` it fails every task by
      # construction -- that is the correct signal, because mock output grades the
      # eval's own description and fixture text, never the skill. Measurement goes
      # through `waza grade` on a real run; see CLAUDE.md.
      assertions:
        - "len(output) > 40"
        - "'Mock response for:' not in output"
  - type: text
    name: relevant_content
    config:
      regex_match:
        - "(?i)(ADR|Decision|Context|Options|Consequences|아키텍처|결정)"
tasks:
  - "tasks/*.yaml"
