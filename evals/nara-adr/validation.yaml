    # ADR-001: 상태 관리 라이브러리로 Zustand 채택

    ## 상태
    승인됨

    ## 배경
    프론트엔드 애플리케이션의 전역 상태가 늘어나면서 일관된 상태 관리 방식이 필요해졌다. 후보로 Redux, Jotai, Zustand를 검토했고, 평가 기준은 번들 사이즈와 개발자 경험(DX)이다.

    ## 검토한 대안

    | 기준 | Redux (Toolkit) | Jotai | Zustand |
    |---|---|---|---|
    | 번들 사이즈 | 상대적으로 큼 | 작음 | 매우 작음 |
    | 보일러플레이트 | 많음 (slice, store, provider) | 적음 | 거의 없음 |
    | 학습 곡선 | 높음 | 중간 (atom 개념) | 낮음 |
    | Provider 필요 여부 | 필요 | 경우에 따라 필요 | 불필요 |
    | DevTools | 강력함 | 제한적 | Redux DevTools 연동 가능 |

    ## 결정
    Zustand를 상태 관리 라이브러리로 채택한다. 번들 사이즈가 가장 작고, hook 기반의 단순한 API 덕분에 보일러플레이트 없이 store를 정의하고 사용할 수 있어 DX가 가장 좋다고 판단했다.

    ## 결과
    - 장점: 번들 크기 감소, 빠른 온보딩, Provider 없이 어디서든 store 접근 가능
    - 단점: Redux에 비해 미들웨어·패턴에 대한 강제가 약해 store 구조가 팀마다 달라질 수 있음
    - 후속 조치: store 분리 기준과 네이밍 컨벤션을 팀 가이드로 정리
    ```

    번호 체계나 템플릿 형식이 팀에서 쓰는 것과 다르면 알려주세요. 맞춰서 수정해 드리겠습니다.
