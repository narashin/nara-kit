    # ADR-0001: 상태 관리 라이브러리로 Zustand 채택

    - Status: accepted
    - Date: 2026-10-16

    ## Context

    클라이언트 전역 상태를 관리할 라이브러리를 정해야 했다. 후보는 Redux, Jotai, Zustand 세 가지였고, 선택 기준은 번들 사이즈와 개발자 경험(DX) 두 가지로 정했다.

    ## Options Considered

    1. **Redux**: 생태계와 DevTools가 가장 성숙하고 패턴이 표준화돼 있다. 반면 action/reducer/store 설정 등 boilerplate가 많아 DX 기준에서 불리하고, 함께 쓰는 패키지까지 포함하면 번들 부담이 세 후보 중 가장 크다.
    2. **Jotai**: atom 단위의 가볍고 세밀한 상태 관리가 가능하다. 다만 atom이 흩어지면 상태 구조를 한눈에 파악하기 어렵고, store 중심 모델에 익숙한 팀에는 사고방식 전환 비용이 있다.
    3. **Zustand**: hook 기반 store를 적은 코드로 만들 수 있고 Provider 없이 사용할 수 있다. 번들이 작고 API 표면이 좁아 학습 비용이 낮다. Redux만큼 강제된 구조가 없어 컨벤션을 팀이 직접 정해야 한다.

    ## Decision

    Zustand를 채택한다. 번들 사이즈와 DX 두 기준을 모두 가장 잘 만족했기 때문이다. Redux는 boilerplate와 번들 부담 때문에, Jotai는 atom 분산으로 인한 구조 파악 비용 때문에 기각했다.

    ## Consequences

    ### Positive
    - store 정의와 사용 코드가 짧아져 기능 추가 속도가 빨라진다
    - 전역 상태 관리에 드는 번들 부담이 작다

    ### Negative
    - Redux처럼 구조를 강제하지 않으므로 store 분할, 네이밍, selector 사용 규칙을 팀이 정하고 지켜야 한다
    - 미들웨어와 DevTools 연동은 Redux 대비 생태계가 얇다

    ### Follow-up
    - store 분할 단위와 selector 사용 규칙을 정한 짧은 컨벤션 문서를 작성한다
    ```
