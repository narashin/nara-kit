    ```markdown
    # ADR-0004: 서비스 간 통신을 REST에서 gRPC로 전환

    - 상태: 승인됨
    - 날짜: 2026-10-16
    - 대체: ADR-0003 (REST API 채택)

    ## 배경
    ADR-0003에서는 서비스 간 통신 방식으로 REST API를 채택했다. 이후 성능 요구사항이 바뀌어 더 낮은 지연 시간과 높은 처리량이 필요해졌고, JSON 직렬화와 HTTP/1.1 기반 REST로는 이 요구를 맞추기 어려워졌다.

    ## 검토한 대안
    1. **REST 유지 + 최적화**: 캐싱, 압축, HTTP/2 적용. 변경 비용은 작지만 직렬화 오버헤드는 그대로 남는다.
    2. **gRPC**: Protocol Buffers 바이너리 직렬화와 HTTP/2 멀티플렉싱, 스트리밍 지원. 스키마 기반 코드 생성으로 계약이 명확해진다. 브라우저 직접 호출이 어렵고 디버깅 도구가 REST보다 덜 익숙하다.
    3. **GraphQL**: 클라이언트 쿼리 유연성은 높지만 성능 문제 해결에는 직접적인 도움이 적다.

    ## 결정
    서비스 간 통신을 gRPC로 전환한다. 변경된 성능 요구사항(지연 시간, 처리량)을 충족하는 데 가장 적합하다.

    ## 결과
    - 장점: 직렬화 비용 감소, 스트리밍 지원, .proto 기반의 명확한 계약
    - 단점: 브라우저 클라이언트는 gRPC-Web 또는 게이트웨이가 필요하고, 팀의 학습 비용이 생긴다
    - 후속 작업: .proto 정의 저장소 구성, 기존 REST 엔드포인트 단계적 마이그레이션 계획 수립
    ```

    그리고 ADR-0003 문서의 상태도 함께 바꿔 주세요.

    ```markdown
    - 상태: 대체됨 (ADR-0004 참고)
    ```

    바뀐 성능 요구사항의 구체적인 수치(목표 latency, TPS 등)를 알려주시면 배경 섹션에 반영해 더 구체적으로 다듬어 드리겠습니다.
  should-not-trigger-001: |
    ADR로 기록할 결정을 정리하기 전에 확인할 것이 있습니다.

    `docs/adr/`를 확인했는데 디렉터리가 없어서, 이 결정을 기록하면 `docs/adr/0001-<slug>.md`가 첫 ADR이 됩니다. `git log`와 `docs/plan/`도 없어 참고할 컨텍스트가 대화 내용뿐입니다.

    "NullPointerException 버그 수정"만으로는 기록할 아키텍처 결정이 드러나지 않습니다. 추측해서 작성하지 않으려고 두 가지만 여쭙니다.

    1. 이 수정에서 내린 결정이 무엇인가요? 예를 들어 null 대신 `Optional` 반환으로 통일, 경계에서 입력 검증 도입, nullable 어노테이션 정책 도입 같은 방식 결정이 있었나요?
    2. 검토했다가 버린 대안이 있었나요? (예: 호출부마다 null 체크 vs 생산자 쪽에서 non-null 보장)

    결정과 대안을 알려주시면 Context / Options Considered / Decision / Consequences 섹션을 채워 ADR로 작성하겠습니다. 단순히 한 곳의 null 체크를 추가하는 수정이라면 ADR 대상이 아니므로 기록하지 않습니다.
