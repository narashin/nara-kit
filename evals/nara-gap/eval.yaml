name: nara-gap-eval
description: Evaluation suite for requirements gap analysis skill.
skill: nara-gap
version: "1.1"
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: mock
  model: claude-sonnet-4.6
metrics:
  - name: task_completion
    weight: 1.0
    threshold: 0.8
    description: Did the skill produce gap.md with requirement status and a score?
# Eval-level graders apply to EVERY task, the anti-trigger task included, so they
# assert only universally-true properties. All behavioural discrimination lives in
# each task's `expected.output_contains` / `output_not_contains`, which waza
# enforces per task as `_output_contains` / `_output_not_contains`.
#
# `real_run` was removed on 2026-08-26 for failing 0/8 under `executor: mock`, on
# the reasoning that an assertion which can never pass is not a gate. That was
# right about behaviour and wrong about provenance, and the removal cost more than
# it saved: without it the suite grades mock output as if it were real, and
# `waza run` reports 4/8 passed. Those 4 pass because the mock echoes this file's
# own task descriptions and fixtures, so the assertion strings appear in the output
# it grades — `Score` matched the description's "produces docs/gap.md with a score
# (0-100)", case-insensitively. A loud 0/8 beats a quiet tautology that reads like
# a measurement.
graders:
  - type: code
    name: real_run
    config:
      assertions:
        - "len(output) > 40"
        - "'Mock response for:' not in output"
tasks:
  - "tasks/*.yaml"
