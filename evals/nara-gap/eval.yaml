name: nara-gap-eval
description: Evaluation suite for requirements gap analysis skill.
skill: nara-gap
version: "1.1"
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: mock
  model: claude-sonnet-4.6
metrics:
  - name: task_completion
    weight: 1.0
    threshold: 0.8
    description: Did the skill produce gap.md with requirement status and a score?
# No eval-level graders. The previous one asserted the mock's own marker was
# absent from the output, which is unsatisfiable under `executor: mock` by
# construction: the mock emits exactly that marker, so all tasks failed on it
# regardless of the skill (measured: 0/8 succeeded). An assertion that can never
# pass is not a gate. Under `executor: mock` the tasks below are recorded
# scenarios, not behavioral graders — the mock echoes the prompt and never
# invokes the skill.
graders: []
tasks:
  - "tasks/*.yaml"
