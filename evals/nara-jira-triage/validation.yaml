# Grader-validation table for nara-jira-triage.
#
# `right`: a fresh subagent running the current SKILL.md on each task prompt
# (2026-10-16). `wrong`: observed behaviour -- a fresh subagent with no skill
# loaded (normal tasks), or the skill applied to a request it should decline
# (should-not-trigger). Tools were off for side effects: outputs are dry runs.
#
# Run: tools/eval-fixture.py validate nara-jira-triage
# Expected: every task passes on right and fails on wrong.
right:
  should-not-trigger-001: |
    이 요청은 jira-triage가 다루는 일이 아닙니다. jira-triage는 내게 할당된 Jira 티켓을 분류해 Multica 큐 카드로 만드는 스킬이라, 코드를 읽거나 고치지 않습니다.

    함수 리팩터링은 `/nara-implement`로 진행해 주세요. 바꿀 범위가 크면 `/nara-plan`으로 작업 단위를 먼저 나누고, 리팩터링 방향 자체를 검토받고 싶으면 `/nara-grill`이 맞습니다.

    어떤 함수(파일 경로와 함수 이름)를 어떤 방향으로 바꾸고 싶으신지 알려 주세요.
  bugfix-classify-001: |
    jira-triage dry-run 결과입니다. PROJ-412 1건을 **버그픽스**로 분류했고, 큐 이슈 1개를 만들 예정입니다(`--dry-run`이라 Multica 쓰기는 skipped).

    | 항목 | 값 |
    |---|---|
    | 그룹 | ready (To Do) |
    | 타입 | 버그픽스 (회귀: 어제까지 정상이던 다운로드 버튼이 오늘부터 무반응) |
    | 라우팅 | PROJ, pr_language `en`, sub_repo `[그룹 확인 필요: FE/BE 불명]` |
    | readiness | ready `[확인 필요: 기대 동작은 "어제까지처럼 다운로드됨"으로 읽음]` |
    | dedup | 기존 카드 조회 필요 (`multica issue list --metadata "jira_key=PROJ-412" --output json`) |
    | 멘션 | 신규 ready라 대상 |

    FE/BE는 자동으로 고르지 않았습니다. 말머리가 없고, "버튼 무반응"은 UI 쪽으로 읽히지만 콘솔 에러가 없다는 점은 다운로드 응답(서버) 쪽 원인일 수도 있어서 한쪽으로 단정할 근거가 없습니다. 그래서 `repo`·`sub_repo`·`session_group`은 착수 트리거 때 사람이 고르도록 비워 둡니다(fe면 `git.example.com/acme-sre/web-ui`, be면 `git.example.com/acme-sre/api-server`).

    실제 실행이었다면 돌렸을 명령입니다.

    ```bash
    multica issue create \
      --title "[PROJ-412] 버그픽스: 정산 페이지 다운로드 버튼 무반응 (회귀)" \
      --description "<dev 큐 이슈 본문: 타입 버그픽스 · repo [그룹 확인 필요: FE/BE 불명] · PR 언어 en · 접근법 재현 → 실패 테스트(Red) → 수정 → 회귀 테스트 → verify · [확인 필요: 기대 동작]>" \
      --priority medium --output json
    multica issue metadata set <issue_id> --key jira_key     --value "PROJ-412"
    multica issue metadata set <issue_id> --key triage_type  --value "버그픽스"
    multica issue metadata set <issue_id> --key pr_language  --value "en"
    # repo / sub_repo / session_group: FE/BE 확정 전이라 미설정
    multica issue comment add <issue_id> \
      --content "[@<표시명>](mention://member/00000000-0000-0000-0000-000000000000) PROJ-412 큐에 추가됨 (버그픽스)" --output json
    ```

    상태: skipped (dry-run). 카드는 UNASSIGNED `todo`로 생성 예정이며 코드는 실행하지 않습니다.

    next: 1) `--dry-run` 없이 다시 돌려 카드 생성 2) 착수 시 FE/BE를 골라 `/nara-jira-drain PROJ-412`
  dedup-cancelled-only-001: |
