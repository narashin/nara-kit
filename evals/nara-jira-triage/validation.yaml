  mirror-in-progress-001: |
    jira-triage dry-run 결과입니다. PROJ-505는 Jira에서 이미 In Progress라 **mirror 카드** 1개를 만들 예정입니다(`--dry-run`이라 Multica 쓰기는 skipped).

    | 항목 | 값 |
    |---|---|
    | 그룹 | mirror (In Progress) |
    | 타입 | 구현 (팀 목록 필터 패널에 소유자 검색 추가) |
    | 라우팅 | PROJ `[FE]` → fe `git.example.com/acme-sre/web-ui`, session_group `web-ui`, pr_language `en`, sub_repo `fe` |
    | readiness | 판정 안 함 (mirror 카드) |
    | 멘션 | 안 함 (mirror 카드) |
    | dedup | 기존 카드 조회 필요 (`multica issue list --metadata "jira_key=PROJ-505" --output json`) |

    mirror 카드는 "이미 손으로 하고 있는 일이 보드에 없다"를 메우는 용도이고 착수 지시가 아닙니다. 그래서 본문 첫 줄에 미러 표기를 붙이고 `**착수:**` 줄은 뺍니다. 카드는 `todo`로 생성되며, 이 스킬이 상태를 직접 옮기지 않습니다. 다음 reconcile 회차가 Jira 상태(indeterminate)를 보고 `in_progress` + `drain_state=manual`로 옮깁니다. 그 전 한 주기 동안은 `todo`로 보입니다.

    실제 실행이었다면 돌렸을 명령입니다.

    ```bash
    multica issue create \
      --title "[PROJ-505] 구현: [FE] 팀 목록 화면에 소유자 필터 추가" \
      --description "**미러 카드:** Jira에서 이미 In Progress. 착수 지시가 아니다.
    <dev 큐 이슈 본문: 타입 구현 · repo git.example.com/acme-sre/web-ui · 세션그룹 web-ui · PR 언어 en · 착수 줄 없음>" \
      --priority medium --output json
    multica issue metadata set <issue_id> --key jira_key      --value "PROJ-505"
    multica issue metadata set <issue_id> --key triage_type   --value "구현"
    multica issue metadata set <issue_id> --key repo          --value "git.example.com/acme-sre/web-ui"
    multica issue metadata set <issue_id> --key session_group --value "web-ui"
    multica issue metadata set <issue_id> --key pr_language   --value "en"
    multica issue metadata set <issue_id> --key sub_repo      --value "fe"
    multica issue metadata set <issue_id> --key card_origin   --value "mirror"
    # 멘션 코멘트 없음 (mirror)
    ```

    상태: skipped (dry-run).

    next: `--dry-run` 없이 다시 돌려 mirror 카드 생성. 상태 이동은 reconcile 크론이 맡습니다
