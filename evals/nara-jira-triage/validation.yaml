  proj-fe-classify-001: |
    **Outcome:** PROJ-490을 버그픽스 / FE(`acme-sre/web-ui`)로 분류했습니다. readiness는 `ready`입니다. `--dry-run`이라 Multica 쓰기는 하지 않았고 큐 이슈는 미리보기만 남깁니다 (상태: `recorded only`).

    **Evidence:**
    - 상태 그룹: `To Do`는 config `ready_statuses`에 있으므로 ready 그룹이고 `todo` 카드 대상입니다. subtask 정보가 없어 컨테이너가 아닌 작업 단위로 보고 정상 큐잉합니다.
    - 분류: issuetype이 비어 있어 의미로 판단했습니다. "지난주까진 빈 코멘트를 막았는데 회귀됐다"는 결함·회귀이므로 **버그픽스**입니다. summary가 "검증 추가"라 구현처럼 읽힐 수 있지만, 있던 동작이 깨진 것이라 버그픽스가 맞습니다.
    - FE/BE 판정: `[FE]` 말머리와 `ApprovalApproveModalContent`(UI 컴포넌트)가 둘 다 FE를 가리키므로 **fe**로 정했습니다. PROJ profile의 `repos.fe`로 라우팅합니다.
    - readiness: 증상과 조건(코멘트를 비우고 승인하면 저장됨), 기대 동작(빈 코멘트는 인라인 검증으로 막혀야 함), 미결 사항 없음. 셋 다 충족해 `ready`입니다. 판정 근거가 아닌 참고로, 공백만 있는 코멘트를 빈 값으로 볼지는 본문에 `[확인 필요]`로 남깁니다.
    - dedup: dry-run이라 `multica issue list --metadata "jira_key=PROJ-490" --output json`은 실행하지 않았습니다. 실제 실행 시 `cancelled`가 아닌 카드가 있으면 생성과 멘션을 건너뜁니다.

    **큐 이슈 미리보기 (생성 안 함):**

    ```bash
    multica issue create \
      --title "[PROJ-490] 버그픽스: [FE] 승인 모달 빈 코멘트 인라인 검증 추가" \
      --description "<아래 본문>" \
      --priority medium --output json
    multica issue metadata set <issue_id> --key jira_key      --value "PROJ-490"
    multica issue metadata set <issue_id> --key triage_type  --value "버그픽스"
    multica issue metadata set <issue_id> --key repo          --value "git.example.com/acme-sre/web-ui"
    multica issue metadata set <issue_id> --key session_group --value "web-ui"
    multica issue metadata set <issue_id> --key pr_language   --value "en"
    multica issue metadata set <issue_id> --key sub_repo      --value "fe"
    multica issue comment add <issue_id> \
      --content "[@<표시명>](mention://member/00000000-0000-0000-0000-000000000000) PROJ-490 큐에 추가됨 (버그픽스)" --output json
    ```

    담당자 없이(UNASSIGNED) `todo`로 만들고, 신규 ready 카드이므로 config `defaults.mention` 멤버에게 멘션합니다. `needs-spec`이 아니므로 `blocked` 전환과 `triage_block`은 없습니다.

    본문:

    ```markdown
    **Jira:** PROJ-490 [UNVERIFIED: Jira 호스트 URL이 config에 없음]
    **타입:** 버그픽스 · **repo:** git.example.com/acme-sre/web-ui
    **세션그룹:** web-ui · **PR 언어:** en

    [FE] 승인 모달 빈 코멘트 인라인 검증 추가
    ApprovalApproveModalContent에서 코멘트를 비워도 승인이 저장된다. 지난주까지는 빈 코멘트를 막았는데 회귀됐다.

    **접근법:**
    - 버그픽스: 재현 → 실패 테스트(Red) → 수정 → 회귀 테스트 → verify

    **착수:** 판단 후 Stage 2 트리거 (herdr가 space=repo@branch 워크트리에서 실행)
    (수동: `/nara-wt PROJ-490` → `/nara-ac-draft PROJ-490` → `/nara-plan` → `/nara-implement`)

    [확인 필요: 공백만 입력한 코멘트도 빈 코멘트로 막아야 하는지]
    ```

    **Artifact Paths:** 없음 (dry-run, Multica 쓰기 0건 · MCP 부수효과 없음)

    **Next Action:** 미리보기가 맞으면 `--dry-run` 없이 다시 실행해 카드를 만드세요. 착수는 카드를 보고 `/nara-jira-drain PROJ-490`으로 직접 트리거합니다.
  readiness-needs-spec-001: |
    jira-triage dry-run 결과입니다. 2건 모두 카드를 만들 예정이고, **PROJ-611은 needs-spec이라 생성 직후 `blocked`**, PROJ-612는 ready로 `todo`에 둡니다(`--dry-run`이라 Multica 쓰기는 skipped).

    | 키 | 타입 | 라우팅 | readiness |
    |---|---|---|---|
    | PROJ-611 | 구현 (승인 요청 제출 실패 처리 추가) | `[FE]` → fe `git.example.com/acme-sre/web-ui`, pr_language `en` | **needs-spec.** "재시도로 할지 초안으로 되돌릴지는 TBD"라 고르지 않은 선택지가 남아 있습니다 |
    | PROJ-612 | 구현 (공백뿐인 코멘트면 제출 버튼 비활성화) | `[FE]` → fe `git.example.com/acme-sre/web-ui`, pr_language `en` | **ready.** 대상(승인/반려 다이얼로그), 완료 조건(한 글자 이상이면 활성화), 미결 사항 없음 모두 충족 |

    PROJ-611도 카드는 만듭니다. 보드는 Jira의 거울이라 Jira에 있는 티켓은 보드에도 있어야 하고, 막힌 이유를 카드에 남겨 사람이 보게 합니다. Jira 티켓에는 코멘트를 달지 않습니다. 이 `blocked`는 이 스킬이 풀지 않고, Jira 본문·코멘트가 바뀌면 reconcile이 `todo`로 되돌리거나 사람이 `/drain`으로 판정과 무관하게 넘길 수 있습니다.

    실제 실행이었다면 돌렸을 명령입니다. 공통 metadata(`jira_key`·`triage_type=구현`·`repo=git.example.com/acme-sre/web-ui`·`session_group=web-ui`·`pr_language=en`·`sub_repo=fe`)는 두 카드에 같은 형태로 박습니다.

    ```bash
    # PROJ-611
    multica issue create \
      --title "[PROJ-611] 구현: [FE] 승인 요청 실패 처리" \
      --description "<dev 큐 이슈 본문 ...>
    **기획 보완 필요:** 제출 실패 시 재시도할지 초안으로 되돌릴지 미정" \
      --priority medium --output json
    multica issue metadata set <issue_id> --key jira_key --value "PROJ-611"   # + 공통 metadata
    multica issue status <issue_id> blocked
    multica issue metadata set <issue_id> --key triage_block --value "제출 실패 시 처리 방식(재시도/초안 복귀) 미정"
    multica issue comment add <issue_id> \
      --content "[@<표시명>](mention://member/00000000-0000-0000-0000-000000000000) PROJ-611 기획 보완 필요: 1) 승인 요청 제출이 실패하면 자동 재시도인가요, 초안으로 되돌리나요? 2) 실패 시 화면에 무엇이 보여야 하나요? 3) 재시도라면 몇 번까지, 그 뒤엔 어떻게 되나요?"

    # PROJ-612
    multica issue create \
      --title "[PROJ-612] 구현: [FE] 승인 코멘트 빈 값 차단" \
      --description "<dev 큐 이슈 본문 ...>" \
      --priority medium --output json
    multica issue metadata set <issue_id> --key jira_key --value "PROJ-612"   # + 공통 metadata
    multica issue comment add <issue_id> \
      --content "[@<표시명>](mention://member/00000000-0000-0000-0000-000000000000) PROJ-612 큐에 추가됨 (구현)" --output json
    ```

    상태: skipped (dry-run). `triage_block`은 착수 실행기의 `drain_state`와 다른 키로 박습니다.

    next: 1) `--dry-run` 없이 다시 돌려 카드 2개 생성 2) PROJ-611은 Jira 본문에 실패 처리 방식을 정한 뒤 reconcile 해제를 기다리거나 판단해서 `/drain`
  ready-gate-exclude-001: |
    jira-triage dry-run 결과입니다. **큐 이슈를 만들지 않습니다.** PROJ-478은 Backlog 상태라 큐 대상이 아닙니다.

    보드가 받는 상태는 ready(To Do, Selected for Development)와 mirror(In Progress, In Review)뿐이고, Backlog와 Done은 올리지 않습니다. 본문도 "아직 우선순위가 정해지지 않은 작업"이라 착수 후보로 볼 근거가 없습니다. 실제 poll JQL(`status in ("To Do", "Selected for Development", "In Progress", "In Review")`)로 조회했다면 이 티켓은 결과에 아예 나오지 않습니다.

    참고로 분류만 하면 `[FE]` 구현(fe `git.example.com/acme-sre/web-ui`)이지만, 상태 게이트에서 걸러져 라우팅·readiness·dedup·emit 모두 skipped입니다.

    ✅ 신규 티켓 없음 (큐 대상 0건, Multica 쓰기 없음)

    next: PROJ-478을 Jira에서 To Do 또는 Selected for Development로 옮기면 다음 회차에 자동으로 큐에 들어옵니다
  subtask-container-001: |
    jira-triage dry-run 결과입니다. **큐 이슈를 만들지 않습니다.** PROJ-477은 subtask(PROJ-478)를 가진 컨테이너라 큐에 넣지 않습니다.

    parent는 epic처럼 묶음으로 열고 실제 작업은 subtask에 적는 경우가 많아서, subtask가 있는 티켓은 큐 대상에서 뺍니다. 내용상으로는 구현(빈 Approve 코멘트 필드 메시지 개선)이지만 컨테이너 판정에서 걸러져 라우팅·readiness·emit 모두 skipped입니다.

    PROJ-478도 큐에 넣지 않습니다. 큐 대상은 poll 결과에 자기 행으로 나온 티켓뿐이고, parent의 `subtasks` 필드는 컨테이너 판정에만 씁니다. 그 목록엔 assignee가 없어서 거기서 키를 꺼내 큐잉하면 남의 작업이 섞입니다. PROJ-478이 내게 할당돼 있고 ready·mirror 상태라면 poll 결과에 자기 행으로 따로 오고, 그때 정상 분류됩니다.

    ✅ 신규 티켓 없음 (큐 대상 0건, Multica 쓰기 없음)

    next: 없음
  subtask-foreign-assignee-001: |
    jira-triage dry-run 결과입니다. **큐 이슈를 만들지 않습니다.** 조회 결과 1건(PROJ-293)은 컨테이너이고, subtask 2건은 큐 대상이 아닙니다.

    PROJ-293은 subtask(PROJ-542, PROJ-543)를 가진 parent라 컨테이너로 보고 제외합니다. 내용상으로는 기획 성격(연동 설계 후 단계별 구현)이지만 컨테이너 판정에서 걸러져 라우팅·readiness·emit 모두 skipped입니다.

    PROJ-542와 PROJ-543도 큐에 넣지 않습니다. 둘 다 `assignee = currentUser()` 조회 결과에 자기 행으로 나오지 않았고, parent의 `subtasks` 필드에만 있습니다. 그 목록엔 assignee가 없어 상태가 Selected for Development라도 내 작업이라는 근거가 되지 못합니다. 실제로 내 RfC 하나에서 남의 subtask 8건이 큐에 들어간 적이 있어 이 경로는 막아 둡니다. 두 subtask가 내게 할당되면 다음 poll에 자기 행으로 와서 정상 분류됩니다.

