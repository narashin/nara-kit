wrong:
  should-not-trigger-001: |
    jira-triage를 실행합니다. 인자가 없어 기본값(`--assignee currentUser()`, config 매핑 project 전체)으로 돕니다.

    Step 0: 로컬 config `~/.claude/jira-triage.md`를 찾았지만 이 작업 디렉터리에는 config가 없어 project 매핑을 읽을 수 없습니다.

    Step 1 poll로 실행할 조회:

    ```bash
    jira_search jql='assignee = currentUser() AND status in ("To Do", "Selected for Development", "In Progress", "In Review") ORDER BY updated DESC' \
      fields='key,summary,status,description,labels,subtasks,parent'
    ```

    요청 문장 "이 함수 리팩터링해줘"를 티켓처럼 분류하면 **구현**(리팩터링) 타입이지만, Jira 키가 없고 대상 함수와 repo가 특정되지 않아 route와 dedup을 진행할 수 없습니다.

    - 분류: 구현 `[UNVERIFIED: Jira 키 없음, 대상 함수 불명]`
    - route: 불가 (project key 없음)
    - emit: 스킵

    ❌ 실패: config 없음 + 티켓 키 없음으로 큐 이슈를 만들 수 없습니다.
    → ESCALATE: 리팩터링할 작업의 Jira 티켓 키를 알려주시거나 `~/.claude/jira-triage.md`를 설정한 뒤 다시 실행해 주세요.
  bugfix-classify-001: |
    PROJ-412를 분류했습니다 (dry-run, 실제 생성은 하지 않았습니다).

    분류: **버그** (어제까지 정상이던 기능이 오늘부터 동작하지 않는 회귀)
    우선순위 제안: High. 정산 다운로드는 사용자 업무에 직접 영향이 있고 회귀라 빠른 대응이 필요해 보입니다.
    담당 repo: config의 PROJ 프로필에 fe/be 두 개가 있는데, 버튼 무반응이라 우선 프론트엔드(acme-sre/web-ui)로 보았습니다. 다만 콘솔 에러가 없다는 점에서 API 응답 쪽 원인일 수도 있습니다.

    생성할 큐 이슈 미리보기:

    ```
    제목: [PROJ-412] Bug: 정산 페이지 다운로드 버튼 무반응 (회귀)
    repo: acme-sre/web-ui
    session_group: web-ui
    PR 언어: en
    본문:
      - 현상: 다운로드 버튼 클릭 시 반응 없음, 콘솔 에러 없음
      - 시작 시점: 오늘 (어제까지 정상)
      - 조사 제안: 어제 이후 배포된 web-ui 커밋 확인, 네트워크 탭에서 요청 발생 여부 확인
    담당자: currentUser()
    ```

    dry-run이라 실제 이슈는 만들지 않았습니다. 실행하려면 dry-run 없이 다시 요청해 주세요.
