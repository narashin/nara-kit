  unmapped-repo-flag-001: |
    jira-triage dry-run 결과입니다. FOO-1의 project `FOO`는 config에 매핑이 없어서, 큐 이슈는 만들되 **`[UNVERIFIED: project FOO repo 매핑 없음]`**으로 표기합니다(`--dry-run`이라 Multica 쓰기는 skipped).

    | 항목 | 값 |
    |---|---|
    | 그룹 | ready (To Do) |
    | 타입 | 구현 ("기능 추가") |
    | 라우팅 | 매핑 없음. repo 미설정, session_group `nara-kit`(misc_session_group), 본문에 매핑 요청 표기 |
    | readiness | **needs-spec.** summary가 "미지의 프로젝트 기능 추가"뿐이고 본문도 무엇을 바꾸는지, 끝나는 조건이 무엇인지 적혀 있지 않습니다 |
    | dedup | 기존 카드 조회 필요 (`multica issue list --metadata "jira_key=FOO-1" --output json`) |

    repo는 추측하지 않습니다. autopilot은 무인 실행이라 신규 project를 자동 학습하지 않고, 사람이 매핑을 추가하도록 notify 성격으로 떨어뜨립니다. readiness까지 비어 있어 생성 직후 `blocked`로 둡니다.

    실제 실행이었다면 돌렸을 명령입니다.

    ```bash
    multica issue create \
      --title "[FOO-1] 구현: 미지의 프로젝트 기능 추가" \
      --description "**Jira:** <FOO-1 url>
    **타입:** 구현 | [UNVERIFIED: project FOO repo 매핑 없음]
    미지의 프로젝트 기능 추가
    **착수:** 역할 agent 없음. config(~/.claude/jira-triage.md) profiles에 FOO 매핑 보완 후 재분류
    **기획 보완 필요:** 추가할 기능과 완료 조건 없음" \
      --priority medium --output json
    multica issue metadata set <issue_id> --key jira_key      --value "FOO-1"
    multica issue metadata set <issue_id> --key triage_type   --value "구현"
    multica issue metadata set <issue_id> --key session_group --value "nara-kit"
    # repo / pr_language / sub_repo: 매핑 없음, 미설정
    multica issue status <issue_id> blocked
    multica issue metadata set <issue_id> --key triage_block --value "추가할 기능과 완료 조건 미기재"
    multica issue comment add <issue_id> \
      --content "[@<표시명>](mention://member/00000000-0000-0000-0000-000000000000) FOO-1 기획 보완 필요: 1) 어떤 기능을 어느 화면·엔드포인트에 추가하나요? 2) 끝났다고 보는 조건은 무엇인가요? (repo 매핑도 없음: FOO가 어느 repo인지 알려 주세요)"
    ```

