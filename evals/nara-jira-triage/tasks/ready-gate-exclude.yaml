id: ready-gate-exclude-001
name: "Backlog ticket → excluded from the board, no issue"
description: |
  The board mirrors To Do and above. A Backlog ticket is neither ready nor
  in progress, so it must be EXCLUDED: no Multica queue issue is created.
tags:
  - ready-gate
  - thesis-guard
inputs:
  prompt: |
    아래는 이미 조회된 Jira 티켓이다. jira-triage로 분류하고 (dry-run) 큐 이슈를 만들어줘.
    ready 상태 = To Do, Selected for Development. mirror 상태 = In Progress, In Review.
    key: PROJ-478
    status: Backlog
    summary: "[FE] Enforce non-blank approve/reject comment client-side"
    description: 아직 우선순위가 정해지지 않은 작업.
  files: []
expected:
  regex_match:
    - "(?i)(제외|excluded|backlog|skip|스킵)"
  output_not_contains:
    - "Dev agent에 assign"
    - "[PROJ-478]"
