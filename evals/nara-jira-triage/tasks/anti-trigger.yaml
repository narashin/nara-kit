id: should-not-trigger-001
name: "Plain code request must not trigger triage / Multica write"
description: |
  A non-Jira refactor request must not produce a classification, launch kit,
  or Multica issue write.
tags:
  - anti-trigger
  - negative-test
inputs:
  prompt: "이 함수 리팩터링해줘"
  files: []
expected:
  output_not_contains:
    - "multica issue create"
    - "Dev agent에 assign"
    - "버그픽스"
    - "triage_type"
