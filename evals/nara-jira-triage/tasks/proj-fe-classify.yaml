id: proj-fe-classify-001
name: "PROJ [FE] ticket → fe sub-repo (web-ui) + web-ui session group + en PR"
description: |
  A PROJ [FE] ticket routes to web-ui repo, web-ui session group, English PR,
  and the queue issue body includes a per-type approach.
tags: [classify, routing, proj-fe]
inputs:
  prompt: |
    로컬 config(~/.claude/jira-triage.md)는 첨부한 jira-triage-config.md와 같다.
    아래는 이미 조회된 Jira 티켓이다. jira-triage로 분류하고 (dry-run) 큐 이슈를 만들어줘.
    (issuetype 비어있음 — summary/description 의미 판단)
    key: PROJ-490
    status: To Do
    summary: "[FE] 승인 모달 빈 코멘트 인라인 검증 추가"
    description: ApprovalApproveModalContent에서 코멘트를 비워도 승인이 저장된다. 지난주까진 빈 코멘트를 막았는데 회귀됐다.
  files:
    - path: jira-triage-config.md
expected:
  output_contains: ["web-ui", "버그픽스"]
  output_not_contains: ["api-server"]
graders:
  - type: text
    name: task_regex
    config:
      regex_match:
        - "(?i)(session.?group|web-ui)"
        - "(?i)(접근법|approach)"
        - "(?i)(en\\b|영어|English)"
