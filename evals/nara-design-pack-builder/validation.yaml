    Here's the plan I'd follow:

    1. **Scan the repo**: read `~/repos/acme-ds/package.json`, `src/components/**/*.vue`, and any token files (`tokens/*.json`, `src/styles/variables.scss`).
    2. **Extract tokens**: colors, spacing, typography, radii, shadows into `pack/tokens.json`.
    3. **Catalog components**: for each `.vue` file, pull the `defineProps` / `props` block, emitted events, and slots into `pack/components/<Name>.md`.
    4. **Preview harness**: create a small Vite + Vue 3 entry (`pack/preview/main.ts`) that mounts the components so the studio can render them.
    5. **Manifest**: write `pack/manifest.json` listing tokens, components, and the preview entry.

