name: nara-golden-path-discover-eval
description: Evaluation suite for golden-path-discover.
skill: nara-golden-path-discover
version: "1.0"
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: claude-sonnet-4.6
metrics:
  - name: task_completion
    weight: 1.0
    threshold: 0.8
    description: Did the skill consume test-discover decomposition, stratify S1 atomic paths, compute auditable coverage, and emit a Playwright-ready golden-paths.E2E.md?
graders:
  - type: code
    name: real_run
    config:
      # Provenance gate, not a behavioural one: it asserts the graded output came
      # from a real skill run. Under `executor: mock` it fails every task by
      # construction -- that is the correct signal, because mock output grades the
      # eval's own description and fixture text, never the skill. Measurement goes
      # through `waza grade` on a real run; see CLAUDE.md.
      assertions:
        - "len(output) > 40"
        - "'Mock response for:' not in output"
  - type: text
    name: relevant_content
    config:
      regex_match:
        - "(?i)(golden|Playwright-ready|coverage|커버리지|worker|SKIP_|UNVERIFIED)"
tasks:
  - "tasks/*.yaml"
