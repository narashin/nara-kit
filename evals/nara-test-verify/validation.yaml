# (should-not-trigger). Tools were off for side effects: outputs are dry runs.
#
# Run: tools/eval-fixture.py validate nara-test-verify
# Expected: every task passes on right and fails on wrong.
right:
  basic-usage-001: |
    ❌ 실패: 지정한 시나리오 파일 `docs/test-scenarios/scenarios-detailed.md`가 없음
    - 확인: `ls docs/test-scenarios/` → 디렉터리 없음. 일반 테스트 디렉터리(`test/`, `tests/`, `__tests__/`)에서도 시나리오 `*.md` 없음
    - recovered: no
    - artifact 영향: none (`docs/test-scenarios/scenarios-review.md` 미작성, QA Lead·Developer·Red Team 리뷰 미실행, 판정 없음)
    - side effects: none
    - next action: 시나리오 파일 경로를 알려주세요. 아직 만들지 않았다면 `/nara-test-discover <대상>` 으로 먼저 생성하면 이어서 검증합니다.
  edge-case-001: |
    시나리오 리뷰 완료: **NEEDS_WORK** (recorded only). 시나리오 파일은 그대로 두었고 리뷰 결과만 기록했습니다.

    - 입력: `docs/test-scenarios/`를 스캔해 시나리오 파일 1개(`scenarios-detailed.md`)만 찾았으므로 그 파일로 진행했습니다. 스키마는 discover로 판정했습니다(S1~S3 ID 표기). 다만 `**진입경로**`/`**실행역할**` 필드가 없어 discover 형식을 완전히 따르지는 않습니다.
    - 판정 근거: High 2건(최소 주문 경계 공백, 에러 경로 상태 오염) · Medium 4건 · Low 3건. 판정 규칙(PASS = High 0·Medium 2 이하, NEEDS_WORK = High 1~2 또는 Medium 3 이상, FAIL = High 3 이상)에 따라 NEEDS_WORK입니다.
    - 커버리지: [UNVERIFIED: S2 baseline not available]. 후보 목록이 없어 S3/S2 비율은 계산하지 않았습니다.
    - 핵심 공백: 최소 주문 금액 경계와 미달 케이스가 없고, 만료 쿠폰(S3)의 장바구니 불변 여부가 명시되지 않았으며, 할인액 끝수 처리와 음수 금액 방지 시나리오가 없습니다.
    - artifact: `docs/test-scenarios/scenarios-review.md` (아래 내용으로 작성)
    - next: `/nara-test-discover src/cart/discount.ts`를 다시 실행해 아래 Action Items를 보강하세요. 끝수 처리 정책(내림·반올림)은 사람이 먼저 정해야 합니다.

    Write `docs/test-scenarios/scenarios-review.md`:

    ```markdown
    # Test Scenario Review Report

    - Source: docs/test-scenarios/scenarios-detailed.md
    - Date: 2026-10-16
    - Reviewers: QA Lead, Developer, Red Team

    ## Summary Verdict
    - Overall: NEEDS_WORK
    - Coverage assessment: [UNVERIFIED: S2 baseline not available]
    - Key gaps: (1) 최소 주문 금액 경계·미달 케이스 없음, (2) S3 에러 시 장바구니 불변 미명시, (3) 끝수 처리·음수 금액 방지 시나리오 없음

    ## QA Lead Findings
    ### High
    - 최소 주문 금액 조건 검증 공백: S1·S2는 최소 주문(10,000원)보다 큰 금액(20,000원, 30,000원)만 다룬다. 정확히 10,000원인 경계값과 9,999원처럼 최소 금액에 못 미쳐 쿠폰이 거절되는 경우가 없다. 최소 주문 조건이 아예 동작하지 않아도 S1~S3은 모두 통과한다.
    ### Medium
    - 끝수 처리 미정의: S1(18,000원)과 S2(27,000원)는 모두 10%가 나누어떨어지는 금액이라 끝수 처리 규칙을 검증하지 못한다. 내림인지 반올림인지 시나리오 파일에 정해져 있지 않다 → NEEDS_DISCUSSION.
    - 음수 금액 방지 없음: 모든 시나리오가 10% 정률 쿠폰이다. 장바구니 금액보다 큰 할인이 적용될 때 결과가 0원 미만으로 내려가지 않는지 검증하는 시나리오가 없다. 정액 쿠폰이 `applyCoupon`에서 지원되는지는 파일만으로 확인되지 않는다 [UNVERIFIED].
    - S3 기대 결과 모호: "에러"라고만 적혀 있어 어떤 에러 타입이나 메시지를 기대하는지 정해져 있지 않다. 어떤 예외든 던지기만 하면 통과한다.
    ### Low
    - 우선순위 상위 3: S3(만료 쿠폰 거절) > S1(정상 적용) > S2(동일 쿠폰 다른 금액). 금전 오류 방지 관점에서 만료·조건 위반 거절이 가장 영향이 크다.

    ## Developer Findings
    ### High
    - (없음)
    ### Medium
    - S3 flaky risk Medium: 만료 판정이 현재 시각에 의존한다면 테스트 실행 시점에 따라 결과가 달라진다. 시나리오에 기준 시각(고정 clock 또는 명시적 만료 일시)이 없다.
    ### Low
    - S1·S2 중복: 같은 10% 쿠폰을 다른 금액에 적용할 뿐 검증하는 동작이 같다(DUPLICATE). S2를 경계값이나 끝수 케이스로 바꾸는 편이 낫다.
    - 대상 확인: `src/cart/discount.ts`의 `applyCoupon(cart, coupon)`은 스캔된 파일 목록에 포함되지 않아 시그니처와 반환 형태(새 장바구니를 돌려주는지, 인자를 변경하는지)를 확인하지 못했다 [UNVERIFIED: requires source].

    ## Red Team Findings
    ### Surviving Bug Paths
    - 에러 경로에서 상태 오염: S3은 만료 쿠폰이 에러를 내는 것만 본다. 구현이 할인을 먼저 반영한 뒤 만료를 검사해 예외를 던지면, 장바구니가 이미 할인된 상태로 남아도 S3은 통과한다. (High: 금액이 조용히 틀어진다)
    - 최소 주문 미달에도 할인 적용: 위 QA Lead High와 같은 경로. S1·S2만으로는 조건 비교가 `>=`인지 `>`인지, 아예 비교하지 않는지 구분되지 않는다.
    - 끝수 처리 버그: 12,345원처럼 10%가 나누어떨어지지 않는 금액에서 소수점 금액(1,234.5원)이 그대로 남거나 반올림 방향이 정책과 다른 버그가 살아남는다.
    - 쿠폰 중복 적용: 같은 쿠폰을 같은 장바구니에 두 번 적용하면 할인이 두 번 들어가는지 아무 시나리오도 보지 않는다.
    ### Additional Scenario Proposals
    - [S4] 장바구니 금액이 최소 주문 금액과 정확히 같으면(10,000원) 쿠폰이 적용된다: 경계 비교 연산자 오류를 잡는다
    - [S5] 장바구니 금액이 최소 주문 금액에 못 미치면(9,999원) 쿠폰이 거절되고 금액이 바뀌지 않는다: 조건 누락을 잡는다
    - [S6] 만료 쿠폰 적용 실패 후 장바구니 금액·항목이 적용 전과 같다: 에러 경로 상태 오염을 잡는다
    - [S7] 10%가 나누어떨어지지 않는 금액(12,345원)에 정해진 끝수 정책대로 할인액이 계산된다: 끝수 처리 버그를 잡는다 (정책 확정 후)
    - [S8] 할인액이 장바구니 금액보다 커도 결과 금액은 0원 미만이 되지 않는다: 음수 금액을 잡는다 (정액 쿠폰 지원 여부 확인 후)
    - [S9] 같은 쿠폰을 두 번 적용해도 할인은 한 번만 반영된다: 중복 적용을 잡는다
    ### Adversarial Assessment
    - Overall risk level: MEDIUM
    - Confidence: 낮음. 현재 3개 시나리오는 정상 경로와 만료 거절의 존재만 확인하며, 금액이 틀어지는 경로(경계·끝수·에러 후 상태·중복 적용)는 모두 열려 있다.

    ## Consolidated Action Items
    - [ ] 최소 주문 금액 경계(정확히 10,000원)와 미달(9,999원) 시나리오 추가 (S4, S5 제안)
    - [ ] S3에 장바구니 불변 확인과 기대 에러 타입을 명시하거나 S6으로 분리
    - [ ] 끝수 처리 정책(내림/반올림) 결정 후 나누어떨어지지 않는 금액 시나리오 추가 (NEEDS_DISCUSSION)
    - [ ] 정액 쿠폰 지원 여부 확인 후 음수 금액 방지 시나리오 추가
    - [ ] S3 만료 판정 기준 시각을 시나리오에 고정
    - [ ] S2를 중복이 아닌 경계·끝수 케이스로 대체 검토
    - [ ] 후속: `nara-test-discover`를 재실행해 보강 (verify는 시나리오를 직접 고치지 않음)
    ```
  should-not-trigger-001: |
    이 요청은 테스트 코드 작성이라 시나리오 검증 범위가 아닙니다.

    next: `/nara-test-implement` 로 요청해 주세요. 코드로 옮길 시나리오 문서가 없으면 `/nara-test-discover src/api/users.ts` 가 먼저입니다.
wrong:
  basic-usage-001: |
    `docs/test-scenarios/scenarios-detailed.md` 파일을 열 수 없었어요. 현재 프로젝트에 해당 경로가 없는 것 같습니다.

    파일 내용을 붙여 주시면 아래 기준으로 검토해 드릴게요.

    - 정상/예외/경계값 케이스가 골고루 있는지
    - 각 시나리오의 기대 결과가 구체적이고 검증 가능한지
    - 중복되거나 너무 비슷한 시나리오가 없는지
    - 우선순위가 비즈니스 영향과 맞는지
    - 빠진 케이스(권한, 동시성, 외부 의존성 실패 등)가 있는지

    검토 후에는 보완할 시나리오 목록까지 정리해 드릴게요.
  edge-case-001: |
    `docs/test-scenarios/scenarios-detailed.md`를 찾아서 리뷰했습니다.

    전반적으로 시나리오가 깔끔하게 잘 정리되어 있습니다. 정상 케이스(S1, S2)와 에러 케이스(S3)가 모두 있어서 기본 커버리지는 충분해 보입니다.

    - S1, S2: 할인 계산이 명확하고 기대값도 구체적이라 좋습니다.
    - S3: 만료 쿠폰 에러 케이스가 있는 점이 좋습니다.

    소소한 제안으로는 S2가 S1과 거의 같은 내용이라 하나로 합쳐도 될 것 같습니다. 그 외에는 이대로 테스트 구현에 들어가셔도 무방합니다. 종합 평가: 양호.
  should-not-trigger-001: |
    시나리오 검증을 시작하지 못했습니다 (skipped).

    - Standalone 모드: `docs/test-scenarios/` 및 일반 테스트 디렉터리에서 `*.md` 시나리오 파일 스캔 → 0건
    - `src/api/users.ts`는 시나리오 문서가 아니라 입력 스키마(discover / golden-path) 판정 불가, 파일도 [NOT FOUND]
    - QA Lead · Developer · Red Team 리뷰 미실행, `docs/test-scenarios/scenarios-review.md` 미작성
    - next: 검증할 시나리오 파일 경로를 알려주세요. 아직 시나리오가 없다면 `nara-test-discover`로 먼저 발굴한 뒤 검증할 수 있습니다.
