    ```markdown
    # Test Scenario Review Report

    - Source: docs/test-scenarios/scenarios-detailed.md
    - Date: 2026-10-16
    - Reviewers: QA Lead, Developer, Red Team

    ## Summary Verdict
    - Overall: NEEDS_WORK
    - Coverage assessment: [UNVERIFIED: S2 baseline not available]
    - Key gaps: (1) 최소 주문 금액 경계·미달 케이스 없음, (2) S3 에러 시 장바구니 불변 미명시, (3) 끝수 처리·음수 금액 방지 시나리오 없음

    ## QA Lead Findings
    ### High
    - 최소 주문 금액 조건 검증 공백: S1·S2는 최소 주문(10,000원)보다 큰 금액(20,000원, 30,000원)만 다룬다. 정확히 10,000원인 경계값과 9,999원처럼 최소 금액에 못 미쳐 쿠폰이 거절되는 경우가 없다. 최소 주문 조건이 아예 동작하지 않아도 S1~S3은 모두 통과한다.
    ### Medium
    - 끝수 처리 미정의: S1(18,000원)과 S2(27,000원)는 모두 10%가 나누어떨어지는 금액이라 끝수 처리 규칙을 검증하지 못한다. 내림인지 반올림인지 시나리오 파일에 정해져 있지 않다 → NEEDS_DISCUSSION.
    - 음수 금액 방지 없음: 모든 시나리오가 10% 정률 쿠폰이다. 장바구니 금액보다 큰 할인이 적용될 때 결과가 0원 미만으로 내려가지 않는지 검증하는 시나리오가 없다. 정액 쿠폰이 `applyCoupon`에서 지원되는지는 파일만으로 확인되지 않는다 [UNVERIFIED].
    - S3 기대 결과 모호: "에러"라고만 적혀 있어 어떤 에러 타입이나 메시지를 기대하는지 정해져 있지 않다. 어떤 예외든 던지기만 하면 통과한다.
    ### Low
    - 우선순위 상위 3: S3(만료 쿠폰 거절) > S1(정상 적용) > S2(동일 쿠폰 다른 금액). 금전 오류 방지 관점에서 만료·조건 위반 거절이 가장 영향이 크다.

    ## Developer Findings
    ### High
    - (없음)
    ### Medium
    - S3 flaky risk Medium: 만료 판정이 현재 시각에 의존한다면 테스트 실행 시점에 따라 결과가 달라진다. 시나리오에 기준 시각(고정 clock 또는 명시적 만료 일시)이 없다.
    ### Low
    - S1·S2 중복: 같은 10% 쿠폰을 다른 금액에 적용할 뿐 검증하는 동작이 같다(DUPLICATE). S2를 경계값이나 끝수 케이스로 바꾸는 편이 낫다.
    - 대상 확인: `src/cart/discount.ts`의 `applyCoupon(cart, coupon)`은 스캔된 파일 목록에 포함되지 않아 시그니처와 반환 형태(새 장바구니를 돌려주는지, 인자를 변경하는지)를 확인하지 못했다 [UNVERIFIED: requires source].

    ## Red Team Findings
    ### Surviving Bug Paths
    - 에러 경로에서 상태 오염: S3은 만료 쿠폰이 에러를 내는 것만 본다. 구현이 할인을 먼저 반영한 뒤 만료를 검사해 예외를 던지면, 장바구니가 이미 할인된 상태로 남아도 S3은 통과한다. (High: 금액이 조용히 틀어진다)
    - 최소 주문 미달에도 할인 적용: 위 QA Lead High와 같은 경로. S1·S2만으로는 조건 비교가 `>=`인지 `>`인지, 아예 비교하지 않는지 구분되지 않는다.
    - 끝수 처리 버그: 12,345원처럼 10%가 나누어떨어지지 않는 금액에서 소수점 금액(1,234.5원)이 그대로 남거나 반올림 방향이 정책과 다른 버그가 살아남는다.
    - 쿠폰 중복 적용: 같은 쿠폰을 같은 장바구니에 두 번 적용하면 할인이 두 번 들어가는지 아무 시나리오도 보지 않는다.
    ### Additional Scenario Proposals
    - [S4] 장바구니 금액이 최소 주문 금액과 정확히 같으면(10,000원) 쿠폰이 적용된다: 경계 비교 연산자 오류를 잡는다
    - [S5] 장바구니 금액이 최소 주문 금액에 못 미치면(9,999원) 쿠폰이 거절되고 금액이 바뀌지 않는다: 조건 누락을 잡는다
    - [S6] 만료 쿠폰 적용 실패 후 장바구니 금액·항목이 적용 전과 같다: 에러 경로 상태 오염을 잡는다
    - [S7] 10%가 나누어떨어지지 않는 금액(12,345원)에 정해진 끝수 정책대로 할인액이 계산된다: 끝수 처리 버그를 잡는다 (정책 확정 후)
    - [S8] 할인액이 장바구니 금액보다 커도 결과 금액은 0원 미만이 되지 않는다: 음수 금액을 잡는다 (정액 쿠폰 지원 여부 확인 후)
    - [S9] 같은 쿠폰을 두 번 적용해도 할인은 한 번만 반영된다: 중복 적용을 잡는다
    ### Adversarial Assessment
    - Overall risk level: MEDIUM
    - Confidence: 낮음. 현재 3개 시나리오는 정상 경로와 만료 거절의 존재만 확인하며, 금액이 틀어지는 경로(경계·끝수·에러 후 상태·중복 적용)는 모두 열려 있다.

    ## Consolidated Action Items
    - [ ] 최소 주문 금액 경계(정확히 10,000원)와 미달(9,999원) 시나리오 추가 (S4, S5 제안)
    - [ ] S3에 장바구니 불변 확인과 기대 에러 타입을 명시하거나 S6으로 분리
    - [ ] 끝수 처리 정책(내림/반올림) 결정 후 나누어떨어지지 않는 금액 시나리오 추가 (NEEDS_DISCUSSION)
    - [ ] 정액 쿠폰 지원 여부 확인 후 음수 금액 방지 시나리오 추가
    - [ ] S3 만료 판정 기준 시각을 시나리오에 고정
    - [ ] S2를 중복이 아닌 경계·끝수 케이스로 대체 검토
    - [ ] 후속: `nara-test-discover`를 재실행해 보강 (verify는 시나리오를 직접 고치지 않음)
    ```
