id: basic-usage-001
name: "Named scenarios file is missing: stop and point to the producer"
description: |
  The named scenarios file does not exist in this run. A correct run says so,
  writes no review and no verdict, and names nara-test-discover as the way to
  produce the file. The full review path is covered by critic-lenses-001.
tags:
  - basic
inputs:
  prompt: "시나리오 검증해줘 docs/test-scenarios/scenarios-detailed.md"
  files: []
expected:
  output_contains:
    - "nara-test-discover"
  output_not_contains:
    - "describe("
    - "it("
    - "import "
  outcomes:
    - type: task_completed
graders:
  - type: text
    name: task_regex
    config:
      regex_match:
        - "(없|not found|NOT FOUND|찾지 못)"
