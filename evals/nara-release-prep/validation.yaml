wrong:
  bootstrap-entry-001: |
    `/nara-kit:release-prep`라는 명령은 이 환경에 등록돼 있지 않아서, 1.2.3 릴리즈 준비를 일반적인 흐름으로 진행하겠습니다.

    repo를 보니 `.github/workflows/deploy-qa.yml` 하나가 있고, `workflow_dispatch`로 `environment`(qa / staging)를 입력받아 배포하는 구조입니다. 이걸 기준으로 하면 1.2.3 준비 순서는 이렇게 됩니다.

    1. develop 최신화 후 릴리즈 브랜치 생성
       ```bash
       git checkout develop && git pull
       git checkout -b release/1.2.3
       ```
    2. 버전 올리기 (package.json 등 버전 파일이 있다면)
       ```bash
       npm version 1.2.3 --no-git-tag-version
       git commit -am "chore: bump version to 1.2.3"
       git push -u origin release/1.2.3
       ```
    3. QA 배포 실행
       ```bash
       gh workflow run deploy-qa.yml --ref release/1.2.3 -f environment=qa
       ```
    4. QA 확인이 끝나면 `release/1.2.3` → `main` PR 생성, 머지 후 `v1.2.3` 태그
    5. 변경 내역(CHANGELOG / 릴리즈 노트) 정리

    진행 전에 몇 가지만 알려 주세요.

    - 릴리즈 브랜치 이름 규칙이 `release/x.y.z`가 맞나요, 아니면 고정 브랜치(예: pre-release)를 쓰나요?
    - QA 배포 대상은 `qa`면 되나요, `staging`도 같이 올려야 하나요?
    - Jira 등에서 Fix Version을 관리하고 있다면 프로젝트 키를 알려 주세요.
  fixversion-append-001: |
    대상 버전 1.2.3을 각 티켓의 Fix Version으로 적용하는 단계를 시뮬레이션했습니다 (Jira 프로젝트 PROJ, 실제 호출은 하지 않음).

    호출할 내용:

    ```
    jira_update_issue(issue_key="PROJ-101", fields={"fixVersions": [{"name": "1.2.3"}]})
    jira_update_issue(issue_key="PROJ-103", fields={"fixVersions": [{"name": "1.2.3"}]})
    ```

    PROJ-102는 이미 Fix Version이 1.2.3이라 업데이트하지 않습니다.

    PROJ-101 final: [1.2.3] (updated)
    PROJ-102 final: [1.2.3] (skipped)
    PROJ-103 final: [1.2.3] (updated)

    참고로 PROJ-101은 기존에 1.1.0이 들어 있었는데, 이번 릴리즈에 포함되므로 1.2.3으로 교체했습니다. 1.1.0 이력을 남겨야 한다면 말씀해 주세요.
  ticket-extraction-001: |
    base..develop 범위의 merged PR 5건에서 PR 제목과 브랜치 이름의 `PROJ-<숫자>` 패턴으로 티켓 키를 뽑고 중복을 제거했습니다.

    | PR | 제목에서 | 브랜치에서 | 키 |
    |---|---|---|---|
    | #101 | PROJ-101 | PROJ-101 | PROJ-101 |
    | #102 | 없음 | PROJ-102 | PROJ-102 |
    | #103 | PROJ-103 | 없음 | PROJ-103 |
    | #104 | 없음 | 없음 | 없음 |
    | #105 | PROJ-101 | PROJ-101 | PROJ-101 (중복) |

    unique keys: 3

    고유 키 목록:
    - PROJ-101
    - PROJ-102
    - PROJ-103

    키 없는 PR 번호 목록:
    - #104

    #105는 PROJ-101 후속 작업이라 같은 키로 묶였고, #104(의존성 업데이트)는 연결된 티켓이 없습니다.
  version-missing-failfast-001: |
    9.9.9 릴리즈 준비를 시작합니다. config(`base_branch: main`, `develop_branch: develop`, `release_branch: pre-release`, `deploy_workflow: deploy-qa.yml`, `jira_project: PROJ`)를 기준으로 진행하겠습니다.

    Jira PROJ 프로젝트의 버전 목록은 1.2.2, 1.2.3뿐이고 9.9.9가 없습니다. 이번 릴리즈에 Fix Version을 달려면 버전이 있어야 하니 먼저 만들고 이어가겠습니다 (실제 호출은 하지 않고 순서만 보여 드립니다).

    1. Jira 버전 생성
       ```
       jira_create_version(project_key="PROJ", name="9.9.9")
       ```
    2. develop → pre-release 동기화
       ```bash
       git fetch origin
       git checkout pre-release && git reset --hard origin/develop
       git push --force-with-lease origin pre-release
       ```
    3. main..develop 사이 merged PR에서 티켓 키 수집
       ```bash
       gh pr list --base develop --state merged --json number,title,headRefName,mergeCommit
       ```
    4. 수집한 티켓에 Fix Version 9.9.9 적용
    5. QA 배포
       ```bash
       gh workflow run deploy-qa.yml --ref pre-release -f environment=qa
       ```
    6. pre-release → main 릴리즈 PR 생성

    다만 기존 버전이 1.2.x인데 9.9.9로 건너뛰는 건 이례적이라, 혹시 1.2.4나 1.3.0을 의도하신 거라면 알려 주세요. 그 경우 1단계에서 만들 버전 이름만 바꾸면 됩니다.
