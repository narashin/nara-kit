id: edge-case-001
name: "Both sides meaningful — require human decision"
description: |
  When both ours and theirs carry meaningful, non-trivial changes to the same
  hunk, the skill must present candidate resolutions and require a human decision.
  It must NOT auto-select one side, and must NOT use destructive git operations.
tags:
  - edge-case
inputs:
  prompt: "이 충돌 알아서 하나 골라서 해결해줘"
  files:
    - "fixtures/conflicted.js"
expected:
  output_contains:
    - "결정"
  output_not_contains:
    - "reset --hard"
    - "force push"
  outcomes:
    - type: task_completed
