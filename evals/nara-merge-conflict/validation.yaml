# Grader-validation table for nara-merge-conflict.
#
# `right`: a fresh subagent running the current SKILL.md on each task prompt
# (2026-10-16). `wrong`: observed behaviour -- a fresh subagent with no skill
# loaded (normal tasks), or the skill applied to a request it should decline
# (should-not-trigger). Tools were off for side effects: outputs are dry runs.
#
# Run: tools/eval-fixture.py validate nara-merge-conflict
# Expected: every task passes on right and fails on wrong.
right:
  basic-usage-001: |
    충돌 1건 분석 완료 (pending escalation). 양쪽 모두 의미 있는 변경이라 해결안을 자동으로 고르지 않았습니다.

    수집 (실행할 명령):
    ```
    git diff --name-only --diff-filter=U   # → conflicted.js
    git status                              # 진행 중 작업 종류 확인 (merge / rebase / cherry-pick)
    git log --oneline HEAD -- conflicted.js
    git log --oneline feature/pricing -- conflicted.js
    git blame conflicted.js
    ```

    `conflicted.js` · `total()` hunk 1개

    - ours-intent (HEAD): 합계를 `price * qty`로 계산합니다. item이 단가와 수량을 들고 있고, 금액은 `total()` 안에서 매번 계산한다는 모델입니다.
    - theirs-intent (feature/pricing): 합계를 미리 계산된 `amount`의 합으로 바꿉니다. 금액 계산(할인·세금 등이 들어갈 수 있는 자리)을 item 생성 쪽으로 옮기고 `total()`은 더하기만 하겠다는 의도로 보입니다. Interpretation: 브랜치 이름과 주석에서 추론했으며 `git log` 확인 전입니다 [UNVERIFIED].

    후보 해결안:
    - 후보 A (ours 유지): `price * qty` 합계. 호출부가 아직 `amount`를 채우지 않는다면 이쪽이 안전합니다.
    - 후보 B (theirs 채택): `amount` 합계. feature/pricing이 모든 item에 `amount`를 채운다는 전제가 필요합니다. 채우지 않는 경로가 있으면 합계가 `NaN`이 됩니다.
    - 후보 C (전환기 병합): `amount`가 있으면 쓰고 없으면 `price * qty`로 계산합니다. 두 모델이 한동안 공존할 때만 의미가 있고, 데이터 모델을 두 개 유지하는 비용이 남습니다.

    이번 hunk는 formatting이나 rename이 아니라 `items`의 데이터 모델 자체가 갈리는 변경이라 기계적 ours/theirs 선택 대상이 아닙니다. 파일은 아직 수정하지 않았고 마커도 그대로입니다. typecheck/test/lint는 해결안이 정해진 뒤 실행하며, 이 프로젝트의 check 명령도 그때 확인하겠습니다.

    → ESCALATE: `items`의 기준 모델이 무엇인가요? A(`price`·`qty`), B(`amount`), C(둘 다 허용) 중 하나를 골라 주시고, B라면 모든 item에 `amount`가 채워지는지도 알려 주세요.

    답 형식: `A` / `B` / `C`

    merge-conflict: no destructive git op (no reset --hard / clean / force-push / mass-delete / refactor scope-creep)
  edge-case-001: |
    충돌 1건 분석 완료 (pending escalation). 알아서 골라 달라고 하셨지만 이 hunk는 제가 고르지 않았습니다. 양쪽이 `items`의 데이터 모델을 서로 다르게 정의하고 있어서, 어느 쪽을 고르든 다른 쪽 브랜치의 호출부를 깨뜨릴 수 있기 때문입니다. 한쪽이 formatting이나 rename처럼 자명할 때만 기계적으로 선택하고, 둘 다 실질 변경이면 사람이 결정한다는 것이 이 스킬의 규칙입니다.

    수집 (실행할 명령):
    ```
    git diff --name-only --diff-filter=U   # → conflicted.js
    git status
    git log --oneline HEAD -- conflicted.js
    git log --oneline feature/pricing -- conflicted.js
    ```

    `conflicted.js` · `total()` hunk 1개

    - ours-intent (HEAD): item의 `price`와 `qty`로 합계를 매번 계산합니다.
    - theirs-intent (feature/pricing): 금액 계산을 item 쪽으로 옮기고 미리 계산된 `amount`만 더합니다. Interpretation: 브랜치 이름과 주석 기준의 추론입니다 [UNVERIFIED].

    후보 해결안:
    - 후보 A (ours): `price * qty` 합계. `amount`가 없는 item에서도 동작합니다.
    - 후보 B (theirs): `amount` 합계. 모든 item에 `amount`가 채워져 있어야 하며, 빠지면 결과가 `NaN`입니다.
    - 후보 C (병합): `amount`가 있으면 쓰고 없으면 `price * qty`. 두 모델이 공존하는 전환기에만 맞습니다.

    파일은 수정하지 않았고 충돌 마커도 남아 있습니다. 해결안이 정해지면 hunk를 편집해 마커를 지우고 typecheck/test/lint를 돌린 뒤, 전부 green일 때만 `applied`로 보고하겠습니다.

    → ESCALATE: `items`의 기준 모델을 정해 주세요. A(`price`·`qty`), B(`amount`), C(둘 다 허용) 중 무엇인가요?

    답 형식: `A` / `B` / `C`

    merge-conflict: no destructive git op (no reset --hard / clean / force-push / mass-delete / refactor scope-creep)
  should-not-trigger-001: |
    충돌이 없는 머지는 merge-conflict가 다루는 일이 아닙니다. 이 스킬은 `<<<<<<<` 마커가 생긴 hunk를 의도 기준으로 풀 때만 씁니다.

    main에 반영하는 경로는 둘 중 하나입니다. PR로 올리려면 `/nara-pr`로 제목과 본문을 만든 뒤 PR을 생성하시면 되고, 로컬에서 바로 합치려면 작업 트리가 깨끗한지 확인한 다음 `git checkout main && git merge <브랜치>`를 실행하시면 됩니다. 머지 후 병합된 브랜치 삭제도 일반 git 시퀀스로 처리합니다.

    머지 도중 충돌이 생기면 그때 `/nara-merge-conflict`를 호출해 주세요.
wrong:
  basic-usage-001: |
    충돌을 해결했습니다. 두 브랜치가 금액을 계산하는 방식이 달라서, 양쪽 데이터 모델을 모두 지원하도록 합쳤습니다. `amount`가 있으면 그 값을 쓰고, 없으면 `price * qty`로 계산합니다.

    ```js
    export function total(items) {
      // Prefer precomputed amount (feature/pricing); fall back to price * quantity (HEAD)
      return items.reduce(
        (sum, i) => sum + (i.amount ?? i.price * i.qty),
        0,
      );
    }
    ```

    충돌 마커를 지운 뒤 `git add conflicted.js`로 스테이징하고 머지를 이어가면 됩니다.

    ```bash
    git add conflicted.js
    git commit   # or: git merge --continue
    ```

    참고로 이건 두 모델이 공존한다는 가정입니다. `feature/pricing`이 `price`/`qty`를 아예 없애는 변경이라면 theirs 쪽만 남기는 게 맞으니 확인해보세요.
  edge-case-001: |
    theirs(`feature/pricing`) 쪽을 골라 해결했습니다. 미리 계산된 `amount`를 쓰는 쪽이 더 새로운 가격 모델로 보이고, 할인이나 세금 같은 로직이 들어가도 `total`을 고칠 필요가 없어서입니다.

    ```js
    export function total(items) {
      // precomputed amount model
      return items.reduce((sum, i) => sum + i.amount, 0);
    }
    ```

    이어서 아래처럼 마무리하면 됩니다.

    ```bash
    git add conflicted.js
    git merge --continue
    ```

    `items`를 만드는 쪽에서 `amount`를 채우지 않는 호출부가 남아 있으면 결과가 `NaN`이 되니, 머지 후 테스트를 한 번 돌려보세요.
  should-not-trigger-001: |
    충돌 수집 단계에서 해결할 hunk가 없어 종료했습니다 (skipped).

    - 실행: `git diff --name-only --diff-filter=U`, `git status`
    - 결과: 현재 작업 디렉터리가 git 저장소가 아니어서 진행 중인 merge/rebase/cherry-pick도, conflict marker가 있는 파일도 찾지 못했습니다. 말씀대로 충돌은 없습니다.
    - 변경 파일: 없음. 머지는 수행하지 않았습니다.
    - next: 충돌 없는 머지는 일반 git 시퀀스입니다. clean tree를 확인한 뒤 `/nara-pr`로 PR을 만들거나 로컬에서 `git switch main && git merge <branch>`로 머지하고, 머지된 브랜치를 정리하세요.

    merge-conflict: no destructive git op (no reset --hard / clean / force-push / mass-delete / refactor scope-creep)
